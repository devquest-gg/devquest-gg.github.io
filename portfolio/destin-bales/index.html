<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio · DevQuest</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0a0d14;--panel:#11161f;--panel2:#141b26;--border:#232c3a;--text:#eaf0f8;--muted:#8b98ab;--dim:#5f6b7d;--accent:#58a6ff;--purple:#a371f7;--gold:#e0b23a;--green:#3fb950;--pink:#f778ba}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}
  .bar{height:3px;background:linear-gradient(90deg,var(--gold),var(--purple) 55%,var(--accent))}
  .nav{border-bottom:1px solid var(--border);background:rgba(10,13,20,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:50}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .mark{width:24px;height:24px;flex:none;display:block}
  .brandhome{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;cursor:pointer;transition:opacity .15s}
  .brandhome:hover{opacity:.85}
  .brand .wm{font-weight:800;font-size:20px;letter-spacing:-.3px;color:var(--text)}
  .brand .wm .q{color:var(--accent)}
  .brand .wm .tld{color:var(--gold)}
  .brand .cr{font-size:12px;font-weight:700;color:var(--accent);border:1px solid rgba(88,166,255,.4);border-radius:999px;padding:2px 9px;background:rgba(88,166,255,.08);letter-spacing:.03em;position:relative;top:1px}
  .brand .beta{font-size:10px;font-weight:800;letter-spacing:.09em;color:#0b0e14;background:var(--gold);border-radius:999px;padding:2px 7px;position:relative;top:1px}
  @media(max-width:560px){.brand .cr,.brand .beta{display:none}.brand .wm{font-size:17px}}
  .navlinks{display:flex;gap:18px;font-size:14px;color:var(--muted)}.navlinks a:hover{color:var(--text)}

  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
  .banner{position:absolute;inset:0;background:radial-gradient(60% 120% at 15% 0%, #6d3bd6 0%, transparent 55%),radial-gradient(50% 130% at 88% 10%, #1f6feb 0%, transparent 55%),radial-gradient(45% 120% at 60% 120%, #c99a2a 0%, transparent 55%),conic-gradient(from 210deg at 78% 30%, #10203a, #241033 40%, #0c1626 75%, #10203a);filter:saturate(1.05)}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,13,20,.55),rgba(10,13,20,.72) 55%,rgba(10,13,20,.94))}
  .hero .wrap{position:relative;z-index:2;padding:44px 22px 28px}
  .htop{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
  .avatar{width:102px;height:102px;border-radius:22px;flex:none;background:linear-gradient(135deg,#7cc0ff,#a371f7);display:flex;align-items:center;justify-content:center;font-weight:850;font-size:36px;color:#0a0d14;box-shadow:0 12px 40px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.2)}
  .avatar{position:relative;overflow:hidden}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .avatar.has-photo .ini{display:none}
  .uprow{display:flex;gap:12px;align-items:flex-start;margin-top:2px}
  .upprev{width:64px;height:64px;border-radius:12px;flex:none;background:var(--panel2);border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;text-align:center}
  .upprev.port{border-radius:16px}
  .upprev img{width:100%;height:100%;object-fit:cover;display:block}
  .upbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .upbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px;padding:7px 12px;cursor:pointer;transition:border-color .14s}
  .upbtn:hover{border-color:var(--accent)}
  .upbtn.busy{opacity:.6;pointer-events:none}
  .upbtn.ghost{background:none;color:var(--muted)}
  .hmeta{flex:1;min-width:280px}
  .oa{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green);border:1px solid rgba(63,185,80,.45);background:rgba(63,185,80,.12);border-radius:999px;padding:4px 11px;margin-bottom:12px}
  .oa .d{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  h1{margin:0;font-size:40px;line-height:1.05;letter-spacing:-1px;font-weight:850}
  .role{margin-top:6px;font-size:16px;color:#dbe4ef}
  .bio{margin:14px 0 0;font-size:15px;color:#c6d0de;max-width:640px;white-space:pre-line}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .tag{font-size:12.5px;font-weight:700;color:#dbe4ef;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);border-radius:999px;padding:5px 13px}
  .tag.spec{color:#e2d0ff;border-color:rgba(163,113,247,.5);background:rgba(163,113,247,.22)}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:750;border-radius:11px;padding:11px 18px;cursor:pointer;border:1px solid rgba(255,255,255,.16)}
  .btn.primary{color:#04121f;background:linear-gradient(135deg,#7cc0ff,#58a6ff);border:0}
  .btn.ghost{color:#fff;background:rgba(0,0,0,.3)}
  .stats{display:flex;flex-wrap:wrap;margin-top:26px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:rgba(17,22,31,.85)}
  .stat{flex:1;min-width:110px;padding:15px 18px;border-right:1px solid var(--border)}.stat:last-child{border-right:0}
  .stat .n{font-size:23px;font-weight:850;letter-spacing:-.5px;background:linear-gradient(120deg,#9ecbff,#c9a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

  section{padding:40px 0 6px}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  h2.sec{font-size:23px;font-weight:800;letter-spacing:-.4px;margin:6px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:700px}

  .heroes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:600px}
  .gcardH{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--panel);transition:transform .18s,border-color .18s}
  .gcardH:hover{transform:translateY(-4px);border-color:var(--accent)}
  .cover3{aspect-ratio:3/4;position:relative;display:flex;align-items:flex-end;padding:12px}
  .cover3 .rank{position:absolute;top:8px;left:10px;font-size:26px;font-weight:850;color:rgba(255,255,255,.16)}
  .cover3 .chk{position:absolute;top:10px;right:10px;width:19px;height:19px;border-radius:50%;background:var(--accent);color:#04121f;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
  .cover3 .ttl{position:relative;z-index:2;font-weight:850;font-size:15px;letter-spacing:-.2px;text-shadow:0 2px 14px rgba(0,0,0,.7);line-height:1.1}
  .cover3 .rank,.cover3 .chk{z-index:2}
  .cover3 .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .cover3::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 40%,rgba(0,0,0,.78));z-index:1}
  .gmeta{padding:10px 12px}.gmeta .r{font-weight:700;font-size:12.5px;line-height:1.2}.gmeta .s{color:var(--muted);font-size:11.5px;margin-top:2px}

  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 8px}
  .legend b{color:var(--text)}.lg{display:inline-flex;align-items:center;gap:7px}
  .lgdot{width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
  .lgbar{width:16px;height:11px;border-radius:3px;background:linear-gradient(135deg,#555,#333)}
  /* two-sided spine timeline — studio meta left, games right, no frames */
  .tl3{position:relative;margin:22px 0 10px}
  .tl3 .spine{position:absolute;left:290px;top:4px;bottom:4px;width:2px;background:var(--border)}
  .trow{position:relative;display:grid;grid-template-columns:290px 1fr;margin-bottom:30px;align-items:start}
  .trow .tdot{position:absolute;left:290px;top:5px;transform:translate(-50%,0);width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(224,178,58,.18);z-index:2}
  .tmeta{text-align:right;padding-right:34px;padding-top:1px}
  .tst{display:flex;align-items:center;justify-content:flex-end;gap:9px}
  .tname{font-weight:800;font-size:16.5px;letter-spacing:-.2px}
  .tlogo{width:28px;height:28px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:850;color:#fff;border:1px solid rgba(255,255,255,.2)}
  .trole{font-size:13px;color:var(--muted);margin-top:6px}
  .tyr{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:650;letter-spacing:.02em}
  .tgames{padding-left:34px}
  .shelf{display:flex;flex-wrap:wrap;gap:15px}
  .gtile{width:88px}
  .tart{position:relative;overflow:hidden;width:88px;aspect-ratio:2/3;border-radius:12px;background:#141b26;box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;transition:transform .14s ease,box-shadow .14s ease}
  .gtile:hover .tart{transform:translateY(-4px);box-shadow:0 15px 32px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.15)}
  .tart .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .tart .tini{position:relative;z-index:0;font-size:15px;font-weight:850;color:rgba(255,255,255,.55);text-align:center;padding:4px}
  .tv{position:absolute;top:6px;right:6px;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;z-index:3;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  .tv.blue{background:rgba(88,166,255,.96);color:#04121f}.tv.green{background:rgba(63,185,80,.96);color:#04220f}
  .gtr{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.25}
  .tnone{font-size:12.5px;color:var(--dim);padding-top:6px}
  @media(max-width:640px){.tl3 .spine,.trow .tdot{display:none}.trow{grid-template-columns:1fr;margin-bottom:22px}.tmeta{text-align:left;padding-right:0;margin-bottom:12px}.tst{justify-content:flex-start}.tgames{padding-left:0}}
  .others{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
  .ocard{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--panel);border-radius:11px;padding:8px 11px 8px 8px}
  .ocard .oc{position:relative;overflow:hidden;width:38px;height:50px;border-radius:5px;flex:none}

  .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .skgroup{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:15px 16px}
  .skgroup h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .pills{display:flex;gap:7px;flex-wrap:wrap}
  .pill{font-size:12.5px;font-weight:650;color:#d3dcea;border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:5px 11px}

  .contact{margin-top:30px;border:1px solid var(--border);border-radius:18px;background:radial-gradient(600px 200px at 20% 0%,rgba(88,166,255,.12),transparent),linear-gradient(180deg,var(--panel),#0d121b);padding:28px 26px;text-align:center}
  .contact h3{margin:0 0 6px;font-size:22px;font-weight:800}.contact p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .clinks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .vfoot{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:13px;margin:16px 0 0;flex-wrap:wrap}
  .vfoot .v2{width:16px;height:16px;border-radius:50%;background:var(--green);color:#04121f;font-size:10px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
  footer{border-top:1px solid var(--border);margin-top:38px;padding:22px 0 54px}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--dim)}
  .editlink{position:fixed;bottom:12px;right:12px;z-index:60;font-size:12px;font-weight:700;color:#04121f;background:var(--gold);border-radius:999px;padding:7px 14px;display:none}
  @media(max-width:820px){.heroes{grid-template-columns:1fr 1fr}.skills{grid-template-columns:1fr}}
  @media(max-width:560px){.heroes{grid-template-columns:1fr}h1{font-size:31px}.navlinks{display:none}}

  /* featured work: wall of box art */
  .wall{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:20px}
  .poster{position:relative;aspect-ratio:2/3;border-radius:13px;overflow:hidden;cursor:pointer;background:#141b26;box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07);transition:transform .16s ease,box-shadow .16s ease}
  .poster:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 22px 44px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.18)}
  .poster .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .poster .pfallback{position:absolute;inset:0;display:flex;align-items:flex-end;padding:12px;z-index:0}
  .poster .pfallback span{font-weight:850;font-size:15px;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.85);line-height:1.1}
  .poster .pgloss{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.13),transparent 34%)}
  .poster .pvb{position:absolute;top:8px;right:8px;z-index:3;width:22px;height:22px;border-radius:50%;background:rgba(63,185,80,.96);color:#04220f;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.5)}
  .poster .pexp{position:absolute;bottom:8px;right:8px;z-index:3;font-size:10.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 9px;opacity:0;transform:translateY(6px);transition:.16s}
  .poster:hover .pexp{opacity:1;transform:none}
  @media(max-width:900px){.wall{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:680px){.wall{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:440px){.wall{grid-template-columns:repeat(2,1fr)}}

  /* one-sheet modal */
  .osovl{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:34px 16px 44px;overflow:auto;background:rgba(4,7,12,.74);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .2s ease}
  .osovl.on{opacity:1;pointer-events:auto}
  .ossheet{position:relative;width:100%;max-width:900px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,var(--panel),#0d131d);border:1px solid var(--border);box-shadow:0 40px 100px rgba(0,0,0,.7);transform:translateY(24px) scale(.97);opacity:0;transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .24s}
  .osovl.on .ossheet{transform:none;opacity:1}
  .osclose{position:absolute;top:14px;right:14px;z-index:12;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.4);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .osclose:hover{background:rgba(0,0,0,.66)}
  .osbanner{position:relative;height:210px;overflow:hidden}
  .osbanner img,.osbanner .osfill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .osscrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,11,17,.12),rgba(8,11,17,.55) 55%,var(--panel) 99%)}
  .osgloss{position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.15),transparent 30%);pointer-events:none}
  .osbtitle{position:absolute;left:0;right:0;bottom:0;padding:24px 30px;z-index:2}
  .oskicker{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
  .oschip{font-size:12px;font-weight:800;letter-spacing:.03em;color:#e6edf6;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 11px}
  .osvchip{background:rgba(63,185,80,.2);border-color:rgba(63,185,80,.5);color:#b7f0c2;display:inline-flex;align-items:center;gap:6px}
  .oschip.cssoon{background:rgba(163,113,247,.25);border-color:rgba(163,113,247,.55);color:#e9dcff}
  .cfovl{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,7,12,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .16s}
  .cfovl.on{opacity:1;pointer-events:auto}
  .cfcard{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden;transform:translateY(10px) scale(.98);transition:transform .18s,opacity .18s}
  .cfovl.on .cfcard{transform:none}
  .cfhead{display:flex;align-items:center;gap:9px;padding:15px 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:15px}
  .cfhead .ck{width:22px;height:22px;border-radius:50%;background:var(--green);color:#04220f;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
  .cfhead .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:17px;background:none;border:0;line-height:1}
  .cfhead .x:hover{color:var(--text)}
  .cfsub{padding:15px 16px 5px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .cfrow{display:flex;align-items:center;gap:12px;padding:11px 16px;text-decoration:none;color:inherit}
  .cfrow:hover{background:rgba(255,255,255,.03)}
  .cfav{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:850;font-size:14px;color:#04121f;background:linear-gradient(135deg,#7cc0ff,#a371f7)}
  .cfinfo{display:flex;flex-direction:column;min-width:0}
  .cfnm{font-weight:750;font-size:14px}
  .cfmeta{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
  .cffoot{padding:13px 16px;border-top:1px solid var(--border)}
  .cffoot a{color:var(--accent);font-weight:700;font-size:13.5px;text-decoration:none}
  .osvchip .c{width:14px;height:14px;border-radius:50%;background:var(--green);color:#04220f;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:900}
  .osbtitle h3{margin:0;font-size:33px;font-weight:850;letter-spacing:-.7px;text-shadow:0 3px 20px rgba(0,0,0,.85)}
  .osrole{margin-top:6px;font-size:17px;color:#fff;font-weight:800;letter-spacing:-.2px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .osverify{display:flex;align-items:center;gap:14px;margin:16px 30px 6px;padding:14px 16px;border-radius:14px;background:linear-gradient(90deg,rgba(63,185,80,.16),rgba(63,185,80,.04));border:1px solid rgba(63,185,80,.32)}
  .osverify.dim{background:var(--panel2);border-color:var(--border)}
  .osverify .ovck{width:30px;height:30px;border-radius:50%;flex:none;background:var(--green);color:#04220f;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
  .osverify .ovck.dim{background:var(--dim);color:#0b0e14}
  .ovtx{flex:1;min-width:0}.ovtx b{font-size:14.5px}.ovsub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .ovbtn{flex:none;font-size:13px;font-weight:750;color:var(--accent);background:none;border:0;cursor:pointer;white-space:nowrap}
  .oscontext{padding:16px 30px 4px}
  .oscontext .osstats{border-radius:12px;overflow:hidden;border:1px solid var(--border);border-bottom:1px solid var(--border)}
  .oslabel.ctx{color:var(--muted)}

  /* recruiter mode */
  #recruiter{margin:16px 0 10px;opacity:0;transition:opacity .24s ease}

  @keyframes rcRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #recruiter.show .rcwhy{animation:rcRise .5s cubic-bezier(.2,.8,.2,1) backwards}
  #recruiter.show .rclist .rcrow{animation:rcRise .5s cubic-bezier(.2,.8,.2,1) backwards}
  #recruiter.show .rclist .rcrow:nth-child(1){animation-delay:0.04s}
  #recruiter.show .rclist .rcrow:nth-child(2){animation-delay:0.08s}
  #recruiter.show .rclist .rcrow:nth-child(3){animation-delay:0.12s}
  #recruiter.show .rclist .rcrow:nth-child(4){animation-delay:0.16s}
  #recruiter.show .rclist .rcrow:nth-child(5){animation-delay:0.20s}
  #recruiter.show .rclist .rcrow:nth-child(6){animation-delay:0.24s}
  #recruiter.show .rclist .rcrow:nth-child(7){animation-delay:0.28s}
  #recruiter.show .rclist .rcrow:nth-child(8){animation-delay:0.32s}
  #recruiter.show .rclist .rcrow:nth-child(9){animation-delay:0.36s}
  #recruiter.show .rclist .rcrow:nth-child(n+10){animation-delay:.4s}
  @media (prefers-reduced-motion: reduce){#stage,#recruiter{transition:none}#recruiter.show .rcwhy,#recruiter.show .rclist .rcrow{animation:none}}
  .rcwhy{border:1px solid var(--border);border-radius:16px;background:radial-gradient(600px 200px at 15% 0%,rgba(88,166,255,.1),transparent),var(--panel);padding:20px 22px;margin-bottom:16px}

  .db-btn{border-radius:10px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;border:1px solid transparent;font-family:inherit}
  .db-btn.ghost{background:transparent;border-color:var(--border,#242c38);color:var(--text,#eef3fa)}
  .db-btn.ghost:hover{border-color:var(--accent,#58a6ff)}
  .db-btn.primary{background:linear-gradient(135deg,var(--accent,#58a6ff),var(--purple,#a371f7));color:#fff}
  .db-btn.primary:hover{filter:brightness(1.08)}
  .dmodal-ov{position:fixed;inset:0;z-index:200;background:rgba(4,7,12,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
  .dmodal{background:var(--panel,#141a23);border:1px solid var(--border,#242c38);border-radius:16px;max-width:520px;width:100%;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative}
  .dmodal h3{margin:0 0 4px;font-size:19px}
  .dmodal .dsub{color:var(--muted,#8b98a9);font-size:13.5px;margin:0 0 14px;line-height:1.5}
  .dmodal label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px}
  .dmodal input{width:100%;background:var(--bg,#0b0e14);border:1px solid var(--border,#242c38);border-radius:9px;padding:11px 12px;color:var(--text,#eef3fa);font-size:14px;font-family:inherit}
  .dmodal input:focus{outline:none;border-color:var(--accent,#58a6ff)}
  .dmodal .dact{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .dmodal .dfoot{font-size:11.5px;color:var(--muted,#8b98a9);margin-top:12px;line-height:1.4}
  .dmodal .dx{position:absolute;top:12px;right:14px;background:transparent;border:0;color:var(--muted,#8b98a9);font-size:22px;cursor:pointer;line-height:1}
  #welcomebar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:75;max-width:min(680px,calc(100vw - 28px));background:linear-gradient(135deg,rgba(88,166,255,.18),rgba(163,113,247,.14));border:1px solid var(--border,#242c38);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  #welcomebar .wb-inner{padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #welcomebar .wb-txt{flex:1;min-width:200px;font-size:13.5px;color:var(--text,#eef3fa)}
  #welcomebar .wb-btn{font-size:13px;font-weight:800;color:#04121f;background:var(--gold,#e0b23a);border-radius:999px;padding:7px 14px;white-space:nowrap}
  #welcomebar .wb-x{background:transparent;border:0;color:var(--muted,#8b98a9);font-size:20px;cursor:pointer;line-height:1}
  body.embed .hero .banner{height:150px}
  html.embed{scrollbar-width:thin;scrollbar-color:#2b3648 transparent}
  html.embed::-webkit-scrollbar{width:9px;height:9px}
  html.embed::-webkit-scrollbar-thumb{background:#2b3648;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
  html.embed::-webkit-scrollbar-thumb:hover{background:#3a475c}
  html.embed::-webkit-scrollbar-track{background:transparent}
</style>

<script src="/credits/api.js"></script>
<script>
(function(){
  var CUR = 2026;
  var app = document.getElementById("app");
  var STEAM = {}, IS_OWNER = false, _covMap = {}, _credits = [], _person = null, _positions = [], _curCi = -1;
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  // slug from ?slug= (router / view.html) or the last path segment (/portfolio/<slug>/)
  var qslug = new URLSearchParams(location.search).get("slug");
  var parts = location.pathname.replace(/\/+$/,"").split("/");
  var pslug = parts[parts.length-1] || "";
  var slug = String(qslug || pslug || "").trim().toLowerCase();
  var IS_EMBED = new URLSearchParams(location.search).get("embed")==="1"; if(IS_EMBED){ try{ document.body.classList.add("embed"); document.documentElement.classList.add("embed"); }catch(e){} }
  var IS_DRAFT = new URLSearchParams(location.search).get("draft")==="1";
  if(!IS_DRAFT && (slug==="portfolio" || slug==="view.html" || !slug)){ app.innerHTML='<div class="wrap" style="padding:60px 22px;color:var(--muted)">No profile specified.</div>'; return; }
  if(!IS_DRAFT){ document.getElementById("creditslink").href="/credits/"+slug; }

  // --- box art: resolve Steam capsules + admin covers, same as the credits person page ---
  function bkt(s){ var h=2166136261>>>0; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h%256; }
  var _jc={};
  function getJSON(u){ if(_jc[u]) return _jc[u]; _jc[u]=fetch(u).then(function(r){ return r.ok?r.json():{}; }).catch(function(){ return {}; }); return _jc[u]; }
  function steamArt(id){ return "https://cdn.cloudflare.steamstatic.com/steam/apps/"+encodeURIComponent(id)+"/library_600x900.jpg"; }
  function resolveCovers(credits){
    var seen={}; credits.forEach(function(c){ if(c.game_slug) seen[c.game_slug]=1; });
    var list=Object.keys(seen);
    if(!list.length) return Promise.resolve({});
    var adminP=(DQAPI.gameCovers?DQAPI.gameCovers(list):Promise.resolve({data:{covers:{}}})).then(function(r){ return (r&&r.data&&r.data.covers)||{}; }).catch(function(){ return {}; });
    var entP=Promise.all(list.map(function(s){ return getJSON("/credits/data/site/games/"+bkt(s)+".json").then(function(m){ return {s:s,e:(m&&m[s])||null}; }); }));
    return Promise.all([adminP,entP]).then(function(res){
      var admin=res[0], map={};
      res[1].forEach(function(x){ var e=x.e; if(e&&e.steam) STEAM[x.s]=e.steam; var url=admin[x.s]||(e&&e.cover)||(e&&e.steam?steamArt(e.steam):null); if(url) map[x.s]=url; });
      return map;
    }).catch(function(){ return {}; });
  }
  function art(slug, covMap){ var u=covMap&&covMap[slug]; return u?'<img class="art" loading="lazy" src="'+esc(u)+'" alt="" onerror="this.style.display=\'none\'">':''; }

  function hashHue(s){ s=String(s||"x"); var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h%360; }
  function studioGrad(s){ var h=hashHue(s); return 'linear-gradient(120deg,hsl('+h+',42%,25%),hsl('+((h+18)%360)+',48%,14%))'; }
  function gameGrad(s){ var h=hashHue(s); return 'radial-gradient(120% 90% at 50% 0%,hsl('+h+',52%,28%),hsl('+h+',58%,8%))'; }
  function initials(s){ var w=String(s||"").replace(/[:\-].*$/,"").split(/\s+/).filter(function(x){return x && !/^(of|the|and|a|an|II|2)$/i.test(x);}); var r=w.slice(0,3).map(function(x){return x[0];}).join(""); return (r||String(s||"?").slice(0,2)).toUpperCase(); }
  function studioMark(s){ return String(s||"?").trim().slice(0,1).toUpperCase(); }

  var _relayout=null;
  function loadPortfolio(){
    DQAPI.portfolio(slug).then(function(r){
      if(!(r && r.ok && r.data && r.data.person)){ app.innerHTML='<div class="wrap" style="padding:60px 22px"><h1>Not found</h1><p style="color:var(--muted)">No portfolio at this address yet.</p></div>'; return; }
      var person=r.data.person, positions=r.data.positions||[], credits=r.data.credits||[];
      resolveCovers(credits).then(function(covMap){ render(person, positions, credits, covMap||{}); if(IS_EMBED){ setTimeout(function(){ var h=document.querySelector(".stagehead"); if(h){ var y=h.getBoundingClientRect().top + (window.pageYOffset||0) - 8; window.scrollTo(0, y); } },350); } });
      if(!IS_EMBED && DQAPI.isSignedIn()){ document.body.classList.add("is-auth"); DQAPI.me().then(function(mr){ var me=mr&&mr.data&&mr.data.person; if(me && me.slug===slug){ IS_OWNER=true; document.body.classList.add("is-owner"); document.getElementById("editlink").style.display="inline-block"; if(_relayout) _relayout(); if(new URLSearchParams(location.search).get("welcome")==="1") showWelcomeBanner(); } }).catch(function(){}); }
    }).catch(function(){ app.innerHTML='<div class="wrap" style="padding:60px 22px;color:var(--pink)">Could not load this portfolio. Try again.</div>'; });
  }
  if(IS_DRAFT){ loadDraft(); } else { loadPortfolio(); }

  // ===== games-only DRAFT mode: build a wall from localStorage, no account yet =====
  function dGet(){ try{ return JSON.parse(localStorage.getItem("dq_draft")||"null")||{name:"",credits:[]}; }catch(e){ return {name:"",credits:[]}; } }
  function dSet(d){ try{ localStorage.setItem("dq_draft", JSON.stringify(d||{name:"",credits:[]})); }catch(e){} }
  function draftCredit(c,i){ return { id:"draft-"+i, game_slug:c.game_slug, game_title:c.game_title||c.game_slug, studio:c.studio||"", year:c.year||null, work_start:(c.work_start!=null?c.work_start:(c.year||null)), work_end:(c.work_end!=null?c.work_end:null), role:c.role||"", roles_other:[], releases:[], links:[], source_url:"", verification:[], vouch_count:0, sheet:c.sheet||null, scope:"base" }; }
  function loadDraft(){
    document.body.classList.add("is-draft");
    IS_OWNER=true; document.body.classList.add("is-owner");   // draft acts like owner; writes go to localStorage, never the API
    var d=dGet(); var credits=(d.credits||[]).map(draftCredit);
    var pf=d.profile||{};
    var person={ name:d.name||"Your name", slug:null, headline:pf.headline||"", location:pf.location||"", bio:pf.bio||"", links:pf.links||[], skills:{groups:[]}, portfolio_style:"production", open_to_work:pf.open_to_work?1:0, avatar_url:pf.avatar_url||"" };
    resolveCovers(credits).then(function(cm){ cm=cm||{}; (d.credits||[]).forEach(function(c){ if(c.cover_url) cm[c.game_slug]=c.cover_url; }); render(person,[],credits,cm); mountDraftBar(credits.length); }).catch(function(){ render(person,[],credits,{}); mountDraftBar(credits.length); });
  }
  // Mirror the rendered _credits back into the localStorage draft (role, work years, one-sheet, cover, order).
  function draftSyncFromCredits(){
    var d=dGet();
    d.credits=(_credits||[]).map(function(c){ return { game_slug:c.game_slug, game_title:c.game_title, studio:c.studio||"", year:c.year||"", role:c.role||"", work_start:(c.work_start!=null?c.work_start:null), work_end:(c.work_end!=null?c.work_end:null), sheet:c.sheet||null, cover_url:(_covMap[c.game_slug]||"") }; });
    dSet(d);
  }
  function reloadDraft(){ loadDraft(); }
  function mountDraftBar(count){
    // Persistent publish banner pinned to the very top for the whole draft session.
    var oldp=document.getElementById("draftpub"); if(oldp) oldp.remove();
    var pub=document.createElement("div"); pub.id="draftpub";
    pub.innerHTML='<div class="dp-inner"><span class="dp-msg">'+(count?('You’re building a draft · <b>'+count+' game'+(count===1?'':'s')+'</b> saved on this device only. Publish to keep it for good.'):'You’re building a draft portfolio. Publish to save it to your account.')+'</span><button type="button" id="dp-save" class="db-btn primary">Save &amp; publish →</button></div>';
    document.body.appendChild(pub);
    document.getElementById("dp-save").onclick=draftSave;
    var old=document.getElementById("draftbar"); if(old) old.remove();
    var bar=document.createElement("div"); bar.id="draftbar";
    bar.innerHTML='<div class="db-inner"><div class="db-note">'+(count?('<b>'+count+'</b> game'+(count===1?'':'s')+' on your wall · saved on this device'):'Your wall is empty — add a game you shipped to start')+'</div><div class="db-actions"><button type="button" id="db-add" class="db-btn ghost">+ Add a game</button><button type="button" id="db-save" class="db-btn primary">Save my portfolio →</button></div></div>';
    document.body.appendChild(bar);
    document.getElementById("db-add").onclick=draftAddSearch;
    document.getElementById("db-save").onclick=draftSave;
  }
  function draftModal(inner){ var ov=document.createElement("div"); ov.className="dmodal-ov"; ov.innerHTML='<div class="dmodal"><button class="dx" aria-label="Close">×</button>'+inner+'</div>'; document.body.appendChild(ov); ov.querySelector(".dx").onclick=function(){ ov.remove(); }; return ov; }
  function draftRole(game, onDone){
    var d=dGet();
    var ov=draftModal('<h3>Add '+esc(game.game_title||"this game")+' to your wall</h3><div class="dsub">No account needed yet. Add your role and it goes straight on your portfolio.</div>'+(d.name?'':'<label>Your name</label><input id="dr-name" placeholder="Jane Doe">')+'<label>Your role on '+esc(game.game_title||"this game")+'</label><input id="dr-role" placeholder="e.g. Senior Producer" autocomplete="off"><div class="dact"><button class="db-btn ghost" data-x>Cancel</button><button class="db-btn primary" id="dr-add">Add to my wall →</button></div><div class="dfoot">Saved on this device. We only ask for an email when you save your portfolio.</div>');
    ov.querySelector("[data-x]").onclick=function(){ ov.remove(); };
    ov.querySelector("#dr-add").onclick=function(){
      var role=((ov.querySelector("#dr-role")||{}).value||"").trim(); if(!role){ alert("Add your role first."); return; }
      var dd=dGet(); var nmEl=ov.querySelector("#dr-name"); if(nmEl && nmEl.value.trim()) dd.name=nmEl.value.trim();
      if(!dd.credits.some(function(c){return c.game_slug===game.game_slug;})) dd.credits.push({game_slug:game.game_slug,game_title:game.game_title,studio:game.studio||"",year:game.year||"",role:role});
      dSet(dd); ov.remove(); if(onDone) onDone();
    };
    setTimeout(function(){ var r=ov.querySelector("#dr-role"); if(r) r.focus(); },40);
  }
  function draftAddSearch(){
    var have={}; (dGet().credits||[]).forEach(function(c){ have[c.game_slug]=1; });
    var ov=draftModal('<h3>Add a game you shipped</h3><div class="dsub">Search the catalogue and pick a title you worked on.</div><input id="da-q" placeholder="Start typing a game title…" autocomplete="off"><div id="da-res" style="margin-top:10px;max-height:320px;overflow:auto"></div><div class="dfoot">Not in the catalogue? You can add a missing game once you save.</div>');
    var qi=ov.querySelector("#da-q"), res=ov.querySelector("#da-res"), t;
    function paint(gs){ if(!gs.length){ res.innerHTML='<div style="color:var(--muted,#8b98a9);font-size:13px;padding:8px 2px">No matches yet.</div>'; return; } res.innerHTML=gs.map(function(g){ var added=have[g.slug]; return '<button class="da-row" data-slug="'+esc(g.slug)+'" data-title="'+esc(g.title)+'" data-studio="'+esc(g.studio||"")+'" data-year="'+esc(g.year||"")+'" '+(added?"disabled":"")+' style="display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:transparent;border:0;border-top:1px solid var(--border,#242c38);padding:10px 4px;cursor:'+(added?"default":"pointer")+';color:inherit"><span style="flex:1;min-width:0"><span style="display:block;font-weight:700;font-size:14px">'+esc(g.title)+'</span>'+((g.studio||g.year)?'<span style="display:block;color:var(--muted,#8b98a9);font-size:12px">'+esc((g.studio||"")+(g.studio&&g.year?" · ":"")+(g.year||""))+'</span>':'')+'</span><span style="font-size:12px;font-weight:800;color:'+(added?"var(--muted,#8b98a9)":"var(--accent,#58a6ff)")+';white-space:nowrap">'+(added?"Added ✓":"Add →")+'</span></button>'; }).join(""); }
    qi.addEventListener("input",function(){ clearTimeout(t); var q=qi.value.trim(); if(!q){ res.innerHTML=""; return; } t=setTimeout(function(){ if(DQAPI.searchGames) DQAPI.searchGames(q).then(function(r){ paint(((r.data&&r.data.games)||[]).slice(0,12)); }).catch(function(){}); },140); });
    res.addEventListener("click",function(e){ var b=e.target.closest&&e.target.closest(".da-row"); if(!b||b.disabled) return; var g={game_slug:b.getAttribute("data-slug"),game_title:b.getAttribute("data-title"),studio:b.getAttribute("data-studio"),year:b.getAttribute("data-year")}; ov.remove(); draftRole(g, reloadDraft); });
    setTimeout(function(){ qi.focus(); },40);
  }
  function draftSave(){
    var d=dGet(); if(!(d.credits&&d.credits.length)){ alert("Add at least one game to your wall first."); return; }
    var ov=draftModal('<h3>Save &amp; publish your portfolio</h3><div class="dsub">You have <b>'+d.credits.length+'</b> game'+(d.credits.length===1?'':'s')+' on your wall. Confirm your name, then we\'ll email you a one-tap link to save it. This is the first time we ask for an email.</div><label>Your name (as it should be credited)</label><input id="ds-name" value="'+esc(d.name||"")+'" placeholder="Jane Doe"><div class="dact"><button class="db-btn ghost" data-x>Not yet</button><button class="db-btn primary" id="ds-go">Continue to save →</button></div><div class="dfoot">Your games stay saved on this device until then.</div>');
    ov.querySelector("[data-x]").onclick=function(){ ov.remove(); };
    ov.querySelector("#ds-go").onclick=function(){ var name=((ov.querySelector("#ds-name")||{}).value||"").trim(); if(!name){ alert("Add your name first."); return; } var dd=dGet(); dd.name=name; dSet(dd); location.href="/credits/signin.html?publish=1"; };
    setTimeout(function(){ var n=ov.querySelector("#ds-name"); if(n) n.focus(); },40);
  }
  function showWelcomeBanner(){
    if(document.getElementById("welcomebar")) return;
    var b=document.createElement("div"); b.id="welcomebar";
    b.innerHTML='<div class="wb-inner"><div class="wb-txt"><b>Your portfolio is live.</b> Add your work history and skills to finish it — and use “Edit header” up top for your photo and bio.</div><a class="wb-btn" href="/portfolio/edit/">Add work history →</a><button type="button" class="wb-x" aria-label="Dismiss">×</button></div>';
    document.body.appendChild(b);
    b.querySelector(".wb-x").onclick=function(){ b.remove(); };
  }

  function creditYear(c){ return c.work_start || c.year || c.work_end || null; }
  function isLive(c){ return (c.releases||[]).some(function(x){ return /live/i.test(x); }); }
  function comingSoon(c){ var d=c.sheet&&c.sheet.release_date; if(!d) return false; var t=Date.parse(d); return !isNaN(t) && t>Date.now(); }
  // portfolio-level average critic score across titles that have one (auto-shows only with 2+ scored titles)
  var MIN_SCORED = 2;
  function avgCritic(credits){
    var vals=[];
    (credits||[]).forEach(function(c){ var rs=c.sheet&&c.sheet.review_score; if(rs && rs.score!=null && rs.score!==""){ var n=+rs.score; if(!isNaN(n)) vals.push(n); } });
    if(vals.length<MIN_SCORED) return null;
    var sum=vals.reduce(function(a,b){ return a+b; },0);
    return { avg: Math.round(sum/vals.length), n: vals.length };
  }
  function fmtRel(d){ var t=Date.parse(d); if(isNaN(t)) return String(d); return new Date(t).toLocaleDateString(undefined,{month:"short",year:"numeric"}); }
  // linkify: escapes, then turns [label](url) and bare URLs into clickable links
  function shortUrl(u){ var s=String(u).replace(/^https?:\/\//,"").replace(/\/$/,""); return s.length>46?s.slice(0,44)+"…":s; }
  function linkify(s){
    s=esc(s);
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function(m,l,u){ return '<a href="'+u+'" target="_blank" rel="noopener">'+l+'</a>'; });
    s=s.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, function(m,pre,u){ return pre+'<a href="'+u+'" target="_blank" rel="noopener">'+shortUrl(u)+'</a>'; });
    return s;
  }
  // media: detect video links so screenshots can be YouTube/Vimeo/mp4
  function ytId(u){ var m=String(u).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/); return m?m[1]:null; }
  function vimeoId(u){ var m=String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/); return m?m[1]:null; }
  function mediaTile(u){
    var yt=ytId(u), vm=vimeoId(u);
    if(yt) return '<div class="osshot osvid" data-embed="https://www.youtube.com/embed/'+yt+'?autoplay=1"><img src="https://img.youtube.com/vi/'+yt+'/hqdefault.jpg" alt="" onerror="this.style.opacity=.25"><span class="osplay">▶</span></div>';
    if(vm) return '<div class="osshot osvid" data-embed="https://player.vimeo.com/video/'+vm+'?autoplay=1"><div class="osvidbg"></div><span class="osplay">▶</span></div>';
    if(/\.(mp4|webm|mov)(\?|$)/i.test(u)) return '<div class="osshot"><video src="'+esc(u)+'" controls preload="metadata" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000"></video></div>';
    return '<div class="osshot"><img src="'+esc(u)+'" alt="" onerror="this.closest(\'.osshot\').style.display=\'none\'"></div>';
  }
  // critic score badge — OpenCritic or Metacritic, clickable to the score page
  function scoreColor(n){ n=+n; if(n>=75) return {bg:"#6dc84a",fg:"#08210a"}; if(n>=50) return {bg:"#f2c94c",fg:"#231b02"}; return {bg:"#f0563f",fg:"#2a0a05"}; }
  function reviewBadge(sh){
    var rs=sh&&sh.review_score;
    if(!rs || rs.score==null || rs.score==="") return "";

    {canon:"animation",label:"Animation",v:["animation","rigging","skeletal","mocap","motion capture"]},
    {canon:"rendering",label:"Rendering / graphics",v:["rendering","graphics","shader","shaders","lighting","gpu","render pipeline"]},
    {canon:"physics",label:"Physics",v:["physics","collision","simulation"]},
    {canon:"optimization",label:"Optimization / perf",v:["optimization","optimisation","performance","profiling","frame rate","fps","memory budget"]},
    {canon:"ui",label:"UI/UX",v:["ui","ux","user interface","user experience","hud","front end"]},
    {canon:"production",label:"Production",v:["production","producer","program management","project management","delivery"]},

  // ---- shared image upload + preview helpers (portrait, cover, banner, screenshots) ----
  function downscaleImage(file, maxDim){
    maxDim = maxDim || 1400;
    return new Promise(function(resolve){
      if(!/^image\/(png|jpe?g|webp)$/i.test(file.type)){ resolve(file); return; }
      try{
        var img=new Image(), url=URL.createObjectURL(file);
        img.onload=function(){
          var w=img.naturalWidth, h=img.naturalHeight, mx=Math.max(w,h);
          if(mx<=maxDim && file.size<900*1024){ URL.revokeObjectURL(url); resolve(file); return; }
          var sc=Math.min(1,maxDim/mx), cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
          var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
          cv.getContext("2d").drawImage(img,0,0,cw,ch);
          URL.revokeObjectURL(url);
          cv.toBlob(function(b){ resolve(b&&b.size?b:file); }, "image/webp", 0.85);
        };
        img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
        img.src=url;
      }catch(e){ resolve(file); }
    });
  }
  function wireUploads(container){
    container.querySelectorAll(".upbtn[data-upload-for]").forEach(function(btn){
      if(btn._wired) return; btn._wired=true;
      var file=document.createElement("input"); file.type="file"; file.accept="image/png,image/jpeg,image/webp,image/gif"; file.style.display="none";
      btn.parentNode.appendChild(file);
      btn.onclick=function(){ file.click(); };
      file.onchange=function(){
        var f=file.files&&file.files[0]; if(!f) return;
        var target=document.getElementById(btn.getAttribute("data-upload-for"));
        var old=btn.textContent;
        if(!/^image\/(png|jpe?g|webp|gif)$/i.test(f.type)){ btn.textContent="PNG / JPG / WebP / GIF only"; setTimeout(function(){ btn.textContent=old; },1800); file.value=""; return; }
        if(f.size>15*1024*1024){ btn.textContent="Too large (15 MB max)"; setTimeout(function(){ btn.textContent=old; },2200); file.value=""; return; }
        btn.textContent="Uploading…"; btn.classList.add("busy");
        downscaleImage(f).then(function(blob){ return DQAPI.uploadImage(blob); }).then(function(r){
          btn.classList.remove("busy");
          if(r&&r.ok&&r.data&&r.data.url){
            var u=r.data.url;
            if(target){ if(target.tagName==="TEXTAREA"){ target.value=(target.value.trim()?target.value.trim()+"\n":"")+u; } else { target.value=u; target.dataset.cleared=""; } target.dispatchEvent(new Event("input")); }
            btn.textContent="Uploaded ✓"; setTimeout(function(){ btn.textContent=old; },1400);
          } else { btn.textContent=(r&&r.data&&r.data.error)||"Upload failed"; setTimeout(function(){ btn.textContent=old; },2400); }
          file.value="";
        }).catch(function(){ btn.classList.remove("busy"); btn.textContent="Upload failed"; setTimeout(function(){ btn.textContent=old; },2400); file.value=""; });
      };
    });
  }

  // shared studio typeahead: full catalogue studios (static index.json) + live user-added
  function wireStudioTypeahead(inEl, resEl){
    var t=null;
    function run(){
      var v=inEl.value.trim(); if(v.length<2){ resEl.innerHTML=""; return; }
      var ql=v.toLowerCase();
      var staticP=getJSON("/credits/data/site/index.json").then(function(rows){
        if(!Array.isArray(rows)) return [];
        var seen={}, out=[];
        for(var i=0;i<rows.length && out.length<40;i++){ var s=rows[i]&&rows[i][3]; if(!s) continue; var sl=String(s).toLowerCase(); if(sl.indexOf(ql)!==-1 && !seen[sl]){ seen[sl]=1; out.push(String(s)); } }
        return out;
      }).catch(function(){ return []; });
      var liveP=(DQAPI.searchStudios?DQAPI.searchStudios(v).then(function(r){ return ((r&&r.data&&r.data.studios)||[]).map(function(s){ return s.name; }); }).catch(function(){ return []; }):Promise.resolve([]));
      Promise.all([staticP,liveP]).then(function(a){
        var seen={}, names=[];
        a[0].concat(a[1]).forEach(function(n){ if(!n) return; var k=String(n).toLowerCase(); if(seen[k]) return; seen[k]=1; names.push(String(n)); });
        names.sort(function(x,y){ var xs=x.toLowerCase().indexOf(ql)===0?0:1, ys=y.toLowerCase().indexOf(ql)===0?0:1; return xs-ys || x.localeCompare(y); });
        names=names.slice(0,12);
        if(!names.length){ resEl.innerHTML=""; return; }
        resEl.innerHTML=names.map(function(n,i){ return '<div class="agresult" data-i="'+i+'"><span class="agt">'+esc(n)+'</span></div>'; }).join("");
        resEl.querySelectorAll(".agresult").forEach(function(el){ el.onclick=function(){ inEl.value=names[+el.dataset.i]; resEl.innerHTML=""; }; });
      });
    }
    inEl.oninput=function(){ clearTimeout(t); t=setTimeout(run,200); };
  }

      var ver=cs?'<span class="rcver soon">Coming soon</span>':(conf>0?'<span class="rcver ok">✓ '+conf+' confirmed</span>':'<span class="rcver none">Unconfirmed</span>');
      var scope=(sh.stats&&sh.stats.length)?'<div class="rcscope">'+sh.stats.slice(0,4).map(function(s){ return '<span><b>'+esc(s.value)+'</b> '+esc(s.label)+'</span>'; }).join("")+'</div>':'';
      var impact=(sh.contributions&&sh.contributions.length)?'<ul class="rcimp">'+sh.contributions.slice(0,3).map(function(d){ return '<li>'+linkify(d)+'</li>'; }).join("")+'</ul>':'<div class="rcnone">No impact details added yet.</div>';
      var chal=(sh.challenges&&sh.challenges.length)?'<div class="rcchal"><span class="rclab">Challenges</span>'+esc(sh.challenges.slice(0,2).join("  ·  "))+'</div>':'';
      return '<div class="rcrow" data-ci="'+ci+'" data-studio="'+esc(_studioKeyOf(c))+'"><div class="rcthumb">'+thumb+'</div>'+
        '<div class="rcmain"><div class="rchead"><span class="rcgame">'+esc(c.game_title)+'</span>'+ver+'</div>'+
        '<div class="rcrole">'+esc(c.role)+(c.studio?' · '+esc(c.studio):'')+(creditYear(c)?' · '+creditYear(c):'')+'</div>'+
        scope+impact+chal+'</div></div>';
    }).join("");
    return why+'<div class="rclist">'+rows+'<div class="rcempty rchidden">No shipped titles listed under <b class="rcemptyname"></b> yet. <button class="rcsx" data-studio="">Show all</button></div></div>';
  }
  function deslug(s){ return String(s||"").split("-").map(function(w){ return w?w.charAt(0).toUpperCase()+w.slice(1):w; }).join(" "); }

  // ---- peer-confirmation popover (matches the credits evidence popover) ----
  var _cfovl=null;
  function ensureCf(){
    if(_cfovl) return;
    _cfovl=document.createElement("div"); _cfovl.className="cfovl"; _cfovl.innerHTML='<div class="cfcard" id="cfcard"></div>';
    document.body.appendChild(_cfovl);
    _cfovl.addEventListener("click",function(e){ if(e.target===_cfovl) closeCf(); });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeCf(); });
  }
  function closeCf(){ if(_cfovl) _cfovl.classList.remove("on"); }
  function cfHead(){ return '<div class="cfhead"><span class="ck">✓</span> Peer-confirmed <button class="x" aria-label="Close">✕</button></div>'; }
  function openConfirmers(cid, title){
    ensureCf();
    var card=document.getElementById("cfcard");
    card.innerHTML=cfHead()+'<div style="padding:18px 16px;color:var(--muted);font-size:13px">Loading…</div>';
    card.querySelector(".x").onclick=closeCf;
    _cfovl.classList.add("on");
    DQAPI.confirmers(cid).then(function(r){
      var d=(r&&r.data)||{}; var list=d.confirmers||[];
      var rows=list.map(function(v){
        var av=(v.name||"?").split(/\s+/).map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();
        var meta=esc(v.headline||"")+(v.credit_count?((v.headline?' · ':'')+v.credit_count+' credited title'+(v.credit_count>1?'s':'')):'');
        return '<a class="cfrow" href="/portfolio/'+esc(v.slug)+'"><span class="cfav">'+esc(av)+'</span><span class="cfinfo"><span class="cfnm">'+esc(v.name)+'</span><span class="cfmeta">'+meta+'</span></span></a>';
      }).join("");
      card.innerHTML=cfHead()+
        '<div class="cfsub">Confirmed by teammates who shipped this game</div>'+
        (rows||'<div style="padding:6px 16px 14px;color:var(--muted);font-size:13px">No confirmations yet.</div>')+
        '<div class="cffoot"><a href="/credits/how-evidence-works.html">How evidence works →</a></div>';
      card.querySelector(".x").onclick=closeCf;
    }).catch(function(){
      card.innerHTML=cfHead()+'<div style="padding:16px;color:var(--pink);font-size:13px">Could not load confirmations.</div>';
      card.querySelector(".x").onclick=closeCf;
    });
  }

  // ---- unified wall <-> timeline stage ----
  function _studioKey(s){ return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]+/g,""); }
  function assignBand(c, bands){ var y=creditYear(c); var ck=_studioKey(c.studio); if(ck){ var m=[]; for(var i=0;i<bands.length;i++){ var b=bands[i]; var pk=_studioKey(b.p&&(b.p.studio_slug||b.p.studio)); if(pk&&pk===ck) m.push(i); } if(m.length===1) return m[0]; if(m.length>1){ if(y){ for(var j=0;j<m.length;j++){ if(y>=bands[m[j]].s&&y<=bands[m[j]].e) return m[j]; } } return m[0]; } } if(y){ for(var k=0;k<bands.length;k++){ if(y>=bands[k].s&&y<=bands[k].e) return k; } } return -1; }
  function buildStage(credits, positions, covMap){
    var stage=document.getElementById("stage"); if(!stage) return;
    var chrome=document.getElementById("chrome"), spine=document.getElementById("spine");
    var order=credits.map(function(_,i){return i;});
    var mode="grid", tiles=[], labels=[], dots=[], geo={}, GAP=16, SLOTS=3;

    var bands=positions.map(function(p){ var s=p.start_year||CUR, e=p.is_current?CUR:(p.end_year||s); if(e<s)e=s; return {p:p,s:s,e:e}; });
    // No work history yet (e.g. a games-only draft): build a career spine from the games' own
    // studios + work years, so the timeline lays them out chronologically instead of dumping
    // everything into one "Also credited" pile.
    if(!bands.length){
      var _bs={}, _order=[];
      credits.forEach(function(c){
        var key=_studioKey(c.studio) || ("g:"+(c.game_slug||c.game_title||""));
        var y=creditYear(c);
        if(!_bs[key]){ _bs[key]={ studio:c.studio||c.game_title||"Other", s:(y||CUR), e:(y||CUR) }; _order.push(key); }
        else if(y){ if(y<_bs[key].s)_bs[key].s=y; if(y>_bs[key].e)_bs[key].e=y; }
      });
      bands=_order.map(function(k){ var b=_bs[k]; return { p:{ studio:b.studio, studio_slug:"", is_current:false, start_year:b.s, end_year:b.e }, s:b.s, e:b.e }; });
      bands.sort(function(a,b){ return (b.s||0)-(a.s||0); }); // newest first
    }
    function bandOf(c){ return assignBand(c, bands); }

    credits.forEach(function(c,i){
      var el=document.createElement("div"); el.className="tile"; el.dataset.i=i;
      var conf=(c.vouch_count||0)>0;
      el.innerHTML='<div class="fb" style="background:'+gameGrad(c.game_slug)+'"><span>'+esc(c.game_title)+'</span></div>'+art(c.game_slug,covMap)+'<div class="gloss"></div>'+(conf?'<span class="vb">✓</span>':'')+(comingSoon(c)?'<span class="cs">COMING SOON</span>':'')+'<span class="grip">⠿</span><span class="hf">★ Featured</span>';
      stage.appendChild(el); tiles.push(el);
    });
    var addEl=document.createElement("div"); addEl.className="addtile"; addEl.innerHTML='<div class="plus">+</div><div class="lbl">Add game</div>'; addEl.onclick=openAddGame; stage.appendChild(addEl);
    var hasOrphan = credits.some(function(c){ return bandOf(c)<0; });
    var labelBands = bands.map(function(b){ return {studio:b.p.studio, cur:b.p.is_current, s:b.s, e:b.e}; });
    if(hasOrphan) labelBands.push({studio:"Also credited", orphan:true});
    labelBands.forEach(function(b){
      var L=document.createElement("div"); L.className="slabel";
      var yrs = b.orphan ? "" : (b.s+" – "+(b.cur?"Present":b.e));
      L.innerHTML='<div class="snm">'+esc(b.studio)+'<span class="lg" style="background:'+studioGrad(b.studio)+'">'+esc(studioMark(b.studio))+'</span></div>'+(yrs?'<div class="yr">'+yrs+'</div>':'');
      chrome.appendChild(L); labels.push(L);
      var d=document.createElement("div"); d.className="sdot"; chrome.appendChild(d); dots.push(d);
    });

    function computeBase(){
      var W=stage.clientWidth||900;
      var cols=Math.max(2,Math.min(6,Math.floor((W+GAP)/(176+GAP))));
      var bw=Math.floor((W-GAP*(cols-1))/cols), bh=Math.round(bw*1.5);
      tiles.forEach(function(el){ el.style.width=bw+"px"; el.style.height=bh+"px"; });
      addEl.style.width=bw+"px"; addEl.style.height=bh+"px";
      geo={W:W,cols:cols,bw:bw,bh:bh};
    }
    function put(el,x,y,s){ el.style.transform="translate("+x+"px,"+y+"px) scale("+s+")"; }
    function placeGrid(skip){
      var bw=geo.bw, bh=geo.bh, cols=geo.cols;
      var heroW=Math.round((geo.W - GAP*(SLOTS-1))/SLOTS), hs=heroW/bw, heroH=Math.round(bh*hs);
      var heroN=Math.min(SLOTS, order.length);
      order.forEach(function(gi,k){ tiles[gi].classList.toggle("hero", k<heroN); });
      for(var k=0;k<heroN;k++){ var gi=order[k]; if(gi!==skip) put(tiles[gi], k*(heroW+GAP), 0, hs); }
      var gy = heroN ? heroH + GAP + 14 : 0;
      var rest=order.slice(heroN), total=0;
      rest.forEach(function(gi,j){ if(gi===skip) return; var row=Math.floor(j/cols), col=j%cols; put(tiles[gi], col*(bw+GAP), gy+row*(bh+GAP), 1); });
      total=rest.length;
      if(IS_OWNER){ addEl.style.display="flex"; put(addEl,(total%cols)*(bw+GAP), gy+Math.floor(total/cols)*(bh+GAP), 1); total+=1; }
      else addEl.style.display="none";
      stage.style.height=(gy + Math.max(1,Math.ceil(total/cols))*(bh+GAP) - GAP)+"px";
    }
    function layout(){
      var bw=geo.bw, bh=geo.bh, W=geo.W;
      if(mode==="grid"){
        placeGrid(-1);
      } else {
        addEl.style.display="none";
        var labelW=Math.min(210,Math.max(148,Math.round(W*0.22))), spineX=labelW+18, tilesX=spineX+22, tW=74, sc=tW/bw, tH=Math.round(tW*1.5), tg=12;
        var perRow=Math.max(1,Math.floor((W-tilesX)/(tW+tg)));
        spine.style.left=spineX+"px";
        var byBand={}; credits.forEach(function(c,i){ var b=bandOf(c); if(b<0)b=bands.length; (byBand[b]=byBand[b]||[]).push(i); });
        Object.keys(byBand).forEach(function(b){ byBand[b].sort(function(a,c){ return (creditYear(credits[c])||0)-(creditYear(credits[a])||0); }); });
        var y=0;
        labels.forEach(function(L,bi){
          var list=byBand[bi]||[];
          var rows=Math.max(1,Math.ceil(list.length/perRow));
          var bandH=Math.max(76, rows*(tH+tg));
          L.style.width=labelW+"px"; L.style.transform="translate(0px,"+(y+6)+"px)";
          dots[bi].style.transform="translate("+(spineX-5.5)+"px,"+(y+8)+"px)";
          list.forEach(function(gi,idx){ var r=Math.floor(idx/perRow), c2=idx%perRow; put(tiles[gi], tilesX+c2*(tW+tg), y+r*(tH+tg), sc); });
          y+=bandH+18;
        });
        spine.style.top="6px"; spine.style.height=(y-18)+"px";
        stage.style.height=y+"px";
      }
    }

    var vt=document.getElementById("vtoggle"), vh=document.getElementById("vhint"), rec=document.getElementById("recruiter");
    function setHint(){ vh.textContent = mode==="grid" ? (IS_OWNER?"Drag your best games into the three big Featured slots up top. Click a game for its one-sheet.":"Click any game for its one-sheet.") : (mode==="timeline" ? "Same games — now on your career spine, newest first." : "A recruiter-first read: role, scope, impact, and proof — in the same order, every title."); }
    function filterStudio(rec, chip){
      var key=chip.dataset.studio||"", name=chip.textContent;
      [].forEach.call(rec.querySelectorAll(".rcstudios .rcsx"),function(c){ c.classList.toggle("on",(c.dataset.studio||"")===key); });
      var rows=[].slice.call(rec.querySelectorAll(".rclist .rcrow")), shown=0;
      rows.forEach(function(r){ var m=!key||(r.dataset.studio||"")===key; r.classList.toggle("rchidden",!m); if(m)shown++; });
      var empty=rec.querySelector(".rcempty");
      if(empty){ if(key&&shown===0){ var nm=empty.querySelector(".rcemptyname"); if(nm)nm.textContent=name; empty.classList.remove("rchidden"); } else empty.classList.add("rchidden"); }
      var cnt=rec.querySelector(".rcfltcount"); if(cnt) cnt.textContent = key ? (shown+" title"+(shown===1?"":"s")) : "";
    }
    function wireRecruiter(el){ el.onclick=function(e){ var chip=e.target.closest(".rcsx"); if(chip){ e.stopPropagation(); filterStudio(el, chip); return; } var v=e.target.closest(".rcver.ok"); if(v){ e.stopPropagation(); var rw=v.closest(".rcrow"); if(rw) openConfirmers(credits[+rw.dataset.ci].id, credits[+rw.dataset.ci].game_title); return; } var row=e.target.closest(".rcrow"); if(row) openSheet(+row.dataset.ci); }; }
    vt.addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b||b.dataset.m===mode) return;
      var prev=mode;
      mode=b.dataset.m;
      [].forEach.call(vt.children,function(x){x.classList.toggle("on",x.dataset.m===mode);});
      setHint();
      if(mode==="recruiter"){
        if(rec){ rec.innerHTML=recruiterHTML(credits, positions, covMap); wireRecruiter(rec); }
        stage.classList.add("vanish");
        setTimeout(function(){
          stage.style.display="none"; stage.classList.remove("vanish");
          if(rec){ rec.style.display="block"; rec.classList.remove("show"); void rec.offsetWidth; rec.classList.add("show"); }
        },240);
      } else if(prev==="recruiter"){
        if(rec) rec.classList.remove("show");
        setTimeout(function(){
          if(rec) rec.style.display="none";
          stage.style.display=""; stage.className=mode;
          stage.classList.add("vanish"); void stage.offsetWidth;
          layout();
          requestAnimationFrame(function(){ stage.classList.remove("vanish"); });
        },240);
      } else {
        if(rec) rec.style.display="none";
        stage.style.display=""; stage.className=mode; layout();
      }
    });

    var drag=null, saveT=null;
    function persist(){ if(!IS_OWNER) return;
      if(IS_DRAFT){ clearTimeout(saveT); saveT=setTimeout(function(){ var d=dGet(); var bySlug={}; (d.credits||[]).forEach(function(x){ bySlug[x.game_slug]=x; }); var nw=order.map(function(gi){ return bySlug[credits[gi].game_slug]; }).filter(Boolean); if(nw.length===(d.credits||[]).length){ d.credits=nw; dSet(d); } },600); return; }
      clearTimeout(saveT); saveT=setTimeout(function(){ try{ DQAPI.reorderCredits(order.map(function(gi){return credits[gi].id;})); }catch(e){} },700); }
    stage.addEventListener("pointerdown",function(e){
      if(mode!=="grid"||!IS_OWNER) return;
      var el=e.target.closest(".tile"); if(!el) return;
      var gi=+el.dataset.i;
      var tr=getComputedStyle(el).transform; var m=(tr&&tr!=="none")?new DOMMatrix(tr):new DOMMatrix();
      drag={el:el,gi:gi,sx:e.clientX,sy:e.clientY,moved:false,ox:e.clientX-m.m41,oy:e.clientY-m.m42};
      el.setPointerCapture(e.pointerId);
    });
    stage.addEventListener("pointermove",function(e){
      if(!drag) return;
      var dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
      if(!drag.moved && Math.hypot(dx,dy)<6) return;
      if(!drag.moved){ drag.moved=true; drag.el.classList.add("drag"); drag.el.style.transition="none"; }
      put(drag.el, e.clientX-drag.ox, e.clientY-drag.oy, 1.1);
      var r=stage.getBoundingClientRect();
      var lx=e.clientX-r.left, ly=e.clientY-r.top;
      var heroW=Math.round((geo.W-GAP*(SLOTS-1))/SLOTS), heroH=Math.round(geo.bh*(heroW/geo.bw)), heroN=Math.min(SLOTS,order.length), slot;
      if(ly < heroH + GAP/2){ slot=Math.max(0,Math.min(SLOTS-1, Math.floor(lx/(heroW+GAP)))); slot=Math.min(slot, order.length-1); }
      else { var gy=heroH+GAP+14; var col=Math.max(0,Math.min(geo.cols-1,Math.floor(lx/(geo.bw+GAP)))); var row=Math.max(0,Math.floor((ly-gy)/(geo.bh+GAP))); slot=Math.min(order.length-1, heroN + row*geo.cols + col); }
      var cur=order.indexOf(drag.gi);
      if(slot!==cur){ order.splice(cur,1); order.splice(slot,0,drag.gi); relayoutExcept(drag.gi); }
    });
    stage.addEventListener("pointerup",function(e){
      if(!drag) return; var d=drag; drag=null;
      if(!d.moved){ openSheet(d.gi); return; }
      d.el.classList.remove("drag"); d.el.style.transition=""; layout(); persist();
    });
    function relayoutExcept(skip){ placeGrid(skip); }
    stage.addEventListener("click",function(e){ if(IS_OWNER) return; var el=e.target.closest(".tile"); if(el) openSheet(+el.dataset.i); });

    var rt; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(function(){ computeBase(); layout(); },120); });
    _relayout=function(){ computeBase(); layout(); };
    computeBase(); setHint(); layout();
  }

  function gtile(c, covMap){
    var conf=(c.vouch_count||0)>0;
    return '<div class="gtile"><div class="tart" style="background:'+gameGrad(c.game_slug)+'">'+art(c.game_slug,covMap)+'<span class="tini">'+esc(initials(c.game_title))+'</span>'+(conf?'<span class="tv '+(c.vouch_count>1?"green":"blue")+'">✓</span>':'')+'</div>'+
      '<div class="gtr">'+esc(c.role)+(creditYear(c)?' · '+creditYear(c):'')+'</div></div>';
  }

  function buildTimeline(positions, credits, covMap){
    covMap = covMap || {};
    if(!positions.length && !credits.length) return {html:""};
    // bands from positions (already newest-first from API)
    var bands=positions.map(function(p){
      var s=p.start_year||CUR, e=p.is_current?CUR:(p.end_year||s); if(e<s) e=s;
      return {p:p,s:s,e:e,credits:[]};
    });
    // assign credits to the studio they belong to by year-in-range; else orphan
    var orphans=[];
    credits.forEach(function(c){
      var bi=assignBand(c, bands);
      if(bi<0) orphans.push(c); else bands[bi].credits.push(c);
    });
    // one row per studio: meta left of the spine, games right of it
    var rows = bands.map(function(b){
      var p=b.p;
      var list=b.credits.sort(function(a,c){ return (creditYear(c)||0)-(creditYear(a)||0); });
      var games = list.length ? '<div class="shelf">'+list.map(function(c){ return gtile(c,covMap); }).join("")+'</div>'
                              : '<div class="tnone">No publicly shipped titles from this role.</div>';
      return '<div class="trow"><span class="tdot"></span>'+
        '<div class="tmeta">'+
          '<div class="tst"><span class="tname">'+esc(p.studio)+'</span><span class="tlogo" style="background:'+studioGrad(p.studio)+'">'+esc(studioMark(p.studio))+'</span></div>'+
          '<div class="tyr">'+b.s+' – '+(p.is_current?'Present':b.e)+'</div>'+
        '</div>'+
        '<div class="tgames">'+games+'</div></div>';
    }).join("");
    var tlBlock='<div class="tl3"><div class="spine"></div>'+rows+'</div>';

    // orphans (credits without a matching position)
    var othersBlock = "";
    if(orphans.length){
      orphans.sort(function(a,c){ return (creditYear(c)||0)-(creditYear(a)||0); });
      othersBlock = '<div class="eyebrow" style="margin-top:26px">Also credited</div><p class="sub">Titles not yet matched to a role above — add the studio &amp; dates in your editor and they will nest into the right studio.</p><div class="others">'+
        orphans.map(function(c){ return '<div class="ocard"><span class="oc" style="background:'+gameGrad(c.game_slug)+'">'+art(c.game_slug,covMap)+'</span><div><div style="font-weight:700;font-size:13px">'+esc(c.game_title)+'</div><div style="color:var(--muted);font-size:11.5px">'+esc(c.role)+(creditYear(c)?' · '+creditYear(c):'')+'</div></div></div>'; }).join("")+
        '</div>';
    }

    var legend='<div class="legend"><span class="lg"><span class="lgdot"></span> <b>Studio</b> (newest first)</span><span class="lg"><span class="lgdot" style="background:var(--accent)"></span> <b>Peer-confirmed title</b></span></div>';
    var html = '<div class="wrap"><section><div class="eyebrow">Career &amp; gameography</div><h2 class="sec">Studios &amp; the games they shipped</h2><p class="sub">Every role you\'ve held, newest first, with the titles that came out of each — verified by the people you shipped with.</p>'+legend+tlBlock+othersBlock+'</section></div>';
    return {html:html};
  }
})();
</script>
