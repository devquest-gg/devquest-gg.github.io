<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio · DevQuest</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0a0d14;--panel:#11161f;--panel2:#141b26;--border:#232c3a;--text:#eaf0f8;--muted:#8b98ab;--dim:#5f6b7d;--accent:#58a6ff;--purple:#a371f7;--gold:#e0b23a;--green:#3fb950;--pink:#f778ba}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}
  .bar{height:3px;background:linear-gradient(90deg,var(--gold),var(--purple) 55%,var(--accent))}
  .nav{border-bottom:1px solid var(--border);background:rgba(10,13,20,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:50}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
  .brand .q{color:var(--accent)}.brand .tld{color:var(--gold)}
  .brand .cr{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--accent);border:1px solid var(--border);border-radius:5px;padding:2px 6px;margin-left:4px}
  .navlinks{display:flex;gap:18px;font-size:14px;color:var(--muted)}.navlinks a:hover{color:var(--text)}

  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
  .banner{position:absolute;inset:0;background:radial-gradient(60% 120% at 15% 0%, #6d3bd6 0%, transparent 55%),radial-gradient(50% 130% at 88% 10%, #1f6feb 0%, transparent 55%),radial-gradient(45% 120% at 60% 120%, #c99a2a 0%, transparent 55%),conic-gradient(from 210deg at 78% 30%, #10203a, #241033 40%, #0c1626 75%, #10203a);filter:saturate(1.05)}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,13,20,.55),rgba(10,13,20,.72) 55%,rgba(10,13,20,.94))}
  .hero .wrap{position:relative;z-index:2;padding:44px 22px 28px}
  .htop{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
  .avatar{width:102px;height:102px;border-radius:22px;flex:none;background:linear-gradient(135deg,#7cc0ff,#a371f7);display:flex;align-items:center;justify-content:center;font-weight:850;font-size:36px;color:#0a0d14;box-shadow:0 12px 40px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.2)}
  .hmeta{flex:1;min-width:280px}
  .oa{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green);border:1px solid rgba(63,185,80,.45);background:rgba(63,185,80,.12);border-radius:999px;padding:4px 11px;margin-bottom:12px}
  .oa .d{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  h1{margin:0;font-size:40px;line-height:1.05;letter-spacing:-1px;font-weight:850}
  .role{margin-top:6px;font-size:16px;color:#dbe4ef}
  .bio{margin:14px 0 0;font-size:15px;color:#c6d0de;max-width:640px;white-space:pre-line}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .tag{font-size:12.5px;font-weight:700;color:#dbe4ef;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);border-radius:999px;padding:5px 13px}
  .tag.spec{color:#e2d0ff;border-color:rgba(163,113,247,.5);background:rgba(163,113,247,.22)}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:750;border-radius:11px;padding:11px 18px;cursor:pointer;border:1px solid rgba(255,255,255,.16)}
  .btn.primary{color:#04121f;background:linear-gradient(135deg,#7cc0ff,#58a6ff);border:0}
  .btn.ghost{color:#fff;background:rgba(0,0,0,.3)}
  .stats{display:flex;flex-wrap:wrap;margin-top:26px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:rgba(17,22,31,.85)}
  .stat{flex:1;min-width:110px;padding:15px 18px;border-right:1px solid var(--border)}.stat:last-child{border-right:0}
  .stat .n{font-size:23px;font-weight:850;letter-spacing:-.5px;background:linear-gradient(120deg,#9ecbff,#c9a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

  section{padding:40px 0 6px}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  h2.sec{font-size:23px;font-weight:800;letter-spacing:-.4px;margin:6px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:700px}

  .heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .gcardH{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--panel);transition:transform .18s,border-color .18s}
  .gcardH:hover{transform:translateY(-4px);border-color:var(--accent)}
  .cover3{aspect-ratio:3/4;position:relative;display:flex;align-items:flex-end;padding:16px}
  .cover3 .rank{position:absolute;top:10px;left:12px;font-size:34px;font-weight:850;color:rgba(255,255,255,.16)}
  .cover3 .chk{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#04121f;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
  .cover3 .ttl{position:relative;font-weight:850;font-size:20px;letter-spacing:-.3px;text-shadow:0 2px 14px rgba(0,0,0,.7);line-height:1.06}
  .gmeta{padding:13px 15px}.gmeta .r{font-weight:700;font-size:14px}.gmeta .s{color:var(--muted);font-size:12.5px;margin-top:2px}

  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 8px}
  .legend b{color:var(--text)}.lg{display:inline-flex;align-items:center;gap:7px}
  .lgdot{width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
  .lgbar{width:16px;height:11px;border-radius:3px;background:linear-gradient(135deg,#555,#333)}
  .tlx{position:relative;margin:22px 0 10px}
  .spine{position:absolute;left:44%;top:0;bottom:0;width:2px;background:var(--border);transform:translateX(-1px)}
  .gdot{position:absolute;left:44%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(224,178,58,.18);z-index:3}
  .gdot.conf{background:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.2)}
  .gnode{position:absolute;right:56%;transform:translateY(-50%);display:flex;align-items:center;z-index:2}
  .gcard{display:flex;align-items:center;gap:11px;border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:8px 13px 8px 8px;box-shadow:0 8px 22px rgba(0,0,0,.32)}
  .gcard:hover{border-color:var(--accent)}
  .cover{width:48px;height:64px;border-radius:6px;flex:none;border:1px solid rgba(255,255,255,.12);box-shadow:0 4px 12px rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:8px;color:rgba(255,255,255,.4);font-weight:800}
  .gt{font-weight:750;font-size:14px;white-space:nowrap}
  .gr{font-size:11.5px;color:var(--muted);white-space:nowrap;margin-top:2px}
  .conn{width:42px;height:2px;background:var(--border)}
  .v{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;font-size:9px;font-weight:900;color:#04121f;margin-left:6px;vertical-align:1px}
  .v.blue{background:var(--accent)}.v.green{background:var(--green)}
  .lane-right{position:absolute;left:47%;right:0;top:0}
  .sbar{position:absolute;left:0;right:0;overflow:hidden;padding:12px 15px;color:#fff;border-bottom:2px solid var(--bg);border-radius:4px}
  .sbar .wm{position:absolute;right:6px;bottom:-18px;font-size:82px;font-weight:900;color:rgba(255,255,255,.10);line-height:1;pointer-events:none;letter-spacing:-4px}
  .snm{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:9px;position:relative}
  .slogo{width:23px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:850;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.22)}
  .srole{font-size:12px;color:rgba(255,255,255,.85);margin-top:4px;position:relative;max-width:74%}
  .syr{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px;position:relative}
  .others{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
  .ocard{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--panel);border-radius:11px;padding:8px 11px 8px 8px}
  .ocard .oc{width:38px;height:50px;border-radius:5px;flex:none}

  .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .skgroup{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:15px 16px}
  .skgroup h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .pills{display:flex;gap:7px;flex-wrap:wrap}
  .pill{font-size:12.5px;font-weight:650;color:#d3dcea;border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:5px 11px}

  .contact{margin-top:30px;border:1px solid var(--border);border-radius:18px;background:radial-gradient(600px 200px at 20% 0%,rgba(88,166,255,.12),transparent),linear-gradient(180deg,var(--panel),#0d121b);padding:28px 26px;text-align:center}
  .contact h3{margin:0 0 6px;font-size:22px;font-weight:800}.contact p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .clinks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .vfoot{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:13px;margin:16px 0 0;flex-wrap:wrap}
  .vfoot .v2{width:16px;height:16px;border-radius:50%;background:var(--green);color:#04121f;font-size:10px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
  footer{border-top:1px solid var(--border);margin-top:38px;padding:22px 0 54px}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--dim)}
  .editlink{position:fixed;bottom:12px;right:12px;z-index:60;font-size:12px;font-weight:700;color:#04121f;background:var(--gold);border-radius:999px;padding:7px 14px;display:none}
  @media(max-width:820px){.heroes{grid-template-columns:1fr 1fr}.skills{grid-template-columns:1fr}}
  @media(max-width:560px){.heroes{grid-template-columns:1fr}h1{font-size:31px}.navlinks{display:none}}
</style>
</head>
<body>
<div class="bar"></div>
<div class="nav"><div class="wrap"><div class="brand">Dev<span class="q">Quest</span><span class="tld">.gg</span><span class="cr">PORTFOLIO</span></div><div class="navlinks"><a id="creditslink">Credits</a><a href="/">Jobs board →</a></div></div></div>
<a class="editlink" id="editlink" href="/portfolio/edit/">✎ Edit my portfolio</a>
<div id="app"><div class="wrap" style="padding:60px 22px;color:var(--muted)">Loading portfolio…</div></div>
<footer><div class="wrap"><div><b style="color:var(--text)">DevQuest.gg</b> · portfolio</div><div>Verified by the people you shipped with.</div></div></footer>

<script src="/credits/api.js"></script>
<script>
(function(){
  var CUR = 2026;
  var app = document.getElementById("app");
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  // slug from /portfolio/<slug>/
  var parts = location.pathname.replace(/\/+$/,"").split("/");
  var slug = parts[parts.length-1] || "";
  if(slug==="portfolio" || !slug){ app.innerHTML='<div class="wrap" style="padding:60px 22px;color:var(--muted)">No profile specified.</div>'; return; }
  document.getElementById("creditslink").href="/credits/"+slug;

  function hashHue(s){ s=String(s||"x"); var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h%360; }
  function studioGrad(s){ var h=hashHue(s); return 'linear-gradient(120deg,hsl('+h+',42%,25%),hsl('+((h+18)%360)+',48%,14%))'; }
  function gameGrad(s){ var h=hashHue(s); return 'radial-gradient(120% 90% at 50% 0%,hsl('+h+',52%,28%),hsl('+h+',58%,8%))'; }
  function initials(s){ var w=String(s||"").replace(/[:\-].*$/,"").split(/\s+/).filter(function(x){return x && !/^(of|the|and|a|an|II|2)$/i.test(x);}); var r=w.slice(0,3).map(function(x){return x[0];}).join(""); return (r||String(s||"?").slice(0,2)).toUpperCase(); }
  function studioMark(s){ return String(s||"?").trim().slice(0,1).toUpperCase(); }

  DQAPI.portfolio(slug).then(function(r){
    if(!(r && r.ok && r.data && r.data.person)){ app.innerHTML='<div class="wrap" style="padding:60px 22px"><h1>Not found</h1><p style="color:var(--muted)">No portfolio at this address yet.</p></div>'; return; }
    render(r.data.person, r.data.positions||[], r.data.credits||[]);
    // show edit link if this is my own page
    if(DQAPI.isSignedIn()){ DQAPI.me().then(function(mr){ var me=mr&&mr.data&&mr.data.person; if(me && me.slug===slug) document.getElementById("editlink").style.display="inline-block"; }).catch(function(){}); }
  }).catch(function(){ app.innerHTML='<div class="wrap" style="padding:60px 22px;color:var(--pink)">Could not load this portfolio. Try again.</div>'; });

  function creditYear(c){ return c.work_start || c.year || c.work_end || null; }
  function isLive(c){ return (c.releases||[]).some(function(x){ return /live/i.test(x); }); }

  function render(p, positions, credits){
    document.title = p.name + " · DevQuest Portfolio";
    // ---- stats ----
    var startYears = [];
    positions.forEach(function(x){ if(x.start_year) startYears.push(x.start_year); });
    credits.forEach(function(c){ var y=creditYear(c); if(y) startYears.push(y); });
    var minY = startYears.length ? Math.min.apply(null,startYears) : CUR;
    var studioSet = {}; positions.forEach(function(x){ if(x.studio) studioSet[x.studio.toLowerCase()]=1; }); credits.forEach(function(c){ if(c.studio) studioSet[String(c.studio).toLowerCase()]=1; });
    var nStudios = Object.keys(studioSet).length || positions.length;
    var liveCount = credits.filter(isLive).length;
    var av = (p.name||"?").split(/\s+/).map(function(x){return x[0];}).slice(0,2).join("").toUpperCase();

    var tags = [];
    tags.push(cap(p.portfolio_style||"production"));
    if(liveCount) tags.push("Live Service");
    if(positions.length>=3 || /director|vp|head|lead/i.test(p.headline||"")) tags.push("Studio Leadership");

    var links = {}; (p.links||[]).forEach(function(l){ links[l.type]=l.url; });
    var linkBtns = "";
    if(links.linkedin) linkBtns += '<a class="btn ghost" href="'+esc(links.linkedin)+'" target="_blank">in · LinkedIn</a>';
    if(links.portfolio) linkBtns += '<a class="btn ghost" href="'+esc(links.portfolio)+'" target="_blank">Website</a>';
    if(links.artstation) linkBtns += '<a class="btn ghost" href="'+esc(links.artstation)+'" target="_blank">ArtStation</a>';
    if(links.github) linkBtns += '<a class="btn ghost" href="'+esc(links.github)+'" target="_blank">GitHub</a>';

    var hero =
      '<div class="hero"><div class="banner"></div><div class="scrim"></div><div class="wrap"><div class="htop">'+
        '<div class="avatar">'+esc(av)+'</div><div class="hmeta">'+
        (p.open_to_work ? '<div class="oa"><span class="d"></span> Open to opportunities</div>' : '')+
        '<h1>'+esc(p.name)+'</h1>'+
        (p.headline ? '<div class="role">'+esc(p.headline)+'</div>' : '')+
        (p.bio ? '<p class="bio">'+esc(p.bio)+'</p>' : '')+
        '<div class="tags">'+tags.map(function(t){return '<span class="tag spec">'+esc(t)+'</span>';}).join("")+'</div>'+
        '<div class="cta"><a class="btn primary">⬇ Download résumé</a>'+linkBtns+'</div>'+
        '</div></div>'+
        '<div class="stats">'+
          stat((CUR-minY)+" yrs","In the industry")+stat(nStudios,"Studios")+stat(credits.length,"Credits")+
          stat(liveCount,"Live-service")+stat(p.unshipped||0,"Cancelled / unshipped")+
        '</div>'+
      '</div></div>';

    // ---- highlights: top 3 by vouches, then recency ----
    var top = credits.slice().sort(function(a,b){ return (b.vouch_count||0)-(a.vouch_count||0) || (creditYear(b)||0)-(creditYear(a)||0); }).slice(0,3);
    var highlights = top.length ? '<div class="wrap"><section><div class="eyebrow">Highlights</div><h2 class="sec">Proudest work</h2><p class="sub">Most-confirmed titles from the full record below.</p><div class="heroes">'+
      top.map(function(c,i){ return '<div class="gcardH"><div class="cover3" style="background:'+gameGrad(c.game_slug)+'"><span class="rank">'+(i+1)+'</span>'+(c.vouch_count?'<span class="chk">✓</span>':'')+'<span class="ttl">'+esc(c.game_title)+'</span></div><div class="gmeta"><div class="r">'+esc(c.role)+'</div><div class="s">'+esc(c.studio||"")+(creditYear(c)?(c.studio?' · ':'')+creditYear(c):'')+'</div></div></div>'; }).join("")+
      '</div></section></div>' : '';

    // ---- timeline ----
    var tl = buildTimeline(positions, credits);

    // ---- skills ----
    var groups = (p.skills && p.skills.groups) ? p.skills.groups : [];
    var skills = groups.length ? '<div class="wrap"><section><div class="eyebrow">How I work</div><h2 class="sec">Skills &amp; tools</h2><div class="skills">'+
      groups.map(function(g){ return '<div class="skgroup"><h4>'+esc(g.label)+'</h4><div class="pills">'+(g.items||[]).map(function(it){return '<span class="pill">'+esc(it)+'</span>';}).join("")+'</div></div>'; }).join("")+
      '</div></section></div>' : '';

    // ---- confirm count ----
    var confirmed = credits.filter(function(c){ return (c.vouch_count||0)>0; }).length;
    var contact = '<div class="wrap"><div class="contact"><h3>'+esc(p.name.split(" ")[0])+' is '+(p.open_to_work?'open to new roles':'on DevQuest')+'</h3><p>Résumé tailors to your posting in one click.</p><div class="clinks"><a class="btn primary">⬇ Download résumé (PDF)</a>'+linkBtns+'</div>'+
      (confirmed?'<div class="vfoot"><span class="v2">✓</span> '+confirmed+' of '+credits.length+' credits confirmed by teammates who shipped the same game · <a href="/credits/how-evidence-works.html" style="color:var(--accent)">how evidence works →</a></div>':'')+
      '</div></div>';

    app.innerHTML = hero + highlights + tl.html + skills + contact;
  }

  function stat(n,l){ return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
  function cap(s){ return String(s).charAt(0).toUpperCase()+String(s).slice(1); }

  function buildTimeline(positions, credits){
    if(!positions.length && !credits.length) return {html:""};
    var MINH=84, SCALE=28;
    // bands (positions come newest-first from API)
    var bands=[], top=0;
    positions.forEach(function(p){
      var s=p.start_year||CUR, e=p.is_current?CUR:(p.end_year||s);
      if(e<s) e=s;
      var h=Math.max(MINH, Math.round((e-s)*SCALE));
      bands.push({p:p,top:top,h:h,s:s,e:e}); top+=h;
    });
    // assign credits to bands by year-in-range; else orphan
    var byBand={}, orphans=[];
    credits.forEach(function(c){
      var y=creditYear(c), bi=-1;
      if(y){ for(var i=0;i<bands.length;i++){ if(y>=bands[i].s && y<=bands[i].e){ bi=i; break; } } }
      if(bi<0) orphans.push(c); else (byBand[bi]=byBand[bi]||[]).push(c);
    });
    var totalH = top || 120;
    // bars
    var barsHtml = bands.map(function(b){
      var p=b.p;
      return '<div class="sbar" style="top:'+b.top+'px;height:'+b.h+'px;background:'+studioGrad(p.studio)+'">'+
        '<span class="wm">'+esc(studioMark(p.studio))+'</span>'+
        '<div class="snm"><span class="slogo">'+esc(studioMark(p.studio))+'</span> '+esc(p.studio)+'</div>'+
        '<div class="srole">'+esc(p.title)+'</div>'+
        '<div class="syr">'+b.s+' – '+(p.is_current?'Present':b.e)+'</div></div>';
    }).join("");
    // cards + dots
    var nodes="";
    Object.keys(byBand).forEach(function(k){
      var b=bands[k]; var list=byBand[k].sort(function(a,c){ return (creditYear(c)||0)-(creditYear(a)||0); });
      list.forEach(function(c,idx){
        var y=Math.round(b.top + b.h*(idx+1)/(list.length+1));
        var conf=(c.vouch_count||0)>0;
        nodes += '<div class="gdot'+(conf?' conf':'')+'" style="top:'+y+'px"></div>'+
          '<div class="gnode" style="top:'+y+'px"><div class="gcard"><span class="cover" style="background:'+gameGrad(c.game_slug)+'">'+esc(initials(c.game_title))+'</span><span><span class="gt">'+esc(c.game_title)+(conf?'<span class="v '+(c.vouch_count>1?"green":"blue")+'">✓</span>':'')+'</span><span class="gr">'+esc(c.role)+(creditYear(c)?' · '+creditYear(c):'')+'</span></span></div><span class="conn"></span></div>';
      });
    });
    var tlBlock = '<div class="tlx" style="height:'+totalH+'px"><div class="spine"></div><div class="lane-right" style="height:'+totalH+'px">'+barsHtml+'</div>'+nodes+'</div>';

    // orphans (credits without a matching position)
    var othersBlock = "";
    if(orphans.length){
      orphans.sort(function(a,c){ return (creditYear(c)||0)-(creditYear(a)||0); });
      othersBlock = '<div class="eyebrow" style="margin-top:26px">Also credited</div><p class="sub">Titles not yet matched to a role above — add the studio &amp; dates in your editor and they will slot into the timeline.</p><div class="others">'+
        orphans.map(function(c){ return '<div class="ocard"><span class="oc" style="background:'+gameGrad(c.game_slug)+'"></span><div><div style="font-weight:700;font-size:13px">'+esc(c.game_title)+'</div><div style="color:var(--muted);font-size:11.5px">'+esc(c.role)+(creditYear(c)?' · '+creditYear(c):'')+'</div></div></div>'; }).join("")+
        '</div>';
    }

    var legend='<div class="legend"><span class="lg"><span class="lgdot"></span> <b>Game shipped</b></span><span class="lg"><span class="lgdot" style="background:var(--accent)"></span> <b>Peer-confirmed</b></span><span class="lg"><span class="lgbar"></span> <b>Studio tenure</b></span></div>';
    var html = '<div class="wrap"><section><div class="eyebrow">Career &amp; gameography</div><h2 class="sec">On one timeline</h2><p class="sub">Games on the left; studios on the right, on the same axis. Newest at the top.</p>'+legend+tlBlock+othersBlock+'</section></div>';
    return {html:html};
  }
})();
</script>
</body>
</html>
