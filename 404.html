<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · DevQuest.gg</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
// Pretty-URL router for the Credits section. GitHub Pages serves this file for
// any path that doesn't map to a real file, so we translate clean profile URLs
// like /credits/destin-bales into the actual /credits/person.html?slug=... page.
// Runs in <head> before render, so valid pretty URLs redirect with no flash.
(function () {
  var p = location.pathname.replace(/\/+$/, "");
  var h = location.hash || "";
  var m;
  if ((m = p.match(/^\/credits\/game\/([^\/]+)$/)))   { location.replace("/credits/game.html?slug=" + encodeURIComponent(decodeURIComponent(m[1])) + h); return; }
  if ((m = p.match(/^\/credits\/studio\/([^\/]+)$/))) { location.replace("/credits/studio.html?slug=" + encodeURIComponent(decodeURIComponent(m[1])) + h); return; }
  // /credits/<handle> — a bare segment with no dot (so it's not a real file like person.html)
  if ((m = p.match(/^\/credits\/([^\/.]+)$/)))         { location.replace("/credits/person.html?slug=" + encodeURIComponent(decodeURIComponent(m[1])) + h); return; }
})();
</script>
<style>
  :root{--bg:#0b0e14;--panel:#141a23;--border:#242c38;--text:#eef3fa;--muted:#8b98a9;--accent:#58a6ff;--gold:#e0b23a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
  .card{max-width:460px}
  .mk{font-size:64px;font-weight:850;letter-spacing:-1px;background:linear-gradient(135deg,#7cc0ff,#a371f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 8px}
  h1{font-size:22px;font-weight:800;margin:0 0 10px}
  p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 22px}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:14px;border-radius:10px;padding:10px 18px}
  a.primary{background:linear-gradient(135deg,var(--accent),#a371f7);color:#fff}
  a.ghost{border:1px solid var(--border);color:var(--text)}
  a.ghost:hover{border-color:var(--accent)}
</style>
</head>
<body>
  <div class="card">
    <div class="mk">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be old or mistyped. Head back to the job board or browse developer credits.</p>
    <div class="btns">
      <a class="btn primary" href="/">← Jobs board</a>
      <a class="btn ghost" href="/credits/">DevQuest Credits</a>
    </div>
  </div>
</body>
</html>
