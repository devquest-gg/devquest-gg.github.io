  .statgrid { column-count: 2; column-gap: 14px; }

  .xhint { color: var(--muted); font-size: 12px; margin-top: 8px; }

  #quickbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

  .qchip { cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; }

  #activeFilters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 2px 0 12px; }

  #directory { margin-top: 18px; }

  .dirsub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .dirgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .dircard { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-decoration: none; transition: border-color .15s, transform .1s; }
  .dircard:hover { border-color: var(--accent); transform: translateY(-1px); }

  #moon { margin-top: 26px; }

  .moonsubmit { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 700; color: var(--accent); border: 1px solid rgba(88,166,255,.5); border-radius: 999px; padding: 3px 12px; text-decoration: none; }

  .moonchip { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; font-size: 13px; color: var(--text); text-decoration: none; }

</style>
</head>

<header>

// After a genuine apply-click, a one-time, dismissible nudge offering alerts for that discipline.

// so it never nags again.
var _applyNudgeShown = false;

const hoursAgo = j => Math.max(0, Math.round((Date.now() - j.ts) / 36e5));
// how long WE'VE seen the listing live (reliable age for ghost-job signal); null if unknown
const daysListed = j => j.fseen ? Math.max(0, Math.floor((Date.now() - j.fseen) / 864e5)) : null;
// "re-listed" = either the scraper saw the studio's date jump across runs, OR the role
// has been live far longer than its currently-shown posted date claims (a refreshed /
// continuously-reposted listing). The second check catches it without waiting for runs.
function relistedNow(j){
  if (j.relisted) return true;
  const dl = daysListed(j);
  if (dl == null || !j.ts) return false;
  const postedDays = (Date.now() - j.ts) / 864e5;
  return dl - postedDays >= 30; // live 30+ days longer than its posted date suggests
}
// "Likely stale" = exactly the set that earns a ⏳ or ↻ badge on the card: re-listed/refreshed,
// or we've seen it live 45+ days. One toggle ("Hide likely-stale listings") uses this, replacing
// the old overlapping "Hide re-listed" + "Hide listings live longer than" controls.
function isStale(j){ const dl = daysListed(j); return relistedNow(j) || (dl != null && dl >= 45); }
// "NEW FOR YOU" = appeared in your view since your last visit — posted OR first-seen by us
// after prevVisit (so freshly-added studios count too, and sources with no posted date still
// qualify) — but never a likely-stale/re-listed role, so the badge stays "fresh opportunity".
function isNewForYou(j){
  if (!prevVisit || isStale(j)) return false;
  return (j.ts && j.ts > prevVisit) || (j.fseen && j.fseen > prevVisit);
}

// A typed term -> the set of strings (itself + any synonyms) that count as a hit.
function searchVariants(nq){
  const out = new Set([nq]);
  const syn = SEARCH_SYNONYMS[nq];
  if (syn) for (const v of syn) out.add(normS(v));
  return [...out];
}

function render(){
  const qraw = document.getElementById("q").value.toLowerCase();
  // "-term" tokens EXCLUDE roles containing that word (e.g. "designer -senior", or "-product"
  // to drop product roles). Parse the excludes off the raw text, then normalize the rest.
  const qExc = (qraw.match(/(^|\s)-(\S+)/g) || []).map(t => normS(t.trim().slice(1))).filter(Boolean);
  const q = normS(qraw.replace(/(^|\s)-\S+/g, " "));
  const qVariants = q ? searchVariants(q) : [];     // whole-query + its synonym phrases
  const qToks = q ? q.split(" ").filter(Boolean) : [];
  const qMatch = j => {
    if (!q && !qExc.length) return true;
    const hay = normS(j.t + " " + j.s + " " + j.locs.join(" ") + " " + (j.d || "") + " " + (j.tech || []).join(" "));
    if (qExc.some(x => hay.includes(x))) return false;
    if (!q) return true;
    // Hit if the whole query (or any synonym phrase) appears, OR every word — each
    // itself synonym-expanded — appears somewhere, so word order and punctuation
    // ("character animation lead", "sen animator") don't block an otherwise-good match.
    if (qVariants.some(v => hay.includes(v))) return true;
    if (qToks.length > 1 && qToks.every(t => searchVariants(t).some(v => hay.includes(v)))) return true;
    return false;
  };
  const d = checked("f-d"), w = checked("f-w"), s = checked("f-s");
  const r = document.getElementById("region").value;
  const maxDays = parseInt(document.getElementById("age").value, 10);  const hideTracked = document.getElementById("hideTracked").checked;
  const showDismissed = document.getElementById("showDismissed").checked;
  const hidePools = document.getElementById("hidePools").checked;
  const hideStale = document.getElementById("hideStale").checked;
  const savedOnly = document.getElementById("savedOnly").checked;
  document.getElementById("dismissCount").textContent = dismissed.size;
  document.getElementById("savedCount").textContent = saved.size;

  // "preHub" = everything EXCEPT the matrix cell selection and the hub drill-down.
  // Dismissed jobs are always excluded here; "Show dismissed" is handled as its own
  // focused review list below, so the matrix and counts stay about active roles.
  const preHub = JOBS.filter(j =>
    (!dismissed.has(j.id)) &&
    (!savedOnly || saved.has(j.id)) &&
    (view !== "follow" || FOLLOWS.has(j.s)) &&
    (!hideTracked || !appStatus[j.id]) &&    (!hidePools || !j.pool) &&
    (!hideStale || !isStale(j)) &&
    (!maxDays || (j.ts && hoursAgo(j) <= maxDays*24)) &&
    qMatch(j) &&
    (!selStudios.size || selStudios.has(j.s) || selStudios.has("@"+j.p)) &&
    (!selKinds.size || kindOf(j).some(k=>selKinds.has(k))) &&
    (!selCountries.size || j.countries.some(c=>selCountries.has(c))) &&
    (!d.length || d.includes(j.d)) &&
    (!w.length || w.includes(j.w)) &&
    (!s.length || s.includes(j.sen)) &&
    (!r || j.regions.includes(r)) &&
    (!quickRemote || j.w === "Remote") &&
    (!selRegionsQuick.size || j.regions.some(x=>selRegionsQuick.has(x)))
  );

  // facet helpers: each chip group's counts respect ALL the other active facets,
  // so e.g. picking "Mid · Design" makes the hub counts show only mid design roles.
  const passCells = j => !selCells.size || selCells.has(j.d+"|"+j.sen);
  const passSubs  = j => !selSubs.size  || selSubs.has(j.sub);

  // gaming-hub chips appear only when a region quick-filter is active. Counts respect
  // the selected square(s) + specialize chips, scoped to the selected region(s).
  const availHubs = {};
  if (selRegionsQuick.size)
    for (const j of preHub) if (passCells(j) && passSubs(j))
      for (const hb of j.hubs)
        if (selRegionsQuick.has(HUB_REGION[hb])) availHubs[hb] = (availHubs[hb]||0)+1;
  for (const hb of [...selHubs]) if (!availHubs[hb]) selHubs.delete(hb); // prune stale picks

  // "base" = preHub narrowed by the hub selection (feeds the matrix + cell list).
  const base = selHubs.size ? preHub.filter(j => j.hubs.some(h=>selHubs.has(h))) : preHub;
  // apply the matrix squares; the result feeds both the sub-discipline chips and the list
  const cellList = selCells.size ? base.filter(j=>selCells.has(j.d+"|"+j.sen)) : base;

  // sub-discipline chips appear only when a sub-bearing discipline (Art/Eng/Design)
  // is selected via the matrix. Counts come from the cell-filtered set.
  const selDiscs = new Set([...selCells].map(k=>k.split("|")[0]));
  const subDiscsActive = [...selDiscs].filter(dn=>SUB_DISCS.has(dn));
  const availSubs = {};
  if (subDiscsActive.length)
    for (const j of cellList) if (subDiscsActive.includes(j.d) && j.sub) availSubs[j.sub] = (availSubs[j.sub]||0)+1;
  for (const sb of [...selSubs]) if (!availSubs[sb]) selSubs.delete(sb); // prune stale picks

  let list = (selSubs.size ? cellList.filter(j=>selSubs.has(j.sub)) : cellList)
    .sort((a,b)=>b.ts-a.ts);
  // "Show dismissed" = a focused review list of ONLY the jobs you've hidden, ignoring
  // other filters so they're always easy to find and restore.
  if (showDismissed) list = JOBS.filter(j=>dismissed.has(j.id)).sort((a,b)=>b.ts-a.ts);

  // "✨ New for you" quick-filter: count new-since-last-visit within the current filters, then
  // (if toggled) narrow the list to just those. Count is taken before narrowing so the chip stays stable.
  const newCount = showDismissed ? 0 : list.filter(isNewForYou).length;
  if (quickNew && !showDismissed) list = list.filter(isNewForYou);

  try { window.__dqCount = list.length; updateAccBadges(); } catch(e) {} // current result count, for analytics

  renderMatrix(base);
  renderQuickbar(newCount);
  renderHubbar(availHubs);
  renderSubbar(availSubs);
  renderActiveFilters();

  const groups = {};
  for (const j of list) (groups[j.d] = groups[j.d] || []).push(j);
  GROUPS = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);

  const cellNote = (selCells.size ? " · " + selCells.size + " square" + (selCells.size>1?"s":"") + " selected" : "")
    + (selSubs.size ? " · " + [...selSubs].join(", ") : "")
    + (selHubs.size ? " · " + [...selHubs].join(", ") : "");
  document.getElementById("count").textContent = showDismissed
    ? (list.length + " dismissed job" + (list.length!==1?"s":"") + " — click ↩ on a row to restore it")
    : (list.length + " roles shown (" + JOBS.length + " total)" + cellNote +
       (newCount ? " · " + newCount + " new since your last visit" : ""));

  document.getElementById("jobs").innerHTML = list.length ? GROUPS.map((dn,gi)=>{
    const jobs = groups[dn];
    const open = !collapsed.has(dn);
    const n = shown[dn] || SHOW_STEP;
    const rest = jobs.length - n;
    return `<div class="group">
      <div class="group-header" onclick="toggleGroup(${gi})">
        <span class="arrow ${open?'open':''}">▸</span> <span style="color:${discColor(dn)}">${dn}</span>
        <span class="gcount">${jobs.length}</span>
      </div>
      ${open ? jobs.slice(0,n).map(rowHtml).join("") : ""}
      ${open && rest > 0 ? `<button class="more-btn" onclick="showMore(${gi})">Show ${Math.min(SHOW_STEP,rest)} more (${rest} hidden)</button>` : ""}
    </div>`;
  }).join("") : `<div class="empty">No roles match. Click a highlighted square again to deselect, or clear your filters.</div>`;

  LAST_LIST = list;
  renderDirectory(); // keep the island in sync with the top search bar
  if (view === "map") renderMap();
  if (view === "stats") renderStats();
}

// single floating tooltip, appended to <body> so the matrix's horizontal scroll can't clip it
const gridTip = document.createElement("div"); gridTip.id = "gridTip"; document.body.appendChild(gridTip);
function showGridTip(el){
  const tip = el.getAttribute("data-tip"); if (!tip) return;
  gridTip.innerHTML = tip; gridTip.classList.add("show");
  const r = el.getBoundingClientRect();
  gridTip.style.left = "0px"; gridTip.style.top = "0px"; // reset to measure
  const tw = gridTip.offsetWidth, th = gridTip.offsetHeight;
  let x = r.left, y = r.bottom + 8;
  if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
  if (y + th > window.innerHeight - 8) y = r.top - th - 8; // flip above if no room below
  gridTip.style.left = Math.max(8, x) + "px";
  gridTip.style.top = Math.max(8, y) + "px";
}
function hideGridTip(){ gridTip.classList.remove("show"); }
// delegation on the persistent #matrixWrap survives every re-render of its innerHTML
(function(){

const escTip = s => String(s).replace(/"/g, "&quot;");

// ---- interactive matrix (home page) ------------------------------------------
// Signature colors per discipline (desaturated). Core crafts get a hue; corporate/ops
// disciplines (Marketing, Player Support, Business & Ops, …) stay gray so they recede.
const DISC_COLOR = {
  "Engineering":"#5b9bd5","Art":"#b388d6","Animation":"#db8bb2","Design":"#4fb3a6",
  "Audio":"#d4a85f","Production":"#7fb06c","QA":"#d18f63","Data & Analytics":"#5fb9cb","Esports":"#d27b7b"
};
function discColor(d){ return DISC_COLOR[d] || "var(--muted)"; }

function renderMatrix(base){
  const SEN_ORDER = ["Entry","Mid","Senior","Lead","Director+"];
  const seniorities = SEN_ORDER.filter(sn => base.some(j=>j.sen===sn));
  const discCount = {}; for (const j of base) discCount[j.d] = (discCount[j.d]||0)+1;
  const discOrder = Object.keys(discCount).sort((a,b)=>discCount[b]-discCount[a]);
  const cell = {}; for (const j of base) cell[j.d+"|"+j.sen] = (cell[j.d+"|"+j.sen]||0)+1;
  const cmax = Math.max(1, ...Object.values(cell));
  const heat = n => n===0 ? "transparent" : `rgba(88,166,255,${0.10 + 0.6*Math.sqrt(n/cmax)})`;
  let h = `<div class="matrixhead"><span class="mh-title">Where are the jobs right now?</span><span class="mhint">Tap any role × seniority cell to filter · brighter = more roles · hover a label<span class="swipehint"> · swipe →</span></span></div>`;
  if (!discOrder.length) { document.getElementById("matrixWrap").innerHTML = h + `<div class="xhint">No roles in the current filters.</div>`; return; }
  h += `<div style="overflow-x:auto"><table class="xtab"><tr><th></th>${seniorities.map(sn=>{
    const info = SEN_INFO[sn];
    return info ? `<th class="senh" data-tip="${escTip(info)}"><span>${sn}</span></th>` : `<th>${sn}</th>`;
  }).join("")}<th>Total</th></tr>`;
  for (const dn of discOrder) {
    const rowTotal = discCount[dn];
    const dInfo = DISC_INFO[dn];
    const dCell = dInfo ? `<span class="tipname" data-tip="${escTip(dInfo)}">${dn}</span>` : dn;
    h += `<tr><td class="xname" style="color:${discColor(dn)}">${dCell}</td>` + seniorities.map(sn=>{
      const key = dn+"|"+sn, n = cell[key]||0, sel = selCells.has(key);
      return `<td class="mcell ${sel?'xsel':''}" style="background:${sel?'':heat(n)}" ${n?`onclick="toggleCell('${dn.replace(/'/g,"\\'")}','${sn}')"`:''}>${n||""}</td>`;
    }).join("") + `<td class="xtot">${rowTotal}</td></tr>`;
  }
  h += `</table></div>`;
  document.getElementById("matrixWrap").innerHTML = h;
}

// ---- Active-filters bar: shows every applied filter as a removable chip + "Clear all".
// Each chip stores a closure that clears its specific filter, so removal needs no fragile
// string-escaping in the onclick (we reference the filter by index into __af).
let __af = [];
function renderActiveFilters(){
  __af = [];
  const add = (label, fn) => __af.push({ label, fn });
  const q = document.getElementById('q');
  if (q.value.trim()) add('🔍 "' + q.value.trim() + '"', () => { q.value = ''; });
  const region = document.getElementById('region');
  if (region.value) add('Region: ' + region.options[region.selectedIndex].text, () => { region.selectedIndex = 0; });
  const age = document.getElementById('age');
  if (age.selectedIndex > 0) add('Posted: ' + age.options[age.selectedIndex].text, () => { age.selectedIndex = 0; });  if (document.getElementById('hideStale').checked) add('Hiding stale', () => { document.getElementById('hideStale').checked = false; });
  if (quickRemote) add('Remote only', () => { quickRemote = false; });
  if (quickNew) add('✨ New for you', () => { quickNew = false; });
  [...selCells].forEach(k => { const x = k.split('|'); add((x[1] ? x[1] + ' ' : '') + x[0], () => selCells.delete(k)); });
  [...selSubs].forEach(s => add(s, () => selSubs.delete(s)));
  [...selStudios].forEach(s => add(String(s).replace(/^@/, ''), () => { selStudios.delete(s); renderSearchGroup("studioFilters","studioSearch",STUDIO_COUNTS,selStudios,STUDIO_LABELS,DIR_STUDIOS); }));
  [...selCountries].forEach(c => add(c, () => { selCountries.delete(c); renderSearchGroup("countryFilters","countrySearch",COUNTRY_COUNTS,selCountries,null); }));
  [...selRegionsQuick].forEach(r => add(r, () => selRegionsQuick.delete(r)));
  [...selKinds].forEach(k => add('Type: ' + (KIND_LABELS[k] || k), () => { selKinds.delete(k); const c = document.querySelector('.kindchip[data-k="' + k + '"]'); if (c) c.classList.remove('on'); }));
  // Sidebar Discipline / Work Type / Seniority checkboxes — were filtering silently with no chip
  // and no clear. Now each shows as a removable chip like every other filter.
  const _uncheck = (cls, v) => { const cb=[...document.querySelectorAll('.'+cls+':checked')].find(c=>c.value===v); if(cb) cb.checked=false; };
  checked('f-d').forEach(v => add(v, () => _uncheck('f-d', v)));
  checked('f-w').forEach(v => add(v, () => _uncheck('f-w', v)));
  checked('f-s').forEach(v => add(v, () => _uncheck('f-s', v)));
  const el = document.getElementById('activeFilters');
  if (!el) return;
  if (!__af.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  el.innerHTML = '<span class="aflabel">Filters:</span>'
    + __af.map((f, i) => '<button class="afchip" onclick="rmActive(' + i + ')" title="Remove this filter">' + esc(f.label) + ' <span class="afx">✕</span></button>').join('')
    + '<button class="afexport" onclick="exportCsv()" title="Download these filtered results as a CSV spreadsheet">⤓ Export CSV</button>'
    + '<button class="afclear" onclick="clearAllFilters()">Clear all</button>';
}
function rmActive(i){ const f = __af[i]; if (f) { f.fn(); render(); } }
function clearAllFilters(){
  document.getElementById('q').value = '';
  document.getElementById('region').selectedIndex = 0;
  document.getElementById('age').selectedIndex = 0;  document.getElementById('hideStale').checked = false;
  selCells.clear(); selSubs.clear(); selHubs.clear(); selRegionsQuick.clear(); quickRemote = false; quickNew = false;
  selStudios.clear(); selCountries.clear();
  selKinds.clear(); document.querySelectorAll('.kindchip.on').forEach(c => c.classList.remove('on'));
  ['f-d','f-w','f-s'].forEach(cls => document.querySelectorAll('.'+cls+':checked').forEach(c => c.checked = false));
  renderSearchGroup("studioFilters","studioSearch",STUDIO_COUNTS,selStudios,STUDIO_LABELS,DIR_STUDIOS);
  renderSearchGroup("countryFilters","countrySearch",COUNTRY_COUNTS,selCountries,null);
  render();
}

// connections at this studio, in their already-logged-in session. We send nothing;
// it's just a constructed search URL. network=["F"] = first-degree connections.
function liCompany(name){
  return name.replace(/\s*\((?:HQ|All)\)\s*/i, "").replace(/\s*[—-]\s*all studios.*/i, "").trim();
}
function whoDoIKnowUrl(name){
  return "https://www.linkedin.com/search/results/people/?keywords=" +

function rowHtml(j){
  const h = hoursAgo(j);

  const isNew = isNewForYou(j);
  const isDismissed = dismissed.has(j.id);
  const isSaved = saved.has(j.id);
  const locLabel = l => l.replace(/^united states,\s*/i, "").replace(/,/g, ", ");
  const multi = j.places.length > 1;
  // each location chip links to its own posting; clicking the row opens the first one (chips let you pick a city)
  const locChips = j.places.slice(0,3).map(p=>
    `<span class="tag locchip" ${p.url?`onclick="event.stopPropagation(); openApply('${j.id}','${p.url}')" title="Open the ${locLabel(p.l)} posting"`:""}>${locLabel(p.l)}${multi?' ↗':''}</span>`).join("")
    + (j.places.length>3 ? `<span class="tag">+${j.places.length-3} more</span>` : "");
  const rowClick = j.url ? `onclick="openApply('${j.id}','${j.url}')"` : "";
  // ghost-job signals (facts, not accusations)
  const dl = daysListed(j);
  const longClass = dl==null ? "" : dl>=90 ? "longbad" : dl>=45 ? "longwarn" : "";
  const longChip = longClass ? `<span class="tag ${longClass}" title="We've seen this exact listing live for ${dl} days. Long-running posts are more likely to be stale or 'ghost' listings.">⏳ ${dl}d listed</span>` : "";

  return `<div class="row ${status?'st-'+status:''} ${isDismissed?'dismissed':''}" ${rowClick}>
    <div class="rtop">
      <div class="rmain">

        ${isDismissed?'<span class="dismissedbadge">hidden</span>':''}
        ${poolBadge}

      <button class="save ${isSaved?'on':''}" onclick="event.stopPropagation(); toggleSave('${j.id}')" title="${isSaved?'Saved for later':'Save for later'}" aria-label="${isSaved?'Remove from saved':'Save for later'}">${isSaved?'<svg width="13" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle" aria-hidden="true"><path d="M6 2a2 2 0 0 0-2 2v18l8-5 8 5V4a2 2 0 0 0-2-2H6z"/></svg>':'<svg width="13" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle" aria-hidden="true"><path d="M6 2a2 2 0 0 0-2 2v18l8-5 8 5V4a2 2 0 0 0-2-2H6z"/></svg>'}</button>
      <span class="statusgrp" onclick="event.stopPropagation()">
        <button class="stbtn applied ${status==='applied'?'on':''}" onclick="event.stopPropagation(); setStatusToggle('${j.id}','applied')" title="Applied" aria-label="Mark as applied">✓</button>

        <button class="stbtn reject ${status==='rejected'?'on':''}" onclick="event.stopPropagation(); setStatusToggle('${j.id}','rejected')" title="Rejected" aria-label="Mark as rejected">⊘</button>
      </span>
      <span class="actsep"></span>

    </div>
    <div class="rtags">
      ${j.w!=="Unknown"?`<span class="tag ${j.w.toLowerCase()}">${j.w}</span>`:""}

    </div>

function matchCity(loc){
  const s = loc.toLowerCase();
  if (s.includes("london") && (s.includes("canada") || s.includes("ontario"))) return ["london (ontario)",42.98,-81.25];
  for (const g of GAZ) if (s.includes(g[0])) return g;
  return null;
}

// Coordinates for an island studio's map pin. Prefer an explicit DIR_GEO entry; else
// auto-derive from the city named in its note (or name) via the gazetteer — so new
// island studios pin themselves as long as their note mentions a known city.
function dirCoords(d){
  // Prefer the studio's own `city` (set on each island/moon entry), resolved via the GAZ table —
  // so the map stays in sync with the roster automatically. Fall back to note/name, then DIR_GEO.
  const m = matchCity(d.city || "") || matchCity(d.note || "") || matchCity(d.name || "");
  if (m) return { lat: m[1], lng: m[2], label: d.city || m[0].replace(/\b\w/g, c=>c.toUpperCase()) };
  const g = DIR_GEO[d.name];
  if (g) return { lat: g[0], lng: g[1], label: g[2] };
  return null;
}

function bfOnChange(){
  try { window.dqTrack && window.dqTrack("bestfit_filter", { disc: document.getElementById("bfDisc").value, sen: document.getElementById("bfSen").value, remote: document.getElementById("bfRemote").checked ? 1 : 0 }); } catch(e){}
  bfCompute();

function bfCompute(){
  const disc = document.getElementById("bfDisc").value;
  const sen = document.getElementById("bfSen").value;
  const remote = document.getElementById("bfRemote").checked;
  const matched = JOBS.filter(j => j.d===disc && (sen==="__any" || j.sen===sen) && (!remote || j.w==="Remote"));
  const byS = {};
  for (const j of matched){
    const o = byS[j.s] || (byS[j.s] = { n:j.s, roles:0, paid:0, ages:[] });
    o.roles++; if (j.salary) o.paid++;
    const t = j.ts || j.fseen; if (t) o.ages.push(Math.max(0, Math.floor((Date.now()-t)/864e5)));
  }
  let rows = Object.values(byS);
  const resEl = document.getElementById("bfResults"), gemsWrap = document.getElementById("bfGemsWrap");
  if (!rows.length){ resEl.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:8px 0">No open ${bfEsc(disc)} roles match that mix right now — try a different discipline or turn off "remote only".</div>`; gemsWrap.style.display="none"; return; }
  // Openings are log-scaled (so one giant studio can't dwarf everyone) and weighted lightly;
  // freshness leads, so a stale studio can't hold the top spot. Raw openings get their own
  // spotlight in the "better odds" strip below, so we don't double-count them here.
  const maxLog = Math.max(...rows.map(r=>Math.log(1+r.roles))) || 1;
  const haveInterest = INTEREST && Object.keys(INTEREST).length;
  rows.forEach(r => {
    r.payPct = Math.round(100*r.paid/r.roles);
    r.medAge = r.ages.length ? r.ages.sort((a,b)=>a-b)[Math.floor(r.ages.length/2)] : null;
    r.freshScore = r.medAge==null ? 50 : Math.max(0, Math.min(100, Math.round(100 - r.medAge*1.6)));
    r.score = Math.round(100*(0.30*(Math.log(1+r.roles)/maxLog) + 0.30*r.payPct/100 + 0.40*r.freshScore/100));
    // Contention only when a studio has enough roles for interest/role to mean anything —
    // otherwise "1 open" always reads "very contested" (a denominator artifact, not real demand).
    r.cont = (haveInterest && r.roles >= 3 && (INTEREST[r.n]||0) > 0) ? INTEREST[r.n]/r.roles : null;
  });
  if (haveInterest){
    const cs = rows.filter(r=>r.cont!=null).map(r=>r.cont).sort((a,b)=>a-b);
    if (cs.length >= 4){ const t1=cs[Math.floor(cs.length/3)], t2=cs[Math.floor(2*cs.length/3)];
      rows.forEach(r=>{ r.clabel = r.cont==null ? null : r.cont<=t1 ? "less crowded" : r.cont<=t2 ? "contested" : "very contested"; });
    }
  }
  const ranked = rows.sort((a,b)=> b.score - a.score);
  const top = ranked.slice(0,6);
  resEl.innerHTML = top.map((r,i)=>bfCard(r,i,disc)).join("");
  if (haveInterest){
    const topNames = new Set(top.slice(0,3).map(r=>r.n));
    const gems = rows.filter(r=>r.cont!=null && !topNames.has(r.n) && r.roles>=2).sort((a,b)=>a.cont-b.cont).slice(0,3);
    document.getElementById("bfGems").innerHTML = gems.map(g=>bfGem(g,disc)).join("");
    gemsWrap.style.display = gems.length ? "" : "none";
  } else { gemsWrap.style.display = "none"; }
}

  return `<div class="bfcard" data-studio="${bfEsc(r.n)}" data-disc="${bfEsc(disc)}" style="display:flex;align-items:center;gap:14px;border:${best?"2px solid var(--accent)":"1px solid var(--border)"};border-radius:12px;padding:13px 15px;margin-bottom:10px;background:var(--panel);cursor:pointer">

function tally(list, fn){
  const t = {};
  for (const j of list) { const k = fn(j); if (k) t[k] = (t[k]||0)+1; }
  return Object.entries(t).sort((a,b)=>b[1]-a[1]);
}
// like tally, but fn returns an array (e.g. countries/hubs spanning multiple places);
// each value is counted once per job.
function tallyMulti(list, fn){
  const t = {};
  for (const j of list) for (const k of new Set(fn(j)||[])) if (k) t[k] = (t[k]||0)+1;
  return Object.entries(t).sort((a,b)=>b[1]-a[1]);
}
function barChart(title, entries, limit){
  const top = entries.slice(0, limit || 12);
  const max = Math.max(1, ...top.map(e=>e[1]));
  return `<div class="statcard"><h3>${title}</h3>` + top.map(([k,n]) =>
    `<div class="barrow"><span class="blabel" title="${k}">${k}</span>
     <span class="btrack"><span class="bfill" style="width:${Math.round(100*n/max)}%"></span></span>
     <span class="bnum">${n}</span></div>`).join("") + `</div>`;
}

// front-page strip and the Trends report header. No estimates: every figure is a live role.
function marketPulse(){
  const open = JOBS.length;
  const studios = new Set(JOBS.map(j=>j.s)).size;
  const newWk = JOBS.filter(j=>{ const d=daysListed(j); return d!=null ? d<=7 : (j.ts && hoursAgo(j)<=168); }).length;
  const new72h = JOBS.filter(j=>{ const d=daysListed(j); return d!=null ? d<=3 : (j.ts && hoursAgo(j)<=72); }).length;
  const byS = {}; for (const j of JOBS) byS[j.s] = (byS[j.s]||0)+1;
  const top = Object.entries(byS).sort((a,b)=>b[1]-a[1])[0];
  const salPct = open ? Math.round(100 * JOBS.filter(j=>j.salary).length / open) : 0;
  const remotePct = open ? Math.round(100 * JOBS.filter(j=>j.w==="Remote").length / open) : 0;
  const ages = JOBS.filter(j=>j.ts).map(j=>Math.max(0, Math.floor((Date.now()-j.ts)/864e5))).sort((a,b)=>a-b);
  const medianAge = ages.length ? ages[Math.floor(ages.length/2)] : null;
  return { open, studios, newWk, new72h, topStudio: top ? top[0] : "—", topStudioN: top ? top[1] : 0, salPct, remotePct, medianAge };
}
function renderPulseStrip(){
  const el = document.getElementById("pulseStrip"); if (!el) return;
  const m = marketPulse();
  const chip = (num,label,cls="") => `<span class="psitem ${cls}"><b>${num}</b>${label}</span>`;
  window.__pulseTopStudio = m.topStudio;   // read by the clickable chip (avoids escaping studio names with quotes)
  const topClickable = m.topStudio && m.topStudio !== "—";
  el.innerHTML = chip(m.open.toLocaleString(),"open roles")
    + chip(m.studios,"studios hiring")
    + chip(m.new72h.toLocaleString(),"new in 72h","fresh")
    + chip(m.salPct+"%","list salary")
    + (topClickable
        ? `<span class="psitem top psclick" role="button" tabindex="0" title="Show ${m.topStudio} jobs" onclick="filterToStudio(window.__pulseTopStudio)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();filterToStudio(window.__pulseTopStudio);}"><b>${m.topStudio}</b>${m.topStudioN.toLocaleString()} role${m.topStudioN===1?'':'s'} · most active</span>`
        : chip(m.topStudio,"most active","top"));
}
// Filter the list down to a single studio (used by the "most active" pulse chip).
function filterToStudio(studio){
  if (!studio || studio === "—") return;
  try { window.dqTrack && window.dqTrack("pulse_studio_click", { st: studio }); } catch(e){}
  clearAllFilters();
  selStudios.add(studio);
  renderSearchGroup("studioFilters","studioSearch",STUDIO_COUNTS,selStudios,STUDIO_LABELS,DIR_STUDIOS);
  setView("list");
  render();
}
// Export the current filtered list to a CSV the user can open in a spreadsheet.
function exportCsv(){
  const rows = LAST_LIST || [];
  try{ window.dqTrack && window.dqTrack('export_csv', { n: rows.length }); }catch(e){}
  const head = ["Title","Studio","Discipline","Seniority","Work type","Location","Salary","Posted","URL"];
  const esc = s => '"' + String(s==null?"":s).replace(/"/g,'""') + '"';
  const out = [head.map(esc).join(",")];
  for (const j of rows){
    const loc = (j.places && j.places.map(p=>p.l).join("; ")) || j.l || "";
    const posted = j.ts ? new Date(j.ts).toISOString().slice(0,10) : "";
    const url = (j.places && j.places[0] && j.places[0].url) || j.url || "";
    out.push([j.t, j.s, j.d, j.sen, j.w, loc, j.salary||"", posted, url].map(esc).join(","));
  }
  const blob = new Blob([out.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "devquest-jobs.csv";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}

function renderStats(){
  const list = LAST_LIST;
  // age buckets
  const buckets = [["< 24 hrs",0],["1–7 days",0],["7–30 days",0],["> 30 days",0],["date n/a",0]];
  for (const j of list) {
    if (!j.ts) buckets[4][1]++;
    else { const h = hoursAgo(j);
      if (h<24) buckets[0][1]++; else if (h<168) buckets[1][1]++;
      else if (h<720) buckets[2][1]++; else buckets[3][1]++; }
  }
  // salary ranges by discipline (jobs with parsed salary)
  const sal = {};
  for (const j of list) {
    const m = j.salary && j.salary.match(/\$(\d+)K–\$(\d+)K/);
    if (!m) continue;
    (sal[j.d] = sal[j.d] || []).push([+m[1], +m[2]]);
  }
  const salRows = Object.entries(sal).filter(([,v])=>v.length>=2)
    .map(([d,v])=>({ d, n: v.length,
      lo: Math.round(v.reduce((s,x)=>s+x[0],0)/v.length),
      hi: Math.round(v.reduce((s,x)=>s+x[1],0)/v.length) }))
    .sort((a,b)=>b.hi-a.hi);
  const salMax = Math.max(100, ...salRows.map(r=>r.hi));
  const salCard = `<div class="statcard"><h3>Avg salary range by discipline (${salRows.reduce((s,r)=>s+r.n,0)} postings with pay data)</h3>`
    + (salRows.length ? salRows.map(r =>
      `<div class="barrow"><span class="blabel">${r.d} (${r.n})</span>
       <span class="salrange"><span class="salbar" style="left:${Math.round(100*r.lo/salMax)}%; width:${Math.max(2,Math.round(100*(r.hi-r.lo)/salMax))}%"></span></span>
       <span class="bnum" style="width:110px">$${r.lo}K–$${r.hi}K</span></div>`).join("")
    : `<div class="hmuted" style="color:var(--muted);font-size:13px">No salary data in the current selection.</div>`) + `</div>`;

  // --- Salary transparency leaderboard: share of each studio's CURRENT listings that publish pay.
  // Eligibility floor (15+ listings) so tiny samples can't game it, ranked by the Wilson lower bound
  // so a studio at 100% of 100 outranks 100% of 15 (sample size earns rank). Denominator always shown.
  const transBy = {};
  for (const j of list){ if (j.pool) continue; const b = transBy[j.s] = transBy[j.s] || { tot:0, sal:0 }; b.tot++; if (j.salary) b.sal++; }
  const wilsonLB = (pos, n) => { if (!n) return 0; const z=1.96, p=pos/n; return (p + z*z/(2*n) - z*Math.sqrt((p*(1-p)+z*z/(4*n))/n)) / (1 + z*z/n); };
  const transRows = Object.entries(transBy)
    .filter(([,b]) => b.tot >= 15 && b.sal > 0)
    .map(([s,b]) => ({ s, tot:b.tot, sal:b.sal, pct: Math.round(100*b.sal/b.tot), score: wilsonLB(b.sal, b.tot) }))
    .sort((a,b)=> b.score - a.score).slice(0, 12);
  const transMax = Math.max(1, ...transRows.map(r=>r.pct));
  const medal = i => i===0?"🥇 ":i===1?"🥈 ":i===2?"🥉 ":"";
  const transparencyCard = `<div class="statcard"><h3>Salary transparency leaderboard — studios that publish pay</h3>`
    + (transRows.length
        ? transRows.map((r,i) => `<div class="barrow"><span class="blabel" title="${r.s}">${medal(i)}${r.s}</span>`
            + `<span class="btrack"><span class="bfill" style="width:${Math.round(100*r.pct/transMax)}%;background:linear-gradient(90deg,#2ea043,var(--green))"></span></span>`
            + `<span class="bnum" style="width:96px">${r.pct}% · ${r.sal}/${r.tot}</span></div>`).join("")
        : `<div class="xhint">Not enough data yet — needs studios with 15+ current listings that publish a salary.</div>`)
    + `<div class="xhint">Share of each studio's current listings that publish a salary (studios with 15+ listings, ranked with sample-size weighting so a bigger board earns a higher rank at the same rate). We celebrate the transparent — no shaming the rest.</div></div>`;

  // Data health moved to the private stats dashboard (worker /stats → 🩺 Health tab).

  // --- studios hiring NOW (fresh roles, last 7 days; ignores no-date listings) ---
  const freshBy = {};
  for (const j of list) if (j.ts && hoursAgo(j) <= 168) freshBy[j.s] = (freshBy[j.s]||0)+1;
  const freshEntries = Object.entries(freshBy).sort((a,b)=>b[1]-a[1]);
  const hiringCard = `<div class="statcard"><h3>Studios hiring now (posted in last 7 days)</h3>`
    + (freshEntries.length ? barChart("", freshEntries, 12).replace(/^<div class="statcard"><h3><\/h3>/,"").replace(/<\/div>$/,"")
       : `<div class="xhint">No roles posted in the last 7 days in this selection.</div>`) + `</div>`;

  // --- work type: bars are a share of ALL roles (incl. unstated) so nothing looks
  // bigger than it is. We do NOT guess unstated roles as onsite — that would be
  // inventing data. Instead "Not stated" is shown as its own (usually dominant) bar.
  const total = list.length;
  const known = list.filter(j=>j.w!=="Unknown");
  const rem = known.filter(j=>j.w==="Remote").length;
  const hyb = known.filter(j=>j.w==="Hybrid").length;
  const ons = known.filter(j=>j.w==="Onsite").length;
  const unstated = total - known.length;
  const pctT = n => total ? Math.round(100*n/total) : 0;        // share of all roles
  const pctS = n => known.length ? Math.round(100*n/known.length) : 0; // share of stated
  const wtRows = [["Remote",rem,"var(--green)"],["Hybrid",hyb,"var(--gold)"],["Onsite",ons,"var(--pink)"],["Not stated",unstated,"#484f58"]]
    .sort((a,b)=>b[1]-a[1]);
  const remoteCard = `<div class="statcard"><h3>Work type (all ${total} roles)</h3>`
    + (total ? wtRows.map(([lbl,n,bg])=>
        `<div class="barrow"><span class="blabel">${lbl}</span>
         <span class="btrack"><span class="bfill" style="width:${pctT(n)}%;background:${bg}"></span></span>
         <span class="bnum" style="width:74px">${n} · ${pctT(n)}%</span></div>`).join("")
      : `<div class="xhint">No roles in this selection.</div>`)
    + `<div class="xhint">Most studios don't state work type. Of the ${known.length} that do, ${pctS(rem)}% are remote, ${pctS(hyb)}% hybrid, ${pctS(ons)}% onsite.</div></div>`;

  // --- Listing longevity (neutral framing): how long roles have been open since first posted
  // (the scraper bootstraps first-seen from the studio's own posted date, so this is real
  // time-since-posting). Facts, not accusations — a long-running role may be hard to fill.
  // Talent pools / general-application pipelines are excluded. Reflects the current filter. ---
  const GH_THRESH = 60;
  const ghLong = list.filter(j => { if (j.pool) return false; const d = daysListed(j); return d != null && d >= GH_THRESH; });
  const ghRepCount = list.filter(j => !j.pool && (j.relistCount || 0) > 0).length;
  // Leaderboard by SHARE of each studio's listings (raw count just favours the biggest boards),
  // among studios with enough listings (8+) for the share to mean something.
  const ghTotBy = {}; for (const j of list) if (!j.pool) ghTotBy[j.s] = (ghTotBy[j.s]||0)+1;
  const ghLongBy = {}; for (const j of ghLong) ghLongBy[j.s] = (ghLongBy[j.s]||0)+1;
  const ghShareRows = Object.keys(ghLongBy)
    .filter(s => (ghTotBy[s]||0) >= 8)
    .map(s => ({ s, long: ghLongBy[s], tot: ghTotBy[s], share: Math.round(100*ghLongBy[s]/ghTotBy[s]) }))
    .sort((a,b)=> b.share - a.share || b.long - a.long).slice(0, 12);
  const ghShareMax = Math.max(1, ...ghShareRows.map(r=>r.share));
  const ghStudioCard = `<div class="statcard"><h3>Studios with the most long-running listings (60+ days, share of their board)</h3>`
    + (ghShareRows.length
        ? ghShareRows.map(r => `<div class="barrow"><span class="blabel" title="${r.s}">${r.s}</span>`
            + `<span class="btrack"><span class="bfill" style="width:${Math.round(100*r.share/ghShareMax)}%"></span></span>`
            + `<span class="bnum" style="width:96px">${r.share}% · ${r.long}/${r.tot}</span></div>`).join("")
        : `<div class="xhint">Not enough data yet — this needs studios with 8+ current listings.</div>`)
    + `<div class="xhint">Share of each studio's current listings first posted 60+ days ago (studios with 8+ listings). A long-running listing may be hard to fill rather than stale — not a judgment of the studio.</div></div>`;
  // Oldest individual listings, capped at 2 per studio so one board can't dominate the list.
  const ghPer = {}; const ghOldest = [];
  for (const j of [...ghLong].sort((a,b)=>daysListed(b)-daysListed(a))) {
    const c = ghPer[j.s] || 0; if (c >= 2) continue; ghPer[j.s] = c + 1; ghOldest.push(j); if (ghOldest.length >= 8) break;
  }
  const ghListCard = `<div class="statcard"><h3>Oldest open listings right now</h3>`
    + `<div class="xhint" style="margin-bottom:6px">Days since the listing was first posted (max 2 per studio).</div>`
    + (ghOldest.length
        ? ghOldest.map(j => { const d = daysListed(j), rep = j.relistCount || 0;
            const sev = d>=120 ? "#e06c5e" : d>=90 ? "#d6a531" : "var(--muted)";
            return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;border-top:1px solid var(--border)">`
              + `<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${j.t} <span style="color:var(--muted)">· ${j.s}</span></span>`
              + (rep>0?`<span style="color:var(--muted);white-space:nowrap">↻ ${rep}×</span>`:"")
              + `<span style="color:${sev};white-space:nowrap;font-weight:600">${d}d</span></div>`;
          }).join("")
        : `<div class="xhint">Nothing has been open unusually long right now — a good sign.</div>`)
    + (ghRepCount ? `<div class="xhint">${ghRepCount} listing${ghRepCount===1?"":"s"} in this view ${ghRepCount===1?"has":"have"} had the posted date refreshed at least once (↻).</div>` : "")
    + `</div>`;

  const mp = marketPulse();
  const trendHead = `<div class="trendhead"><h2>Game-dev hiring trends</h2>`
    + `<p class="dirsub">Live across ${mp.studios} studios, refreshed hourly. Every figure here is a real, current opening — no estimated dates, no padding.</p></div>`
    + `<div class="pulsestats">`
    + `<div class="ptile"><div class="pnum">${mp.open.toLocaleString()}</div><div class="plabelt">open roles</div></div>`
    + `<div class="ptile"><div class="pnum">${mp.studios}</div><div class="plabelt">studios hiring</div></div>`
    + `<div class="ptile"><div class="pnum">${mp.newWk.toLocaleString()}</div><div class="plabelt">new this week</div></div>`
    + `<div class="ptile"><div class="pnum">${mp.medianAge==null?"—":mp.medianAge}${mp.medianAge==null?"":`<span style="font-size:14px;font-weight:600;color:var(--muted)"> days</span>`}</div><div class="plabelt">median posting age</div></div>`
    + `<div class="ptile"><div class="pnum">${mp.salPct}%</div><div class="plabelt">list a salary</div></div>`
    + `<div class="ptile"><div class="pnum">${mp.remotePct}%</div><div class="plabelt">remote</div></div>`
    + `<div class="ptile"><div class="pnum" style="font-size:18px;line-height:1.5">${mp.topStudio}</div><div class="plabelt">most active studio</div></div>`
    + `</div>`;
  const mo = buildMomentum();
  const digestCard = `<div class="statcard" style="border-color:rgba(88,166,255,.4);margin-bottom:14px"><h3 style="color:var(--accent);text-transform:none;letter-spacing:0;font-size:15px;font-weight:700">📬 Weekly market digest</h3><div style="font-size:14px;color:var(--text);margin:2px 0 12px">Get “what changed this week” in one email every Thursday — new roles, studio movers, salary transparency. Separate from job alerts; unsubscribe anytime.</div><div id="digestSignup"></div></div>`;
  const openedLine = `<div style="font-size:14px;color:var(--muted);margin:2px 0 12px"><b style="color:var(--text)">${mp.newWk.toLocaleString()}</b> roles opened in the last 7 days across the board.</div>`;
  const boardHead = `<h2 class="pulsehead" style="margin-top:6px">The board right now</h2><p class="dirsub">A live snapshot of every open role — current state, not change.${list.length!==mp.open?` Reflects your current filter (${list.length.toLocaleString()} of ${mp.open.toLocaleString()} roles).`:""}</p>`;
  document.getElementById("statsWrap").innerHTML = trendHead + digestCard
    // ---- What changed this week ----
    + (mo.head ? `<div class="mhead">` + mo.head + `</div>` : "")
    + openedLine
    + `<div class="statgrid">` + mo.cards + `</div>`
    // ---- The board right now ----
    + boardHead
    + `<div class="statgrid">`
    + barChart(`Roles by studio`, tally(list, j=>j.s), 14)
    + barChart("Roles by discipline", tally(list, j=>j.d))
    + barChart("Roles by country", tallyMulti(list, j=>j.countries), 14)
    + barChart("Roles by gaming hub", tallyMulti(list, j=>j.hubs), 14)
    + barChart("Roles by seniority", tally(list, j=>j.sen))
    + barChart("Posting age", buckets.filter(b=>b[1]>0))
    + salCard + transparencyCard
    + ghStudioCard + ghListCard
    + hiringCard + remoteCard
    + `</div>`;
  try { window.dqDigestForm && window.dqDigestForm("digestSignup"); } catch(e){}
}

// ---- "What's moving this week": momentum block, folded into the Trends tab ----
// All derived from trends.json (per-studio + per-discipline daily counts) — momentum, not news.
function buildMomentum(){
  const T = (window.JOBS_DATA && window.JOBS_DATA.trends) || null;
  if (!T || !T.studios || !Object.keys(T.studios).length) return { head: "", cards: "" };
  const enough = (T.span||0) >= 8;
  const sArr = Object.keys(T.studios).map(name => Object.assign({name}, T.studios[name]));
  const sumNow = sArr.reduce((a,s)=>a+(s.now||0),0);
  const sumD7  = sArr.reduce((a,s)=>a+(s.d7!=null?s.d7:s.now),0);
  const netWeek = sumNow - sumD7;
  const studiosUp = sArr.filter(s=>s.d7!=null && s.now>s.d7).length;
  const studiosDown = sArr.filter(s=>s.d7!=null && s.now<s.d7).length;
  let len=0; for (const s of sArr){ if (s.series && s.series.length>len) len=s.series.length; }
  const totalSeries=[]; for (let i=0;i<len;i++){ let sum=0, any=false; for (const s of sArr){ const v=s.series&&s.series[i]; if(v!=null){sum+=v;any=true;} } totalSeries.push(any?sum:null); }
  const klass=(now,base)=>{ const d=now-base, p=base>0?d/base:(now>0?1:0); if(now===0&&base>0)return"dark"; if(p>=0.15&&d>=2)return"up"; if(p<=-0.15&&d<=-2)return"down"; return"flat"; };
  const sRows=sArr.map(s=>{ const base=s.d30!=null?s.d30:(s.d7!=null?s.d7:s.now); return {name:s.name, now:s.now, delta:s.now-base, c:klass(s.now,base), series:s.series}; });
  const up=sRows.filter(r=>r.c==="up").sort((a,b)=>b.delta-a.delta);
  const down=sRows.filter(r=>r.c==="down"||r.c==="dark").sort((a,b)=>a.delta-b.delta);
  const srow=r=>`<div class="pulserow"><span class="plabel" title="${r.name}">${r.name}${r.c==="dark"?' <span class="darktag">board quiet</span>':''}</span><span class="spark">${sparkline(r.series)}</span><span class="pulsenum">${r.now}<span class="pdelta p-${r.c}">${r.delta>0?'+':''}${r.delta}</span></span></div>`;
  const dArr=T.disc?Object.keys(T.disc).map(name=>Object.assign({name}, T.disc[name])):[];
  const dRows=dArr.map(s=>{ const base=s.d30!=null?s.d30:(s.d7!=null?s.d7:s.now); return {name:s.name, now:s.now, delta:s.now-base, series:s.series}; });
  const hot=dRows.filter(r=>r.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,6);
  const cool=dRows.filter(r=>r.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,6);
  const drow=(r,sgn)=>`<div class="pulserow"><span class="plabel">${r.name}</span><span class="spark">${sparkline(r.series)}</span><span class="pulsenum">${r.now}<span class="pdelta p-${sgn}">${r.delta>0?'+':''}${r.delta}</span></span></div>`;
  const fresh=enough?sArr.filter(s=>s.d7==null && (s.now||0)>0).sort((a,b)=>b.now-a.now).slice(0,12):[];
  const card=(t,inner)=>`<div class="statcard"><h3>${t}</h3>${inner}</div>`;
  const tM=(num,label,c)=>`<div class="ptile"><div class="pnum ${c||''}">${num}</div><div class="plabelt">${label}</div></div>`;
  const tilesRow = enough
    ? `<div class="pulsestats">`
      + tM((netWeek>0?'+':'')+netWeek.toLocaleString(),'net roles vs last week', netWeek>0?'p-up':netWeek<0?'p-down':'p-flat')
      + tM(studiosUp,'studios hiring more')
      + tM(studiosDown,'studios slowing')
      + `<div class="ptile"><div style="height:28px;display:flex;align-items:center;justify-content:center">${sparkline(totalSeries)||'<span style="color:var(--muted);font-size:12px">building</span>'}</div><div class="plabelt">whole-market trend</div></div>`
      + `</div>`
    : "";
  const moverHint='<div class="xhint">No clear movers yet. Fills in as we track studios over the coming days.</div>';
  const discHint='<div class="xhint">Per-discipline history is just starting to bank. Check back in a few days.</div>';
  const head = `<h2 class="pulsehead">What changed this week</h2>`
    + `<div class="dirsub">${enough?'Change vs ~30 days ago, from how many roles each studio lists over time. Momentum, not official layoff news.':'<b>Momentum is still building.</b> The week-over-week totals appear once we have about 8 days of history; the movers below are live as soon as a studio shifts.'}</div>`
    + tilesRow;
  const cards = card('📈 Ramping up', up.length?up.map(srow).join(''):moverHint)
    + card('📉 Pulling back / quiet', down.length?down.map(srow).join(''):moverHint)
    + card('🔥 Disciplines heating up', hot.length?hot.map(r=>drow(r,'up')).join(''):discHint)
    + card('🧊 Disciplines cooling', cool.length?cool.map(r=>drow(r,'down')).join(''):'<div class="xhint">Nothing clearly cooling yet.</div>')
    + card('✨ New studios this week', fresh.length?fresh.map(r=>`<div class="pulserow"><span class="plabel">${r.name}</span><span class="pulsenum">${r.now} role${r.now===1?'':'s'}</span></div>`).join(''):(enough?'<div class="xhint">No studios newly added in the last week.</div>':'<div class="xhint">Starts once we have a full week of history.</div>'));
  return { head, cards };
}

// ---- Pulse: hiring momentum from our own listing history ---------------------
function sparkline(series){
  const pts = (series||[]).filter(v=>v!=null);
  if (pts.length < 2) return "";
  const w=120,h=22, max=Math.max(...pts), min=Math.min(...pts), rng=(max-min)||1, step=w/(pts.length-1);
  const d = pts.map((v,i)=>`${i?'L':'M'}${(i*step).toFixed(1)},${(h-2-((v-min)/rng)*(h-4)).toFixed(1)}`).join(" ");
  const up = pts[pts.length-1] >= pts[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${up?'var(--green)':'var(--pink)'}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function renderPulse(){
  const el = document.getElementById("pulseWrap");
  const T = (window.JOBS_DATA && window.JOBS_DATA.trends) || null;
  const hasTrends = !!(T && T.studios && Object.keys(T.studios).length);
  const enough = hasTrends && (T.span || 0) >= 8;
  const tile = (num,label,cls="") => `<div class="ptile"><div class="pnum ${cls}">${num}</div><div class="plabelt">${label}</div></div>`;

  // numbers available right now from current listings (work before any trend history)
  const newThisWeek = JOBS.filter(j=>{ const d=daysListed(j); return d!=null ? d<=7 : (j.ts && hoursAgo(j)<=168); }).length;
  const remoteNow = JOBS.filter(j=>j.w==="Remote").length;
  const studiosTracked = new Set(JOBS.map(j=>j.s)).size; // distinct studios actually listed (sub-studios split out)

  // week-over-week numbers (only once we have history)
  let netTile = "", studiosUpTile = "";
  if (enough) {
    const totals = Object.values(T.studios);
    const netWeek = totals.reduce((a,s)=>a+(s.now||0),0) - totals.reduce((a,s)=>a+(s.d7!=null?s.d7:s.now),0);
    const studiosUp = totals.filter(s=>s.d7!=null && s.now>s.d7).length;
    netTile = tile((netWeek>0?"+":"")+netWeek.toLocaleString(),"net vs last week", netWeek>0?"p-up":netWeek<0?"p-down":"p-flat");
    studiosUpTile = tile(studiosUp,"studios hiring more");
  }
  const summary = `<div class="pulsestats">`
    + tile(JOBS.length.toLocaleString(),"active jobs") + netTile
    + tile(newThisWeek.toLocaleString(),"new this week") + studiosUpTile
    + tile(remoteNow.toLocaleString(),"remote roles") + tile(studiosTracked,"studios tracked")
    + `</div>`;

  const note = `<div class="dirsub">Based on how many open roles we see on each studio's board over time — a signal of momentum, <b>not</b> official layoff news.${enough?' Compares now vs. ~30 days ago.':' <b>Momentum trends are still building</b> — the week-over-week numbers and the lists below fill in as we track studios over the coming days.'}</div>`;

  let body = "";
  if (hasTrends) {
    const rows = Object.entries(T.studios).map(([name,s])=>{
      const base = s.d30!=null ? s.d30 : (s.d7!=null ? s.d7 : s.now);
      const delta = s.now - base;
      const pct = base>0 ? delta/base : (s.now>0?1:0);
      let cls;
      if (s.now===0 && base>0) cls="dark";
      else if (pct>=0.15 && delta>=2) cls="up";
      else if (pct<=-0.15 && delta<=-2) cls="down";
      else cls="flat";
      return { name, now:s.now, delta, cls, series:s.series };
    });
    const up = rows.filter(r=>r.cls==="up").sort((a,b)=>b.delta-a.delta);
    const down = rows.filter(r=>r.cls==="down"||r.cls==="dark").sort((a,b)=>a.delta-b.delta);
    const row = r => `<div class="pulserow">
       <span class="plabel" title="${r.name}">${r.name}${r.cls==="dark"?' <span class="darktag">board quiet</span>':''}</span>
       <span class="spark">${sparkline(r.series)}</span>
       <span class="pulsenum">${r.now}<span class="pdelta p-${r.cls}">${r.delta>0?'+':''}${r.delta}</span></span>
     </div>`;
    const upCard = `<div class="statcard"><h3>📈 Ramping up</h3>${up.length?up.map(row).join(""):'<div class="xhint">No clear risers yet — trends are still building.</div>'}</div>`;
    const downCard = `<div class="statcard"><h3>📉 Pulling back / quiet</h3>${down.length?down.map(row).join(""):'<div class="xhint">No clear decliners right now.</div>'}</div>`;
    body = `<div class="statgrid">${upCard}${downCard}</div>`;
  }
  el.innerHTML = `<h2 class="pulsehead">This week in hiring</h2>${summary}${note}${body}`;
}

function renderMap(){
  if (typeof L === "undefined") {
    document.getElementById("map").innerHTML = '<div class="empty">Map requires an internet connection (loads OpenStreetMap tiles).</div>';
    return;
  }
  if (!map) {
    map = L.map("map", { worldCopyJump: true }).setView([39, -35], 3);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 12,
    }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
  }
  setTimeout(()=>map.invalidateSize(), 50);
  markerLayer.clearLayers();

  const list = LAST_LIST;
  const cities = {}; // key -> {lat,lng,count,studios:{}}
  let remote = 0, unmapped = 0;
  for (const j of list) {
    let placed = false;
    const seen = new Set();
    for (const loc of j.locs) {
      if (/remote/i.test(loc)) { if(!placed){remote++;} placed = true; continue; }
      const g = matchCity(loc);
      if (g && !seen.has(g[0])) {
        seen.add(g[0]);
        const c = cities[g[0]] = cities[g[0]] || { lat: g[1], lng: g[2], name: g[0], count: 0, studios: {} };
        c.count++;
        c.studios[j.s] = (c.studios[j.s] || 0) + 1;
        placed = true;
      }
    }
    if (!placed) unmapped++;
  }

  const max = Math.max(1, ...Object.values(cities).map(c=>c.count));
  for (const c of Object.values(cities)) {
    const r = 6 + 22 * Math.sqrt(c.count / max);
    const label = c.name.replace(/\b\w/g, ch=>ch.toUpperCase());
    const topStudios = Object.entries(c.studios).sort((a,b)=>b[1]-a[1]).slice(0,4)
      .map(([s,n])=>`${s} (${n})`).join("<br>");
    L.circleMarker([c.lat, c.lng], {
      radius: r, color: "#58a6ff", weight: 1.5, fillColor: "#58a6ff", fillOpacity: 0.35,
    }).bindPopup(
      `<b>${label}</b> — ${c.count} role${c.count>1?"s":""}<br><span style="color:#8b949e">${topStudios}</span><br>` +
      `<a onclick="filterCity('${c.name.replace(/'/g,"\\'")}')">Show these jobs →</a>`
    ).addTo(markerLayer);
  }
  // island studios: gold pins at each studio's HQ, grouped by city, linking out.
  // Nudged slightly off the blue job-pins so overlapping cities stay clickable.
  const dirCities = {};
  const dq = (document.getElementById("q").value || "").toLowerCase(); // honor the search
  // Both the island directory AND the moon (indie) studios plot as one amber "browse directly" layer.
  for (const d of DIRECTORY.concat(MOON_STUDIOS)) {
    if (dq && !(d.name + " " + (d.note || "")).toLowerCase().includes(dq)) continue;
    const c0 = dirCoords(d);
    if (!c0) continue;
    const key = c0.lat + "," + c0.lng;
    (dirCities[key] = dirCities[key] || { lat: c0.lat, lng: c0.lng, label: c0.label, items: [] }).items.push(d);
  }
  let islandShown = 0;
  for (const c of Object.values(dirCities)) {
    islandShown += c.items.length;
    const links = c.items.map(d=>`<a href="${d.url}" target="_blank" rel="noopener">${d.name} ↗</a>`).join("<br>");
    L.circleMarker([c.lat + 0.06, c.lng + 0.06], {
      radius: 5 + Math.min(8, c.items.length * 1.5), color: "#d29922", weight: 1.5,
      fillColor: "#d29922", fillOpacity: 0.45,
    }).bindPopup(
      `<b>${c.label}</b> — ${c.items.length} studio${c.items.length>1?"s":""} to browse directly<br>` +
      `<span style="color:#8b949e">${links}</span>`
    ).addTo(markerLayer);
  }

  document.getElementById("mapNote").innerHTML =
    `<span style="color:#58a6ff">●</span> ${Object.keys(cities).length} cities with listed roles · ` +
    `<span style="color:#d29922">●</span> ${islandShown} "browse directly" studios · ` +
    `${remote} remote roles &amp; ${unmapped} unmapped (not shown)`;
}

  // let the after-apply nudge (top-level) open the same alert form, pre-set to a discipline.
  window.dqAlertForm = function(label, c){ try{ openForm(label, c||{}); }catch(e){} };
  // one-time visitor-source capture: referrer host + any UTM tags on the URL (cookieless).
  try {
    var _host = location.hostname.replace(/^www\./,"");
    var _ref = "(direct)";
    if (document.referrer) { try { var _rh = new URL(document.referrer).hostname.replace(/^www\./,""); _ref = (_rh===_host) ? "(internal)" : _rh; } catch(e){ _ref = "(unknown)"; } }
    var _p = new URLSearchParams(location.search);
    track("landing", { ref:_ref, src:(_p.get("utm_source")||"").slice(0,40), medium:(_p.get("utm_medium")||"").slice(0,40), campaign:(_p.get("utm_campaign")||"").slice(0,60) });
  } catch(e){}
  track("view", { tab:"list" });

  // wrap job-status + dismiss if present
  try{ if(typeof window.setStatus==="function"){ var _ss=window.setStatus; window.setStatus=function(id,v){ try{ if(v) track("track_job",{status:v}); }catch(e){} return _ss.apply(this,arguments); }; } }catch(e){}
  try{ if(typeof window.toggleDismiss==="function"){ var _td=window.toggleDismiss; window.toggleDismiss=function(id){ try{ track("dismiss_job",{}); }catch(e){} return _td.apply(this,arguments); }; } }catch(e){}

  // search (debounced)
  var _q = document.getElementById("q");
  if(_q){ var _qt; _q.addEventListener("input", function(){ clearTimeout(_qt); _qt=setTimeout(function(){ var _v=_q.value.trim(); if(_v){ var _n=(typeof window.__dqCount==="number"?window.__dqCount:null); track("search",{ q:_v.toLowerCase().slice(0,40), len:_v.length, n:_n, zero:_n===0 }); } },1500); }); }

  // delegated click tracking
  document.addEventListener("click", function(e){
    try{
      var t = e.target;
      var tabBtn = t.closest && t.closest(".viewtabs button");
      if(tabBtn){ track("view", {tab:(tabBtn.textContent||"").replace(/[^a-z]/gi,"").toLowerCase()}); return; }
      var a = t.closest && t.closest("a");
      if(!a) return;
      if(a.classList.contains("knowbtn")) track("who_do_i_know",{});
      else if(a.classList.contains("dircard")||a.classList.contains("dirrow")) track("directory_click",{st:a.getAttribute("data-st")||""});
      else if(a.classList.contains("moonchip")) track("moon_click",{st:a.getAttribute("data-st")||""});
      else if(a.closest("#jobs")) track("apply_click",{});
    }catch(_){}
  }, true);

  // ---------- "Email me these roles" signup widget ----------
  function escapeH(s){ return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function val(id){ var e=document.getElementById(id); return e?e.value:""; }
  function chk(id){ var e=document.getElementById(id); return !!(e&&e.checked); }
  function setArr(name){ try{ return Array.from(eval(name)); }catch(e){ return []; } }

  function readCriteria(){
    var c={};
    c.q=(val("q")||"").trim(); c.region=val("region"); c.age=val("age");
    c.hidePools=chk("hidePools");
    try{ c.quickRemote=!!quickRemote; }catch(e){ c.quickRemote=false; }
    try{ c.cells=Array.from(selCells); }catch(e){ c.cells=[]; }
    try{ c.subs=Array.from(selSubs); }catch(e){ c.subs=[]; }
    try{ c.studios=Array.from(selStudios); }catch(e){ c.studios=[]; }
    try{ c.countries=Array.from(selCountries); }catch(e){ c.countries=[]; }
    try{ c.regionsQuick=Array.from(selRegionsQuick); }catch(e){ c.regionsQuick=[]; }
    try{ c.hubs=Array.from(selHubs); }catch(e){ c.hubs=[]; }
    // Sidebar Discipline / Work type / Seniority checkboxes (were previously missed by alerts).
    try{ c.disc=checked("f-d"); c.work=checked("f-w"); c.sen=checked("f-s"); }catch(e){ c.disc=[]; c.work=[]; c.sen=[]; }
    return c;
  }
  function hasFilters(c){
    return !!(c.q||c.region||c.quickRemote||(c.cells&&c.cells.length)||(c.subs&&c.subs.length)||
      (c.studios&&c.studios.length)||(c.countries&&c.countries.length)||(c.regionsQuick&&c.regionsQuick.length)||(c.hubs&&c.hubs.length)||
      (c.disc&&c.disc.length)||(c.sen&&c.sen.length)||(c.work&&c.work.length));
  }
  // "structured" = filters other than the free-text box. A zero-result on a typed query
  // ("Rito") must NOT offer an alert (it would never fire); only clean filter sets do.
  function hasStructured(c){
    return !!(c.region||c.quickRemote||(c.cells&&c.cells.length)||(c.subs&&c.subs.length)||
      (c.studios&&c.studios.length)||(c.countries&&c.countries.length)||(c.regionsQuick&&c.regionsQuick.length)||(c.hubs&&c.hubs.length)||
      (c.disc&&c.disc.length)||(c.sen&&c.sen.length)||(c.work&&c.work.length));
  }
  function labelFor(c){
    var p=[];
    (c.cells||[]).slice(0,3).forEach(function(k){ var x=k.split("|"); p.push((x[1]?x[1]+" ":"")+x[0]); });
    (c.sen||[]).slice(0,2).forEach(function(x){ p.push(x); });
    (c.disc||[]).slice(0,2).forEach(function(x){ p.push(x); });
    (c.work||[]).slice(0,1).forEach(function(x){ p.push(x); });
    (c.subs||[]).slice(0,2).forEach(function(s){ p.push(s); });
    (c.studios||[]).slice(0,2).forEach(function(s){ p.push(String(s).replace(/^@/,"")); });
    if(c.quickRemote) p.push("Remote");
    (c.regionsQuick||[]).slice(0,1).forEach(function(r){ p.push(r); });
    if(c.region) p.push(c.region);
    (c.countries||[]).slice(0,1).forEach(function(x){ p.push(x); });
    if(c.q) p.push('"'+c.q+'"');
    var l=p.join(" · "); if(l.length>90) l=l.slice(0,87)+"…"; return l||"matching";
  }

  var bar=document.createElement("div");
  bar.id="alertBar";
  bar.style.cssText="display:none;margin:10px 0 8px;padding:11px 14px;border:1px solid #2a3a28;border-radius:8px;background:#141816";
  var jobsEl=document.getElementById("jobs");
  if(jobsEl&&jobsEl.parentNode) jobsEl.parentNode.insertBefore(bar, jobsEl);

  function buildCta(label, c, n){
    bar.setAttribute("data-state","cta"); bar.style.display="block";
    var subbed=false; try{ subbed=!!store.get("luj-subscribed",0); }catch(e){}
    if(subbed){
      // Already subscribed on this device: go quiet, but stay available so they can add an
      // alert for a NEW search. Muted styling, low-key "+ Add alert" instead of the loud prompt.
      var qmsg = (n===0)
        ? 'You\'re subscribed. Get an email when a <b style="color:#9fb499">'+escapeH(label)+'</b> role opens?'
        : 'You\'re subscribed. Want <b style="color:#9fb499">'+escapeH(label)+'</b> emailed too?';
      bar.innerHTML='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#7a8878;font-size:13px">'+
        '<span>'+qmsg+'</span>'+
        '<button id="alertCta" style="margin-left:auto;background:transparent;color:#58a6ff;border:0;font-size:13px;font-weight:600;cursor:pointer;padding:2px 4px">'+(n===0?'+ Notify me':'+ Add alert')+'</button></div>';
      var qbtn=document.getElementById("alertCta"); if(qbtn) qbtn.onclick=function(){ openForm(label, c); };
      return;
    }
    var msg, btnLabel;
    if(n===0){
      msg='🔔 No <b>'+escapeH(label)+'</b> roles open right now. We\'ll email you when one opens.';
      btnLabel='Notify me';
    } else {
      msg='🔔 <b style="color:#fff">'+n+' role'+(n===1?'':'s')+'</b> '+(n===1?'matches':'match')+' <b>'+escapeH(label)+'</b>. Get them emailed to you now, then weekly as new ones open.';
      btnLabel='Email me these';
    }
    bar.innerHTML='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#d0dcc8">'+
      '<span style="font-size:14px">'+msg+'</span>'+
      '<button id="alertCta" style="margin-left:auto;background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer">'+btnLabel+'</button></div>';
    var btn=document.getElementById("alertCta"); if(btn) btn.onclick=function(){ openForm(label, c); };
  }
  function openForm(label, c){
    bar.setAttribute("data-state","form");
    bar.innerHTML='<form id="alertForm" style="display:flex;flex-direction:column;gap:8px;color:#d0dcc8">'+
      '<div style="font-size:14px">🔔 Weekly email of new <b>'+escapeH(label)+'</b> roles:</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="alertEmail" type="email" required placeholder="you@email.com" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid #2a3a28;border-radius:6px;background:#0d0f0e;color:#d0dcc8">'+
      '<button type="submit" style="background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer">Subscribe</button></div>'+
      '<label style="font-size:12px;color:#7a8878;display:flex;gap:6px;align-items:flex-start"><input id="alertConsent" type="checkbox" required style="margin-top:2px">I agree to receive a weekly job-alert email. Unsubscribe anytime; no spam.</label>'+
      (TURNSTILE_SITEKEY?'<div id="alertTurnstile" style="margin-top:2px"></div>':'')+
      '<div id="alertMsg" style="font-size:13px;min-height:16px"></div></form>';
    _tsWidget=null;
    if(TURNSTILE_SITEKEY && window.turnstile){
      try{ _tsWidget=window.turnstile.render("#alertTurnstile",{sitekey:TURNSTILE_SITEKEY,theme:"dark",appearance:"interaction-only",retry:"auto","retry-interval":3000,"refresh-expired":"auto","error-callback":function(){ var m=document.getElementById("alertMsg"); if(m){ m.textContent="Verification hiccup — it'll retry automatically. Give it a moment, then try again."; m.style.color="#8b949e"; } return true; }}); }catch(e){}
    }
    document.getElementById("alertForm").onsubmit=function(ev){
      ev.preventDefault();
      var email=document.getElementById("alertEmail").value.trim();
      var consent=document.getElementById("alertConsent").checked;
      var msg=document.getElementById("alertMsg");
      if(!consent){ msg.textContent="Please tick the consent box."; msg.style.color="#c87878"; return; }
      var tsToken="";
      if(TURNSTILE_SITEKEY){
        try{ tsToken=window.turnstile?window.turnstile.getResponse(_tsWidget):""; }catch(e){ tsToken=""; }
        if(!tsToken){ msg.textContent="Just a sec — finishing a quick security check. Tap again."; msg.style.color="#c87878"; return; }
      }
      msg.textContent="Sending…"; msg.style.color="#7a8878";
      track("alert_signup",{});
      fetch(ALERTS_API+"/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email,criteria:c,label:label,token:tsToken})})
        .then(function(r){ return r.json().catch(function(){return{};}).then(function(j){ return {ok:r.ok,j:j}; }); })
        .then(function(res){
          if(res.ok&&res.j&&res.j.ok){ try{ store.set("luj-subscribed",1); }catch(e){} bar.setAttribute("data-state","done"); bar.innerHTML='<div style="font-size:14px;color:#58a6ff">✓ Almost there. Check your inbox and click the confirmation link to start your weekly alert.</div>'; }
          else { msg.textContent="That didn’t go through. Please try again in a moment."; msg.style.color="#c87878"; }
        }).catch(function(){ msg.textContent="Network hiccup. Please try again."; msg.style.color="#c87878"; });
    };
  }

  // compact, non-personal summary of the active filters (+ current result count) for analytics.
  function filterSummary(c){
    var cells=c.cells||[], disc=[], sen=[];
    cells.forEach(function(k){ var x=String(k).split("|"); if(x[0]&&disc.indexOf(x[0])<0)disc.push(x[0]); if(x[1]&&sen.indexOf(x[1])<0)sen.push(x[1]); });
    var regions=(c.regionsQuick||[]).slice(); if(c.region&&regions.indexOf(c.region)<0)regions.push(c.region);
    var n=(typeof window.__dqCount==="number"?window.__dqCount:null);
    return { disc:disc.slice(0,4), sen:sen.slice(0,4),
      studios:(c.studios||[]).map(function(s){return String(s).replace(/^@/,"");}).slice(0,4),
      regions:regions.slice(0,4), countries:(c.countries||[]).slice(0,4), subs:(c.subs||[]).slice(0,4),
      remote:!!c.quickRemote, q:(c.q||"").toLowerCase().slice(0,30), n:n, zero:n===0,
      gc:cells.length, sd:(c.disc||[]).length, ss:(c.sen||[]).length };  // grid-cells vs sidebar disc/sen counts
  }

  var lastSig="";
  function renderBar(){
    var c=readCriteria();
    var sig=""; try{ sig=JSON.stringify(c); }catch(e){}
    var changed=(sig!==lastSig);
    if(changed){ lastSig=sig; if(hasFilters(c)){ try{ track("filter", filterSummary(c)); }catch(e){} } }
    var state=bar.getAttribute("data-state");
    // Keep an open or just-submitted form while the filters are unchanged. The moment the
    // filters change, clear it so a subscriber can set up an alert for the NEW search.
    if((state==="form"||state==="done") && !changed) return;
    if(state==="form"||state==="done") bar.removeAttribute("data-state");
    var n=(typeof window.__dqCount==="number"?window.__dqCount:null);
    // No filters, or a free-text-only search that found nothing -> no email ask (the in-list
    // "no roles match" helper covers the typo case). Structured filters at zero DO get the ask.
    if(!hasFilters(c) || (n===0 && !hasStructured(c))){ bar.style.display="none"; bar.removeAttribute("data-state"); return; }
    buildCta(labelFor(c), c, n);
  }

  // update the bar whenever the job list re-renders (i.e. filters changed)
  if(jobsEl){ try{ new MutationObserver(function(){ try{ renderBar(); }catch(e){} }).observe(jobsEl,{childList:true}); }catch(e){} }
  try{ renderBar(); }catch(e){}
})();
</script>

</body>
