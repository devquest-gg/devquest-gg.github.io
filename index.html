// Right-edge fade on the grid's horizontal scroller, so it's visible that Lead / Director+ exist
// off-screen. Wraps each .mxscroll once, then keeps the fade in sync with scroll position and
// resize. Cheap and idempotent: re-running after a grid re-render just re-binds.
function mxFadeSync(){
  try {
    document.querySelectorAll(".mxscroll").forEach(function(sc){
      var wrap = sc.parentNode;
      if (!wrap || !wrap.classList || !wrap.classList.contains("mxfade")){
        wrap = document.createElement("div"); wrap.className = "mxfade";
        sc.parentNode.insertBefore(wrap, sc); wrap.appendChild(sc);
      }
      var upd = function(){
        var more = sc.scrollWidth - sc.clientWidth - sc.scrollLeft > 8;
        wrap.classList.toggle("canscroll", more);
        wrap.classList.toggle("canscrollback", sc.scrollLeft > 8);
      };
      // On a phone the grid can only show three columns. Entry is the thinnest column on the board
      // (roughly 50 open roles across every discipline — mostly single digits), while Lead carries
      // real numbers and outranks Entry on filter events (8,235 vs 7,284). So start one column in:
      // Mid / Senior / Lead are what you see, Entry is one swipe left and flagged by the left fade.
      // Only ever applied to a fresh, unscrolled grid, so it never fights someone who has scrolled.
      try {
        if (window.innerWidth <= 560 && !sc._mxStarted && sc.scrollLeft === 0){
          var cells = sc.querySelectorAll("tr:first-child th");
          var w = (cells && cells.length > 1) ? Math.round(cells[1].getBoundingClientRect().width) : 0;
          // Land flush on the Mid column. Overshooting clipped Mid's numbers under the left fade,
          // which is worse than the gap it was trying to close — that gap is really the label column
          // being wider than the labels need, and it's fixed in CSS instead (see xname width below).
          var start = w;
          if (w > 20 && sc.scrollWidth - sc.clientWidth >= start){ sc.scrollLeft = start; sc._mxStarted = true; }
        }
      } catch(e){}
      if (!sc._mxBound){ sc._mxBound = true; sc.addEventListener("scroll", upd, { passive: true }); }
      // Measure the sticky label column so the left fade begins where the data does.
      try { var lab = sc.querySelector("tr:first-child th:first-child");
            if (lab) wrap.style.setProperty("--mxlab", Math.round(lab.getBoundingClientRect().width) + "px"); } catch(e){}
      upd();
    });
  } catch(e){}
}
try { window.addEventListener("resize", function(){ try { mxFadeSync(); } catch(e){} }); } catch(e){}

// One-line For You entry point, shown in the space the collapsed grid gives back.
// 15,211 profile edits produced only 529 For You visits: people tell us their craft and level and
// then never see what it bought them, because the payoff lives behind a tab. This puts it on the
// List, where 89% of tab views are. Deliberately one line (~40px) against the 295px the collapsed
// grid frees, and only shown when ALL of these hold, so it never becomes clutter:
//   · we're on List, and the grid is actually collapsed (so we're spending reclaimed space)
//   · the visitor has explicitly pinned a craft or a level (same .pinned test as matrixCollapsed)
//   · there are real matches to point at

function fyStripDismissed(){ try { return !!store.get("dq-fystrip-off", false); } catch(e){ return false; } }
function fyStripDismiss(){ try { store.set("dq-fystrip-off", true); } catch(e){}
  try { window.dqTrack && window.dqTrack("fystrip_dismiss", {}); } catch(e){}
  const el = document.getElementById("fyStrip"); if (el){ el.innerHTML = ""; el.style.display = "none"; } }
function fyStripGo(){
  try { window.dqTrack && window.dqTrack("fystrip_click", {}); } catch(e){}
  try { setView("bestfit"); } catch(e){}
  try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch(e){}
}
function renderFyStrip(){
  const el = document.getElementById("fyStrip"); if (!el) return;
  const hide = () => { el.innerHTML = ""; el.style.display = "none"; };
  if (typeof view !== "undefined" && view !== "list") return hide();
  if (fyStripDismissed() || !matrixCollapsed()) return hide();
  let disc = null, sen = null;
  try { if (profGet("roles").pinned) disc = (profGet("roles").v || [])[0] || null; } catch(e){}
  try { const s = profGet("sen"); if (s.pinned && s.v && s.v !== "__any") sen = s.v; } catch(e){}
  if (!disc && !sen) return hide();
  const pool = (typeof JOBS !== "undefined" && JOBS) ? JOBS : [];
  const match = pool.filter(j => (!disc || j.d === disc) && (!sen || j.sen === sen));
  if (match.length < 3) return hide();                       // nothing worth pointing at
  const studios = new Set(match.map(j => j.s).filter(Boolean)).size;
  if (studios < 2) return hide();
  const who = [sen, disc].filter(Boolean).join(" ") || "you";
  el.style.display = "flex";   // NB: the CSS default for #fyStrip is display:none, so setting "" here
                               // would fall straight back to hidden. Must name the display mode.
  el.innerHTML = '<span class="fysic">🎯</span>'
    + '<span class="fystxt"><b>' + studios + ' studios</b> hiring ' + _h(who) + '</span>'
    + '<button class="fyscta" onclick="event.stopPropagation();fyStripGo()">See your best matches →</button>'
    + '<span class="fyschev" aria-hidden="true">›</span>'
    + '<button class="fysx" onclick="event.stopPropagation();fyStripDismiss()" data-tip="Hide this" aria-label="Hide">✕</button>';
  el.onclick = fyStripGo;   // whole row is the tap target on phones, where the button is hidden
  // Fire ONCE per page load. renderFyStrip() runs on every render, so this was emitting an
  // impression beacon on every filter change — five grid taps sent five identical events. That
  // both inflates the metric and turns a quiet analytics endpoint into a chatty one, which is
  // exactly the behaviour mobile browsers' tracking heuristics look for.
  if (!renderFyStrip._logged){ renderFyStrip._logged = true;
    try { window.dqTrack && window.dqTrack("fystrip_show", { d: disc || "", s: sen || "" }); } catch(e){} }
}

// sub-discipline chips: only rendered when a sub-bearing square is selected
function renderSubbar(availSubs){
  const el = document.getElementById("subbar");
  const keys = Object.keys(availSubs).sort((a,b)=>availSubs[b]-availSubs[a]);
  if (!keys.length) { el.innerHTML = ""; el.style.display = "none"; return; }
  el.style.display = "";

// Gaming-hub chips. Showing all ~30 at once cost four rows of vertical space and pushed the job list
// below the fold, so we show the busiest few and hide the tail behind a "+N more" toggle. Anything
// currently SELECTED is always rendered, even when it's outside the top slice — a filter you can't
// see is a filter you can't turn off.
// 8 chips fits one row on a desktop but wraps to ~148px on a 390px phone — measured, and that
// made this the second-largest block above the first job card despite only 35 hub filters all
// week. Show half as many on narrow screens; the "+N more" toggle still reaches every hub.
function hubsCollapsedCount(){ try { return (window.innerWidth <= 520) ? 4 : 8; } catch(e){ return 8; } }
function renderHubbar(availHubs){
  const el = document.getElementById("hubbar");
  const keys = Object.keys(availHubs).sort((a,b)=>availHubs[b]-availHubs[a]);
  if (!keys.length) { el.innerHTML = ""; el.style.display = "none"; return; }
  el.style.display = "";
  const chip = h => `<button class="qchip hub ${selHubs.has(h)?'on':''}" onclick="toggleHub('${h.replace(/'/g,"\\'")}')">${h} <span class="subn">${availHubs[h]}</span></button>`;
  let shown = keys, hidden = 0;
  const HUBS_COLLAPSED = hubsCollapsedCount();
  if (!hubsExpanded && keys.length > HUBS_COLLAPSED + 1){
    const top = keys.slice(0, HUBS_COLLAPSED);
    const picked = keys.filter(h => selHubs.has(h) && !top.includes(h));   // never hide an active filter
    shown = top.concat(picked);
    hidden = keys.length - shown.length;
  }
  el.innerHTML = `<span class="qlabel">📍 Hubs:</span>`
    + shown.map(chip).join("")
    + (hidden > 0 ? `<button class="qchip hubmore" onclick="toggleHubsExpanded()" data-tip="Show the remaining ${hidden} hubs">+${hidden} more ▾</button>` : "")
    + (hubsExpanded && keys.length > HUBS_COLLAPSED + 1 ? `<button class="qchip hubmore" onclick="toggleHubsExpanded()">Show fewer ▴</button>` : "")
    // Only meaningful once a hub is picked, so it appears alongside the selection rather than always.
    + (selHubs.size ? `<button class="qchip ${hubPlusRemote?'on':''}" onclick="toggleHubPlusRemote()" data-tip="Also show fully-remote roles from anywhere, not just ones based in your hub">➕ or remote${hubPlusRemote?' ✓':''}</button>` : "");
}

// ---- Active-filters bar: shows every applied filter as a removable chip + "Clear all".
// Each chip stores a closure that clears its specific filter, so removal needs no fragile
// string-escaping in the onclick (we reference the filter by index into __af).
let __af = [];
function renderActiveFilters(){
  __af = [];
  const add = (label, fn) => __af.push({ label, fn });
  const q = document.getElementById('q');
  if (q.value.trim()) add('🔍 "' + q.value.trim() + '"', () => { q.value = ''; });
  const region = document.getElementById('region');
  if (region.value) add('Region: ' + region.options[region.selectedIndex].text, () => { region.selectedIndex = 0; });
  const age = document.getElementById('age');
  if (age.selectedIndex > 0) add('Posted: ' + age.options[age.selectedIndex].text, () => { age.selectedIndex = 0; });  if (document.getElementById('hideStale').checked) add('Hiding stale', () => { document.getElementById('hideStale').checked = false; });
  if (quickRemote) add('Remote only', () => { quickRemote = false; });
  if (quickNew) add('✨ New for you', () => { quickNew = false; });
  [...selCells].forEach(k => { const x = k.split('|'); add((x[1] ? x[1] + ' ' : '') + x[0], () => selCells.delete(k)); });
  [...selSubs].forEach(s => add(s, () => selSubs.delete(s)));
  [...selStudios].forEach(s => add(String(s).replace(/^@/, ''), () => { selStudios.delete(s); renderSearchGroup("studioFilters","studioSearch",STUDIO_COUNTS,selStudios,STUDIO_LABELS,DIR_STUDIOS); }));
  [...selCountries].forEach(c => add(c, () => { selCountries.delete(c); renderSearchGroup("countryFilters","countrySearch",COUNTRY_COUNTS,selCountries,null); saveCountries(); }));
  [...selRegionsQuick].forEach(r => add(r, () => selRegionsQuick.delete(r)));
  [...selKinds].forEach(k => add('Type: ' + (KIND_LABELS[k] || k), () => { selKinds.delete(k); const c = document.querySelector('.kindchip[data-k="' + k + '"]'); if (c) c.classList.remove('on'); }));
  // Sidebar Discipline / Work Type / Seniority checkboxes — were filtering silently with no chip
  // and no clear. Now each shows as a removable chip like every other filter.
  const _uncheck = (cls, v) => { const cb=[...document.querySelectorAll('.'+cls+':checked')].find(c=>c.value===v); if(cb) cb.checked=false; };
  checked('f-d').forEach(v => add(v, () => _uncheck('f-d', v)));
  checked('f-w').forEach(v => add(v, () => _uncheck('f-w', v)));
  checked('f-s').forEach(v => add(v, () => _uncheck('f-s', v)));
  const el = document.getElementById('activeFilters');
  if (!el) return;
  if (!__af.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  el.innerHTML = '<span class="aflabel">Filters:</span>'
    + __af.map((f, i) => '<button class="afchip" onclick="rmActive(' + i + ')" data-tip="Remove this filter">' + esc(f.label) + ' <span class="afx">✕</span></button>').join('')
    + '<button class="afexport" onclick="copyShareLink(this)" data-tip="Copy a link that reopens this exact filtered view">🔗 Copy link</button>'
    + '<button class="afexport" onclick="exportCsv()" data-tip="Download these filtered results as a CSV spreadsheet">⤓ Export CSV</button>'
    + '<button class="afclear" onclick="clearAllFilters()">Clear all</button>';
}
function rmActive(i){ const f = __af[i]; if (f) { f.fn(); render(); } }
// ---- Shareable filter links: encode the active filter set into the URL, and apply it on load -------
function buildFilterQuery(){
  const p = new URLSearchParams();
  try {
    const q = (document.getElementById('q').value||'').trim(); if (q) p.set('q', q);
    const rg = document.getElementById('region'); if (rg && rg.value) p.set('region', rg.value);
    const ag = document.getElementById('age'); if (ag && ag.value && ag.value!=='0') p.set('age', ag.value);
    if (quickRemote) p.set('remote','1');
    const hs = document.getElementById('hideStale'); if (hs && hs.checked) p.set('stale','1');
    if (selCells.size)        p.set('cells', [...selCells].join(';'));
    if (selSubs.size)         p.set('subs', [...selSubs].join(';'));
    if (selStudios.size)      p.set('studios', [...selStudios].join(';'));
    if (selCountries.size)    p.set('countries', [...selCountries].join(';'));
    if (selRegionsQuick.size) p.set('rquick', [...selRegionsQuick].join(';'));
    if (selHubs.size)         p.set('hubs', [...selHubs].join(';'));
    if (selKinds.size)        p.set('kinds', [...selKinds].join(';'));
    const d = checked('f-d'), w = checked('f-w'), s = checked('f-s');
    if (d.length) p.set('disc', d.join(';'));
    if (w.length) p.set('work', w.join(';'));
    if (s.length) p.set('sen', s.join(';'));
  } catch(e){}
  return p.toString();
}
function currentShareUrl(){ const qs = buildFilterQuery(); return location.origin + '/' + (qs ? ('?'+qs) : ''); }
// Pixel-align the Filters box top with the matrix card (desktop), so it tracks the tabs+strip height

function _dqFallbackCopy(text){ try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }catch(e){} }
function _dqCopy(text, onDone){
  try { if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(onDone, function(){ _dqFallbackCopy(text); onDone(); }); return; } } catch(e){}
  _dqFallbackCopy(text); onDone();
}
function copyShareLink(btn){

  _dqCopy(url, function(){ btn.textContent = '✓ Link copied'; setTimeout(function(){ btn.textContent = label; }, 1600); try{ if(typeof dqToast==="function") dqToast("Filter link copied", null, { icon:"🔗", label:"", ms:2600 }); }catch(e){} });

// Apply filters carried in the URL (?studios=…&cells=…&region=…) so a shared link reopens the same view.
function applyFilterQuery(){
  try {
    const p = new URLSearchParams(location.search);
    const KEYS = ['q','region','age','remote','stale','cells','subs','studios','countries','rquick','hubs','kinds','disc','work','sen'];
    if (!KEYS.some(k => p.has(k))) return false;
    const intoSet = (param, set) => { const v=p.get(param); if(v) v.split(';').forEach(x=>{ if(x) set.add(x); }); };
    const qel=document.getElementById('q'); if (qel && p.get('q')) qel.value = p.get('q');
    const rg=document.getElementById('region'); if (rg && p.get('region')) rg.value = p.get('region');
    const ag=document.getElementById('age'); if (ag && p.get('age')) ag.value = p.get('age');
    if (p.get('remote')==='1') quickRemote = true;
    const hs=document.getElementById('hideStale'); if (hs && p.get('stale')==='1') hs.checked = true;
    intoSet('cells', selCells); intoSet('subs', selSubs); intoSet('studios', selStudios);
    intoSet('countries', selCountries); intoSet('rquick', selRegionsQuick); intoSet('hubs', selHubs);
    const kv=p.get('kinds'); if (kv) kv.split(';').forEach(k=>{ if(k){ selKinds.add(k); const c=document.querySelector('.kindchip[data-k="'+k+'"]'); if(c) c.classList.add('on'); } });
    const intoChk = (param, cls) => { const v=p.get(param); if(v){ const arr=v.split(';'); document.querySelectorAll('.'+cls).forEach(c=>{ if(arr.indexOf(c.value)>=0) c.checked=true; }); } };
    intoChk('disc','f-d'); intoChk('work','f-w'); intoChk('sen','f-s');
    try{ renderSearchGroup("studioFilters","studioSearch",STUDIO_COUNTS,selStudios,STUDIO_LABELS,DIR_STUDIOS); }catch(e){}
    try{ renderSearchGroup("countryFilters","countrySearch",COUNTRY_COUNTS,selCountries,null); }catch(e){}
    return true;
  } catch(e){ return false; }
}
// Remember the matrix-square selection between visits — in a DEDICATED store ("dq-cells") that we
// rewrite on every change (select AND deselect), so an intentional clear is remembered as clear and
// never re-applied. (We can't use dq-lastfilters for this: it deliberately keeps your last *non-empty*
// filter so Hot jobs can seed from it, so it would resurrect a cell you cleared.) Restore only the
// grid cells, only if recent. Restored cells show in the matrix + active-filters bar and clear with
// "Clear all" / "Clear" — so they're always visible and one tap to drop.
function saveCells(){ try { store.set("dq-cells", { cells: [...selCells], ts: Date.now() }); } catch(e){} }
function restoreLastCells(){
  try {
    var s = store.get("dq-cells", null);
    if (!s || !Array.isArray(s.cells) || !s.cells.length) return false;
    if (s.ts && (Date.now() - s.ts) > 30*864e5) return false;   // don't resurrect selections older than 30 days
    s.cells.forEach(function(c){ if (c) selCells.add(c); });
    return selCells.size > 0;
  } catch(e){ return false; }
}
// Remember the COUNTRY filter between visits (dedicated "dq-countries" store, same approach as the grid
// cells). A location preference is stable, so someone who filters to "United States" keeps seeing US
// roles on return without re-selecting. Written on every change (incl. clearing → remembered as cleared,
// so it's never resurrected), restored on load, and shown as a removable chip like any other filter.
function saveCountries(){ try { store.set("dq-countries", { countries: [...selCountries], ts: Date.now() }); } catch(e){} }
function restoreCountries(){
  try {
    var s = store.get("dq-countries", null);
    if (!s || !Array.isArray(s.countries) || !s.countries.length) return false;
    if (s.ts && (Date.now() - s.ts) > 90*864e5) return false;   // keep ~90 days; a geo preference is long-lived
    s.countries.forEach(function(c){ if (c) selCountries.add(c); });
    try{ renderSearchGroup("countryFilters","countrySearch",COUNTRY_COUNTS,selCountries,null); }catch(e){}
    return selCountries.size > 0;
  } catch(e){ return false; }
}
function clearAllFilters(){
  document.getElementById('q').value = '';
  document.getElementById('region').selectedIndex = 0;
  document.getElementById('age').selectedIndex = 0;  document.getElementById('hideStale').checked = false;
  selCells.clear(); selSubs.clear(); selHubs.clear(); selRegionsQuick.clear(); quickRemote = false; quickNew = false;
  selStudios.clear(); selCountries.clear();
  selKinds.clear(); document.querySelectorAll('.kindchip.on').forEach(c => c.classList.remove('on'));
  ['f-d','f-w','f-s'].forEach(cls => document.querySelectorAll('.'+cls+':checked').forEach(c => c.checked = false));
  renderSearchGroup("studioFilters","studioSearch",STUDIO_COUNTS,selStudios,STUDIO_LABELS,DIR_STUDIOS);
  renderSearchGroup("countryFilters","countrySearch",COUNTRY_COUNTS,selCountries,null);
  saveCells();
  saveCountries();   // remember the cleared country filter so it isn't resurrected next visit
  render();
}

// Keep the mobile filter drawer sized to the *visible* area. Without this, iOS keeps 100dvh at full
// height when the keyboard opens, so the bottom-pinned "Show results" button ends up behind the
// keyboard and can't be tapped after typing in a search box. visualViewport.height excludes the
// keyboard, so the drawer shrinks and the button stays reachable just above it.
(function keyboardAwareDrawer(){
  var vv = window.visualViewport;
  if (!vv) return;
  var root = document.documentElement;
  function sync(){ root.style.setProperty("--vvh", vv.height + "px"); }
  vv.addEventListener("resize", sync);
  vv.addEventListener("scroll", sync);
  sync();
})();

function nbData(id){ const d = NOTEBOOKS[id] || {}; return { notes:d.notes||"", dates:d.dates||[], contacts:d.contacts||[], questions:d.questions||[] }; }

function nbToday(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function nbSeedAppliedDate(id){
  var d = NOTEBOOKS[id] || {}; var dates = (d.dates || []).slice();
  if (dates.some(function(x){ return x.l==="Applied" && x.d; })) return false;   // keep an existing date
  var empty = null; for (var i=0;i<dates.length;i++){ if (dates[i].l==="Applied" && !dates[i].d){ empty=dates[i]; break; } }
  if (empty){ empty.d = nbToday(); } else { dates.push({ l:"Applied", d:nbToday(), t:"" }); }
  d.dates = dates; NOTEBOOKS[id] = d; try { store.set("dq-notebooks", NOTEBOOKS); } catch(e){}
  return true;
}
function nbAppliedDate(id){
  var d = NOTEBOOKS[id]; if (!d || !d.dates) return null;
  var ds = d.dates.filter(function(x){ return x.l==="Applied" && x.d; }).map(function(x){ return x.d; }).sort();
  return ds.length ? ds[0] : null;
}
function nbAppliedDays(id){
  var a = nbAppliedDate(id); if (!a) return null;
  var t = new Date(a+"T00:00").getTime(); if (isNaN(t)) return null;
  return Math.max(0, Math.floor((Date.now()-t)/864e5));

function nbSync(id){

// Soonest upcoming dated entry across all notebooks (today or later) — feeds the My Jobs banner.
function nextUpcoming(){
  const now = Date.now(); let best = null;
  // "Applied" / "Offer received" are records of things that already happened, not upcoming steps —
  // never surface them in the "Coming up" banner (only forward-looking dates: interviews, deadlines…).
  const SKIP = { "Applied": 1, "Offer received": 1 };
  for (const id in NOTEBOOKS){
    const j = JOB_BY_ID[id]; if (!j) continue;
    for (const dt of (NOTEBOOKS[id].dates||[])){
      if (!dt.d || SKIP[dt.l]) continue;
      const ts = new Date(dt.d + "T" + (dt.t || "23:59:59")).getTime();   // timed: until that time; date-only: until end of day
      if (!isNaN(ts) && ts >= now && (!best || ts < best.ts)) best = { ts, label: dt.l, hasTime: !!dt.t, studio: j.s, id: id };
    }
  }
  return best;
}
function dqUpdateUpcoming(){
  const el = document.getElementById("mineUpcoming"); if (!el) return;
  const u = nextUpcoming();
  if (!u){ el.innerHTML = ""; return; }
  const dt = new Date(u.ts);
  const when = u.hasTime
    ? dt.toLocaleString(undefined, { weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" })
    : dt.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  el.innerHTML = `<div class="mineupcoming"><span>📅</span><span>Coming up: <b>${nbEsc(u.label||"Next step")} — ${nbEsc(u.studio)}</b></span><span class="when">${nbEsc(when)}</span></div>`;
}

function dqImportFile(input){
  const f = input.files && input.files[0]; if (!f){ return; }
  const r = new FileReader();
  r.onload = function(){
    try {
      const data = JSON.parse(r.result);
      if (!data || typeof data !== "object") throw new Error("bad");
      if (data.appStatus && typeof data.appStatus === "object") Object.assign(appStatus, data.appStatus);
      (data.saved||[]).forEach(x=>saved.add(x));
      (data.dismissed||[]).forEach(x=>dismissed.add(x));
      (data.follows||[]).forEach(x=>FOLLOWS.add(x));
      if (data.notebooks && typeof data.notebooks === "object") Object.assign(NOTEBOOKS, data.notebooks);
      store.set("luj-status", appStatus); store.set("luj-saved", [...saved]);
      store.set("luj-dismissed", [...dismissed]); store.set("dq-follows", [...FOLLOWS]);
      store.set("dq-notebooks", NOTEBOOKS);
      try { window.dqTrack && window.dqTrack("myjobs_import", {}); } catch(e){}
      render(); updateFollowTab(); renderFollowView();
      try { dqToast("Imported your saved data", null, { icon:"✓", label:"", ms:3000 }); } catch(e){}
    } catch(e){ try { dqToast("Couldn’t read that file — is it a DevQuest export?", null, { icon:"⚠️", label:"", ms:3600 }); } catch(_){} }
    input.value = "";
  };
  r.readAsText(f);
}

function matchCity(loc){
  const s = loc.toLowerCase();
  if (s.includes("london") && (s.includes("canada") || s.includes("ontario"))) return ["london (ontario)",42.98,-81.25];
  for (const g of GAZ) if (s.includes(g[0])) return g;
  return null;
}

// Coordinates for an island studio's map pin. Prefer an explicit DIR_GEO entry; else
// auto-derive from the city named in its note (or name) via the gazetteer — so new
// island studios pin themselves as long as their note mentions a known city.
function dirCoords(d){
  // Prefer the studio's own `city` (set on each island/moon entry), resolved via the GAZ table —
  // so the map stays in sync with the roster automatically. Fall back to note/name, then DIR_GEO.
  const m = matchCity(d.city || "") || matchCity(d.note || "") || matchCity(d.name || "");
  if (m) return { lat: m[1], lng: m[2], label: d.city || m[0].replace(/\b\w/g, c=>c.toUpperCase()) };
  const g = DIR_GEO[d.name];
  if (g) return { lat: g[0], lng: g[1], label: g[2] };
  return null;
}

// ---- stats dashboard + data health -------------------------------------------
function tally(list, fn){
  const t = {};
  for (const j of list) { const k = fn(j); if (k) t[k] = (t[k]||0)+1; }
  return Object.entries(t).sort((a,b)=>b[1]-a[1]);
}
// like tally, but fn returns an array (e.g. countries/hubs spanning multiple places);
// each value is counted once per job.
function tallyMulti(list, fn){
  const t = {};
  for (const j of list) for (const k of new Set(fn(j)||[])) if (k) t[k] = (t[k]||0)+1;
  return Object.entries(t).sort((a,b)=>b[1]-a[1]);
}
function barChart(title, entries, limit){
  const top = entries.slice(0, limit || 12);
  const max = Math.max(1, ...top.map(e=>e[1]));
  const VIS = 5;   // show top few; rest behind a one-tap "show all" to keep the page skimmable
  const row = ([k,n]) =>
    `<div class="barrow"><span class="blabel" data-tip="${k}">${k}</span>
     <span class="btrack"><span class="bfill" style="width:${Math.round(100*n/max)}%"></span></span>
     <span class="bnum">${n}</span></div>`;
  const head = top.slice(0, VIS).map(row).join("");
  const rest = top.slice(VIS);
  const more = rest.length
    ? `<div hidden>${rest.map(row).join("")}</div>`
      + `<button type="button" onclick="this.previousElementSibling.hidden=false;this.remove()" style="margin-top:6px;background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:4px 0">Show all ${top.length} ↓</button>`
    : "";
  return `<div class="statcard"><h3>${title}</h3>${head}${more}</div>`;
}
// "Game engines" — engine is one of the most decision-relevant facts for a game dev (many are
// "Unreal devs" or "Unity devs"). We only know an engine when a posting names it, and that's
// mostly in technical roles — so we report coverage honestly, scoped to Engineering roles.
const ENGINE_SET = new Set(["Unreal","Unity","Godot","Frostbite","CryEngine","Source 2","id Tech","REDengine","RE Engine","Decima","Snowdrop","Anvil","Creation Engine","Luminous","Cocos","GameMaker","O3DE","PlayCanvas","Bevy","Stride"]);
function engineCard(list){
  const ent = tallyMulti(list, j => (j.tech||[]).filter(t => ENGINE_SET.has(t)));
  const engRoles = list.filter(j => j.d === "Engineering");
  const named = engRoles.filter(j => (j.tech||[]).some(t => ENGINE_SET.has(t))).length;
  const pct = engRoles.length ? Math.round(100 * named / engRoles.length) : 0;
  const cap = `<div style="font-size:11px;color:var(--muted);margin-top:9px;line-height:1.5">Named in <b style="color:var(--text)">${pct}%</b> of engineering roles shown. Not every posting states its engine, so this reflects roles that do — in-house engines are under-counted.</div>`;
  if (!ent.length) return `<div class="statcard"><h3>Game engines</h3><div style="font-size:12px;color:var(--muted)">No engine named in the roles shown.</div>${cap}</div>`;
  const html = barChart("Game engines", ent, 8);
  return html.slice(0, html.lastIndexOf("</div>")) + cap + "</div>";
}

// Market-pulse headline numbers (whole board, not the filtered view) — shared by the
// front-page strip and the Trends report header. No estimates: every figure is a live role.
function marketPulse(pool){
  pool = pool || JOBS;
  const open = pool.length;
  const studios = new Set(pool.map(j=>j.s)).size;
  const newWk = pool.filter(j=>{ const d=daysListed(j); return d!=null ? d<=7 : (j.ts && hoursAgo(j)<=168); }).length;
  const new72h = pool.filter(j=>{ const d=daysListed(j); return d!=null ? d<=3 : (j.ts && hoursAgo(j)<=72); }).length;
  const byS = {}; for (const j of pool) byS[j.s] = (byS[j.s]||0)+1;
  const top = Object.entries(byS).sort((a,b)=>b[1]-a[1])[0];
  const salPct = open ? Math.round(100 * pool.filter(j=>j.salary).length / open) : 0;
  const remotePct = open ? Math.round(100 * pool.filter(j=>j.w==="Remote").length / open) : 0;
  const ages = pool.filter(j=>j.ts).map(j=>Math.max(0, Math.floor((Date.now()-j.ts)/864e5))).sort((a,b)=>a-b);
  const medianAge = ages.length ? ages[Math.floor(ages.length/2)] : null;
  return { open, studios, newWk, new72h, topStudio: top ? top[0] : "—", topStudioN: top ? top[1] : 0, salPct, remotePct, medianAge };
}

// Personalized pulse bar: the same one-line strip, recomputed over the current filtered slice (LAST_LIST).

// Build a short label for the active filter slice, e.g. "Senior Production · Remote".
function dqSliceLabel(cellsArr, discArr, senArr, region, countriesArr, regionsQuickArr, remote, studiosArr, search){
  const disc = new Set(), sen = new Set();
  (cellsArr||[]).forEach(k=>{ const p=String(k).split("|"); if(p[0])disc.add(p[0]); if(p[1])sen.add(p[1]); });
  (discArr||[]).forEach(x=>x&&disc.add(x)); (senArr||[]).forEach(x=>x&&sen.add(x));
  const senL=[...sen], discL=[...disc], parts=[];
  if (senL.length) parts.push(senL.length<=2 ? senL.join(" / ") : senL.length+" levels");
  if (discL.length) parts.push(discL.length<=2 ? discL.join(" / ") : discL.length+" disciplines");
  let label = parts.join(" ");
  if (!label && studiosArr && studiosArr.length) label = studiosArr.length===1 ? studiosArr[0] : studiosArr.length+" studios";
  if (!label && search) label = '"' + search + '"';
  if (!label) label = "Your search";
  const qual = [];
  if (remote) qual.push("Remote");
  if (region) qual.push(region);
  (regionsQuickArr||[]).forEach(x=>x&&qual.push(x));
  (countriesArr||[]).forEach(x=>x&&qual.push(x));
  if (qual.length) label += " · " + qual.slice(0,2).join(" · ");
  if (label.length > 42) label = label.slice(0,40) + "…";
  return label;
}

function renderStats(){
  const list = LAST_LIST;

  for (const j of list) {

  const yoeAvg = yoeN ? (yoeSum / yoeN).toFixed(1) : null;

       <span class="bnum" style="width:110px">$${r.lo}K–$${r.hi}K</span></div>`).join("")
    : `<div class="hmuted" style="color:var(--muted);font-size:13px">No salary data in the current selection.</div>`) + `</div>`;

bfill{background:linear-gradient(90deg,#e8722e,#ff8a3d)}.herobar.dim{opacity:.42}.herobar.hi .hblabel{color:#ff8a3d;font-weight:800}.herohl{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}.herofilt{font:inherit;font-size:11px;font-weight:700;color:var(--accent);background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.4);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}.herofilt:hover{background:rgba(88,166,255,.22);color:var(--text)}</style>`;
  // When any filter/search narrows the board, say so right on the hero (it drives every Trends

    : "";
  const heroHtml = `<div class="herowrap" id="heroWrap"><div class="herohead"><span class="herohl"><span class="herotitle" id="heroTitle">${heroData[0][0]}</span>${heroFiltBadge}</span>`

  document.getElementById("statsWrap").innerHTML = statStrip + heroCss + heroHtml + segCss + segBar
    + pane("overview", `<div class="statgrid">`

        + barChart("Roles by country", tallyMulti(list, j=>j.countries), 14)

        + hiringCard + remoteCard
        + `</div>`)
    + pane("demand", `<div class="statgrid">`
        + barChart("Roles by seniority", tally(list, j=>j.sen))

    + pane("changed", (mo.head ? `<div class="mhead">` + mo.head + `</div>` : "") + openedLine + `<div class="statgrid">` + mo.cards + `</div>`);
  // pin the sub-tab bar just below the sticky site header
  try { var _hdr = document.querySelector("header"); var _bar = document.querySelector(".viewtabsbar"); var _seg = document.querySelector("#statsWrap .dqseg"); if (_hdr && _seg) _seg.style.top = (_hdr.offsetHeight + (_bar ? _bar.offsetHeight : 0)) + "px"; } catch(e){}

// Trends sub-tabs (segmented control inside the Trends view; selection persists per device).
function dqSubTab(name){

// ---- Trends hero carousel: a rotating focal graph (mirrors the List matrix). Auto-advances with
// controls, pauses on hover/focus, honors reduced-motion, and each bar is click-to-filter. ----
var _heroI = 0, _heroTimer = null, _heroPlaying = true, _heroDur = [];
var _heroReduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches);
function escAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function heroSlide(rows, emptyMsg){
  if (!rows || !rows.length) return '<div class="heroempty">' + (emptyMsg||"No data in this view yet.") + '</div>';
  return rows.map(function(r){
    var act = r.act ? (' data-act="'+r.act.type+'" data-val="'+escAttr(r.act.val)+'" role="button" tabindex="0"') : "";
    var cls = 'herobar'+(r.act?' clickable':'')+(r.hi?' hi':'')+(r.dim?' dim':'');
    return '<div class="'+cls+'"'+act+'>'
      + '<span class="hblabel" data-tip="'+escAttr(r.label)+'">'+r.label+'</span>'
      + '<span class="hbtrack"><span class="hbfill" style="width:'+r.pct+'%"></span></span>'
      + '<span class="hbnum">'+r.barText+'</span></div>';
  }).join("");
}
function heroGo(i){
  var wrap = document.getElementById("heroWrap"); if (!wrap) return;
  var slides = wrap.querySelectorAll(".heroslide"); var n = slides.length; if (!n) return;
  _heroI = ((i % n) + n) % n;
  slides.forEach(function(s){ s.hidden = (+s.getAttribute("data-i") !== _heroI); });
  wrap.querySelectorAll(".herodot").forEach(function(d){ d.classList.toggle("on", +d.getAttribute("data-i") === _heroI); });
  var t = document.getElementById("heroTitle"); if (t && window.__heroTitles) t.textContent = window.__heroTitles[_heroI] || "";
  try { wrap.classList.toggle("foryou", !!window.__heroForYouAll); } catch(e){}
  if (_heroPlaying) heroTimerStart();   // (re)arm with the dwell of the slide we just landed on
}
function heroStep(d){ heroGo(_heroI + d); heroPause(); }
function heroToggle(){ _heroPlaying ? heroPause() : heroPlay(); }
function heroPlay(){ _heroPlaying = true; var b = document.getElementById("heroPlay"); if (b){ b.textContent = "⏸"; b.setAttribute("aria-label","Pause"); } heroTimerStart(); }
function heroPause(){ _heroPlaying = false; var b = document.getElementById("heroPlay"); if (b){ b.textContent = "▶"; b.setAttribute("aria-label","Play"); } heroTimerStop(); }
function heroTimerStop(){ if (_heroTimer){ clearTimeout(_heroTimer); _heroTimer = null; } }
function heroTimerStart(){ heroTimerStop(); if (_heroReduce || !_heroPlaying) return; _heroTimer = setTimeout(function(){ heroGo(_heroI + 1); }, (_heroDur[_heroI] || 6000)); }
function heroFilter(type, value){
  if (!value) return;
  if (type === "studio"){ filterToStudio(value); return; }
  try {
    clearAllFilters();
    if (type === "disc"){ new Set(JOBS.map(function(j){return j.sen;}).filter(Boolean)).forEach(function(s){ selCells.add(value+"|"+s); }); }
    else if (type === "sen"){ new Set(JOBS.map(function(j){return j.d;}).filter(Boolean)).forEach(function(d){ selCells.add(d+"|"+value); }); }
    else if (type === "skill"){ var qel = document.getElementById("q"); if (qel) qel.value = value; }
    else if (type === "cell"){ value.split(";").forEach(function(c){ if (c) selCells.add(c); }); }
    setView("list"); saveCells(); render();
  } catch(e){}
}
function heroInit(){
  var wrap = document.getElementById("heroWrap"); if (!wrap) return;
  wrap.addEventListener("mouseenter", heroTimerStop);
  wrap.addEventListener("mouseleave", function(){ if (_heroPlaying) heroTimerStart(); });
  wrap.addEventListener("focusin", heroTimerStop);
  wrap.addEventListener("focusout", function(){ if (_heroPlaying) heroTimerStart(); });
  wrap.addEventListener("click", function(e){ var b = e.target.closest && e.target.closest(".herobar.clickable"); if (b) heroFilter(b.getAttribute("data-act"), b.getAttribute("data-val")); });
  wrap.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ var b = e.target.closest && e.target.closest(".herobar.clickable"); if (b){ e.preventDefault(); heroFilter(b.getAttribute("data-act"), b.getAttribute("data-val")); } } });
  heroGo(0);
  if (_heroReduce) { heroPause(); } else { _heroPlaying = true; heroTimerStart(); }
}

// ---- "What's moving this week": momentum block, folded into the Trends tab ----
// All derived from trends.json (per-studio + per-discipline daily counts) — momentum, not news.
function buildMomentum(){
  const T = (window.JOBS_DATA && window.JOBS_DATA.trends) || null;
  if (!T || !T.studios || !Object.keys(T.studios).length) return { head: "", cards: "" };
  const enough = (T.span||0) >= 8;
  const sArr = Object.keys(T.studios).map(name => Object.assign({name}, T.studios[name]));
  const sumNow = sArr.reduce((a,s)=>a+(s.now||0),0);
  const sumD7  = sArr.reduce((a,s)=>a+(s.d7!=null?s.d7:s.now),0);
  const netWeek = sumNow - sumD7;
  const studiosUp = sArr.filter(s=>s.d7!=null && s.now>s.d7).length;
  const studiosDown = sArr.filter(s=>s.d7!=null && s.now<s.d7).length;
  let len=0; for (const s of sArr){ if (s.series && s.series.length>len) len=s.series.length; }
  const totalSeries=[]; for (let i=0;i<len;i++){ let sum=0, any=false; for (const s of sArr){ const v=s.series&&s.series[i]; if(v!=null){sum+=v;any=true;} } totalSeries.push(any?sum:null); }
  const klass=(now,base)=>{ const d=now-base, p=base>0?d/base:(now>0?1:0); if(now===0&&base>0)return"dark"; if(p>=0.15&&d>=2)return"up"; if(p<=-0.15&&d<=-2)return"down"; return"flat"; };
  const sRows=sArr.map(s=>{ const base=s.d30!=null?s.d30:(s.d7!=null?s.d7:s.now); return {name:s.name, now:s.now, delta:s.now-base, c:klass(s.now,base), series:s.series}; });
  const up=sRows.filter(r=>r.c==="up").sort((a,b)=>b.delta-a.delta);
  const down=sRows.filter(r=>r.c==="down"||r.c==="dark").sort((a,b)=>a.delta-b.delta);
  // Confidence: how meaningful is the move? major (>=10), moderate (>=4), or small/stable.
  const conf=d=>{const a=Math.abs(d);return a>=10?'<span class="pconf maj" data-tip="Major move">🔥</span>':a>=4?('<span class="pconf mod" data-tip="Moderate move">'+(d>0?'↑':'↓')+'</span>'):'<span class="pconf st" data-tip="Small move">→</span>';};
  const srow=r=>`<div class="pulserow"><span class="plabel" data-tip="${r.name}">${r.name}${r.c==="dark"?' <span class="darktag">board quiet</span>':''}</span><span class="spark">${sparkline(r.series)}</span><span class="pulsenum">${conf(r.delta)}${r.now}<span class="pdelta p-${r.c}">${r.delta>0?'+':''}${r.delta}</span></span></div>`;
  const dArr=T.disc?Object.keys(T.disc).map(name=>Object.assign({name}, T.disc[name])):[];
  const dRows=dArr.map(s=>{ const base=s.d30!=null?s.d30:(s.d7!=null?s.d7:s.now); return {name:s.name, now:s.now, delta:s.now-base, series:s.series}; });
  const hot=dRows.filter(r=>r.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,6);
  const cool=dRows.filter(r=>r.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,6);
  const drow=(r,sgn)=>`<div class="pulserow"><span class="plabel">${r.name}</span><span class="spark">${sparkline(r.series)}</span><span class="pulsenum">${conf(r.delta)}${r.now}<span class="pdelta p-${sgn}">${r.delta>0?'+':''}${r.delta}</span></span></div>`;
  const fresh=enough?sArr.filter(s=>s.d7==null && (s.now||0)>0).sort((a,b)=>b.now-a.now).slice(0,12):[];
  // Skills heating up / cooling — same momentum treatment as disciplines, from trends.json skills
  // (now vs ~30d ago). No per-skill series is banked, so these rows show no sparkline.
  const kArr = T.skills ? Object.keys(T.skills).map(name=>Object.assign({name}, T.skills[name])) : [];
  const kRows = kArr.map(s=>{ const base=s.d30!=null?s.d30:(s.d7!=null?s.d7:s.now); return {name:s.name, now:s.now, delta:s.now-base, series:s.series}; });
  const skHot = kRows.filter(r=>r.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,6);
  const skCool = kRows.filter(r=>r.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,6);
  const card=(t,inner)=>`<div class="statcard"><h3>${t}</h3>${inner}</div>`;
  const tM=(num,label,c)=>`<div class="ptile"><div class="pnum ${c||''}">${num}</div><div class="plabelt">${label}</div></div>`;
  // ----- Discoveries, rankings, emerging skills, and a shareable weekly summary -----
  const surge = up[0], drop = down.find(r=>r.delta<0), skillUp = skHot[0];
  let discInner = "";
  if (surge)   discInner += `<div class="pulserow"><span class="plabel">🔥 Biggest surge</span><span class="pulsenum">${surge.name}<span class="pdelta p-up">+${surge.delta}</span></span></div>`;
  if (drop)    discInner += `<div class="pulserow"><span class="plabel">🔻 Biggest drop</span><span class="pulsenum">${drop.name}<span class="pdelta p-down">${drop.delta}</span></span></div>`;
  if (skillUp) discInner += `<div class="pulserow"><span class="plabel">💡 Skill to watch</span><span class="pulsenum">${skillUp.name}<span class="pdelta p-up">+${skillUp.delta}</span></span></div>`;
  const discCard = (enough && discInner) ? card('✨ Discoveries', discInner) : "";
  // Highest-paid disciplines: current medians from listed salaries (needs a sample to be stable)
  const _dp = {}; for (const j of JOBS){ if (!j.d || !j.salary) continue; const pv = mtxParsePay(j.salary); if (pv){ (_dp[j.d] = _dp[j.d] || []).push(pv); } }
  const payRank = Object.keys(_dp).filter(d=>_dp[d].length>=5).map(d=>({name:d, med:mtxMedian(_dp[d])})).sort((a,b)=>b.med-a.med).slice(0,5);
  const payCard = payRank.length ? card('💰 Highest-paid disciplines', payRank.map((r,i)=>`<div class="pulserow"><span class="plabel">#${i+1} ${r.name}</span><span class="pulsenum">~$${r.med}K</span></div>`).join('')) : "";
  // Emerging skills: on the board now, absent from the ~30-day-ago baseline
  const newSkills = enough ? kArr.filter(s => s.d30==null && (s.now||0)>0).sort((a,b)=>b.now-a.now).slice(0,8) : [];
  const newSkillsCard = card('🌱 New skills appearing', newSkills.length ? newSkills.map(r=>`<div class="pulserow"><span class="plabel">${r.name}</span><span class="pulsenum">${r.now} role${r.now===1?'':'s'}</span></div>`).join('') : '<div class="xhint">Tracked as skills first appear on the board — fills in as history builds.</div>');
  // Shareable weekly summary
  const _sp = [(netWeek>=0?'+':'')+netWeek+' net roles'];
  if (surge)   _sp.push(surge.name+' +'+surge.delta);
  if (skillUp) _sp.push(skillUp.name+' +'+skillUp.delta);
  const shareDisp = _sp.join(' · ');
  const shareText = 'This week in game hiring (devquest.gg): ' + shareDisp;
  const shareEnc = encodeURIComponent(shareText);
  const shareBanner = enough ? `<div class="trshare"><span class="tt">📣 <b>Share this week:</b> ${shareDisp}</span>`
    + `<button class="shbtn" data-t="${escAttr(shareText)}" onclick="try{navigator.clipboard.writeText(this.getAttribute('data-t'));window.dqToast&&dqToast('Copied weekly summary')}catch(e){}">Copy</button>`
    + `<a href="https://twitter.com/intent/tweet?text=${shareEnc}&url=https%3A%2F%2Fdevquest.gg" target="_blank" rel="noopener">Share on X</a>`
    + `<a href="https://www.linkedin.com/sharing/share-offsite/?url=https%3A%2F%2Fdevquest.gg" target="_blank" rel="noopener">LinkedIn</a></div>` : "";
  const tilesRow = enough
    ? `<div class="pulsestats">`
      + tM((netWeek>0?'+':'')+netWeek.toLocaleString(),'net roles vs last week', netWeek>0?'p-up':netWeek<0?'p-down':'p-flat')
      + tM(studiosUp,'studios hiring more')
      + tM(studiosDown,'studios slowing')
      + `<div class="ptile"><div style="height:28px;display:flex;align-items:center;justify-content:center">${sparkline(totalSeries)||'<span style="color:var(--muted);font-size:12px">building</span>'}</div><div class="plabelt">whole-market trend</div></div>`
      + `</div>`
    : "";
  const moverHint='<div class="xhint">No clear movers yet. Fills in as we track studios over the coming days.</div>';
  const discHint='<div class="xhint">Per-discipline history is just starting to bank. Check back in a few days.</div>';
  const head = `<h2 class="pulsehead">What changed this week</h2>`
    + `<div class="dirsub">${enough?'Change vs ~30 days ago, from how many roles each studio lists over time. Momentum, not official layoff news.':'<b>Momentum is still building.</b> The week-over-week totals appear once we have about 8 days of history; the movers below are live as soon as a studio shifts.'}</div>`
    + tilesRow + shareBanner;
  const cards = discCard
    + card('📈 Ramping up', up.length?up.map(srow).join(''):moverHint)
    + card('📉 Pulling back / quiet', down.length?down.map(srow).join(''):moverHint)
    + card('🔥 Disciplines heating up', hot.length?hot.map(r=>drow(r,'up')).join(''):discHint)
    + card('🧊 Disciplines cooling', cool.length?cool.map(r=>drow(r,'down')).join(''):'<div class="xhint">Nothing clearly cooling yet.</div>')
    + payCard
    + card('🔥 Skills heating up', skHot.length?skHot.map(r=>drow(r,'up')).join(''):'<div class="xhint">Skill history is just starting to bank — check back in a few days.</div>')
    + card('🧊 Skills cooling', skCool.length?skCool.map(r=>drow(r,'down')).join(''):'<div class="xhint">Nothing clearly cooling yet.</div>')
    + newSkillsCard
    + card('✨ New studios this week', fresh.length?fresh.map(r=>`<div class="pulserow"><span class="plabel">${r.name}</span><span class="pulsenum">${r.now} role${r.now===1?'':'s'}</span></div>`).join(''):(enough?'<div class="xhint">No studios newly added in the last week.</div>':'<div class="xhint">Starts once we have a full week of history.</div>'));
  return { head, cards };
}

// ---- Pulse: hiring momentum from our own listing history ---------------------
function sparkline(series, W, H){
  const pts = (series||[]).filter(v=>v!=null);
  if (pts.length < 2) return "";
  const w=W||120,h=H||22, max=Math.max(...pts), min=Math.min(...pts), rng=(max-min)||1, step=w/(pts.length-1);
  const d = pts.map((v,i)=>`${i?'L':'M'}${(i*step).toFixed(1)},${(h-2-((v-min)/rng)*(h-4)).toFixed(1)}`).join(" ");
  const up = pts[pts.length-1] >= pts[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${up?'var(--green)':'var(--pink)'}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function renderPulse(){
  const el = document.getElementById("pulseWrap");
  const T = (window.JOBS_DATA && window.JOBS_DATA.trends) || null;
  const hasTrends = !!(T && T.studios && Object.keys(T.studios).length);
  const enough = hasTrends && (T.span || 0) >= 8;
  const tile = (num,label,cls="") => `<div class="ptile"><div class="pnum ${cls}">${num}</div><div class="plabelt">${label}</div></div>`;

  // numbers available right now from current listings (work before any trend history)
  const newThisWeek = JOBS.filter(j=>{ const d=daysListed(j); return d!=null ? d<=7 : (j.ts && hoursAgo(j)<=168); }).length;
  const remoteNow = JOBS.filter(j=>j.w==="Remote").length;
  const studiosTracked = new Set(JOBS.map(j=>j.s)).size; // distinct studios actually listed (sub-studios split out)

  // week-over-week numbers (only once we have history)
  let netTile = "", studiosUpTile = "";
  if (enough) {
    const totals = Object.values(T.studios);
    const netWeek = totals.reduce((a,s)=>a+(s.now||0),0) - totals.reduce((a,s)=>a+(s.d7!=null?s.d7:s.now),0);
    const studiosUp = totals.filter(s=>s.d7!=null && s.now>s.d7).length;
    netTile = tile((netWeek>0?"+":"")+netWeek.toLocaleString(),"net vs last week", netWeek>0?"p-up":netWeek<0?"p-down":"p-flat");
    studiosUpTile = tile(studiosUp,"studios hiring more");
  }
  const summary = `<div class="pulsestats">`
    + tile(JOBS.length.toLocaleString(),"active jobs") + netTile
    + tile(newThisWeek.toLocaleString(),"new this week") + studiosUpTile
    + tile(remoteNow.toLocaleString(),"remote roles") + tile(studiosTracked,"studios tracked")
    + `</div>`;

  const note = `<div class="dirsub">Based on how many open roles we see on each studio's board over time — a signal of momentum, <b>not</b> official layoff news.${enough?' Compares now vs. ~30 days ago.':' <b>Momentum trends are still building</b> — the week-over-week numbers and the lists below fill in as we track studios over the coming days.'}</div>`;

  let body = "";
  if (hasTrends) {
    const rows = Object.entries(T.studios).map(([name,s])=>{
      const base = s.d30!=null ? s.d30 : (s.d7!=null ? s.d7 : s.now);
      const delta = s.now - base;
      const pct = base>0 ? delta/base : (s.now>0?1:0);
      let cls;
      if (s.now===0 && base>0) cls="dark";
      else if (pct>=0.15 && delta>=2) cls="up";
      else if (pct<=-0.15 && delta<=-2) cls="down";
      else cls="flat";
      return { name, now:s.now, delta, cls, series:s.series };
    });
    const up = rows.filter(r=>r.cls==="up").sort((a,b)=>b.delta-a.delta);
    const down = rows.filter(r=>r.cls==="down"||r.cls==="dark").sort((a,b)=>a.delta-b.delta);
    const row = r => `<div class="pulserow">
       <span class="plabel" data-tip="${r.name}">${r.name}${r.cls==="dark"?' <span class="darktag">board quiet</span>':''}</span>
       <span class="spark">${sparkline(r.series)}</span>
       <span class="pulsenum">${r.now}<span class="pdelta p-${r.cls}">${r.delta>0?'+':''}${r.delta}</span></span>
     </div>`;
    const upCard = `<div class="statcard"><h3>📈 Ramping up</h3>${up.length?up.map(row).join(""):'<div class="xhint">No clear risers yet — trends are still building.</div>'}</div>`;
    const downCard = `<div class="statcard"><h3>📉 Pulling back / quiet</h3>${down.length?down.map(row).join(""):'<div class="xhint">No clear decliners right now.</div>'}</div>`;
    body = `<div class="statgrid">${upCard}${downCard}</div>`;
  }
  el.innerHTML = `<h2 class="pulsehead">This week in hiring</h2>${summary}${note}${body}`;
}

// ---- Map intelligence: shared per-city aggregation + leaderboard / dream-move ----
let MAP_MODE = "jobs";   // jobs | studios | afford
// Aggregate the current list into per-city stats (count, studios, disciplines, salary
// median+coverage, fresh, COL) plus remote totals. All from data already on each job.
function mapCityStats(){
  const list = LAST_LIST;
  const cities = {};
  const remote = { count:0, disc:{}, studios:{} };
  let unmapped = 0;
  for (const j of list){
    let placed = false, isRemote = false; const seen = new Set();
    for (const loc of j.locs){
      if (/remote/i.test(loc)){ isRemote = true; continue; }
      const g = matchCity(loc);
      if (g && !seen.has(g[0])){
        seen.add(g[0]);
        const c = cities[g[0]] = cities[g[0]] || { key:g[0], lat:g[1], lng:g[2], name:g[0].replace(/\b\w/g,ch=>ch.toUpperCase()), count:0, studios:{}, disc:{}, paid:0, fresh:0, pays:[] };
        c.count++;
        c.studios[j.s] = (c.studios[j.s]||0) + 1;
        if (j.d) c.disc[j.d] = (c.disc[j.d]||0) + 1;
        if (j.salary){ c.paid++; const pv = mtxParsePay(j.salary); if (pv) c.pays.push(pv); }
        if ((j.fseen || j.ts || 0) >= Date.now() - 7*864e5) c.fresh++;
        placed = true;
      }
    }
    if (isRemote){ remote.count++; if (j.d) remote.disc[j.d] = (remote.disc[j.d]||0)+1; remote.studios[j.s] = (remote.studios[j.s]||0)+1; placed = true; }
    if (!placed) unmapped++;
  }
  const arr = Object.values(cities);
  arr.forEach(c => { c.nStudios = Object.keys(c.studios).length; c.payPct = c.count ? Math.round(100*c.paid/c.count) : 0; c.medPay = mtxMedian(c.pays); c.col = colLookup(c.key); });
  return { cities: arr, remote, unmapped };
}
// Cost of living vs home base: cheaper than home = "better", within ±5% = "sim", pricier = "worse".
function mapAffordClass(cityCol, homeCol){ const d = (cityCol - homeCol) / homeCol; return d <= -0.05 ? "better" : d >= 0.05 ? "worse" : "sim"; }
function mapColDelta(cityCol, homeCol){ return Math.round(100 * (cityCol - homeCol) / homeCol); }
function mapCityPopup(c, homeCol){
  const topDisc = Object.entries(c.disc).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([d,n])=>`${d} (${n})`).join("<br>");
  const pay = c.payPct ? `${c.payPct}% list salary${c.medPay?` · ~$${c.medPay}K median`:""}` : "no salary data yet";
  let colLine = "";
  if (homeCol != null && c.col != null){ const d = mapColDelta(c.col, homeCol); colLine = `<br><span style="color:#8b949e">Cost of living: <b>${d>0?'+':''}${d}%</b> vs home</span>`; }
  return `<b>${c.name}</b> — ${c.count} role${c.count>1?'s':''} · ${c.nStudios} studio${c.nStudios>1?'s':''}<br>`
    + `<span style="color:#8b949e">${topDisc}</span><br>`
    + `<span style="color:#8b949e">${pay}${c.fresh?` · +${c.fresh} new this week`:""}</span>${colLine}<br>`
    + `<a onclick="filterCity('${c.key.replace(/'/g,"\\'")}')">Show these jobs →</a>`;
}

// ---- Leaflet, fetched on first use ------------------------------------------------------------
// Resolves true once L exists, false if the CDN can't be reached. On failure the promise is cleared
// so a later attempt can retry rather than being stuck with a permanently rejected cache.
let _leafletP = null;
function loadLeaflet(){
  if (typeof L !== "undefined") return Promise.resolve(true);
  if (_leafletP) return _leafletP;
  _leafletP = new Promise(function(resolve){
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload  = function(){ resolve(true); };
    s.onerror = function(){ _leafletP = null; resolve(false); };
    document.head.appendChild(s);
  });
  return _leafletP;
}
function renderMap(skipBar){
  if(!skipBar) renderMapCityBar();   // skip when called from live typing so the input keeps focus
  const _stats = mapCityStats();
  renderMapDream();
  renderMapPanel(_stats);
  if (typeof L === "undefined") {
    const host = document.getElementById("map");
    if (!host) return;
    // First open: go and get Leaflet, then re-enter with skipBar so the city bar built above is
    // left alone (rebuilding it would steal focus from the filter input).
    if (!host.dataset.dqLoading) {
      host.dataset.dqLoading = "1";
      host.innerHTML = '<div class="empty">Loading map…</div>';
      loadLeaflet().then(function(ok){
        delete host.dataset.dqLoading;
        if (ok){
          host.innerHTML = "";     // L.map() adds its own panes but won't remove the placeholder
          renderMap(true);
        } else {
          host.innerHTML = '<div class="empty">Map requires an internet connection (loads OpenStreetMap tiles).</div>';
        }
      });
    }
    return;
  }
  if (!map) {
    map = L.map("map", { worldCopyJump: true }).setView([39, -35], 3);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 12,
    }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
  }
  setTimeout(()=>map.invalidateSize(), 50);
  markerLayer.clearLayers();

  const homeCol = colLookup(profGet("loc").v);
  const cityArr = _stats.cities;
  const maxCount = Math.max(1, ...cityArr.map(c=>c.count));
  const maxStud = Math.max(1, ...cityArr.map(c=>c.nStudios));
  for (const c of cityArr) {
    let radius = (MAP_MODE === "studios") ? 6 + 22 * Math.sqrt(c.nStudios / maxStud) : 6 + 22 * Math.sqrt(c.count / maxCount);
    let fill = "#58a6ff";
    if (MAP_MODE === "afford" && homeCol != null && c.col != null) {
      const cls = mapAffordClass(c.col, homeCol);
      fill = cls === "better" ? "#3fb950" : cls === "worse" ? "#e06c5e" : "#d29922";
    }
    L.circleMarker([c.lat, c.lng], {
      radius: radius, color: fill, weight: 1.5, fillColor: fill, fillOpacity: 0.38,
    }).bindPopup(mapCityPopup(c, homeCol)).addTo(markerLayer);
  }
  // island studios: gold pins at each studio's HQ, grouped by city, linking out.
  // Nudged slightly off the blue job-pins so overlapping cities stay clickable.
  const dirCities = {};
  const dq = (document.getElementById("q").value || "").toLowerCase(); // honor the search
  // Both the island directory AND the moon (indie) studios plot as one amber "browse directly" layer.
  for (const d of DIRECTORY.concat(MOON_STUDIOS)) {

    const c0 = dirCoords(d);

    const key = c0.lat + "," + c0.lng;
    (dirCities[key] = dirCities[key] || { lat: c0.lat, lng: c0.lng, label: c0.label, items: [] }).items.push(d);
  }
  let islandShown = 0;
  for (const c of Object.values(dirCities)) {
    islandShown += c.items.length;
    const links = c.items.map(d=>`<a href="${d.url}" target="_blank" rel="noopener">${d.name} ↗</a>`).join("<br>");
    L.circleMarker([c.lat + 0.06, c.lng + 0.06], {
      radius: 5 + Math.min(8, c.items.length * 1.5), color: "#d29922", weight: 1.5,
      fillColor: "#d29922", fillOpacity: 0.45,
    }).bindPopup(
      `<b>${c.label}</b> — ${c.items.length} studio${c.items.length>1?"s":""} to browse directly<br>` +
      `<span style="color:#8b949e">${links}</span>`
    ).addTo(markerLayer);
  }

  document.getElementById("mapNote").innerHTML =
    `<span style="color:#58a6ff">●</span> ${cityArr.length} cities with listed roles · ` +
    `<span style="color:#d29922">●</span> ${islandShown} "browse directly" studios · ` +

// ---- Add to home screen (installable PWA) -------------------------------------------------
// Browsers don't allow a one-click "install" link universally. So: register a tiny service worker
// (makes the site installable + fast), reveal a header "Install app" button when the browser supports
// it, and show a dismissible mobile banner on the 2nd–4th visit (never the first). Android/desktop
// Chrome get the native install dialog; iOS Safari gets a short "Share → Add to Home Screen" how-to
// (Apple blocks programmatic install). Nothing shows once the app is already installed.
(function(){
  var deferredPrompt = null;
  var isStandalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var isMobile = window.matchMedia && matchMedia('(max-width: 760px)').matches;
  var btn = document.getElementById('installBtn');
  function track(ev, d){ try{ window.dqTrack && window.dqTrack(ev, d||{}); }catch(e){} }

  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('/sw.js').catch(function(){}); } catch(e){} }
  if (isStandalone) return;   // already installed → no install UI

  var visits = 0;
  try {
    if (!sessionStorage.getItem('dq-sess')) { sessionStorage.setItem('dq-sess','1'); visits = (store.get('dq-visits',0)||0) + 1; store.set('dq-visits', visits); }
    else visits = store.get('dq-visits',0)||0;
  } catch(e){ visits = 1; }
  function dismissed(){ try { return !!store.get('dq-a2hs-dismissed',0); } catch(e){ return false; } }
  function showBtn(){ if (btn) btn.style.display = ''; }
  function hideBanner(){ var b=document.getElementById('a2hsBanner'); if(b) b.remove(); }

  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; showBtn(); maybeBanner(); });
  window.addEventListener('appinstalled', function(){ deferredPrompt = null; if(btn) btn.style.display='none'; hideBanner(); track('pwa_installed'); });
  if (isIOS) showBtn();

  window.dqInstall = function(){
    track('pwa_install_click', { ios: isIOS });
    if (deferredPrompt) {
      deferredPrompt.prompt();
      if (deferredPrompt.userChoice) deferredPrompt.userChoice.then(function(c){ track('pwa_choice', { outcome:(c&&c.outcome)||'?' }); }).finally(function(){ deferredPrompt=null; if(btn) btn.style.display='none'; hideBanner(); });
      return;
    }
    showHowTo();
  };

  function showHowTo(){
    if (document.getElementById('a2hsModal')) return;
    var share = isIOS ? 'the Share button <b>(the square with an up-arrow)</b>' : 'your browser menu <b>(⋮)</b>';
    var add   = isIOS ? '<b>“Add to Home Screen”</b>' : '<b>“Install app”</b> or <b>“Add to Home screen”</b>';
    var m = document.createElement('div'); m.id='a2hsModal'; m.className='a2-modal';
    m.innerHTML = '<div class="a2-card"><h3>📲 Add DevQuest to your home screen</h3>'
      + '<ol><li>Tap '+share+'.</li><li>Choose '+add+'.</li><li>Tap <b>Add</b> — DevQuest gets its own app icon.</li></ol>'
      + '<button class="a2-close">Got it</button></div>';
    m.addEventListener('click', function(ev){ if (ev.target===m || (ev.target.className||'').indexOf('a2-close')>=0) m.remove(); });
    document.body.appendChild(m);
  }

  function maybeBanner(){
    if (isStandalone || !isMobile || dismissed()) return;
    if (visits < 2 || visits > 4) return;       // 2nd–4th visit only, never the first
    if (!isIOS && !deferredPrompt) return;       // Android: only once actually installable
    if (document.getElementById('a2hsBanner')) return;
    var b = document.createElement('div'); b.id='a2hsBanner';
    b.innerHTML = '<img class="a2-ico" src="/icon-192.png" alt=""><div class="a2-txt"><b>Add DevQuest to your home screen</b><br>One tap to your jobs, like an app.</div>'
      + '<button class="a2-add">Add</button><button class="a2-x" aria-label="Dismiss">✕</button>';
    b.querySelector('.a2-add').addEventListener('click', function(){ track('a2hs_banner_add'); window.dqInstall(); });
    b.querySelector('.a2-x').addEventListener('click', function(){ try{store.set('dq-a2hs-dismissed',1);}catch(e){} track('a2hs_banner_dismiss'); hideBanner(); });
    document.body.appendChild(b);
    track('a2hs_banner_shown', { v: visits, ios: isIOS });
  }
  if (isIOS) maybeBanner();   // iOS has no beforeinstallprompt; Android triggers it from the event
})();

<!-- Cloudflare Web Analytics removed: a third-party analytics beacon on every page

<!-- Turnstile used to load here on every page view, though only the two signup forms ever use it.
     Worse than the wasted bytes: if it failed to load, nothing said so. window.turnstile stayed
     undefined, no widget rendered, getResponse() returned "", and the submit handler answered
     "finishing a quick security check, tap again" — forever, with no way through. It is now fetched
     when a form actually opens, and a failure to load is reported as a failure. -->
<script>
(function(){
  "use strict";
  var ALERTS_API = "https://devquest-alerts.balesdestin.workers.dev";   // see ALERTS_BASE note above
  // Spam guard. Paste the Turnstile SITE key here to turn it on (public key, safe in client code).
  // Leave "" to keep the signup working with no challenge until you're ready.
  var TURNSTILE_SITEKEY = "0x4AAAAAADgYBtcO1AW8_rq_";
  var _tsWidget = null;
  var _tsFailed = false;        // the script itself would not load — distinct from "not solved yet"

  // Resolves true once window.turnstile exists, false if the script can't be fetched.
  var _tsP = null;
  function loadTurnstile(){
    if (!TURNSTILE_SITEKEY) return Promise.resolve(false);
    if (window.turnstile) return Promise.resolve(true);
    if (_tsP) return _tsP;
    _tsP = new Promise(function(resolve){
      var s = document.createElement("script");
      s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
      s.async = true; s.defer = true;
      s.onload = function(){
        // The script sets window.turnstile asynchronously, so poll briefly rather than assume.
        var tries = 0;
        (function wait(){
          if (window.turnstile) return resolve(true);
          if (++tries > 40) { _tsFailed = true; return resolve(false); }   // ~4s
          setTimeout(wait, 100);
        })();
      };
      s.onerror = function(){ _tsFailed = true; _tsP = null; resolve(false); };
      document.head.appendChild(s);
    });
    return _tsP;
  }
  // Shared by both forms: render the widget into `boxId`, or explain why there isn't one.
  // `onWidget` receives the widget id so the caller can read getResponse(widget) on submit.
  function mountTurnstile(boxId, msgId, onWidget){
    if (!TURNSTILE_SITEKEY) return;
    loadTurnstile().then(function(ok){
      var msg = document.getElementById(msgId);
      if (!ok){
        if (msg){
          msg.textContent = "Couldn't load the security check — an ad blocker, privacy extension or network filter may be blocking it.";
          msg.style.color = "#f778ba";
        }
        return;
      }
      if (!document.getElementById(boxId)) return;    // form was closed while we were fetching
      try {
        onWidget(window.turnstile.render("#" + boxId, {
          sitekey: TURNSTILE_SITEKEY, theme: "dark", appearance: "interaction-only",
          retry: "auto", "retry-interval": 3000, "refresh-expired": "auto",
          "error-callback": function(){
            var m = document.getElementById(msgId);
            if (m){ m.textContent = "Verification hiccup — it'll retry automatically. Give it a moment, then try again."; m.style.color = "#8b949e"; }
            return true;
          }
        }));
      } catch(e){ _tsFailed = true; }
    });
  }

  // Watchlist email bridge: a weekly job alert pre-filled with the visitor's followed studios.
  window.dqStudioAlertForm = function(cid, studios){
    var el = document.getElementById(cid); if(!el) return;
    studios = studios || [];
    if (!studios.length){ el.innerHTML = '<div style="font-size:13px;color:var(--muted)">Follow at least one studio first.</div>'; return; }
    var label = studios.length===1 ? studios[0] : (studios.length+" followed studios");
    var names = studios.map(function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }).join(", ");
    el.innerHTML = '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">🔔 <b style="color:var(--text)">Weekly job alert</b> — new roles at: <b style="color:var(--text)">'+names+'</b></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
      + '<input id="wlEmail" type="email" placeholder="you@email.com" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)">'
      + '<button id="wlBtn" style="background:var(--accent);color:#0d1117;border:0;border-radius:6px;padding:8px 16px;font-weight:700;cursor:pointer">Create alert</button></div>'
      + '<label style="font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-top:6px"><input id="wlConsent" type="checkbox" style="margin-top:2px">I agree to receive a weekly job-alert email. Unsubscribe anytime; no spam.</label>'
      + (TURNSTILE_SITEKEY ? '<div id="wlTurnstile" style="margin-top:8px"></div>' : '')
      + '<div id="wlMsg" style="font-size:13px;min-height:16px;margin-top:6px;color:var(--muted)"></div>'
      + '<div style="display:flex;align-items:center;gap:8px;margin:10px 0 8px"><div style="flex:1;height:1px;background:var(--border)"></div><span style="font-size:11px;color:var(--muted)">or</span><div style="flex:1;height:1px;background:var(--border)"></div></div>'
      + '<button type="button" id="wlDiscord" style="background:#5865F2;color:#fff;border:0;border-radius:6px;padding:8px 16px;font-weight:700;cursor:pointer;width:100%">Get these as a Discord DM</button>'
      + '<div style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:5px">Real time instead of weekly. No email address needed.</div>';
    var _wd = document.getElementById("wlDiscord");
    if (_wd) _wd.onclick = function(){
      try{ track("alert_signup", { src:"following_discord", ch:"discord", n:studios.length }); }catch(e){}
      location.href = ALERTS_API+"/discord/start?criteria="+encodeURIComponent(JSON.stringify({ studios: studios, src: "watchlist" }))+"&label="+encodeURIComponent(label);
    };
    var wts = null;
    mountTurnstile("wlTurnstile", "wlMsg", function(id){ wts = id; });
    var btn = document.getElementById("wlBtn");
    if (btn) btn.onclick = function(){
      var email = (document.getElementById("wlEmail").value || "").trim();
      var msg = document.getElementById("wlMsg");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent = "Enter a valid email."; msg.style.color = "#f778ba"; return; }
      var consentEl = document.getElementById("wlConsent");
      if (consentEl && !consentEl.checked){ msg.textContent = "Please tick the consent box."; msg.style.color = "#f778ba"; return; }
      var tok = "";
      if (TURNSTILE_SITEKEY){
        try { tok = window.turnstile ? window.turnstile.getResponse(wts) : ""; } catch(e){}
        // "Tap again" is only honest advice when the check exists and simply hasn't finished. If the
        // script never loaded, tapping again will never work, so say what's actually wrong.
        if (!tok && (_tsFailed || !window.turnstile)){
          msg.textContent = "Couldn't load the security check — an ad blocker, privacy extension or network filter may be blocking it.";
          msg.style.color = "#f778ba"; return;
        }
        if (!tok){ msg.textContent = "Just a sec — finishing a quick security check. Tap again."; msg.style.color = "#f778ba"; return; }
      }
      msg.textContent = "Sending…"; msg.style.color = "var(--muted)";
      try { track("alert_signup", { src: "following", n: studios.length }); } catch(e){}
      fetch(ALERTS_API + "/subscribe", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ email: email, criteria: { studios: studios, src: "watchlist" }, label: label, token: tok }) })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok:r.ok, j:j }; }); })
        .then(function(res){ if (res.ok && res.j && res.j.ok){ el.innerHTML = '<div style="color:var(--accent);font-size:14px">✓ Almost there — check your inbox and confirm to start your weekly job alert.</div>'; } else { msg.textContent = "That didn’t go through. Please try again."; msg.style.color = "#f778ba"; } })
        .catch(function(){ msg.textContent = "Network hiccup. Please try again."; msg.style.color = "#f778ba"; });
    };
  };

  function track(name, props){
    try{ if (localStorage.getItem("dq-nostat")==="1") return; }catch(e){}   // owner self-exclude (see /?dqstat=off)
    try{
      var payload = JSON.stringify({ name:name, props:props||{} });
      if (navigator.sendBeacon) navigator.sendBeacon(ALERTS_API+"/event", payload);
      else fetch(ALERTS_API+"/event", {method:"POST", headers:{"Content-Type":"application/json"}, body:payload, keepalive:true});
    }catch(e){}
  }
  window.dqTrack = track;

  // ---- Alert ids this browser owns. The id IS the manage token, so keeping it locally is
  // what lets "Manage my alerts" work without making anyone dig up an old email or DM.
  function dqAlertIds(){ try { return store.get("dq-alert-ids", []) || []; } catch(e){ return []; } }
  window.dqManageUrl = function(){
    var a = dqAlertIds();
    return a.length ? ALERTS_API + "/manage?token=" + encodeURIComponent(a[a.length-1]) : "";
  };
  window.dqManageBtn = function(){
    var u = window.dqManageUrl();
    return u ? ' <a class="wlbtn" href="'+u+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">\u2699 Manage my alerts</a>' : '';
  };

  // Returning from the Discord handshake. Store the id, then STRIP IT FROM THE URL: it is a
  // bearer token, and a token sitting in the address bar gets pasted into chats where a link
  // crawler will follow it. (That exact class of bug unsubscribed a live user in 902ms.)
  try {
    var _dq = new URLSearchParams(location.search);
    var _da = _dq.get("dqalert");
    if (_da){
      var _ids = dqAlertIds();
      if (_ids.indexOf(_da) === -1) _ids.push(_da);
      try { store.set("dq-alert-ids", _ids); } catch(e){}
      try { store.set("luj-subscribed", 1); } catch(e){}
      try { store.set("dq-follow-alert-done", 1); } catch(e){}   // don't re-offer after they've converted
      var _blocked = _dq.get("dm") === "blocked";
      _dq.delete("dqalert"); _dq.delete("dm"); _dq.delete("dj");
      var _qs = _dq.toString();
      try { history.replaceState(null, "", location.pathname + (_qs ? "?"+_qs : "") + location.hash); } catch(e){}
      try { store.set("dq-pending-discord", null); } catch(e){}   // completed — nothing to recover
      track("alert_confirmed", { ch: "discord", blocked: _blocked ? 1 : 0 });
      setTimeout(function(){
        try {
          if (typeof dqToast !== "function") return;
          if (_blocked) dqToast("Linked \u2014 but Discord is blocking my DMs. Open Discord Settings \u203a Content & Social and allow DMs from server members.");
          else dqToast("Discord alerts are on \u2014 check your DMs.", null, { label:"Manage", icon:"\u2699", fn:function(){ var u=window.dqManageUrl(); if(u) window.open(u,"_blank","noopener"); } });
        } catch(e){}
      }, 700);
    } else {
      // Back on the board with no alert id: they started the Discord handoff and did not
      // finish it. Offer one retry from the stashed search — on a Discord-only signup there
      // is no email address on file, so this is the only way back.
      try {
        var _pend = store.get("dq-pending-discord", null);
        if (_pend && _pend.ts && (Date.now() - _pend.ts) < 30*60*1000){
          store.set("dq-pending-discord", null);   // offer once, never nag
          setTimeout(function(){
            try {
              if (typeof dqToast !== "function") return;
              track("discord_retry_shown", {});
              dqToast("Didn't finish connecting Discord?", null, { label:"Try again", icon:"\uD83D\uDCAC", ms: 9000, fn:function(){
                try{ track("discord_retry_click", {}); }catch(e){}
                location.href = ALERTS_API+"/discord/start?criteria="+encodeURIComponent(JSON.stringify(_pend.c))+"&label="+encodeURIComponent(_pend.label||"");
              }});
            } catch(e){}
          }, 1200);
        }
      } catch(e){}
    }
  } catch(e){}
  // Owner self-exclude: visit /?dqstat=off on each of your own browsers to keep your visits out of
  // analytics (stored per-browser; no events are sent). /?dqstat=on re-enables. Identity-based, so it
  // never affects a real visitor who happens to live in your city.
  try {
    var _dqs = new URLSearchParams(location.search).get("dqstat");
    if (_dqs === "off"){ localStorage.setItem("dq-nostat","1"); alert("DevQuest: this browser is now EXCLUDED from your analytics."); }
    else if (_dqs === "on"){ localStorage.removeItem("dq-nostat"); alert("DevQuest: this browser is now INCLUDED in your analytics."); }
  } catch(e){}
  // let the after-apply nudge (top-level) open the same alert form, pre-set to a discipline.
  window.dqAlertForm = function(label, c, src){ try{ openForm(label, c||{}, src||"apply"); }catch(e){} };
  // one-time visitor-source capture: referrer host + any UTM tags on the URL (cookieless).
  try {
    var _host = location.hostname.replace(/^www\./,"");
    var _ref = "(direct)";
    if (document.referrer) { try { var _rh = new URL(document.referrer).hostname.replace(/^www\./,""); _ref = (_rh===_host) ? "(internal)" : _rh; } catch(e){ _ref = "(unknown)"; } }
    var _p = new URLSearchParams(location.search);
    track("landing", { ref:_ref, src:(_p.get("utm_source")||"").slice(0,40), medium:(_p.get("utm_medium")||"").slice(0,40), campaign:(_p.get("utm_campaign")||"").slice(0,60) });
  } catch(e){}
  track("view", { tab:"list" });

  // wrap job-status + dismiss if present
  try{ if(typeof window.setStatus==="function"){ var _ss=window.setStatus; window.setStatus=function(id,v){ try{ if(v) track("track_job",{status:v}); }catch(e){} return _ss.apply(this,arguments); }; } }catch(e){}
  try{ if(typeof window.toggleDismiss==="function"){ var _td=window.toggleDismiss; window.toggleDismiss=function(id){ try{ track("dismiss_job",{}); }catch(e){} return _td.apply(this,arguments); }; } }catch(e){}

  // search (debounced)
  var _q = document.getElementById("q");
  if(_q){ var _qt; _q.addEventListener("input", function(){ clearTimeout(_qt); _qt=setTimeout(function(){ var _v=_q.value.trim(); if(_v){ var _n=(typeof window.__dqCount==="number"?window.__dqCount:null); track("search",{ q:_v.toLowerCase().slice(0,40), len:_v.length, n:_n, zero:_n===0 }); } },1500); }); }

  // delegated click tracking
  document.addEventListener("click", function(e){
    try{
      var t = e.target;
      var tabBtn = t.closest && t.closest(".viewtabs button");
      // Was keyed on the button's VISIBLE TEXT, so every label edit silently forked the metric into
      // a new bucket ("Hiring Trends" -> hiringtrends, an older "Trends" -> trends, and so on) and
