<!-- Leaflet used to load here on every page view: ~150KB of JS+CSS, a render-blocking <script>, plus
     a preconnect and dns-prefetch that opened a TCP+TLS connection to unpkg before the page even
     drew. The Map is 2.6% of views, so 97.4% of visitors paid all of that for a feature they never
     opened. It is now fetched by loadLeaflet() the first time renderMap actually needs it — see
     renderMap, which already knew how to cope with L being absent. Nothing here on load. -->
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --pink: #f778ba;
    --gold: #d29922; --purple: #a371f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: #30363d transparent; }
  /* ==== Document outline ======================================================================
     The List view had ZERO headings — h1 through h6, not one. Google reads heading structure as a
     primary signal of what a page is about, and screen readers use it as the only way to navigate a
     page without scrolling through all 5,297 nodes linearly. Real heading elements are used below,
     with .hx neutralising the two UA defaults the `*` reset above doesn't already cover, so the
     markup gains semantics and the page does not move by a pixel. Declared here, before every rule
     that styles these classes, so those rules still win. */
  .hx { font-size: inherit; font-weight: inherit; }
  /* Visually hidden but still read by screen readers and indexed — deliberately NOT display:none,
     which would remove it from both. Used for the h1: the visible tagline it would otherwise sit on
     is display:none below 1000px, and Google indexes mobile-first, so an h1 there would be invisible
     to exactly the crawler that matters. */
  .vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #58a6ff; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Was a 6px gradient rule echoing the portfolio pages. Those aren't shipped, so it was paying
     rent for a consistency nobody can see yet. Restore by setting height back to 6px. */
  /* Foot-of-page home for the header's meta buttons on phones (see metaFooterSync). Hidden and
     empty on desktop, where those buttons stay in the header. */
  /* NB: this sits inside .layout, which is a CSS GRID. Without min-width:0 the footer's
     min-content (four buttons on one line) becomes the grid track's minimum, which widened the
     single mobile column to 489px and pushed the whole page sideways. grid-column keeps it
     spanning the full width rather than landing in an implicit column. */
  #metaFooter { display: none; min-width: 0; grid-column: 1 / -1; }
  #metaFooter.on { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; min-width: 0;
                   padding: 18px 14px calc(22px + env(safe-area-inset-bottom, 0px));
                   margin-top: 22px; border-top: 1px solid var(--border); }
  /* .headeractions keeps the header's own non-wrapping flex rules when it is moved down here, so
     its four buttons sat on one 461px line and pushed the page sideways. Let it wrap. */
  #metaFooter.on .headeractions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
                                  gap: 8px; min-width: 0; max-width: 100%; }
  #metaFooter.on .btxt { display: inline; }        /* room down here for real labels on every button */
  /* .btxt already carries the emoji for some of these buttons ("✨ What's new", "💬 Feedback"),
     so showing the icon span too printed it twice. Labels only down here, same as desktop. */
  #metaFooter.on .bico-m { display: none; }
  #metaFooter.on .wnbtn, #metaFooter.on .aboutbtn, #metaFooter.on .catbtn, #metaFooter.on .feedbackbtn {
    padding: 8px 12px !important; font-size: 13px !important; }
  .dqbar { height: 0; background: linear-gradient(90deg, var(--gold), var(--purple) 55%, var(--accent)); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
  .logohome { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; cursor: pointer; transition: opacity .15s; }
  .logohome:hover { opacity: .85; }
  .logo .wordmark span { color: var(--accent); }
  .logo .wordmark .logo-tld { color: var(--gold); }
  .logo svg { display: block; flex-shrink: 0; }
  /* Tagline lives in the header's empty middle (replaces the old centered hero band). */
  .herotag { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; letter-spacing: -0.2px; }
  .herotag em { color: var(--pink); font-style: normal; }
  @media (max-width: 1000px) { .herotag { display: none; } }
  .pulse { font-size: 12px; color: var(--muted); }
  .pulse b { color: var(--green); }
  .hero { text-align: center; padding: 8px 20px 6px; }
  .hero .herobrand { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1; margin-bottom: 4px; }
  .hero .herobrand .hbword span { color: var(--accent); }
  .hero .herobrand .logo-tld { color: var(--gold); }
  .hero .hmark { width: 30px; height: 30px; flex-shrink: 0; }
  .hero h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .hero h1 em { color: var(--pink); font-style: normal; }
  .hero p { color: var(--muted); max-width: 620px; margin: 0 auto; }
  /* Centered content with a fixed sidebar slot on the left and a matching right gutter, so the content
     stays anchored in the SAME centered position on every tab. Hiding the sidebar (below) leaves its
     column reserved, so switching tabs never shifts the content. main is pinned to column 2 so it
     stays centered even when the sidebar is gone. */
  .layout { display: grid; grid-template-columns: 270px minmax(0, 920px) 270px; justify-content: center; gap: 24px; max-width: 1520px; margin: 0 auto; padding: 14px 24px 60px; }
  .layout > #sidebar { grid-column: 1; }
  .layout > main { grid-column: 2; min-width: 0; }
  /* Tabs that don't use the sidebar facets (For You, My Jobs, Hiring Trends) hide it; the column stays
     reserved so the centered content doesn't move. */
  .layout.nofilters #sidebar, .layout.nofilters #filterToggle { display: none; }
  /* CLS fix: reserve space for JS-rendered content so the layout does not jump as data loads */
  #heroSub { min-height: 3.5em; }
  #matrixWrap { min-height: 410px; }
  #jobs { min-height: 50vh; }
  /* mobile-only controls — hidden on desktop so the PC layout is unchanged */
  #filterToggle, #filterClose, #filterBackdrop, .swipehint { display: none; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; gap: 14px; padding: 14px 12px 48px; }
    .layout > main, .layout > #sidebar { grid-column: auto; }   /* reset desktop column pinning for the single-column phone layout */
    /* filters become an off-canvas drawer; content (matrix + jobs) comes first */
    #sidebar { position: fixed; top: 0; left: 0; width: 86%; max-width: 330px; z-index: 60;
      /* height tracks the *visual* viewport (see --vvh JS) so the on-screen keyboard shrinks the
         drawer instead of pushing the sticky "Show results" button behind the keyboard. */
      border-radius: 0; height: 100vh; height: 100dvh; height: var(--vvh, 100dvh); max-height: none; overflow-y: auto;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 40px;
      transform: translateX(-100%); transition: transform .25s ease; }
    #sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,.6); }
    body.filters-open { overflow: hidden; }
    #filterClose { display: block; position: absolute; top: 10px; right: 12px; background: none; border: none;
      color: var(--muted); font-size: 20px; cursor: pointer; }
    #filterBackdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 55; }
    #filterToggle { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #0d1117;
      border: none; font-weight: 700; font-size: 14px; padding: 9px 16px; border-radius: 10px; cursor: pointer; margin-bottom: 12px; }
    .hero { padding: 10px 16px 8px; }
    .hero .herobrand { font-size: 26px; gap: 8px; }
    .hero .hmark { width: 26px; height: 26px; }
    .hero h1 { font-size: 15px; }
    header { padding: 12px 14px; flex-wrap: wrap; row-gap: 10px; }
    /* compact icon buttons sit top-right next to the logo (fills the dead space there);
       they wrap to their own row only if they genuinely don't fit */
    header .headeractions { flex-wrap: wrap; justify-content: flex-end; }
    /* show the "Who do I know?" label on touch (no hover to reveal it) */
    .knowtext { display: inline; }
    .row:not(:hover) .knowbtn { color: var(--accent); border-color: rgba(88,166,255,.5); background: rgba(88,166,255,.08); }
    .knowbtn { margin-left: 0; }
    .swipehint { display: inline; }
  }
  @media (max-width: 480px) {
    .hero .herobrand { font-size: 23px; gap: 7px; }
    .hero .hmark { width: 23px; height: 23px; }
    .hero h1 { font-size: 14px; }
    .row { padding: 11px 12px; }
    .rtop { gap: 6px; }
    .status-sel { font-size: 11px; }
    .blabel { width: 110px; }
  }
  /* Mobile-declutter helpers (desktop defaults: mini chip + icon-only glyphs hidden) */
  .bico-m, .pulse-mini { display: none; }
  .livedot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); vertical-align: middle; }
  @media (max-width: 560px) {
    /* ===== First-time mobile declutter: surface the job list sooner. Desktop is untouched. =====
       1) sync line -> a short "live" chip; 2) secondary header buttons -> compact icons;
       3) the 5-metric stat strip and the quick-filter row are dropped (region/remote live in
       the Filters drawer), with the two useful numbers folded into the count line by JS. */
    .pulse-full { display: none; }
    .pulse-mini { display: inline-flex; align-items: center; gap: 5px; }
    .bico-m { display: inline; }
    .wnbtn .btxt, .aboutbtn .btxt, .feedbackbtn .btxt { display: none; }
    /* Categories keeps its label on mobile. Install / What's new / Feedback are guessable from
       their glyphs and are meta actions; "🗂" alone communicates nothing, and this is the entry
       point to ~340 category and studio pages — both the browse affordance and the only internal
       link into that SEO cluster. It fits: four icons + one short label sits inside 390px. */
    .catbtn .btxt { display: inline; font-size: 13px; }
    .catbtn .bico-m { margin-right: 5px; }
    header .catbtn { padding: 6px 11px !important; font-size: 13px !important; }
    header .headeractions { gap: 8px !important; justify-content: flex-end; }
    header .wnbtn, header .aboutbtn, header .catbtn, header .feedbackbtn { padding: 6px 10px !important; font-size: 15px !important; }
    #pulseStrip, #quickbar { display: none !important; }
    /* job cards: title takes its own line, then meta + action icons wrap to a second line so
       nothing (notebook / ✓💬⊘ status / hide) falls off the right edge on phones */
    .rtop { flex-wrap: wrap; }
    .rmain { flex-basis: 100%; min-width: 0; }
    /* ===== Mobile-only card slimming. Desktop keeps every control; it has the width. =====
       Ranked by this board's own usage, so what goes is what nobody reaches for:
         dismissed 1,999 · tracked 726 · followed 333 · "who do I know?" 314 · SAVED 268
       Save is both the least-used control and the one whose job Track already does, so it's the one
       that goes. The ✕ stays: dismissing is the second-most-used action on the whole site, and it
       was only ever orphaned onto its own line because the row was over-full. */
    .row .save { display: none; }
    /* The little vertical rule between Track and ✕ is decoration that was costing real width,
       and it was enough to bounce the ✕ onto a line of its own with nothing beside it. */
    .row .actsep { display: none; }
    /* And drop the seniority chip when the list is already filtered to a level — on a filtered
       board every single card was repeating the same word back at you. */
    body.senfiltered .row .tag.tsen { display: none; }
    /* "🤝 Who do I know?" carries margin-left:auto, so on a narrow card it wraps to a line of its
       own and claims that line in EVERY card — a whole row of vertical space per job, paid on every
       scroll. At 314 clicks it is real but minor use, and it opens LinkedIn search, which is a
       desk task anyway. Desktop keeps it exactly as-is.
       !important is load-bearing: the base `.tag.knowbtn { display: inline-flex }` is the same
       specificity (0,2,0) and sits ~100 lines LATER in this file, so it would quietly win. Same trap
       that silently swallowed the .mtx-lensbar rule earlier. */
    .row .tag.knowbtn { display: none !important; }
  }
  aside { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; height: fit-content; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
  /* Drop the Filters box so its top lines up with the "Where are the jobs" card (below the tabs +
     stat strip). Leaves room above it for the welcome-back sprite card to slide out. Desktop only —
     on mobile the sidebar is an off-canvas drawer. */
  @media (min-width: 821px) { #sidebar { margin-top: 104px; } }
  aside h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 16px 0 8px; }
  aside h3:first-child { margin-top: 0; }
  input[type=text], select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 14px; }
  .chk { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; cursor: pointer; }
  .chk input { accent-color: var(--accent); }
  .flabel { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
  .filtersearch { margin-bottom: 6px; }
  .filterscroll { max-height: 220px; overflow-y: auto; padding-right: 4px; }
  .filterscroll .chk { padding: 3px 0; }
  .filterscroll .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filterscroll .fcount { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .filterscroll a.dirrow { text-decoration: none; color: var(--text); }
  .filterscroll a.dirrow:hover .fname { color: var(--accent); }
  .filterscroll a.dirrow .fcount { color: var(--accent); }
  /* modernized sidebar: header, pinned fields, collapsible accordions, chips, toggle switches */
  .sbhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sbttl { font-size: 15px; font-weight: 600; color: var(--text); }
  .sbclear { background: none; border: 0; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0; }
  .fpin { margin-bottom: 12px; }
  .acc { border-top: 1px solid var(--border); }
  .acch { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 12px 0; cursor: pointer; color: inherit; text-align: left; }
  .acch .t { flex: 1; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .acch .bdg { font-size: 11px; font-weight: 700; color: #0d1117; background: var(--accent); border-radius: 999px; padding: 0 7px; line-height: 17px; min-width: 8px; text-align: center; }
  .acch .bdg:empty { display: none; }
  .acch .chev { color: var(--muted); font-size: 11px; transition: transform .15s; }
  .acc.open .acch .chev { transform: rotate(90deg); }
  .accb { display: none; padding: 0 0 12px; }
  .acc.open .accb { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .kindchip { font-size: 12.5px; border: 1px solid var(--border); color: var(--muted); background: var(--bg); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .kindchip.on { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,.12); }
  .tgl { gap: 9px; }
  .tgl input { position: absolute; opacity: 0; width: 0; height: 0; }
  .tgl .sw { width: 34px; height: 19px; border-radius: 999px; background: var(--border); position: relative; flex: none; transition: background .15s; }
  .tgl .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--muted); transition: all .15s; }
  .tgl input:checked + .sw { background: var(--accent); }
  .tgl input:checked + .sw::after { left: 17px; background: #fff; }
  /* iOS Safari auto-zooms into any focused input whose font-size is < 16px. That zoom was throwing off
     the filter drawer layout and shoving the sticky "Show results" button off-screen when you typed in
     a search field. Forcing >=16px on the drawer/keyword inputs on mobile disables the auto-zoom. */
  @media (max-width: 820px) { #q, .filtersearch, #sidebar input[type=text], #sidebar select { font-size: 16px; } }
  #filterApply { display: none; }
  @media (max-width: 820px) { #filterApply { display: block; position: sticky; bottom: 0; width: 100%; margin-top: 14px; background: var(--accent); color: #0d1117; border: 0; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; } }
  .count { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .group { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .group-header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; font-weight: 700; user-select: none; }
  .group-header:hover { background: rgba(88,166,255,.06); }
  .arrow { display: inline-block; transition: transform .15s; color: var(--muted); }
  .arrow.open { transform: rotate(90deg); }
  /* Brought into the job-list chip system: it is a label, not a control, so it takes the same
     borderless 13%-alpha fill at 6px as every chip on the cards below it. The pressable things in
     this area (.qchip, .trackchip) deliberately keep their borders — a border is a real affordance
     signal for "you can click this", and there is no reason to spend it on a number. */
  .gcount { background: rgba(139,148,158,.13); border: 0; border-radius: 6px; padding: 1px 10px; font-size: 12px; color: var(--muted); }
  .row { display: flex; flex-direction: column; gap: 7px; padding: 10px 16px; border-top: 1px solid var(--border); cursor: pointer; }
  .rtop { display: flex; align-items: center; gap: 10px; }
  .row:nth-child(odd) { background: rgba(13,17,23,.45); }
  .row:hover { background: rgba(88,166,255,.06); }
  .row.stale { opacity: .5; }
  .row.st-applied { border-left: 3px solid var(--accent); }
  .row.st-interviewing { border-left: 3px solid var(--green); }
  .row.st-rejected { border-left: 3px solid var(--pink); opacity: .55; }
  .row.st-offer { border-left: 3px solid var(--green); }
  .rmain { flex: 1; min-width: 200px; }
  .rmain .title { font-weight: 800; font-size: 16px; color: var(--text); }
  /* The title is a real anchor now, so it has to be told not to look like one. Underline on hover
     only, which also gives the card a bit of affordance it didn't have before. */
  .rmain a.title { text-decoration: none; color: var(--text); }
  .rmain a.title:hover, .rmain a.title:focus-visible { text-decoration: underline; }
  .rmain .studio { color: var(--accent); font-size: 13px; font-weight: 400; margin-left: 8px; }
  .nfy { position: relative; overflow: hidden; background: linear-gradient(100deg, #2ea043 0%, #56d364 48%, #2ea043 100%); color: #06210d; font-size: 10px; font-weight: 800; letter-spacing: .03em; padding: 2px 9px; border-radius: 999px; margin-left: 8px; vertical-align: middle; box-shadow: 0 0 0 1px rgba(86,211,100,.35), 0 2px 9px rgba(46,160,67,.45); }
  .nfy::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 25%, rgba(255,255,255,.9) 50%, transparent 75%); transform: translateX(-130%); animation: nfyShine 2.8s ease-in-out infinite; pointer-events: none; }
  @keyframes nfyShine { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
  @media (prefers-reduced-motion: reduce) { .nfy::after { animation: none; } }
  .multibadge { background: rgba(88,166,255,.15); color: var(--accent); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }

  .tag { white-space: nowrap; }

  /* ==== Job-list type scale and chip system ===================================================
     Everything below is scoped to .row on purpose. Rolling a design system through 475KB of HTML
     in one pass is how you end up half-migrated and looking worse than either state; the job list
     is where the eye actually spends its time and it is self-contained. Revert = delete this block.

     TYPE. The card ran 16 / 13 / 12 / 12px — four levels of information inside a 4px range, so
     nothing led and nothing receded. That flatness is most of what reads as "dated". The title goes
     UP in size and DOWN in weight: 800 at 16px was heavy enough to fight the studio name sitting
     beside it, so size carries the emphasis now and the weight stops shouting. */
  /* Inline, not block, so the NEW badge can sit on the title's line — a "new" flag belongs next to
     the thing that is new. The studio line is its own element now, which is what pushes the studio
     down instead of the title's display doing it. */
  .row .rmain .title { font-size: 17.5px; font-weight: 650; letter-spacing: -.011em; line-height: 1.3; }
  .row .rmain .studioline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  /* Studio drops to its own line (the title going display:block is what frees it) and gains enough
     weight to be scannable — people scan by studio at least as often as by title. The follow star
     and any badges ride along with it, which is where they belong. */
  .row .rmain .studio { margin-left: 0; font-weight: 600; letter-spacing: .005em; }
  /* These carry margin-left for the old inline layout; the flex gap handles spacing now. */
  .row .rmain .studioline .cardstar, .row .rmain .studioline .dismissedbadge,
  .row .rmain .studioline .poolbadge { margin-left: 0; }
  .row .posted { font-size: 11.5px; color: #6e7681; font-variant-numeric: tabular-nums; }
  /* Top-align the row's controls, since .rmain is two lines now and centring them against it left
     the date floating oddly in the middle of the card. */
  .row .rtop { align-items: flex-start; }

  /* CHIPS. One role, one radius, fills instead of borders. "Everything is boxed" was the fair part
     of the design critique: a border around every chip draws six rectangles per card competing with
     the card's own. A 13%-alpha fill reads as a chip without drawing a box. */
  /* Giving the studio its own line costs a line of height, and the whole point of the next proposal
     is to move jobs UP the page — so the vertical budget is paid back here rather than borrowed.
     Dropping the chip border means the chip no longer needs padding to clear it, and the row gap can
     tighten now that the type hierarchy separates things that spacing used to have to. Net effect on
     card height is roughly zero; see the measurements in the reply. */
  .row { gap: 5px; }
  .row .rtags { gap: 7px; }
  .row .rtags .tag { border: 0; border-radius: 6px; background: rgba(139,148,158,.13); padding: 3px 9px; }
  /* Salary is promoted because it is the field people actually scan for, and it is the one number on
     the card worth setting in tabular figures so columns of them line up as you scroll. */
  .row .rtags .tag.salary { background: rgba(63,185,80,.12); color: var(--green); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  /* Green now means exactly one thing on a card — "this is good for you" — so Remote joins pay there
     and gives up its blue. Blue is reserved for things you can click. */
  .row .rtags .tag.wt.remote { background: rgba(63,185,80,.13); color: var(--green); }
  /* Hybrid is a neutral fact, not a benefit, so it stops spending purple. Purple is retired from the
     job list entirely — it was carrying no meaning here that muted couldn't. */
  .row .rtags .tag.wt.hybrid { background: rgba(139,148,158,.13); color: var(--muted); }
  /* Gold, and only gold, means caution. Re-listed moves off pink so pink can mean errors alone. */
  .row .rtags .tag.relist { background: rgba(210,153,34,.12); color: var(--gold); }
  /* The location chip is a link, so it may use the action colour — on hover, via fill not border. */
  .row .rtags .tag.locchip[onclick]:hover { background: rgba(88,166,255,.16); color: var(--accent); }
  .row .rtags .knowbtn { background: transparent; }
  .row:hover .rtags .knowbtn { background: rgba(88,166,255,.12); }
  /* At 390px a 17.5px title wraps to a third line often enough to cost more height than the
     hierarchy is worth there. Half a point smaller wraps far less while still sitting clearly
     above the 13px studio line — the ratio is what creates hierarchy, not the absolute size. */
  @media (max-width: 560px){
    .row .rmain .title { font-size: 16.5px; line-height: 1.28; }
    /* Pre-existing, not caused by the type change, but visible in the same screenshots so it gets
       fixed here: .rmain carries min-width:200px, which on a 390px screen leaves too little room for
       the date + Track + ✕ cluster, so ✕ wrapped onto a line of its own with nothing beside it.
       Removing .save and .actsep earlier only helped rows whose title fit on ONE line. Letting .rmain
       shrink and refusing to wrap keeps the controls together no matter how long the title runs. */
    .row .rtop { flex-wrap: nowrap; }
    .row .rmain { min-width: 0; }
  }

<script>
/* Testing helper: open with ?dqreset to wipe THIS device's DevQuest state (onboarding, profile,
   saved cells/filters, last-visit) and reload as a brand-new visitor. Runs before everything else so
   the app inits clean. Harmless if a real visitor ever hits it — they just start fresh. */
(function(){ try{
  if (/[?&]dqreset\b/i.test(location.search)) {
    Object.keys(localStorage).filter(function(k){ return /^(dq-|luj-)/.test(k); }).forEach(function(k){ localStorage.removeItem(k); });
    location.replace(location.href.split("?")[0]);

}catch(e){} })();

// ---- Dream Studio watchlist: studios the visitor follows (local only, no account) ----
const FOLLOWS = new Set(store.get("dq-follows", []) || []);
function isFollowed(s){ return FOLLOWS.has(s); }
function toggleFollow(s, ev){
  if (ev){ try { ev.stopPropagation(); ev.preventDefault(); } catch(e){} }
  const on = !FOLLOWS.has(s);
  on ? FOLLOWS.add(s) : FOLLOWS.delete(s);
  try { store.set("dq-follows", Array.from(FOLLOWS)); } catch(e){}
  try { window.dqTrack && window.dqTrack("studio_follow", { st: s, on: on }); } catch(e){}
  if (on) try {
    // 255 studio follows had produced exactly ONE email alert, because the only path to the alert was
    // finding the form buried on the Following tab. Following a studio IS the moment of intent — so
    // offer it here. First follow gets the panel; after that it's just an action on the toast, so it
    // never becomes nagging.
    var _offered = store.get("dq-follow-alert-offered", 0) || 0;
    var _done = store.get("dq-follow-alert-done", 0);
    if (!_done && _offered < 1){
      store.set("dq-follow-alert-offered", _offered + 1);
      dqToast("Following " + s, dqSrcEl(ev));
      setTimeout(function(){ try { offerFollowAlert(s); } catch(e){} }, 450);
    } else if (!_done){
      dqToast("Following " + s, dqSrcEl(ev), { label: "Email me", icon: "✉", fn: function(){
        try { window.dqTrack && window.dqTrack("follow_alert_toast_click", { st: s }); } catch(e){}
        offerFollowAlert(s);
      } });
    } else {
      dqToast("Following " + s + " · in My Jobs", dqSrcEl(ev));
    }
  } catch(e){}
  try { renderSearchGroup("studioFilters","studioSearch",STUDIO_COUNTS,selStudios,STUDIO_LABELS,DIR_STUDIOS); } catch(e){}
  updateFollowTab();
  refreshFollowStars();
  if (typeof view !== "undefined" && view === "follow"){ renderFollowView(); render(); }
}
// Lightweight "want an email when they post?" panel, shown right after a follow. Deliberately reuses
// window.dqStudioAlertForm (the Following-tab form) rather than duplicating the signup logic.
function offerFollowAlert(studio){
  if (document.getElementById("dqFollowAlert")) return;
  try { window.dqTrack && window.dqTrack("follow_alert_shown", { st: studio }); } catch(e){}
  var ov = document.createElement("div");
  ov.id = "dqFollowAlert";
  ov.style.cssText = "position:fixed;inset:0;z-index:9000;background:rgba(3,6,12,.72);display:flex;align-items:center;justify-content:center;padding:20px";
  ov.innerHTML =
    '<div style="background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:460px;width:100%;padding:22px 22px 18px;position:relative">'
    + '<button type="button" id="faX" aria-label="Close" style="position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1">×</button>'
    + '<div style="font-size:17px;font-weight:800;margin:0 0 6px">Want an email when ' + (window.escapeHtml ? escapeHtml(studio) : studio) + ' posts?</div>'
    + '<div style="color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 14px">We\u2019ll send one email a week, only when they have something new. No spam, unsubscribe in one click.</div>'
    + '<div id="faForm"></div>'
    + '<div style="margin-top:12px"><a id="faSkip" style="color:var(--muted);font-size:12.5px;cursor:pointer">No thanks \u2014 just save it to My Jobs</a></div>'
    + '</div>';
  document.body.appendChild(ov);
  function close(){ try { ov.remove(); } catch(e){} }
  ov.addEventListener("click", function(e){ if (e.target === ov) close(); });
  var x = document.getElementById("faX"); if (x) x.onclick = close;
  var sk = document.getElementById("faSkip"); if (sk) sk.onclick = function(){
    try { window.dqTrack && window.dqTrack("follow_alert_dismiss", { st: studio }); } catch(e){}
    close();
  };
  // Mark done on success so we never ask again — the form swaps its own contents to a ✓ message.
  var form = document.getElementById("faForm");
  if (window.dqStudioAlertForm) {
    window.dqStudioAlertForm("faForm", [studio]);
    var obs = new MutationObserver(function(){
      if (form && /Almost there/.test(form.textContent || "")) {
        try { store.set("dq-follow-alert-done", 1); } catch(e){}
        try { window.dqTrack && window.dqTrack("follow_alert_converted", { st: studio }); } catch(e){}
        obs.disconnect();
        setTimeout(close, 2600);
      }
    });
    try { obs.observe(form, { childList: true, subtree: true, characterData: true }); } catch(e){}
  } else if (form) {
    form.innerHTML = '<a class="btn" href="#" onclick="setView(\'follow\');return false">Set up an alert on the Following tab \u2192</a>';
  }
}

function updateFollowTab(){
  const t = document.getElementById("tabFollow");
  if (!t) return;
  // badge = everything personal you can still act on: tracked (pipeline) + saved + followed studios.
  // Count only ids that still resolve to a live listing, so the badge matches what My Jobs actually
  // shows — a saved/tracked role drops off the board when it's filled or re-listed under a new id,
  // and we have no data left to render it (only the id was stored), so it must not be counted either.
  let n = 0;
  try {
    const live = id => (typeof JOB_BY_ID !== "undefined") && !!JOB_BY_ID[id];
    n = Object.keys(appStatus).filter(live).length + [...saved].filter(live).length + FOLLOWS.size;
  } catch(e){ try { n = Object.keys(appStatus).length + saved.size + FOLLOWS.size; } catch(e2){} }
  // Light the star gold whenever the tab holds anything personal; stays lit while populated.
  const star = n ? '<span style="color:var(--gold)">★</span>' : '★';
  t.innerHTML = star + " My Jobs" + (n ? ' <span style="opacity:.75">' + n + '</span>' : "");
}
// Prune saved/tracked ids whose listing has left the board (filled or re-posted under a new id).
// Only the id was stored, so there's nothing left to render — drop them and re-sync the badge + view.
function dqClearStale(){
  try {
    [...saved].forEach(id => { if (!JOB_BY_ID[id]) saved.delete(id); });
    Object.keys(appStatus).forEach(id => { if (!JOB_BY_ID[id]) delete appStatus[id]; });
    store.set("luj-saved", [...saved]);
    store.set("luj-status", appStatus);
  } catch(e){}
  try { window.dqTrack && window.dqTrack("clear_stale_jobs", {}); } catch(e){}
  updateFollowTab();
  try { renderFollowView(); } catch(e){}
}

// The followed-studios dashboard (tiles + clickable chips + movers + weekly-alert) — one
// section of the larger "My Jobs" view. Returns inner HTML (no outer panel/heading).
function buildStudioDash(){
  const T = (window.JOBS_DATA && window.JOBS_DATA.trends) || null;
  const followed = JOBS.filter(j => FOLLOWS.has(j.s));
  const open = followed.length;
  const newWk = followed.filter(j => j.ts && hoursAgo(j) <= 168).length;
  const byS = {}; for (const j of followed) byS[j.s] = (byS[j.s] || 0) + 1;
  const deltaOf = s => { if (!T || !T.studios || !T.studios[s]) return null; const t = T.studios[s]; const base = t.d7 != null ? t.d7 : t.now; return (t.now || 0) - base; };
  const studios = [...FOLLOWS].map(s => ({ s, n: byS[s] || 0, d: deltaOf(s) })).sort((a,b)=> b.n - a.n);
  const arrow = d => d > 0 ? ` <span class="d up">+${d}</span>` : (d < 0 ? ` <span class="d dn">−${-d}</span>` : "");
  const chips = studios.map(o => `<span class="wlchip"><span class="st" role="button" tabindex="0" data-tip="Unfollow ${o.s.replace(/"/g,'')}" onclick="toggleFollow('${o.s.replace(/'/g,"\\'")}', event)">★</span><span class="nm" role="button" tabindex="0" data-tip="Browse ${o.s.replace(/"/g,'')} roles" style="cursor:pointer" onclick="filterToStudio('${o.s.replace(/'/g,"\\'")}')">${o.s}</span><span class="c">${o.n}</span>${arrow(o.d)}</span>`).join("");
  const ups = studios.filter(o => o.d > 0).sort((a,b)=> b.d - a.d).slice(0, 4);
  const downs = studios.filter(o => o.d < 0).sort((a,b)=> a.d - b.d).slice(0, 3);
  const moversLine = (ups.length || downs.length)
    ? `<div class="wlmovers">What’s moving: ${ups.map(o=>`<span class="up">${o.s} +${o.d}</span>`).join(" · ")}${(ups.length&&downs.length)?" · ":""}${downs.map(o=>`<span class="dn">${o.s} −${-o.d}</span>`).join(" · ")}</div>`
    : `<div class="wlmovers">Week-over-week movement fills in as history banks (~8 days).</div>`;
  return `<div class="wlpanel">`
    + `<div class="wltiles">`
    + `<div class="wltile"><div class="n">${open.toLocaleString()}</div><div class="l">open roles across your studios</div></div>`
    + `<div class="wltile"><div class="n">${newWk.toLocaleString()}${newWk?' <span class="up">▲</span>':''}</div><div class="l">new in the last 7 days</div></div>`
    + `<div class="wltile"><div class="n">${FOLLOWS.size}</div><div class="l">studios followed</div></div>`
    + `</div>`
    + `<div class="wlchips">${chips}</div>`
    + moversLine
    + `<div class="wlcta"><button class="wlbtn primary" onclick="window.dqShowFollowEmail()">🔔 Get a weekly job alert for these studios</button>${window.dqManageBtn ? window.dqManageBtn() : ""}</div>`
    + `<div id="followEmailBox" style="display:none;margin-top:12px"></div>`
    + `<div class="wlnote">Tap a studio to browse its roles, the ★ to unfollow. The alert button sets up a weekly job alert pre-filled with these studios. Saved on this device.</div>`
    + `</div>`;
}

function mjBarHtml(j, stage){
  const L = { offer:"Offer", applied:"Applied", interviewing:"Interviewing", rejected:"Rejected", saved:"Saved" };

  if (stage === "applied"){
    const d = nbAppliedDays(j.id);   // days since you marked it applied (null if unknown)

      const txt = d < 7 ? `Active · ${d}d` : d < 30 ? `Follow up · ${d}d` : `Quiet · ${d}d`;

// Company intelligence on My Jobs cards (shown inline in the expanded view, not a new toggle): live
// studio role count, hiring momentum (trends.json now vs ~30d), other roles in the same discipline,
// and this listing's age — all from data already on the page. EASY REVERT: MYJOBS_COMPANY_INTEL = false.
const MYJOBS_COMPANY_INTEL = true;
function mjCompanyHtml(j){
  const studio = j.s; if (!studio) return "";
  const open = (typeof STUDIO_COUNTS === "object" && STUDIO_COUNTS && STUDIO_COUNTS[studio]) || 0;
  if (!open) return "";
  let sameDisc = 0; for (const x of JOBS) if (x.s === studio && x.d === j.d) sameDisc++;
  const otherDisc = Math.max(0, sameDisc - 1);
  let delta = null;
  try { const T = window.JOBS_DATA && window.JOBS_DATA.trends; const s = T && T.studios && T.studios[studio];
    if (s && s.now != null){ const base = (s.d30 != null) ? s.d30 : (s.d7 != null ? s.d7 : null); if (base != null) delta = s.now - base; } } catch(e){}
  let dl = null; try { dl = daysListed(j); } catch(e){}
  let stats = `<div class="cistat"><b>${open.toLocaleString()}</b>open role${open===1?'':'s'}</div>`;
  if (delta != null && delta !== 0) stats += `<div class="cistat"><b class="${delta>0?'up':'down'}">${delta>0?'▲ +'+delta:'▼ '+Math.abs(delta)}</b>vs last month</div>`;
  if (otherDisc > 0) stats += `<div class="cistat"><b>${otherDisc}</b>other ${j.d} role${otherDisc===1?'':'s'}</div>`;
  if (dl != null) stats += `<div class="cistat"><b${dl>=STALE_DAYS?' class="down"':''}>${dl}d</b>this listing's age</div>`;
  let line = "";
  if (delta > 0) line = "Hiring is <span class='up'>up</span> this month.";
  else if (delta < 0) line = "Hiring has <span class='down'>slowed</span> — momentum, not layoff news.";
  if (dl != null && dl >= STALE_DAYS) line += (line?" ":"") + `This posting has been live ${dl} days (possibly stale).`;
  const esc = s => String(s).replace(/'/g, "\\'");
  return `<div class="ci" onclick="event.stopPropagation()">`
    + `<div class="ci-h">📊 ${studio} <span class="ci-m">· market snapshot</span></div>`
    + `<div class="ci-r">${stats}</div>`
    + (line ? `<div class="ci-line">${line}</div>` : "")
    + `<span class="ci-cta" onclick="event.stopPropagation(); filterToStudio('${esc(studio)}')">See all ${open.toLocaleString()} ${studio} roles →</span>`
    + `</div>`;
}

// ---- discipline consolidation: keep dev crafts, fold corporate noise -------
const CORE_DISC = ["Engineering","Art","Animation","Design","Audio","Production","QA","Data & Analytics"];
function normDisc(d){
  if (CORE_DISC.includes(d)) return d;
  if (d === "Player Support") return "Marketing & Comms";   // too few roles for its own row — folded into Marketing & Comms
  if (/marketing|comms|brand|communication|publishing|entertainment/i.test(d)) return "Marketing & Comms";
  return "Business & Ops";
}

// ---- talent-pool detection: these aren't specific openings, they're pipelines ----
function isPool(title){
  return /general (application|resume|submission|interest)|resume submission|open applications?\b|open\s+(?:[\w\/&-]+\s+){1,3}applications?(?=\s*$|\s*[\(\[\-–|\/])|candidature\s+(?:libre|ouverte|spontan)|spontaneous application|unsolicited|talent (community|pool|network|connection)|future opportunit|expression of interest|speculative|join our talent|introduce yourself|don'?t see (a|the|your) (role|fit)|prospective|candidate pool|stay connected/i.test(title || "");
}

// ---- load + normalize + dedupe ----------------------------------------------
const LIVE = window.JOBS_DATA && window.JOBS_DATA.jobs && window.JOBS_DATA.jobs.length;
const RAW = LIVE ? window.JOBS_DATA.jobs.map(j => ({

  l: j.location, r: j.region, sen: j.seniority, url: j.url,
  salary: j.salary || null, yoe: j.yoe || null, tech: j.tech || [],
  ts: j.postedAt ? new Date(j.postedAt).getTime() : 0, // 0 = date unknown (e.g. EA)
  fseen: j.firstSeen ? Date.parse(j.firstSeen) : 0,    // when WE first saw it (reliable age)

  if (US_STATES.test(loc||"") && !/canada|ontario|quebec|alberta|british columbia/i.test(loc||"")) return "United States";

const hoursAgo = j => Math.max(0, Math.round((Date.now() - j.ts) / 36e5));
// how long WE'VE seen the listing live (reliable age for ghost-job signal); null if unknown
// Days-live beyond which a listing reads as "likely stale". One source of truth for the
// ⏳ badge, the hide-stale filter, the orange posted-date and the studio tooltip so they can
// never drift. Calibrated from our own data (Jul 2026): 60 clears the MEDIAN age of every
// seniority band (Senior 36d · Lead 40d · Director+ 50d), so it flags roles that are old for
// their level rather than normal slow game-industry hiring. A separate 90d tier marks the worst.
const STALE_DAYS = 60;
const daysListed = j => j.fseen ? Math.max(0, Math.floor((Date.now() - j.fseen) / 864e5)) : null;
// "re-listed" = either the scraper saw the studio's date jump across runs, OR the role
// has been live far longer than its currently-shown posted date claims (a refreshed /
// continuously-reposted listing). The second check catches it without waiting for runs.
function relistedNow(j){
  if (j.relisted) return true;
  const dl = daysListed(j);
  if (dl == null || !j.ts) return false;
  const postedDays = (Date.now() - j.ts) / 864e5;
  return dl - postedDays >= 30; // live 30+ days longer than its posted date suggests
}
// "Likely stale" = exactly the set that earns a ⏳ or ↻ badge on the card: re-listed/refreshed,
// or we've seen it live STALE_DAYS+ days. One toggle ("Hide likely-stale listings") uses this,
// replacing the old overlapping "Hide re-listed" + "Hide listings live longer than" controls.
function isStale(j){ const dl = daysListed(j); return relistedNow(j) || (dl != null && dl >= STALE_DAYS); }
// "NEW FOR YOU" = appeared in your view since your last visit — posted OR first-seen by us
// after prevVisit (so freshly-added studios count too, and sources with no posted date still
// qualify) — but never a likely-stale/re-listed role, so the badge stays "fresh opportunity".
function isNewForYou(j){
  if (!prevVisit || isStale(j)) return false;
  return (j.ts && j.ts > prevVisit) || (j.fseen && j.fseen > prevVisit);
}

function renderSearchGroup(boxId, searchId, counts, sel, labels, extras){

const selSubs = new Set();         // sub-discipline chips (Art/Eng/Design specializations)
const selRegionsQuick = new Set(); // quick region chips
const selHubs = new Set();         // gaming-hub chips (drill-down under a selected region)
let hubPlusRemote = true;          // with a hub picked, also keep fully-remote roles ("Austin or remote")
let hubsExpanded = false;          // hub chips are collapsed to the busiest few until asked to expand
let quickRemote = false, quickNew = false;

// ---- Search normalization + synonyms -----------------------------------------
// Collapse punctuation that otherwise splinters a match: "UI/UX", "R&D", "node.js"
// all become space-separated words. We deliberately KEEP "+" and "#" so "c++" and
// "c#" survive (they live in each job's tech tags).
function normS(s){ return (s || "").toLowerCase().replace(/[\/&_,.|]+/g, " ").replace(/\s+/g, " ").trim(); }
// Maps what people type to the words actually in the postings. Keys are in normalized
// form (no slashes). When the stats show a zero-result search that should have hit
// something, add a line here. Matching is substring-based, so a value is a hit if it
// appears anywhere in the title/studio/discipline/tech/location text.
const SEARCH_SYNONYMS = {
  // UI / UX / product design
  "ui ux": ["ui", "ux", "user experience", "user interface", "product designer", "interaction design"],
  "ux ui": ["ui", "ux", "user experience", "user interface"],

// A typed term -> the set of strings (itself + any synonyms) that count as a hit.
function searchVariants(nq){
  const out = new Set([nq]);
  const syn = SEARCH_SYNONYMS[nq];
  if (syn) for (const v of syn) out.add(normS(v));
  return [...out];
}

function render(){
  const qraw = document.getElementById("q").value.toLowerCase();
  // "-term" tokens EXCLUDE roles containing that word (e.g. "designer -senior", or "-product"
  // to drop product roles). Parse the excludes off the raw text, then normalize the rest.
  const qExc = (qraw.match(/(^|\s)-(\S+)/g) || []).map(t => normS(t.trim().slice(1))).filter(Boolean);
  const q = normS(qraw.replace(/(^|\s)-\S+/g, " "));
  const qVariants = q ? searchVariants(q) : [];     // whole-query + its synonym phrases
  const qToks = q ? q.split(" ").filter(Boolean) : [];
  const qMatch = j => {
    if (!q && !qExc.length) return true;
    // j.hubs is the NORMALISED city ("Austin"), j.locs the raw studio strings. A user searching
    // "austin" was matching raw text only, so they hit "Austin, TX" but missed "Austin, Texas" and
    // "Austin, United States of America" — 33 different spellings in the data, and a literal search
    // finds a third of them. Including the hub makes one search term match every spelling.
    const hay = normS(j.t + " " + j.s + " " + j.locs.join(" ") + " " + (j.hubs || []).join(" ") + " " + (j.d || "") + " " + (j.tech || []).join(" "));
    if (qExc.some(x => hay.includes(x))) return false;
    if (!q) return true;
    // Hit if the whole query (or any synonym phrase) appears, OR every word — each
    // itself synonym-expanded — appears somewhere, so word order and punctuation
    // ("character animation lead", "sen animator") don't block an otherwise-good match.
    if (qVariants.some(v => hay.includes(v))) return true;
    if (qToks.length > 1 && qToks.every(t => searchVariants(t).some(v => hay.includes(v)))) return true;
    return false;
  };
  const d = checked("f-d"), w = checked("f-w"), s = checked("f-s");
  // When the list is already filtered to a level, every card repeats it ("Director+" on all 12).
  // Mobile drops that chip via this hook; desktop has the width to keep showing it.
  try { document.body.classList.toggle("senfiltered", (s && s.size > 0) || selCells.size > 0); } catch(e){}
  const r = document.getElementById("region").value;
  const maxDays = parseInt(document.getElementById("age").value, 10);  const hideTracked = document.getElementById("hideTracked").checked;
  const showDismissed = document.getElementById("showDismissed").checked;
  const hidePools = document.getElementById("hidePools").checked;
  const hideStale = document.getElementById("hideStale").checked;
  const savedOnly = document.getElementById("savedOnly").checked;
  document.getElementById("dismissCount").textContent = dismissed.size;
  document.getElementById("savedCount").textContent = saved.size;

  // "preHub" = everything EXCEPT the matrix cell selection and the hub drill-down.
  // Dismissed jobs are always excluded here; "Show dismissed" is handled as its own
  // focused review list below, so the matrix and counts stay about active roles.
  const preHub = JOBS.filter(j =>
    (!dismissed.has(j.id)) &&
    (!savedOnly || saved.has(j.id)) &&
    (view !== "follow" || FOLLOWS.has(j.s)) &&
    (!hideTracked || !appStatus[j.id]) &&    (!hidePools || !j.pool) &&
    (!hideStale || !isStale(j)) &&
    (!maxDays || (j.ts && hoursAgo(j) <= maxDays*24)) &&
    qMatch(j) &&
    (!selStudios.size || selStudios.has(j.s) || selStudios.has("@"+j.p)) &&
    (!selKinds.size || kindOf(j).some(k=>selKinds.has(k))) &&
    (!selCountries.size || j.countries.some(c=>selCountries.has(c))) &&
    (!d.length || d.includes(j.d)) &&
    (!w.length || w.includes(j.w)) &&
    (!s.length || s.includes(j.sen)) &&
    (!r || j.regions.includes(r)) &&
    (!quickRemote || j.w === "Remote") &&
    (!selRegionsQuick.size || j.regions.some(x=>selRegionsQuick.has(x))) &&
    regionScopeOK(j)
  );

  // facet helpers: each chip group's counts respect ALL the other active facets,
  // so e.g. picking "Mid · Design" makes the hub counts show only mid design roles.
  const passCells = j => !selCells.size || selCells.has(j.d+"|"+j.sen);
  const passSubs  = j => !selSubs.size  || selSubs.has(j.sub);

  // gaming-hub chips appear only when a region quick-filter is active. Counts respect
  // the selected square(s) + specialize chips, scoped to the selected region(s).
  // Hubs used to appear only after a region quick-filter was picked, so most people never found them
  // and fell back to keyword search (which is exactly how the Austin spelling problem got reported).
  // Show them whenever they're relevant; scope by region only when a region is actually selected.
  const availHubs = {};
  for (const j of preHub) if (passCells(j) && passSubs(j))
    for (const hb of j.hubs)
      if (!selRegionsQuick.size || selRegionsQuick.has(HUB_REGION[hb])) availHubs[hb] = (availHubs[hb]||0)+1;
  for (const hb of [...selHubs]) if (!availHubs[hb]) selHubs.delete(hb); // prune stale picks

  // "base" = preHub narrowed by the hub selection (feeds the matrix + cell list).
  // "Onsite in my city OR remote anywhere" is the single most common job-seeker query and a plain
  // AND can't express it: hub + Remote work-type intersects to "remote roles tagged Austin", which is
  // almost nothing. hubPlusRemote widens the hub selection to also keep fully-remote roles, mirroring
  // what regionScopeOK already does for regions ("out-of-region jobs are hidden; remote roles stay").
  const base = selHubs.size
    ? preHub.filter(j => j.hubs.some(h=>selHubs.has(h)) || (hubPlusRemote && j.w === "Remote"))
    : preHub;
  // apply the matrix squares; the result feeds both the sub-discipline chips and the list
  const cellList = selCells.size ? base.filter(j=>selCells.has(j.d+"|"+j.sen)) : base;

  // sub-discipline chips appear only when a sub-bearing discipline (Art/Eng/Design)
  // is selected via the matrix. Counts come from the cell-filtered set.
  const selDiscs = new Set([...selCells].map(k=>k.split("|")[0]));
  const subDiscsActive = [...selDiscs].filter(dn=>SUB_DISCS.has(dn));
  const availSubs = {};
  if (subDiscsActive.length)
    for (const j of cellList) if (subDiscsActive.includes(j.d) && j.sub) availSubs[j.sub] = (availSubs[j.sub]||0)+1;
  for (const sb of [...selSubs]) if (!availSubs[sb]) selSubs.delete(sb); // prune stale picks

  let list = (selSubs.size ? cellList.filter(j=>selSubs.has(j.sub)) : cellList)
    .sort((a,b)=>b.ts-a.ts);
  // "Show dismissed" = a focused review list of ONLY the jobs you've hidden, ignoring
  // other filters so they're always easy to find and restore.
  if (showDismissed) list = JOBS.filter(j=>dismissed.has(j.id)).sort((a,b)=>b.ts-a.ts);

  // "✨ New for you" quick-filter: count new-since-last-visit within the current filters, then
  // (if toggled) narrow the list to just those. Count is taken before narrowing so the chip stays stable.
  const newCount = showDismissed ? 0 : list.filter(isNewForYou).length;
  if (quickNew && !showDismissed) list = list.filter(isNewForYou);

  try { window.__dqCount = list.length; updateAccBadges(); } catch(e) {} // current result count, for analytics

  renderMatrix(base);
  renderQuickbar(newCount);
  try{ renderCityStrip(); }catch(e){}
  renderHubbar(availHubs);
  renderSubbar(availSubs);
  try{ renderFyStrip(); }catch(e){}
  renderActiveFilters();

  const groups = {};
  for (const j of list) (groups[j.d] = groups[j.d] || []).push(j);
  GROUPS = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);

  const cellNote = (selCells.size ? " · " + selCells.size + " square" + (selCells.size>1?"s":"") + " selected" : "")
    + (selSubs.size ? " · " + [...selSubs].join(", ") : "")
    + (selHubs.size ? " · " + [...selHubs].join(", ") : "");
  // On phones the stat strip is hidden, so fold its two most useful numbers into the count line.
  var _mpMini = "";
  try {
    if (window.matchMedia && window.matchMedia("(max-width: 560px)").matches && typeof marketPulse === "function") {
      if (!window.__mpCache) window.__mpCache = marketPulse();
      var _mp = window.__mpCache;
      _mpMini = " · " + _mp.studios + " studios · " + _mp.newWk + " new this week";
    }
  } catch(e){}
  document.getElementById("count").textContent = showDismissed
    ? (list.length + " dismissed job" + (list.length!==1?"s":"") + " — click ↩ on a row to restore it")
    // "20 roles shown (5214 total)" reads as if the page cut 5,214 down to 20 on its own, rather
    // than your filters doing it. "20 of 5,214 roles" states the relationship directly.
    : (list.length.toLocaleString() + " of " + JOBS.length.toLocaleString() + " roles" + cellNote + _mpMini +
       (newCount ? " · " + newCount + " new since your last visit" : ""));

  // "🔥 Hot jobs for you": a personalized highlight atop the *default* browse state, for returning
  // visitors with enough on-device signal. Any active filter / search / selection hides it so the
  // normal grouped results take over (and first-timers always get the standard default view).
  let hotHtml = "";
  let hotShownIds = new Set();   // ids shown in the Hot strip — removed from the grouped list below so nothing repeats
  // Surface the cost-of-living chip on the main List (not just My Jobs / Best Fit) whenever the visitor
  // has set a home city we can resolve. colChipForJob still self-guards (single-location jobs with a
  // known city only), so this is safe to leave on for the whole list. Reset after the rows are built.
  ROW_COL = (view === "list") && !!colHome();
  window.__hotDisc = null;   // discipline the email-ask bar can pre-target (set when hot jobs show)
  try {
    // "hotOK" = when to show the personalized "🔥 Hot jobs for you" highlight. It survives PROFILE-LEVEL
    // context — the grid (your craft×level), your feasible country / region-quick filters, the sidebar
    // region, and the region scope — because those describe WHO you are and WHERE you can work, not an
    // ad-hoc search. It hides only for explicit narrowing: a text search, a studio / sub-discipline /
    // work-type / seniority facet, a day limit, remote-only, or the new / saved / dismissed views.
    const hotOK = view === "list" && !showDismissed && !savedOnly && !quickNew && !quickRemote
      && !q && !qExc.length && !selStudios.size && !selSubs.size && !selKinds.size && !selHubs.size
      && !d.length && !w.length && !s.length && !maxDays;
    // "defaultBrowse" = nothing applied at all (used to snapshot the last real filter set for next visit).
    const defaultBrowse = hotOK && !selCells.size && !selCountries.size && !selRegionsQuick.size && !r;
    // Snapshot the active filter set so hot jobs can lead with it on the next visit (matrix cells
    // carry discipline×seniority; sidebar facets too). Only saved when a real filter is set, so the
    // last meaningful search persists after the visitor clears back to the default view.
    if (!defaultBrowse && view === "list" && !showDismissed
        && (selCells.size||selStudios.size||selSubs.size||selCountries.size||selRegionsQuick.size||d.length||w.length||s.length||r||quickRemote||q)) {
      try { store.set("dq-lastfilters", { cells:[...selCells], studios:[...selStudios], subs:[...selSubs],
        countries:[...selCountries], regionsQuick:[...selRegionsQuick], region:r||"", disc:d, sen:s, work:w,
        remote:!!quickRemote, q:q||"", ts:Date.now() }); } catch(e){}
    }
    if (hotOK && list.length) {
      const P = buildProfile();
      // "Hot jobs for you" now means NEW-since-your-last-visit AND matches your criteria — the reason to
      // come back. Pull a larger matched pool, then keep only roles first seen after your previous visit
      // (isNewForYou). If nothing's new (frequent visitors — and always on a first session), fall back to
      // the freshest matches so the section is never empty.
      const allHot = hotJobs(list, P, 60);
      // If the visitor set an explicit filter last time, honor it even with just a few matches.
      // The stricter ≥4 bar only guards the IMPLICIT affinity guess (no recent filter), so a weak
      // signal doesn't produce a thin section. Fixes: a single matrix cell / cell+studios not surfacing.
      const _lfNow = affLastFilters();
      const minHot = (_lfNow && lfHasFilters(_lfNow)) ? 1 : 4;
      if (allHot.length >= minHot) {
        const newHot = allHot.filter(isNewForYou)
          .sort((a,b)=>(b.ts||b.fseen||0)-(a.ts||a.fseen||0));   // a "what's new" feed leads with the freshest
        // Always show the strip when there's profile signal, so it's consistent across devices/sessions
        // regardless of whether a grid square is selected. Lead with NEW-since-last-visit matches; if
        // you're caught up, fall back to your freshest matches so it's never empty.
        const hotMode = newHot.length ? "new" : "fresh";
        // Always show the full hot list; lead with NEW-since-last-visit matches (tagged), then the
        // rest of your freshest matches — so a single new role no longer collapses the whole section.
        const _newIds = new Set(newHot.map(j => j.id));
        const hot = [...newHot, ...allHot.filter(j => !_newIds.has(j.id))].slice(0, 12);
        hotHtml = renderHotSection(hot, P, hotMode);
        hotShownIds = new Set(hot.map(j => j.id));   // so these don't repeat in the grouped list below
        // email-ask discipline target. Mirror hotJobs()'s priority ladder so the alert matches the
        // "your profile · …" header: an explicitly pinned My-profile wins over transient last-filters /
        // affinity. (Previously this skipped the pinned profile, so the ask drifted to the affinity
        // discipline — e.g. "67 new Art roles" while the profile said Production.)
        let _hd = [];
        const _pin = profPinnedRoles();
        if (_pin && _pin.length) { _hd = _pin.slice(); }
        else {
          const _lf = affLastFilters();
          if (_lf && lfHasFilters(_lf)) { const ds=new Set(); (_lf.cells||[]).forEach(c=>{const d0=String(c).split("|")[0]; if(d0)ds.add(d0);}); (_lf.disc||[]).forEach(x=>ds.add(x)); _hd=[...ds]; }
          if (!_hd.length) _hd = topKeys(P.disc, 0.6);
        }
        window.__hotDisc = _hd[0] || null;
        window.__hotDiscs = _hd;
        window.__hotDiscNew = list.filter(j => _hd.includes(j.d) && j.ts && (Date.now()-j.ts) <= 7*864e5).length;
      }
    }
  } catch(e){}

  { const _hw = document.getElementById("hotWrap");
    if (_hw) _hw.innerHTML = list.length ? hotHtml : ""; }
  try{ mobileReorder(); }catch(e){}   // phones: region banner + hubs sit below Hot jobs
  try{ metaFooterSync(); }catch(e){}  // phones: header meta buttons live at the foot of the page
  document.getElementById("jobs").innerHTML = list.length ? GROUPS.map((dn,gi)=>{
    const jobs = hotShownIds.size ? groups[dn].filter(j=>!hotShownIds.has(j.id)) : groups[dn];
    if (!jobs.length) return "";   // every role in this group is already up in "Hot jobs for you"
    const open = !collapsed.has(dn);
    const n = shown[dn] || SHOW_STEP;
    const rest = jobs.length - n;
    return `<div class="group">
      <div class="group-header" onclick="toggleGroup(${gi})">
        <span class="arrow ${open?'open':''}">▸</span> <h2 class="hx" style="color:${discColor(dn)};display:inline">${dn}</h2>
        <span class="gcount">${jobs.length}</span>
      </div>
      ${open ? jobs.slice(0,n).map(rowHtml).join("") : ""}
      ${open && rest > 0 ? `<button class="more-btn" onclick="showMore(${gi})">Show ${Math.min(SHOW_STEP,rest)} more (${rest} hidden)</button>` : ""}
    </div>`;
  }).join("") : `<div class="empty">No roles match. Click a highlighted square again to deselect, or clear your filters.</div>`;

  ROW_COL = false;   // done building List rows; leave the flag off for other views/renderers
  LAST_LIST = list;
  // Personalize the top pulse bar to the active filter slice (stays global on the default/first-visit view).
  try {
    PULSE_FILTERED = (view === "list") && !!(selCells.size||selStudios.size||selSubs.size||selCountries.size||selRegionsQuick.size||d.length||w.length||s.length||r||quickRemote||q);
    PULSE_SLICE = PULSE_FILTERED ? dqSliceLabel([...selCells], d, s, r, [...selCountries], [...selRegionsQuick], quickRemote, [...selStudios], q) : "";
    renderPulseStrip();
  } catch(e){}
  renderDirectory(); // keep the island in sync with the top search bar
  if (view === "map") renderMap();
  if (view === "stats") renderStats();
}

// single floating tooltip, appended to <body> so the matrix's horizontal scroll can't clip it
const gridTip = document.createElement("div"); gridTip.id = "gridTip"; document.body.appendChild(gridTip);
function showGridTip(el){
  // Touch devices fire mouseover on tap but never mouseout, so the tip would stick. Hover tooltips
  // are desktop-only; on touch, tapping a cell just filters (and the lens shows the metrics).
  if (window.matchMedia && window.matchMedia("(hover: none)").matches) return;
  const tip = el.getAttribute("data-tip"); if (!tip) return;
  gridTip.innerHTML = tip; gridTip.classList.add("show");
  const r = el.getBoundingClientRect();
  gridTip.style.left = "0px"; gridTip.style.top = "0px"; // reset to measure
  const tw = gridTip.offsetWidth, th = gridTip.offsetHeight;
  let x = r.left, y = r.bottom + 8;
  if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
  if (y + th > window.innerHeight - 8) y = r.top - th - 8; // flip above if no room below
  gridTip.style.left = Math.max(8, x) + "px";
  gridTip.style.top = Math.max(8, y) + "px";
}
function hideGridTip(){ gridTip.classList.remove("show"); }
// Delegate on <body> so every [data-tip] gets the styled tooltip — matrix cells AND studio names in
// job rows (both re-render constantly; body is always persistent). Desktop-only is enforced in showGridTip.
(function(){
  document.body.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); if (el) showGridTip(el); });
  document.body.addEventListener("mouseout",  e => { const el = e.target.closest("[data-tip]"); if (el) hideGridTip(); });
})();
const escTip = s => String(s).replace(/"/g, "&quot;");

// ---- interactive matrix (home page) ------------------------------------------
// Signature colors per discipline (desaturated). Core crafts get a hue; corporate/ops
// disciplines (Marketing, Player Support, Business & Ops, …) stay gray so they recede.
const DISC_COLOR = {
  "Engineering":"#5b9bd5","Art":"#b388d6","Animation":"#db8bb2","Design":"#4fb3a6",
  "Audio":"#d4a85f","Production":"#7fb06c","QA":"#d18f63","Data & Analytics":"#5fb9cb"
};
function discColor(d){ return DISC_COLOR[d] || "var(--muted)"; }

// Default to EXPANDED on mobile: the role×seniority matrix is the signature, fast way to find
// relevant roles — far more useful to a first-timer than a generic top-of-list discipline. Once a
// visitor explicitly collapses it, that choice is remembered (stored value wins over the default).
// The grid is 295px of the 905px stacked above the first job card on a 390px phone, so a returning
// visitor had to scroll past a control they'd already used before seeing a single job — and mobile
// is 47% of visitors, returning at 8% against desktop's 18%. But the grid is also the onboarding:
// 61% of new visitors tap a square, and it's the only thing that sets their profile. So: expanded
// by default for anyone who hasn't told us what they do, collapsed once a profile exists. An
// explicit toggle by the user always wins over both defaults.
function matrixCollapsed(){
  try {
    var v = store.get("dq-mtx-collapsed", null);
    if (v !== null) return !!v;
    // Must test .pinned, not .v — profGet("roles").v falls back to profInferRoles(), which returns
    // guesses from browsing behaviour and is non-empty even for a first-time visitor. Keying on .v
    // collapsed the grid for brand-new visitors, i.e. hid the onboarding from exactly the people it
    // converts. .pinned is only true once someone has actually told us their craft or level.
    var pinnedRoles = false, pinnedSen = false;
    try { pinnedRoles = !!profGet("roles").pinned && ((profGet("roles").v) || []).length > 0; } catch(e){}
    try { pinnedSen = !!profGet("sen").pinned && profGet("sen").v !== "__any"; } catch(e){}
    return pinnedRoles || pinnedSen;
  } catch(e){ return false; }
}
function matrixToggle(){
  if (window.innerWidth > 560) return;   // desktop: the matrix always stays open
  var collapsed = !matrixCollapsed();
  try { store.set("dq-mtx-collapsed", collapsed); } catch(e){}
  var mw = document.getElementById("matrixWrap"); if (mw) mw.classList.toggle("mcollapsed", collapsed);
  var ch = document.getElementById("mhToggle"); if (ch) ch.textContent = collapsed ? "▸" : "▾";
  try { window.dqTrack && window.dqTrack("matrix_toggle", { open: !collapsed }); } catch(e){}
}
// ===== Matrix dashboard (Jobs / Median pay / Remote % / Fresh lenses) =====
// EASY REVERT: set MATRIX_DASH = false to restore the original count-only matrix exactly.
// renderMatrix below is left untouched; the new view lives entirely in renderMatrixDash.
const MATRIX_DASH = true;
const MATRIX_RESTYLE = false;   // cosmetic "dashboard" grid (rounded, spaced cells). false = original tight heatmap. Independent of MATRIX_DASH (the lenses/hover/pay).
let matrixMetric = "n";   // n | pay | rem | fr
function setMatrixMetric(m){
  if (m === matrixMetric) return;                 // no-op if the lens is already active
  // Untracked until now, which is why "is anyone using View by?" was unanswerable. Log it so the
  // decision to keep or cut it can be made on evidence rather than a hunch.
  try { window.dqTrack && window.dqTrack("matrix_lens", { m: m }); } catch(e){}
  matrixMetric = m; render();
  // One-shot soft cross-fade so the grid reads as "re-tinting" when you switch View by, instead of a hard
  // color swap. render() rebuilds the matrix synchronously, so the fresh .matrixbody is in the DOM now;
  // adding the class replays the keyframe once. Honors prefers-reduced-motion (CSS disables it).
  try { const _mb = document.querySelector("#matrixWrap .matrixbody"); if (_mb) _mb.classList.add("mtx-recolor"); } catch(e){}
}
function mtxMedian(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y), m=Math.floor(s.length/2); return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2); }
function mtxParsePay(str){
  if(!str || /hour|hr\b|\/h/i.test(str)) return 0;
  // Non-USD ranges (\u00a3/\u20ac) are shown on the card verbatim but excluded from every $K
  // average/median on the site, so a London range can never be mixed into a dollar figure.
  if(/[\u00a3\u20ac]|\bGBP\b|\bEUR\b|\bCAD\b/i.test(String(str))) return 0;
  const nums = String(str).replace(/,/g,"").match(/\d+(?:\.\d+)?/g); if(!nums) return 0;
  const k = /k/i.test(str);
  const v = nums.map(n=>{ let x=parseFloat(n); if(!k && x>=1000) x/=1000; return x; }).filter(x=>x>=10 && x<=2000);
  if(!v.length) return 0;
  return Math.round(((v[0]) + (v[1]!=null?v[1]:v[0])) / 2);   // midpoint of a range, in $K
}

function renderMatrix(base){
  if (MATRIX_DASH) return renderMatrixDash(base);
  const SEN_ORDER = ["Entry","Mid","Senior","Lead","Director+"];
  const seniorities = SEN_ORDER.filter(sn => base.some(j=>j.sen===sn));
  const discCount = {}; for (const j of base) discCount[j.d] = (discCount[j.d]||0)+1;
  const discOrder = Object.keys(discCount).sort((a,b)=>discCount[b]-discCount[a]);
  const cell = {}; for (const j of base) cell[j.d+"|"+j.sen] = (cell[j.d+"|"+j.sen]||0)+1;
  const cmax = Math.max(1, ...Object.values(cell));
  const heat = n => n===0 ? "transparent" : `rgba(88,166,255,${0.10 + 0.6*Math.sqrt(n/cmax)})`;
  let h = `<div class="matrixhead" onclick="matrixToggle()"><div class="mh-text"><h2 class="hx mh-title">Where are the jobs right now?</h2><span class="mhint">Tap any role × seniority cell to filter · brighter = more roles · hover a label<span class="swipehint"> · swipe →</span></span></div><span class="mh-toggle" id="mhToggle" aria-hidden="true">${matrixCollapsed()?"▸":"▾"}</span></div>`;
  if (!discOrder.length) { document.getElementById("matrixWrap").innerHTML = h + `<div class="xhint">No roles in the current filters.</div>`; return; }
  h += `<div class="matrixbody"><div class="mxscroll" style="overflow-x:auto"><table class="xtab"><tr><th></th>${seniorities.map(sn=>{
    const info = SEN_INFO[sn];
    return info ? `<th class="senh" data-tip="${escTip(info)}"><span>${sn}</span></th>` : `<th>${sn}</th>`;
  }).join("")}<th>Total</th></tr>`;
  for (const dn of discOrder) {
    const rowTotal = discCount[dn];
    const dInfo = DISC_INFO[dn];
    const dCell = dInfo ? `<span class="tipname" data-tip="${escTip(dInfo)}">${dn}</span>` : dn;
    h += `<tr><td class="xname" style="color:${discColor(dn)}">${dCell}</td>` + seniorities.map(sn=>{
      const key = dn+"|"+sn, n = cell[key]||0, sel = selCells.has(key);
      return `<td class="mcell ${sel?'xsel':''}" style="background:${sel?'':heat(n)}" ${n?`onclick="toggleCell('${dn.replace(/'/g,"\\'")}','${sn}')"`:''}>${n||""}</td>`;
    }).join("") + `<td class="xtot">${rowTotal}</td></tr>`;
  }
  h += `</table></div></div>`;
  var _mw = document.getElementById("matrixWrap"); _mw.innerHTML = h; _mw.classList.toggle("mcollapsed", matrixCollapsed()); try{ mxFadeSync(); }catch(e){}
}

// Dashboard matrix: same grid + multi-select + instant filter as renderMatrix, but each cell can be
// re-coloured by Jobs / Median pay / Remote % / Fresh, and hovering a cell shows all four at once.
// All four are computed from jobs already loaded — no scraper changes, no historical data.
function renderMatrixDash(base){
  const SEN_ORDER = ["Entry","Mid","Senior","Lead","Director+"];
  const seniorities = SEN_ORDER.filter(sn => base.some(j=>j.sen===sn));
  const discCount = {}; for (const j of base) discCount[j.d] = (discCount[j.d]||0)+1;
  const discOrder = Object.keys(discCount).sort((a,b)=>discCount[b]-discCount[a]);
  // per-cell aggregates
  const WK = Date.now() - 7*864e5, MIN_PAY = 3;
  const agg = {};
  for (const j of base){
    const k = j.d+"|"+j.sen;
    const a = agg[k] || (agg[k] = { n:0, pays:[], rem:0, fresh:0, studios:{} });
    a.n++;
    const pv = mtxParsePay(j.salary); if (pv) a.pays.push(pv);
    if (j.w==="Remote") a.rem++;   // fully-remote only — hybrid is not lumped in
    const seen = j.fseen || j.ts || 0; if (seen && seen >= WK) a.fresh++;
    if (j.s) a.studios[j.s] = (a.studios[j.s]||0) + 1;
  }
  const der = {}; let maxN=1, maxPay=1, maxFresh=1;
  for (const k in agg){ const a=agg[k];
    const pay = a.pays.length>=MIN_PAY ? mtxMedian(a.pays) : null;
    const top = Object.entries(a.studios).sort((x,y)=>y[1]-x[1]).slice(0,3).map(e=>e[0]);
    der[k] = { n:a.n, pay, payAny:(a.pays.length?mtxMedian(a.pays):null), paysN:a.pays.length, rem:a.n?Math.round(100*a.rem/a.n):0, fresh:a.fresh, top };
    if (a.n>maxN) maxN=a.n; if (pay&&pay>maxPay) maxPay=pay; if (a.fresh>maxFresh) maxFresh=a.fresh;
  }
  const RGB = { n:"88,166,255", pay:"210,153,34", rem:"63,185,80", fr:"163,113,247" };
  const cellBg = d => {
    let v, mx;
    if (matrixMetric==="n"){ v=d.n; mx=maxN; }
    else if (matrixMetric==="pay"){ if(!d.pay) return "rgba(139,148,158,.05)"; v=d.pay; mx=maxPay; }
    else if (matrixMetric==="rem"){ v=d.rem; mx=100; }
    else { v=d.fresh; mx=maxFresh; }
    if (!v) return "transparent";
    return `rgba(${RGB[matrixMetric]},${(0.10 + 0.55*Math.sqrt(v/mx)).toFixed(3)})`;
  };
  // Three different marks used to mean three different kinds of "nothing", with no way to tell them
  // apart: "·" for a cell whose roles publish no salary, a bare blank for a cell with no NEW roles,
  // and (after the empty-cell fix) "0" for a cell with no roles at all. Now there are exactly two
  // symbols and they never overlap:
  //   –   no roles in this combination at all        (drawn by the mcell-empty branch below)
  //   ·   roles exist, but this metric is unknown    (only possible for Pay: nobody published one)
  //   0   roles exist and the metric is really zero  (Fresh: none new this week)
  // A blank cell is now impossible, which is the point — blank was doing three jobs at once.
  const cellTxt = d => {
    if (matrixMetric==="n") return d.n||"0";
    if (matrixMetric==="pay") return d.pay ? "$"+d.pay+"K" : "·";
    if (matrixMetric==="rem") return d.n ? d.rem+"%" : "0%";
    return d.fresh ? "+"+d.fresh : "0";
  };
  const lenses = [["n","Jobs"],["pay","Pay"],["rem","Remote"],["fr","Fresh"]];
  // The lens lives in the matrix title row (not a page-level toggle): a quiet "View by" segmented
  // control bound to this chart. stopPropagation so tapping it doesn't collapse the matrix.
  const lensBar = `<div class="mtx-lensbar" onclick="event.stopPropagation()"><span class="mtx-lens-label">View by</span><span class="mtx-lenses">`
    + lenses.map(([m,l])=>`<button type="button" class="mtx-lens ${matrixMetric===m?'on':''}" onclick="setMatrixMetric('${m}')">${l}</button>`).join("")
    + `</span></div>`;
  let h = `<div class="matrixhead" onclick="matrixToggle()"><div class="mh-text"><h2 class="hx mh-title">Where are the jobs right now?</h2><span class="mhint">Tap cells to filter<span class="hoverhint"> · hover any cell for detail</span><span class="swipehint"> · swipe →</span></span></div>${lensBar}<span class="mh-toggle" id="mhToggle" aria-hidden="true">${matrixCollapsed()?"▸":"▾"}</span></div>`;
  const _mw = document.getElementById("matrixWrap");
  _mw.classList.toggle("mtx-dash", MATRIX_RESTYLE);
  if (!discOrder.length){ _mw.innerHTML = h + `<div class="xhint">No roles in the current filters.</div>`; _mw.classList.toggle("mcollapsed", matrixCollapsed()); return; }
  h += `<div class="matrixbody">`;
  // table-layout:fixed → seniority columns are equal AND fill the width (so a long "Director+" header
  // can't stretch one column), with a tight name column and no dead space. min-width keeps the grid
  // horizontally scrollable on phones instead of squeezing the cells.
  h += `<div class="mxscroll" style="overflow-x:auto"><table class="xtab" style="table-layout:fixed;width:100%;min-width:540px"><tr><th style="width:156px"></th>${seniorities.map(sn=>{
    const info = SEN_INFO[sn];
    return info ? `<th class="senh" data-tip="${escTip(info)}"><span>${sn}</span></th>` : `<th>${sn}</th>`;
  }).join("")}<th style="width:56px">Total</th></tr>`;
  for (const dn of discOrder){
    const dInfo = DISC_INFO[dn];
    const dCell = dInfo ? `<span class="tipname" data-tip="${escTip(dInfo)}">${dn}</span>` : dn;
    h += `<tr><td class="xname" style="color:${discColor(dn)};overflow:hidden;text-overflow:ellipsis">${dCell}</td>` + seniorities.map(sn=>{
      const key = dn+"|"+sn, d = der[key], sel = selCells.has(key);
      // A blank cell reads as a rendering fault — as though the number failed to load. This says
      // "nothing here" instead. An en dash rather than a 0 because this mark has to survive all four
      // lenses: "0" is honest under Jobs and Fresh, but under Pay it reads as "$0K" and under Remote
      // as "0% remote", both of which are claims about roles that do not exist. Deliberately not
      // clickable — filtering to a combination with nothing in it just produces an empty board.
      if (!d) return `<td class="mcell mcell-empty" data-tip="${escTip(`<b>${dn} · ${sn}</b><br><span style="color:var(--muted)">No open roles in this combination right now.</span>`)}">–</td>`;
      const payTxt = d.pay ? `$${d.pay}K median` : (d.paysN ? `~$${d.payAny}K · ${d.paysN} role${d.paysN===1?'':'s'} list${d.paysN===1?'s':''} pay` : `no salary data`);
      const tip = `<b>${dn} · ${sn}</b><br>`
        + `<span style="color:var(--gold)">${payTxt}</span> · `
        + `<span style="color:var(--green)">${d.rem}% remote</span> · `
        + `<span style="color:var(--purple)">+${d.fresh} new this week</span>`
        + `<span style="color:var(--muted)"> · ${d.n} role${d.n===1?'':'s'}</span>`
        + (d.top.length ? `<br><span style="color:var(--muted)">Top hiring: </span><span style="color:var(--accent)">${d.top.join(", ")}</span>` : "");
      return `<td class="mcell ${sel?'xsel':''}" style="background:${sel?'':cellBg(d)}" data-tip="${escTip(tip)}" onclick="toggleCell('${dn.replace(/'/g,"\\'")}','${sn}')">${cellTxt(d)}</td>`;
    }).join("") + `<td class="xtot">${discCount[dn]}</td></tr>`;
  }
  h += `</table></div></div>`;
  // Preserve the horizontal scroll position across the re-render (tapping a cell calls render(),
  // which rebuilds this innerHTML — without this the grid snaps back to the left, very jarring on mobile).
  const _prevScroll = (function(){ var s = _mw.querySelector(".mxscroll"); return s ? s.scrollLeft : 0; })();
  _mw.innerHTML = h; _mw.classList.toggle("mcollapsed", matrixCollapsed()); try{ mxFadeSync(); }catch(e){}
  if (_prevScroll){ var _ns = _mw.querySelector(".mxscroll"); if (_ns) _ns.scrollLeft = _prevScroll; }
}

function renderQuickbar(newCount){
  const regions = ["North America","Europe","Asia-Pacific"];

  let chips = "";
  // Region scope (the geo default) folded into the quick-filters row, replacing the old banner.
  // When scoped, this chip clears to worldwide; when worldwide with a known home region, it re-scopes.
  if (REGION_SCOPE) {

  } else if (typeof HOME_REGION !== "undefined" && HOME_REGION) {

  }

var _mobReordered = false;
