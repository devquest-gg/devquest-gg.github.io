      // rather than starting over. Text is only a fallback for anything not yet tagged.
      if(tabBtn){ track("view", {tab: tabBtn.getAttribute("data-view") || (tabBtn.textContent||"").replace(/[^a-z]/gi,"").toLowerCase()}); return; }
      var moreBtn = t.closest && t.closest("#moreTabs button");
      if(moreBtn){ track("view", {tab: moreBtn.getAttribute("data-view")||"more"}); return; }
      var a = t.closest && t.closest("a");
      if(!a) return;
      if(a.classList.contains("knowbtn")) track("who_do_i_know",{});
      else if(a.classList.contains("dircard")||a.classList.contains("dirrow")) track("directory_click",{st:a.getAttribute("data-st")||""});
      else if(a.classList.contains("moonchip")) track("moon_click",{st:a.getAttribute("data-st")||""});
      else if(a.closest("#jobs")) track("apply_click",{});
    }catch(_){}
  }, true);

  // ---------- "Email me these roles" signup widget ----------
  function escapeH(s){ return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function val(id){ var e=document.getElementById(id); return e?e.value:""; }
  function chk(id){ var e=document.getElementById(id); return !!(e&&e.checked); }
  function setArr(name){ try{ return Array.from(eval(name)); }catch(e){ return []; } }

  function readCriteria(){
    var c={};
    c.q=(val("q")||"").trim(); c.region=val("region"); c.age=val("age");
    c.hidePools=chk("hidePools");
    try{ c.quickRemote=!!quickRemote; }catch(e){ c.quickRemote=false; }
    try{ c.cells=Array.from(selCells); }catch(e){ c.cells=[]; }
    try{ c.subs=Array.from(selSubs); }catch(e){ c.subs=[]; }
    try{ c.studios=Array.from(selStudios); }catch(e){ c.studios=[]; }
    try{ c.countries=Array.from(selCountries); }catch(e){ c.countries=[]; }
    try{ c.regionsQuick=Array.from(selRegionsQuick); }catch(e){ c.regionsQuick=[]; }
    try{ c.hubs=Array.from(selHubs); }catch(e){ c.hubs=[]; }
    // Sidebar Discipline / Work type / Seniority checkboxes (were previously missed by alerts).
    try{ c.disc=checked("f-d"); c.work=checked("f-w"); c.sen=checked("f-s"); }catch(e){ c.disc=[]; c.work=[]; c.sen=[]; }
    return c;
  }
  function hasFilters(c){
    return !!(c.q||c.region||c.quickRemote||(c.cells&&c.cells.length)||(c.subs&&c.subs.length)||
      (c.studios&&c.studios.length)||(c.countries&&c.countries.length)||(c.regionsQuick&&c.regionsQuick.length)||(c.hubs&&c.hubs.length)||
      (c.disc&&c.disc.length)||(c.sen&&c.sen.length)||(c.work&&c.work.length));
  }
  // "structured" = filters other than the free-text box. A zero-result on a typed query
  // ("Rito") must NOT offer an alert (it would never fire); only clean filter sets do.
  function hasStructured(c){
    return !!(c.region||c.quickRemote||(c.cells&&c.cells.length)||(c.subs&&c.subs.length)||
      (c.studios&&c.studios.length)||(c.countries&&c.countries.length)||(c.regionsQuick&&c.regionsQuick.length)||(c.hubs&&c.hubs.length)||
      (c.disc&&c.disc.length)||(c.sen&&c.sen.length)||(c.work&&c.work.length));
  }
  function labelFor(c){
    var p=[];
    (c.cells||[]).slice(0,3).forEach(function(k){ var x=k.split("|"); p.push((x[1]?x[1]+" ":"")+x[0]); });
    (c.sen||[]).slice(0,2).forEach(function(x){ p.push(x); });
    (c.disc||[]).slice(0,2).forEach(function(x){ p.push(x); });
    (c.work||[]).slice(0,1).forEach(function(x){ p.push(x); });
    (c.subs||[]).slice(0,2).forEach(function(s){ p.push(s); });
    (c.studios||[]).slice(0,2).forEach(function(s){ p.push(String(s).replace(/^@/,"")); });
    if(c.quickRemote) p.push("Remote");
    (c.regionsQuick||[]).slice(0,1).forEach(function(r){ p.push(r); });
    if(c.region) p.push(c.region);
    (c.countries||[]).slice(0,1).forEach(function(x){ p.push(x); });
    if(c.q) p.push('"'+c.q+'"');
    var l=p.join(" · "); if(l.length>90) l=l.slice(0,87)+"…"; return l||"matching";
  }

  var bar=document.createElement("div");
  bar.id="alertBar";
  bar.style.cssText="display:none;margin:10px 0 8px;padding:11px 14px;border:1px solid #2a3a28;border-radius:8px;background:#141816";
  var jobsEl=document.getElementById("jobs");
  if(jobsEl&&jobsEl.parentNode) jobsEl.parentNode.insertBefore(bar, jobsEl);

  var _seenBar = {};
  function buildCta(label, c, n, fresh){
    var subbed=false; try{ subbed=!!store.get("luj-subscribed",0); }catch(e){}
    // The shared one-ask budget: hide entirely if not subscribed and we're in the quiet window / capped.
    if(!subbed && !canAskEmail()){ bar.style.display="none"; bar.removeAttribute("data-state"); window.__emailAskActive=false; return; }
    bar.setAttribute("data-state","cta"); bar.style.display="block";
    // Impression = the denominator for every conversion rate below. Deduped per distinct
    // search per page load, because renderBar fires on every single filter change.
    try{ if(!_seenBar[label]){ _seenBar[label]=1; track("alert_bar_shown",{ sub: subbed?1:0, n:(typeof n==="number"?n:null) }); } }catch(e){}
    if(subbed){
      // Already subscribed on this device: go quiet, but stay available so they can add an
      // alert for a NEW search. Muted styling, low-key "+ Add alert" instead of the loud prompt.
      var qmsg = (n===0)
        ? 'You\'re set up. Get notified when a <b style="color:#9fb499">'+escapeH(label)+'</b> role opens?'
        : 'You\'re set up. Want alerts for <b style="color:#9fb499">'+escapeH(label)+'</b> too?';
      bar.innerHTML='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#7a8878;font-size:13px">'+
        '<span>'+qmsg+'</span>'+
        '<button id="alertCta" style="margin-left:auto;background:transparent;color:#58a6ff;border:0;font-size:13px;font-weight:600;cursor:pointer;padding:2px 4px">'+(n===0?'+ Notify me':'+ Add alert')+'</button>'+
        (window.dqManageUrl && window.dqManageUrl() ? '<a href="'+window.dqManageUrl()+'" target="_blank" rel="noopener" style="color:#7a8878;font-size:12.5px;text-decoration:none;padding:2px 4px">\u2699 Manage</a>' : '')+'</div>';
      var qbtn=document.getElementById("alertCta"); if(qbtn) qbtn.onclick=function(){ openForm(label, c, "readd"); };
      window.__emailAskActive=false;
      return;
    }
    var msg, btnLabel;
    if(n===0){
      msg = fresh
        ? '📬 Get new <b>'+escapeH(label)+'</b> roles the moment they open — by Discord DM, or one email a week.'
        : '🔔 No <b>'+escapeH(label)+'</b> roles open right now — we\'ll tell you when one does.';
      btnLabel='Notify me of new jobs';
    } else {
      msg = fresh
        ? '📬 <b style="color:#fff">'+n+' new '+escapeH(label)+'</b> role'+(n===1?'':'s')+' this week. Get told the moment fresh ones open.'
        : '🔔 <b style="color:#fff">'+n+' '+escapeH(label)+'</b> role'+(n===1?'':'s')+' '+(n===1?'matches':'match')+'. Get notified as new ones open.';
      btnLabel='Notify me of new jobs';
    }
    bar.innerHTML='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#d0dcc8">'+
      '<span style="font-size:14px;flex:1;min-width:180px">'+msg+'</span>'+
      '<button id="alertCta" style="background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer">'+btnLabel+'</button>'+
      '<button id="alertDismiss" data-tip="Not now" aria-label="Dismiss" style="background:transparent;color:#6e7681;border:0;font-size:16px;line-height:1;cursor:pointer;padding:2px 6px">×</button></div>';
    var btn=document.getElementById("alertCta"); if(btn) btn.onclick=function(){ openForm(label, c, fresh ? "hotjobs" : "filter"); };
    var dis=document.getElementById("alertDismiss"); if(dis) dis.onclick=function(){ try{dismissEmailAsk();}catch(e){} bar.style.display="none"; bar.removeAttribute("data-state"); window.__emailAskActive=false; };
    window.__emailAskActive=true;
  }
  function openForm(label, c, src){
    bar.setAttribute("data-state","form");
    try{ track("alert_form_open",{ src: src||"filter" }); }catch(e){}
    // Real checkboxes, not styled chips. The chip version read as decoration — people could
    // not tell they were selectable. Each option carries a plain-language line saying what
    // actually arrives, including the honest downside (cadence).
    var ROW = "display:flex;gap:9px;align-items:flex-start;cursor:pointer";
    var TTL = "font-size:13.5px;font-weight:600;color:#d0dcc8;line-height:1.3";
    var SUB = "font-size:12px;color:#7a8878;line-height:1.45;margin-top:2px";
    var CBX = "margin-top:2px;width:16px;height:16px;accent-color:#1f6feb;flex:none;cursor:pointer";
    bar.innerHTML='<form id="alertForm" style="display:flex;flex-direction:column;gap:12px;color:#d0dcc8">'+
      '<div style="font-size:14px">🔔 Notify me about new <b>'+escapeH(label)+'</b> roles:</div>'+

      '<label style="'+ROW+'"><input type="checkbox" id="chEmail" checked style="'+CBX+'">'+
        '<span><span style="'+TTL+'">✉ Email</span>'+
        '<div style="'+SUB+'">One email a week listing new roles that match this search. Nothing sent in a week with no matches.</div></span></label>'+

      '<div id="emailBlock" style="display:flex;flex-direction:column;gap:8px;margin:-4px 0 0 25px">'+
        '<input id="alertEmail" type="email" placeholder="you@email.com" style="padding:8px 10px;border:1px solid #2a3a28;border-radius:6px;background:#0d0f0e;color:#d0dcc8">'+
        '<label style="font-size:12px;color:#7a8878;display:flex;gap:6px;align-items:flex-start"><input id="alertConsent" type="checkbox" style="margin-top:2px;accent-color:#1f6feb">I agree to receive a weekly job-alert email. Unsubscribe anytime; no spam.</label>'+
        (TURNSTILE_SITEKEY?'<div id="alertTurnstile"></div>':'')+
      '</div>'+

      '<label style="'+ROW+'"><input type="checkbox" id="chDisc" style="'+CBX+'">'+
        '<span><span style="'+TTL+'">💬 Discord DM</span>'+
        '<div style="'+SUB+'">A direct message within minutes of a matching role going up — no waiting for the weekly. Adds you to the DevQuest Discord, and sends at most a few messages a day.</div></span></label>'+

      '<button type="submit" id="alertGo" style="background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer">Turn on alerts</button>'+
      '<div id="alertMsg" style="font-size:13px;min-height:16px"></div></form>';

    var chEmail=document.getElementById("chEmail"), chDisc=document.getElementById("chDisc");
    var emailBlock=document.getElementById("emailBlock"), go=document.getElementById("alertGo");
    function paint(){
      emailBlock.style.display = chEmail.checked ? "flex" : "none";
      go.textContent = (chEmail.checked && chDisc.checked) ? "Turn on both"
                     : (chDisc.checked && !chEmail.checked) ? "Continue with Discord" : "Turn on alerts";
      go.style.background = (chDisc.checked && !chEmail.checked) ? "#5865F2" : "#1f6feb";
    }
    chEmail.onchange=paint; chDisc.onchange=paint; paint();

    _tsWidget=null;
    mountTurnstile("alertTurnstile", "alertMsg", function(id){ _tsWidget = id; });

    function goDiscord(){
      try{ track("alert_signup",{ src:(src||"filter")+"_discord", ch:"discord" }); }catch(e){}
      // Stash the search before handing off. If OAuth fails, or they close Discord's consent
      // screen, they return here with nothing to show for it — and on a Discord-only signup we
      // have no email address to send a recovery link to. This is the recovery.
      try{ store.set("dq-pending-discord", { c:c, label:label, ts:Date.now() }); }catch(e){}
      location.href = ALERTS_API+"/discord/start?criteria="+encodeURIComponent(JSON.stringify(c))+"&label="+encodeURIComponent(label);
    }

    document.getElementById("alertForm").onsubmit=function(ev){
      ev.preventDefault();
      var msg=document.getElementById("alertMsg");
      if(!chEmail.checked && !chDisc.checked){ msg.textContent="Tick at least one way to be notified."; msg.style.color="#c87878"; return; }
      if(!chEmail.checked){ goDiscord(); return; }   // Discord only: nothing to validate or POST

      var email=document.getElementById("alertEmail").value.trim();
      if(!email || email.indexOf("@")<1){ msg.textContent="Enter a valid email."; msg.style.color="#c87878"; return; }
      if(!document.getElementById("alertConsent").checked){ msg.textContent="Please tick the consent box."; msg.style.color="#c87878"; return; }
      var tsToken="";
      if(TURNSTILE_SITEKEY){
        try{ tsToken=window.turnstile?window.turnstile.getResponse(_tsWidget):""; }catch(e){ tsToken=""; }
        if(!tsToken && (_tsFailed || !window.turnstile)){ msg.textContent="Couldn't load the security check — an ad blocker, privacy extension or network filter may be blocking it."; msg.style.color="#c87878"; return; }
        if(!tsToken){ msg.textContent="Just a sec — finishing a quick security check. Tap again."; msg.style.color="#c87878"; return; }
      }
      var alsoDisc=chDisc.checked;
      msg.textContent="Sending…"; msg.style.color="#7a8878";
      track("alert_signup",{ src: src || "filter", ch: alsoDisc ? "both" : "email" });
      fetch(ALERTS_API+"/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email,criteria:c,label:label,token:tsToken})})
        .then(function(r){ return r.json().catch(function(){return{};}).then(function(j){ return {ok:r.ok,j:j}; }); })
        .then(function(res){
          if(res.ok&&res.j&&res.j.ok){
            try{ store.set("luj-subscribed",1); }catch(e){}
            // Email first, THEN navigate — leaving the page kills an in-flight fetch, so the
            // Discord hop has to wait for /subscribe to actually come back ok.
            if(alsoDisc){ msg.textContent="Email alert created. Sending you to Discord…"; msg.style.color="#7a8878"; goDiscord(); return; }
            bar.setAttribute("data-state","done");
            // "Almost there" is load-bearing: offerFollowAlert() text-matches it to know the
            // signup converted and close its modal. Do not reword it.
            bar.innerHTML='<div style="font-size:14px;color:#58a6ff">✓ Almost there. Check your inbox and click the confirmation link to start your weekly alert.</div>';
          }
          else { msg.textContent="That didn’t go through. Please try again in a moment."; msg.style.color="#c87878"; }
        }).catch(function(){ msg.textContent="Network hiccup. Please try again."; msg.style.color="#c87878"; });
    };
  }

  // compact, non-personal summary of the active filters (+ current result count) for analytics.
  function filterSummary(c){
    var cells=c.cells||[], disc=[], sen=[];
    cells.forEach(function(k){ var x=String(k).split("|"); if(x[0]&&disc.indexOf(x[0])<0)disc.push(x[0]); if(x[1]&&sen.indexOf(x[1])<0)sen.push(x[1]); });
    var regions=(c.regionsQuick||[]).slice(); if(c.region&&regions.indexOf(c.region)<0)regions.push(c.region);
    var n=(typeof window.__dqCount==="number"?window.__dqCount:null);
    return { disc:disc.slice(0,4), sen:sen.slice(0,4),
      studios:(c.studios||[]).map(function(s){return String(s).replace(/^@/,"");}).slice(0,4),
      regions:regions.slice(0,4), countries:(c.countries||[]).slice(0,4), subs:(c.subs||[]).slice(0,4),
      remote:!!c.quickRemote, q:(c.q||"").toLowerCase().slice(0,30), n:n, zero:n===0,
      gc:cells.length, sd:(c.disc||[]).length, ss:(c.sen||[]).length };  // grid-cells vs sidebar disc/sen counts
  }

  var lastSig="";
  function renderBar(){
    var c=readCriteria();
    var sig=""; try{ sig=JSON.stringify(c); }catch(e){}
    var changed=(sig!==lastSig);
    if(changed){ lastSig=sig; if(hasFilters(c)){ try{ track("filter", filterSummary(c)); }catch(e){} try{ window.__fyOnFilter && window.__fyOnFilter(c); }catch(e){} } }
    var state=bar.getAttribute("data-state");
    // Keep an open or just-submitted form while the filters are unchanged. The moment the
    // filters change, clear it so a subscriber can set up an alert for the NEW search.
    if((state==="form"||state==="done") && !changed) return;
    if(state==="form"||state==="done") bar.removeAttribute("data-state");
    var n=(typeof window.__dqCount==="number"?window.__dqCount:null);
    // No filters, or a free-text-only search that found nothing -> no email ask (the in-list
    // "no roles match" helper covers the typo case). Structured filters at zero DO get the ask.
    if(!hasFilters(c) || (n===0 && !hasStructured(c))){
      // No active filter (or a fruitless free-text search): offer a discipline-targeted ask to the
      // engaged hot-jobs crowd; otherwise stay hidden. The shared budget/cooldown is enforced in buildCta.
      var hd = window.__hotDisc;
      if (hd) { buildCta(hd, { disc: (window.__hotDiscs||[hd]) }, (window.__hotDiscNew||0), true); }
      else { bar.style.display="none"; bar.removeAttribute("data-state"); window.__emailAskActive=false; }
      return;
    }
    buildCta(labelFor(c), c, n, false);
  }

  // update the bar whenever the job list re-renders (i.e. filters changed)
  if(jobsEl){ try{ new MutationObserver(function(){ try{ renderBar(); }catch(e){} }).observe(jobsEl,{childList:true}); }catch(e){} }
  try{ renderBar(); }catch(e){}
})();
</script>
