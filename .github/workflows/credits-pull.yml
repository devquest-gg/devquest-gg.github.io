name: Credits catalogue pull (Wikidata)

# Builds credits/data/games.json + studios.json from Wikidata (CC0).
# Runs weekly, and can be run on demand from the Actions tab (Run workflow).
# This is a scheduled batch import, not a runtime call: the site serves the
# cached JSON and never live-depends on Wikidata.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start year (inclusive). Leave blank for full pull."
        required: false
      end:
        description: "End year (exclusive). Leave blank for full pull."
        required: false
  schedule:
    - cron: "0 5 * * 0"   # Sundays 05:00 UTC

permissions:
  contents: write

concurrency:
  group: credits-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull games + studios from Wikidata
        env:
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
        run: node credits/tools/pull-wikidata.js

      - name: Pull moderation studio links
        run: |
          curl -fsS https://devquest-credits-api.balesdestin.workers.dev/export/studio-links \
            -o credits/data/studio-links.json || echo '{"links":[]}' > credits/data/studio-links.json

      - name: Build site data (index + shards)
        run: node credits/tools/build-site.js

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add credits/data
          if git diff --staged --quiet; then
            echo "No catalogue changes."
          else
            git commit -m "Credits: refresh Wikidata catalogue + rebuild site data"
            # The remote can move while this runs (site uploads). Rebase onto it and retry.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && { echo "pushed"; exit 0; }
              echo "push rejected — retry $i"; sleep 5
            done
            echo "push still failing after 5 tries"; exit 1
          fi
