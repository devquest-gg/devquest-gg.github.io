name: Scrape jobs hourly

# Runs the scraper on GitHub's servers (not your PC) and commits the refreshed
# data back into the repo so the site updates. The state files (seen.json,
# trends.json) are committed too, so ghost-job ages and Pulse history persist.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        run: node scrape.js

      - name: Commit refreshed data (only if something changed)
        run: |
          git config user.name  "devquest-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.js jobs.json seen.json trends.json
          if git diff --staged --quiet; then
            echo "No changes this run."
          else
            git commit -m "data: hourly scrape"
            git push
          fi
