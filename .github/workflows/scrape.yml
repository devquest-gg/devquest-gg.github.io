name: Scrape jobs hourly

# Runs the scraper on GitHub's servers (not your PC) and commits the refreshed
# data back into the repo, so a connected static host (GitHub Pages / Cloudflare
# Pages) redeploys automatically. The state files (seen.json, trends.json) are
# committed too, so ghost-job ages and the Pulse history persist between runs.

on:
  schedule:
    # Two slots per hour so a dropped GitHub cron (they're best-effort and often
    # delayed/skipped) still leaves a second chance. The Cloudflare Worker also
    # pings workflow_dispatch hourly as the primary, reliable trigger.
    - cron: "23 * * * *"     # :23 past every hour (UTC) — off-peak slot
    - cron: "53 * * * *"     # :53 backup slot
  workflow_dispatch: {}        # adds a "Run workflow" button + lets the Worker trigger it via the API

# never let two scrapes run at once
concurrency:
  group: scrape
  cancel-in-progress: false

# allow the job to commit the refreshed data back to the repo
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so we can rebase onto main before pushing

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        run: node scrape.js

      - name: Commit refreshed data (only if something changed)
        run: |
          git config user.name  "devquest-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.js jobs.json seen.json trends.json sitemap.xml *-jobs.html jobs.html
          # The hiring report does NOT end in "-jobs.html", so the glob above misses it. It was
          # being regenerated every run, never committed, and listed in sitemap.xml regardless —
          # which pointed Google at a URL that 404s. Any future page whose name breaks the
          # "-jobs.html" convention needs adding here too.
          git add game-industry-hiring-report.html 2>/dev/null || true
          git add data/jobs 2>/dev/null || true
          git add job 2>/dev/null || true
          git add linkhealth.json 2>/dev/null || true   # apply-link health state; tolerate first-run absence
          if git diff --staged --quiet; then
            echo "No changes this run."
            exit 0
          fi
          git commit -m "data: hourly scrape $(date -u +'%Y-%m-%dT%H:%MZ')"
          # A scrape can take ~4 min, during which main may move (a site deploy, the
          # pages build, or a manual push). A bare 'git push' then fails with
          # "! [rejected] (fetch first)" and the data never lands. Rebase the data
          # commit onto the latest main and retry. The data files (jobs.*, *.json)
          # never overlap hand-edited files, so the rebase applies cleanly.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing onto origin/main and retrying..."
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "::error::Push still rejected after 5 attempts." >&2
          exit 1

      # Fast path: tell the alerts Worker that fresh jobs.json has landed, so
      # #new-jobs fills within ~2 min instead of waiting for the hourly cron.
      # The Worker's "17 * * * *" cron runs the same job as a safety net, and the
      # announced ledger makes it idempotent, so double-firing is harmless.
      - name: Announce new jobs to Discord
        if: success()
        env:
          WORKER_BASE: https://devquest-alerts.balesdestin.workers.dev
          RUN_KEY: ${{ secrets.RUN_KEY }}
        run: |
          # GitHub Pages needs a moment to publish the new jobs.json before the
          # Worker reads it. Without this the Worker sees the previous run's data.
          sleep 90
          # Never fail the workflow on a failed ping — the cron will catch it.
          curl -sS -m 30 "$WORKER_BASE/announce?key=$RUN_KEY" || echo "announce ping failed; hourly cron will catch it"
