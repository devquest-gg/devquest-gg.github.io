name: Scrape jobs hourly

on:
  schedule:
    - cron: "23 * * * *"     # :23 past every hour (UTC) — off-peak slot
    - cron: "53 * * * *"     # :53 backup slot
  workflow_dispatch: {}

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        run: node scrape.js

      - name: Commit refreshed data (only if something changed)
        run: |
          git config user.name  "devquest-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.js jobs.json seen.json trends.json
          if git diff --staged --quiet; then
            echo "No changes this run."
            exit 0
          fi
          git commit -m "data: hourly scrape $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing onto origin/main and retrying..."
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "::error::Push still rejected after 5 attempts." >&2
          exit 1
