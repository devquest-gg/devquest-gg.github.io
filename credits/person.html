<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Person · DevQuest Credits</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/credits/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  .gvtabs{display:flex;justify-content:flex-end;margin:0 0 16px}
  .gvtab{padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted,#8b98a9);cursor:pointer;border:1px solid var(--border,#2d333b);background:var(--panel,#11161d);user-select:none}
  .gvtab:first-child{border-radius:8px 0 0 8px}
  .gvtab:last-child{border-radius:0 8px 8px 0;border-left:none}
  .gvtab.on{background:#20293a;color:var(--text,#e6edf3)}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px;align-items:start}
  .ggrid.ggrid-hero{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));max-width:560px;gap:18px}
  .gvhead{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted,#8b98a9);font-weight:700;margin:2px 0 12px}
  .gvgrip{position:absolute;top:6px;left:7px;z-index:3;font-size:15px;line-height:1;color:#fff;opacity:0;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 4px;cursor:grab;transition:opacity .12s}
  .dragtile:hover .gvgrip{opacity:.9}
  .dragtile.dragging{opacity:.4}
  @media (pointer:coarse){.gvgrip{display:none}}
  .ggrid.dragover-zone{outline:2px dashed rgba(224,178,58,.5);outline-offset:4px;border-radius:12px}
  @media(max-width:600px){.ggrid.ggrid-hero{grid-template-columns:repeat(2,1fr);max-width:none}}
  .gtile{text-decoration:none;color:inherit;display:block}
  .gcov{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;display:flex;align-items:flex-end;box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 1.5px 1px rgba(255,255,255,.22), inset 0 -3px 5px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .13s ease, box-shadow .13s ease}
  .gtile:hover .gcov{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.65), inset 0 1.5px 1px rgba(255,255,255,.28), inset 0 -3px 5px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.10)}
  .gcov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .gvb{position:absolute;top:7px;right:7px;z-index:2;width:22px;height:22px;border-radius:50%;background:rgba(63,185,80,.92);color:#04220f;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .gcap{min-height:44px;margin-top:9px}
  .gtt{color:var(--text,#e6edf3);font-weight:600;font-size:12.5px;line-height:1.25;overflow-wrap:break-word}
  .gmt{display:block;color:var(--muted,#8b98a9);font-size:11.5px;margin-top:4px;line-height:1.35;overflow-wrap:break-word}
  .gmt .y{white-space:nowrap}
</style>
</head>
<body>
<div class="topbar"><div class="container">
  <div class="brand"><a class="brandhome" href="/credits/" data-tip="Back to Credits home" aria-label="DevQuest Credits home"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="12" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="12" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="23" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="23" width="8" height="8" rx="2" fill="var(--gold)"/></svg><span class="wm">Dev<span class="q">Quest</span><span class="tld">.gg</span></span></a> <span class="cr">CREDITS</span> <span class="beta">BETA</span></div>
  <div class="topnav">
    <a href="/credits/#how">How it works</a>
    <a class="back" href="/">← Jobs board</a>
  </div>
</div></div>

<div class="container">
  <div class="crumbs"><a href="/credits/">Credits</a><span class="sep">/</span><a href="search.html?tab=people">People</a><span class="sep">/</span><span id="crumb" class="mut">…</span></div>
</div>

<div id="app"><div class="container"><div class="loading">Loading profile…</div></div></div>

<footer><div class="container">
  <div><b style="color:var(--text)">DevQuest.gg / Credits</b> · a companion to the game-industry job board</div>
  <div><a href="/credits/">← Credits home</a> &nbsp;·&nbsp; <a href="mailto:studios@devquest.gg?subject=DevQuest%20Credits%20feedback&body=Bug%2C%20idea%2C%20or%20just%20a%20thought%3A%0A%0A">Feedback</a></div>
</div></footer>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var slug = DQ.qs("slug"), uname = DQ.qs("name"), app = document.getElementById("app");
  // Keep the address bar on the pretty URL (/credits/<slug>) even when reached via
  // person.html?slug=... The 404.html router redirects clean URLs here; this rewrites back.
  try { if (slug) history.replaceState(null, "", "/credits/" + encodeURIComponent(slug)); } catch (e) {}
  if(!slug){
    // No claimed slug, but a ?name= means an unclaimed person — someone a teammate
    // attributed who hasn't signed in yet. Show every title attributed to that name.
    if(uname && window.DQAPI){ renderUnclaimed(uname); return; }
    app.innerHTML = '<div class="container"><div class="empty">No person specified.</div></div>'; return;
  }

  // ---- Unclaimed profile: aggregates every pending attribution for a name ----
  function renderUnclaimed(name){
    document.getElementById("crumb").textContent = name;
    document.title = name + " · DevQuest Credits";
    var pProf = DQAPI.unclaimedProfile(name).catch(function(){ return {ok:false}; });
    var pMe = DQAPI.isSignedIn() ? DQAPI.me().catch(function(){ return {ok:false}; }) : Promise.resolve({ok:false});
    Promise.all([pProf, pMe]).then(function(res){
      var data = (res[0] && res[0].ok && res[0].data) ? res[0].data : null;
      var signedIn = !!(res[1] && res[1].ok && res[1].data && res[1].data.authenticated);
      var atts = (data && data.attributions) || [];
      var disp = (data && data.name) || name;
      document.getElementById("crumb").textContent = disp;
      document.title = disp + " · DevQuest Credits";
      if(!atts.length){
        app.innerHTML = '<div class="container"><div class="empty">No profile yet for that name.<br>'+
          '<span class="mut">People appear here once a teammate attributes a credit, or once they claim their own.</span></div></div>';
        return;
      }
      var rows = atts.map(function(a){
        return '<div class="row">'+
          '<div class="rmain"><div class="rname"><a href="/credits/game/'+encodeURIComponent(a.game_slug)+'">'+DQ.esc(a.game_title)+'</a></div>'+
            '<div class="rsub"><span class="rrole">'+DQ.esc(a.role||"Contributor")+'</span>'+
            '<span class="mut"> &nbsp;·&nbsp; added by '+DQ.esc(a.added_by_name||"a teammate")+'</span></div></div>'+
        '</div>';
      }).join("");
      var cta = '<span class="btn primary" id="claimun">This is me — claim '+(atts.length===1?'this credit':'these '+atts.length+' credits')+' →</span>';
      app.innerHTML =
        '<div class="phead"><div class="container">'+
          '<div style="display:flex;align-items:center;gap:16px">'+
            '<div class="row" style="padding:0;border:none"><div class="av" style="width:60px;height:60px;font-size:22px">'+DQ.esc(DQ.initials(disp))+'</div></div>'+
            '<div><h1 style="margin:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+DQ.esc(disp)+' <span style="font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 11px;line-height:1.4">UNCLAIMED</span></h1>'+
            '<div class="meta">Attributed by teammates · not yet claimed</div></div>'+
          '</div>'+
          '<div class="claimbanner" style="margin-top:16px"><div class="cbtext"><b>Is this you?</b> A teammate credited you on the '+(atts.length===1?'game':'games')+' below. Claim this page to confirm your credits, add the rest of what you shipped, and get peer-vouched.</div>'+cta+'</div>'+
        '</div></div>'+
        '<section class="blk"><div class="container">'+
          '<div class="eyebrow">Attributed credits</div>'+
          '<p class="secsub" style="margin:6px 0 14px">Titles a teammate has credited to this name. They become a verified record once claimed.</p>'+
          '<div class="rows">'+rows+'</div>'+
          '<div class="notice">These credits were added by teammates and are unclaimed. Only the person credited can claim and edit this page.</div>'+
        '</div></section>';
      var cbtn = document.getElementById("claimun");
      if(cbtn) cbtn.onclick = function(){
        if(DQAPI.isSignedIn()){
          cbtn.textContent = "Claiming…";
          var i = 0, lastSlug = null;
          (function nextClaim(){
            if(i >= atts.length){ location.href = lastSlug ? ("/credits/person.html?slug=" + encodeURIComponent(lastSlug)) : "/credits/"; return; }
            DQAPI.claimAttribution(atts[i].id).then(function(rr){ if(rr.ok && rr.data && rr.data.person_slug) lastSlug = rr.data.person_slug; i++; nextClaim(); }).catch(function(){ i++; nextClaim(); });
          })();
        } else {
          try{ localStorage.setItem("dq_pending_claim_name", disp); }catch(e){}
          location.href = "signin.html";
        }
      };
    }).catch(function(e){
      app.innerHTML = '<div class="container"><div class="empty">Something went wrong loading this profile.<br><span class="mut">'+DQ.esc(e && e.message)+'</span></div></div>';
    });
  }
  var LINK_LABEL = { linkedin:"LinkedIn", portfolio:"Portfolio", artstation:"ArtStation", website:"Website", site:"Website", personal:"Website", twitter:"Twitter", x:"X", bluesky:"Bluesky", github:"GitHub", itch:"itch.io", mastodon:"Mastodon" };

  // Load the static (seed) profile + the live (API) profile + who I am, in parallel.
  var pStatic = DQ.loadEntity("people", slug).catch(function(){ return null; });
  var pApi = (window.DQAPI ? DQAPI.personCredits(slug) : Promise.resolve({ok:false})).catch(function(){ return {ok:false}; });
  var pMe  = (window.DQAPI && DQAPI.isSignedIn()) ? DQAPI.me().catch(function(){ return {ok:false}; }) : Promise.resolve({ok:false});

  Promise.all([pStatic, pApi, pMe]).then(function(res){
    var stat = res[0];
    var api  = (res[1] && res[1].ok && res[1].data && res[1].data.person) ? res[1].data : null;
    var me   = (res[2] && res[2].ok && res[2].data && res[2].data.authenticated) ? res[2].data.person : null;

    if(!stat && !api){
      document.getElementById("crumb").textContent = "Not found";
      app.innerHTML = '<div class="container"><div class="empty">No profile yet for that name.<br>'+
        '<span class="mut">People appear here once a credit is added or claimed.</span></div></div>';
      return;
    }

    var name  = (api && api.person.name) || (stat && stat.name) || slug;
    var links = (api && api.person.links && api.person.links.length) ? api.person.links : ((stat && stat.links) || []);
    var headline = (api && api.person && api.person.headline) ? api.person.headline : '';
    var isOwn = !!(me && api && me.slug === api.person.slug);

    // If a signed-in viewer is looking at someone else, fetch their own credits so we know
    // which games they *both* shipped — those are the credits the viewer can confirm/vouch for.
    var pMyGames = (me && api && me.slug !== api.person.slug)
      ? DQAPI.personCredits(me.slug).then(function(r){ var s={}; (((r.data&&r.data.credits)||[])).forEach(function(c){ s[c.game_slug]=1; }); return s; }).catch(function(){ return {}; })
      : Promise.resolve({});

    // Merge credits by game_slug — live (API) wins over seed (static).
    var byGame = {};
    ((stat && stat.credits) || []).forEach(function(c){ byGame[c.game_slug] = { game_slug:c.game_slug, game_title:c.game_title, year:c.year||null, studio:c.studio||null, role:c.role, roles_other:c.roles_other||[], verification:c.verification||[], vouch_count:0, live:false }; });
    ((api && api.credits) || []).forEach(function(c){ byGame[c.game_slug] = { id:c.id, game_slug:c.game_slug, game_title:c.game_title, year:c.year||null, studio:c.studio||null, role:c.role, roles_other:c.roles_other||[], verification:c.verification||[], links:c.links||[], position:(c.position!=null?c.position:null), releases:c.releases||[], vouch_count:c.vouch_count||0, voucher_slugs:c.voucher_slugs||[], partial:!!c.partial, live:true }; });
    var credits = Object.keys(byGame).map(function(k){ return byGame[k]; });

    // Resolve missing launch years from the static catalogue (added games already
    // carry a year; catalogue games get theirs from the shard), then sort + render.
    // Admin-set covers for games without a Steam capsule (instant, ahead of the next rebuild).
    var _coverSlugs = credits.map(function(c){ return c.game_slug; });
    var pCovers = (_coverSlugs.length && window.DQAPI && DQAPI.gameCovers) ? DQAPI.gameCovers(_coverSlugs).then(function(r){ return (r.data && r.data.covers) || {}; }).catch(function(){ return {}; }) : Promise.resolve({});
    Promise.all([ Promise.all(credits.map(function(c){
      return DQ.loadEntity("games", c.game_slug).then(function(gg){ if(gg){ if(c.year==null && gg.year!=null) c.year = gg.year; if(gg.steam) c.steam = gg.steam; if(gg.cover) c.cover = gg.cover; } }).catch(function(){});
    })), pMyGames, pCovers ]).then(function(_res){
    var myGames = _res[1] || {};
    var _covMap = _res[2] || {};
    credits.forEach(function(c){ if(_covMap[c.game_slug]) c.cover = _covMap[c.game_slug]; });
    // Credits on games the viewer also shipped, that they haven't confirmed yet.
    var confirmable = credits.filter(function(c){ return me && !isOwn && c.live && c.id && myGames[c.game_slug] && (c.voucher_slugs||[]).indexOf(me.slug) < 0; });
    credits.sort(function(a,b){
      var pa=(a.position!=null)?a.position:1e9, pb=(b.position!=null)?b.position:1e9;
      if(pa!==pb) return pa-pb;
      return (b.year||0)-(a.year||0) || String(a.game_title).localeCompare(String(b.game_title));
    });

    document.title = name + " · DevQuest Credits";
    document.getElementById("crumb").textContent = name;

    // ---- Career Snapshot: honest, computable, ungameable stats only ----
    var years = credits.map(function(c){ return c.year; }).filter(function(y){ return y; });
    var minY = years.length ? Math.min.apply(null, years) : null;
    var maxY = years.length ? Math.max.apply(null, years) : null;
    // Show the honest first-to-latest release range as a plain fact, NOT a "years shipping"
    // count: a min-to-max span falsely implies continuous activity, misreading career gaps or
    // breaks as either inactivity or overstated tenure. Recent unshipped work is surfaced too.
    var relRange = (minY && maxY) ? (minY===maxY ? String(minY) : (minY+'–'+maxY)) : '';
    var liveCount = credits.filter(function(c){ return (c.releases||[]).some(function(rl){ return DQ.releaseClass(rl)==="live"; }); }).length;
    var unshippedCount = (api && api.person && typeof api.person.unshipped === "number") ? api.person.unshipped : 0;
    function snapStat(n, label, sub){ return '<div class="snap"><b>'+n+'</b><span>'+label+(sub?' <em>'+sub+'</em>':'')+'</span></div>'; }
    var snapItems = credits.length ? (
        snapStat(credits.length, 'shipped '+(credits.length===1?'game':'games')) +
        (relRange ? snapStat(relRange, 'release '+(minY===maxY?'year':'years')) : '') +
        (liveCount>0 ? snapStat(liveCount, 'live-service '+(liveCount===1?'title':'titles')) : '') +
        (unshippedCount>0 ? snapStat(unshippedCount, 'cancelled / unshipped') : '')
      ) : '';
    var snapshotHTML = snapItems ? '<div class="snapshot">'+snapItems+'</div>' : '';

    // ---- Claim CTA ----
    // A page with a live owner record (api present) is already claimed & curated —
    // keep the claim path available but quiet. An unclaimed seed page is the real
    // acquisition moment, so there the banner stays prominent.
    var claimed = !!api;
    var claimBanner = '';
    // Only signed-out visitors see a claim prompt — a signed-in person is not this page's subject.
    if(!me && window.DQAPI){
      claimBanner = claimed
        ? '<div class="claimquiet">Is this your page? <span id="claimbtn">Sign in to edit →</span></div>'
        : '<div class="claimbanner"><div class="cbtext"><b>Is this you?</b> Claim this page to edit your credits, add the games you shipped, and get peer-vouched by teammates.</div><span class="btn primary" id="claimbtn">Claim this page →</span></div>';
    }

    var rowsHTML = credits.length ? '<div class="rows">' + credits.map(function(c){
      // State the rule once (in the footer note); mark only the exceptions here.
      // Self-provided signals (LinkedIn self, etc.) are dropped from the row —
      // they're implied by "self-reported" + the proof link. Only genuine
      // third-party signals and peer vouches earn a visible mark.
      var sigs = (c.verification||[]).filter(function(s){ return String(s).indexOf("_self")===-1; }).map(function(s){ return '<span class="sig">'+DQ.esc(DQ.SIG_LABEL[s]||s)+'</span>'; }).join("");
      var others = c.roles_other || [];
      var more = others.length ? ' <span class="rmore2" style="color:var(--muted);font-weight:400">· also '+DQ.esc(others.join(", "))+'</span>' : '';
      // Named releases (ports + expansions) and the live-service era are one flat bucket.
      // The asterisk (partial scope) is the only thing that ranks them: "Worked on" for a
      // scoped credit, "Also worked on" for a base-game credit. No ports-vs-expansions split.
      var rels = DQ.uniq(c.releases || []);
      var relNamed = rels.filter(function(r){ var k=DQ.releaseClass(r); return k==="port"||k==="content"; });
      var didWork = relNamed.slice();
      if(rels.some(function(r){ return DQ.releaseClass(r)==="live"; })) didWork.push("the live-service era");
      var isExternal = rels.some(function(r){ return DQ.releaseClass(r)==="xdev"; });
      var workList = didWork.length ? DQ.esc(didWork.join(", ")) : "";
      var workBody = isExternal
        ? (workList ? "Worked as an outsourcer on: "+workList : "Worked as an outsourcer")
        : (workList ? (c.partial?"Worked on: ":"Also worked on: ")+workList : "");
      var workNote = workBody ? '<div class="relnote" style="font-size:11px;font-weight:400;color:var(--muted);margin-top:3px">'+workBody+'</div>' : '';
      var seal = c.vouch_count
        ? ' <span class="vseal" title="Verified by '+c.vouch_count+' teammate'+(c.vouch_count===1?'':'s')+' who shipped this game" aria-label="Peer-verified by '+c.vouch_count+' teammate'+(c.vouch_count===1?'':'s')+'">✓</span>'
        : '';
      var ast = c.partial ? ' <span class="ast" style="color:var(--muted);font-weight:700;cursor:help" title="Worked on a specific part, not the base game" aria-label="Worked on a specific part, not the base game">*</span>' : '';
      var trust = (!c.vouch_count && isOwn && c.live && c.id)
        ? '<a class="getconf" href="/credits/game/'+encodeURIComponent(c.game_slug)+'" title="Add the teammates you shipped with; once they claim, they can confirm this credit">Get confirmed →</a>'
        : '';
      var proof = (c.links && c.links.length) ? '<a class="proofln" href="'+DQ.esc(DQ.safeUrl(c.links[0]))+'" target="_blank" rel="noopener noreferrer" title="Source for this credit (self-reported): '+DQ.esc(c.links.join(", "))+'" aria-label="View source for this credit">↗</a>' : '';
      var grip = (isOwn && c.live && c.id && credits.length>1)
        ? '<span class="drag-grip" title="Drag to reorder" style="cursor:grab;color:var(--muted);font-size:16px;line-height:1;user-select:none;padding:0 10px 0 2px">⠿</span>'
        : '';
      var editAttrs = 'data-id="'+c.id+'" data-role="'+DQ.esc(c.role||"")+'" data-others="'+DQ.esc((c.roles_other||[]).join(", "))+'" data-links="'+DQ.esc((c.links||[]).join("\n"))+'" data-releases="'+DQ.esc((c.releases||[]).join(", "))+'" data-partial="'+(c.partial?"1":"")+'"';
      // Owner nudge: a claimed credit still sitting at the "Contributor" placeholder (or blank)
      // gets an invite to set a real title — the common case after claiming a teammate's add.
      var isPlaceholderRole = isOwn && c.live && c.id && (!String(c.role||"").trim() || /^contributor$/i.test(String(c.role||"").trim()));
      var roleHTML = isPlaceholderRole
        ? '<span class="rrole" style="color:var(--muted)">'+DQ.esc(c.role||"Role not recorded")+'</span> <a class="editcredit" '+editAttrs+' style="color:var(--gold);font-weight:700;font-size:12px;cursor:pointer">+ add your real title</a>'
        : '<span class="rrole">'+DQ.esc(c.role||"Role not recorded")+'</span>';
      // Viewer who shipped this same game can confirm this credit right from the profile.
      var iVouchedThis = !!(me && (c.voucher_slugs||[]).indexOf(me.slug) >= 0);
      var canConfirm = !!(me && !isOwn && c.live && c.id && myGames[c.game_slug]);
      var confirmBtn = canConfirm
        ? (iVouchedThis
            ? '<a class="unvouchp" data-id="'+c.id+'" title="Withdraw your confirmation" style="font-size:12px;font-weight:700;color:var(--green);cursor:pointer;white-space:nowrap;margin-left:8px">✓ Confirmed</a>'
            : '<a class="vouchp" data-id="'+c.id+'" title="Confirm you shipped this game with '+DQ.esc(name)+'" style="font-size:12px;font-weight:700;color:var(--green);border:1px solid rgba(63,185,80,.4);background:rgba(63,185,80,.08);border-radius:8px;padding:4px 11px;cursor:pointer;white-space:nowrap;margin-left:8px">Confirm ✓</a>')
        : '';
      var controls = (isOwn && c.live && c.id)
        ? '<a class="editcredit" '+editAttrs+' style="color:var(--accent);font-size:12px;cursor:pointer;margin-left:10px">Edit</a>'+
          '<a class="rmvcredit" data-id="'+c.id+'" style="color:var(--pink);font-size:12px;cursor:pointer;margin-left:10px">Remove</a>'
        : '';
      return '<div class="row"'+((isOwn&&c.live&&c.id)?' data-id="'+c.id+'"':'')+'>'+
        grip +
        '<div class="rmain"><div class="rname"><a href="/credits/game/'+encodeURIComponent(c.game_slug)+'">'+DQ.esc(c.game_title)+'</a>'+ast+seal+'</div>'+
          '<div class="rsub">'+roleHTML+more+(sigs?' &nbsp; '+sigs:'')+(proof?' &nbsp; '+proof:'')+'</div>'+workNote+'</div>'+
        '<div class="rright">'+(trust?'<span style="margin-right:6px">'+trust+'</span>':'')+(c.year?'<span class="yr" title="Game release year"><span class="yrlbl">Released</span> '+c.year+'</span>':'')+confirmBtn+controls+'</div>'+
      '</div>';

      box.querySelector(".le-save").onclick = function(){
        var out = [];
        Array.prototype.forEach.call(box.querySelectorAll(".le-row"), function(r){
          var type = r.querySelector(".le-type").value;
          var url = r.querySelector(".le-url").value.trim();
          if(!url) return;
          if(!/^https?:\/\//i.test(url)) url = "https://"+url;
          out.push({ type:type, url:url });
        });
        var hl = box.querySelector(".le-headline").value.trim();
        var sbtn = this; sbtn.textContent = "Saving…";
        DQAPI.updateProfile({ headline: hl, links: out }).then(function(r){
          if(r && r.ok){ location.reload(); }
          else { sbtn.textContent = "Save profile"; alert((r && r.data && r.data.error) || "Could not save."); }
        });
      };
    }

    // ---- Owner-only unshipped/cancelled count editor (saves via PATCH /me) ----
    var usBtn = document.getElementById("editus");
    if(usBtn) usBtn.onclick = function(){
      var box = document.getElementById("usedit");
      usBtn.style.display = "none";
      box.innerHTML = '<div class="panel" style="padding:14px;margin-top:12px;max-width:440px">'+
        '<div style="font-size:12px;font-weight:700;margin-bottom:8px">Projects you worked on that were cancelled or never shipped</div>'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<input class="us-num" type="number" min="0" max="999" value="'+(unshipped||0)+'" style="width:90px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
          '<span class="mut" style="font-size:12.5px">Count only. No names are stored or shown.</span>'+
        '</div>'+
        '<div style="margin-top:12px;display:flex;gap:8px"><span class="btn primary us-save" style="padding:8px 16px">Save</span><span class="btn ghost us-cancel" style="padding:8px 16px">Cancel</span></div>'+
      '</div>';
      box.querySelector(".us-cancel").onclick = function(){ box.innerHTML=""; usBtn.style.display=""; };
      box.querySelector(".us-save").onclick = function(){
        var n = parseInt(box.querySelector(".us-num").value, 10); if(isNaN(n)||n<0) n=0; if(n>999) n=999;
        var sbtn = this; sbtn.textContent = "Saving…";
        DQAPI.updateProfile({ unshipped_count: n }).then(function(r){
          if(r && r.ok){ location.reload(); }
          else { sbtn.textContent = "Save"; alert((r && r.data && r.data.error) || "Could not save."); }
        });
      };
    };
    // Viewer confirms/vouches for this person's credit on a game they both shipped.
    Array.prototype.forEach.call(document.querySelectorAll(".vouchp"), function(el){
      el.onclick = function(){ el.textContent = "…"; DQAPI.vouch(el.dataset.id).then(function(r){ if(r.ok){ location.reload(); } else { el.textContent="Confirm ✓"; alert((r.data&&r.data.error)||"Could not confirm. You can only confirm someone on a game you also shipped."); } }).catch(function(){ el.textContent="Confirm ✓"; alert("Network error. Try again."); }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".unvouchp"), function(el){
      el.onclick = function(){ if(!confirm("Withdraw your confirmation of this credit?")) return; DQAPI.unvouch(el.dataset.id).then(function(r){ if(r.ok) location.reload(); else alert((r.data&&r.data.error)||"Could not update."); }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".rmvcredit"), function(el){
      el.onclick = function(){ if(!confirm("Remove this credit?")) return; DQAPI.deleteCredit(el.dataset.id).then(function(){ location.reload(); }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".editcredit"), function(el){
      el.onclick = function(){
        var row = el.closest(".row"), id = el.dataset.id;
        // Grab the game title (and year) from the row before we replace it, so the editor
        // shows what's being edited instead of a blank, context-free form.
        var gtEl = row.querySelector(".rname a"); var gtitle = gtEl ? gtEl.textContent : "";
        var yrEl = row.querySelector(".yr"); var gyear = yrEl ? yrEl.textContent.replace(/[^0-9]/g,"") : "";
        var curRole = el.dataset.role || "";
        row.innerHTML = '<div class="rmain" style="width:100%">'+
          '<div style="font-weight:800;font-size:16px;line-height:1.25">'+DQ.esc(gtitle)+(gyear?' <span style="font-weight:400;color:var(--muted);font-size:13px">('+DQ.esc(gyear)+')</span>':'')+'</div>'+
          '<div style="font-size:12px;color:var(--muted);margin:2px 0 14px">Editing your credit'+(curRole?' — currently listed as “'+DQ.esc(curRole)+'”':'')+'</div>'+
          '<label style="font-size:12px;font-weight:700;display:block;margin-bottom:4px">Headline role</label>'+
          '<input class="ed-role" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
          '<label style="font-size:12px;font-weight:700;display:block;margin:10px 0 4px">Other titles <span style="font-weight:400;color:var(--muted)">(comma-separated, optional)</span></label>'+
          '<input class="ed-others" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
          '<label style="font-size:12px;font-weight:700;display:block;margin:10px 0 4px">Proof links <span style="font-weight:400;color:var(--muted)">(LinkedIn, portfolio, press kit. One per line, optional)</span></label>'+
          '<textarea class="ed-proof" style="width:100%;min-height:56px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical"></textarea>'+
          '<label style="font-size:12px;font-weight:700;display:block;margin:10px 0 4px">Releases / expansions <span style="font-weight:400;color:var(--muted)">(ports, remasters, named expansions. Comma-separated, optional)</span></label>'+
          '<input class="ed-release" list="ed-release-list" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit" placeholder="PC port, Trials of Atlantis, Catacombs"><datalist id="ed-release-list"><option value="PC port"></option><option value="Console port"></option><option value="Remaster"></option><option value="DLC"></option><option value="Expansion"></option></datalist>'+
          '<label style="display:block;font-weight:400;font-size:13px;margin:8px 0;cursor:pointer"><input type="checkbox" class="ed-live" style="margin-right:7px;vertical-align:-1px">I worked on this game\'s live-service / post-launch period</label>'+
          '<label style="display:block;font-weight:400;font-size:13px;margin:8px 0;cursor:pointer"><input type="checkbox" class="ed-external" style="margin-right:7px;vertical-align:-1px">I worked on this as an outsourced or external contributor</label>'+
          '<label style="font-size:12px;font-weight:700;display:block;margin:10px 0 4px">What did you work on?</label>'+
          '<label style="display:block;font-weight:400;font-size:13px;margin:4px 0;cursor:pointer"><input type="radio" name="ed-scope" value="base" style="margin-right:7px;vertical-align:-1px">The base game <span style="color:var(--muted)">— including if you also worked on expansions, ports, or live service</span></label>'+
          '<label style="display:block;font-weight:400;font-size:13px;margin:4px 0;cursor:pointer"><input type="radio" name="ed-scope" value="partial" style="margin-right:7px;vertical-align:-1px">Only a specific part, not the base game <span style="color:var(--muted)">— a port, an expansion, or the live-service era</span></label>'+
          '<div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4">Only add work you\'re free to disclose. Leave off anything under NDA or not publicly announced.</div>'+
          '<div style="margin-top:12px;display:flex;gap:8px"><span class="btn primary ed-save" style="padding:8px 16px">Save</span><span class="btn ghost ed-cancel" style="padding:8px 16px">Cancel</span></div>'+
        '</div>';
        row.querySelector(".ed-role").value = el.dataset.role || "";
        row.querySelector(".ed-others").value = el.dataset.others || "";
        row.querySelector(".ed-proof").value = el.dataset.links || "";
        var edAll = (el.dataset.releases || "").split(",").map(function(s){return s.trim();}).filter(Boolean);
        row.querySelector(".ed-release").value = edAll.filter(function(r){ var k=DQ.releaseClass(r); return k !== "live" && k !== "xdev"; }).join(", ");
        var edLiveCk = row.querySelector(".ed-live"); if(edLiveCk) edLiveCk.checked = edAll.some(function(r){ return DQ.releaseClass(r) === "live"; });
        var edExtCk = row.querySelector(".ed-external"); if(edExtCk) edExtCk.checked = edAll.some(function(r){ return DQ.releaseClass(r) === "xdev"; });
        var scopeSel = row.querySelector('input[name="ed-scope"][value="'+(el.dataset.partial ? "partial" : "base")+'"]');
        if(scopeSel) scopeSel.checked = true;
        row.querySelector(".ed-role").focus();
        row.querySelector(".ed-cancel").onclick = function(){ location.reload(); };
        row.querySelector(".ed-save").onclick = function(){
          var nrole = row.querySelector(".ed-role").value.trim();
          if(!nrole){ alert("Role can't be empty."); return; }
          var nothers = row.querySelector(".ed-others").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
          var nlinks = row.querySelector(".ed-proof").value.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);
          var nverif = nlinks.some(function(u){return /linkedin\.com/i.test(u);}) ? ["linkedin_self"] : [];
          var nreleases = DQ.uniq(row.querySelector(".ed-release").value.split(",").map(function(s){return s.trim();}).filter(Boolean));
          var edLiveOn = row.querySelector(".ed-live");
          if(edLiveOn && edLiveOn.checked && nreleases.indexOf("Live service") === -1) nreleases.push("Live service");
          var edExtOn = row.querySelector(".ed-external");
          if(edExtOn && edExtOn.checked && nreleases.indexOf("External contributor") === -1) nreleases.push("External contributor");
          var nscopeEl = row.querySelector('input[name="ed-scope"]:checked');
          var nscope = nscopeEl ? nscopeEl.value : "base";
          var sbtn = this; sbtn.textContent = "Saving…";
          DQAPI.updateCredit(id, { role: nrole, roles_other: nothers, links: nlinks, verification: nverif, releases: nreleases, scope: nscope }).then(function(r){
            if(r && r.ok){ location.reload(); }
            else { sbtn.textContent = "Save"; alert((r && r.data && r.data.error) || "Could not save."); }
          });
        };
      };
    });
    // Drag-and-drop reorder (drag starts from the ⠿ grip so row links still click).
    (function(){
      var rowsEl = app.querySelector(".rows");
      if(!isOwn || !rowsEl) return;
      var rows = rowsEl.querySelectorAll(".row[data-id]");
      if(rows.length < 2) return;
      var dragged = null;
      Array.prototype.forEach.call(rows, function(row){
        var grip = row.querySelector(".drag-grip");
        if(grip){
          grip.addEventListener("mousedown", function(){ row.draggable = true; });
          grip.addEventListener("mouseup", function(){ setTimeout(function(){ if(!dragged) row.draggable = false; }, 0); });
        }
        row.addEventListener("dragstart", function(e){ dragged = row; row.style.opacity = ".4"; if(e.dataTransfer) e.dataTransfer.effectAllowed = "move"; });
        row.addEventListener("dragend", function(){ row.style.opacity = ""; row.draggable = false; var moved = dragged; dragged = null; if(moved) saveOrder(); });
      });
      rowsEl.addEventListener("dragover", function(e){
        if(!dragged) return;
        e.preventDefault();
        var after = afterEl(e.clientY);
        if(after == null) rowsEl.appendChild(dragged);
        else rowsEl.insertBefore(dragged, after);
      });
      function afterEl(y){
        var els = Array.prototype.slice.call(rowsEl.querySelectorAll(".row[data-id]"));
        var closest = { offset: -Infinity, el: null };
        els.forEach(function(el){ if(el === dragged) return; var b = el.getBoundingClientRect(); var off = y - b.top - b.height/2; if(off < 0 && off > closest.offset){ closest = { offset: off, el: el }; } });
        return closest.el;
      }
      function saveOrder(){
        var order = Array.prototype.map.call(rowsEl.querySelectorAll(".row[data-id]"), function(r){ return r.getAttribute("data-id"); });
        DQAPI.reorderCredits(order).then(function(){ location.reload(); });
      }
    })();
    });
  }).catch(function(e){
    app.innerHTML = '<div class="container"><div class="empty">Something went wrong loading this profile.<br><span class="mut">'+DQ.esc(e && e.message)+'</span></div></div>';
  });
})();
</script>
</body>
</html>
