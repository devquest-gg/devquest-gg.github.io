<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Person · DevQuest Credits</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/credits/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  .gvtabs{display:flex;justify-content:flex-end;margin:0 0 16px}
  .rhactions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .gvtab{padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted,#8b98a9);cursor:pointer;border:1px solid var(--border,#2d333b);background:var(--panel,#11161d);user-select:none}
  .gvtab:first-child{border-radius:8px 0 0 8px}
  .gvtab:last-child{border-radius:0 8px 8px 0}
  .gvtab + .gvtab{border-left:none}
  .gvtab.on{background:#20293a;color:var(--text,#e6edf3)}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;align-items:start}
  .ggrid.ggrid-hero{grid-template-columns:repeat(3,1fr);max-width:none;gap:20px}
  .gvhead{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted,#8b98a9);font-weight:700;margin:2px 0 12px}
  @media (pointer:coarse){.gvgrip{display:none}}
  @media(max-width:600px){.ggrid.ggrid-hero{grid-template-columns:1fr 1fr}}
  /* Cover tile: caption sits ON the art via a bottom scrim, so full titles/roles never clip. */
  .gtile{text-decoration:none;color:inherit;display:block;-webkit-user-drag:none}
  .gcov{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;display:block;background:#141b26;box-shadow:0 8px 22px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .14s ease, box-shadow .14s ease}
  .gtile:hover .gcov{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.13)}
  .gcov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;-webkit-user-drag:none;user-select:none}
  .gph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-size:12.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.30);line-height:1.3}
  .gscrim{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:34px 13px 12px;background:linear-gradient(to top,rgba(4,7,12,.95) 12%,rgba(4,7,12,.70) 55%,transparent);pointer-events:none}
  .gtt{display:block;color:#fff;font-weight:750;font-size:13.5px;line-height:1.22;margin-bottom:4px;overflow-wrap:break-word}
  .gmt{display:block;color:#cdd6e2;font-size:11.5px;line-height:1.32;overflow-wrap:break-word}
  .gmt .y{white-space:nowrap;color:#8b98a9}
  .gsub{display:block;color:#8b98a9;font-size:10.5px;margin-top:3px;line-height:1.3;overflow-wrap:break-word;font-variant-numeric:tabular-nums}
  .ggrid-hero .gsub{font-size:11.5px}
  .ggrid-hero .gtt{font-size:16px}
  .ggrid-hero .gmt{font-size:12.5px}
  .ggrid-hero .gscrim{padding:44px 15px 14px}
  .grank{display:none;position:absolute;top:6px;left:13px;z-index:2;font-size:38px;font-weight:900;color:rgba(255,255,255,.22);line-height:1;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .ggrid-hero{counter-reset:rank}
  .ggrid-hero .grank{display:block;counter-increment:rank}
  .ggrid-hero .grank::before{content:counter(rank)}
  .gvb{position:absolute;top:9px;right:9px;z-index:3;width:24px;height:24px;border-radius:50%;background:rgba(63,185,80,.95);color:#04220f;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  .gvb.peer{background:rgba(88,166,255,.96);color:#04122b} .gvb.team{background:rgba(63,185,80,.96);color:#04220f}
  .gvgrip{position:absolute;top:8px;left:9px;z-index:4;font-size:15px;line-height:1;color:rgba(255,255,255,.82);opacity:0;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 5px;cursor:grab;transition:opacity .12s}
  .dragtile:hover .gvgrip{opacity:1}
  .dragtile.dragging{opacity:.45}
  .gv-nav-lock{cursor:grabbing !important}
  /* Career snapshot as a light hairline strip (overrides the boxed cards in app.css). */
  /* width:fit-content makes the top/bottom rules hug the stats instead of spanning full width. */
  .snapshot{display:flex;gap:30px;margin:22px 0 4px;padding:16px 2px;border-top:1px solid var(--border,#2d333b);border-bottom:1px solid var(--border,#2d333b);flex-wrap:wrap;width:fit-content;max-width:100%}
  .snap{background:none;border:none;border-radius:0;padding:0;min-width:0;text-align:center}
  .snap b{font-size:27px}
  .snap span{margin-top:6px}
  /* Peer-verified strip hugs its text too, rather than stretching across the page. */
  .verifystrip{width:fit-content;max-width:100%}
  /* Peer-verification trust block — the product's core signal, so give it real presence. */
  .vblock{display:flex;gap:13px;align-items:flex-start;margin:16px 0 2px;padding:13px 17px 13px 14px;border-radius:12px;width:fit-content;max-width:560px;border:1px solid rgba(63,185,80,.42);background:rgba(63,185,80,.09)}
  .vblock .vbadge{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green,#3fb950);color:#04220f;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px;box-shadow:0 1px 5px rgba(0,0,0,.35)}
  .vblock .vlbl{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--green,#3fb950);margin-bottom:4px}
  .vblock .vtxt{font-size:13.5px;line-height:1.5;color:#cdefd5}
  .vblock .vtxt b{color:#fff;font-weight:750}
  .vblock .vtxt .mut{color:#8b98a9}
  .vblock.cta{border-color:rgba(224,178,58,.42);background:rgba(224,178,58,.08)}
  .vblock.cta .vbadge{background:var(--gold,#e0b23a)}
  .vblock.cta .vlbl{color:var(--gold,#e0b23a)}
  .vblock.cta .vtxt{color:#e8ddc4}
  /* "Known for" chip row under the headline. */
  .knownfor{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:11px 0 2px}
  .knownfor .kflabel{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted,#8b98a9);margin-right:3px}
  .kchip{font-size:12.5px;font-weight:600;color:var(--text,#e6edf3);text-decoration:none;background:var(--panel,#11161d);border:1px solid var(--border,#2d333b);border-radius:999px;padding:4px 12px;transition:border-color .12s,background .12s}
  .kchip:hover{border-color:#3b4654;background:#171d27}
  .phead .metastudio{color:var(--muted,#8b98a9);font-size:13.5px;margin-top:2px}
  /* Timeline view: year rail down the left, dots per credit, progression top to bottom. */
  .tl{margin-top:2px}
  .tlrow{display:grid;grid-template-columns:58px 22px 1fr;align-items:start}
  .tlyear{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--accent,#58a6ff);padding-top:1px}
  .tlrail{position:relative;display:flex;justify-content:center;align-self:stretch}
  .tlrail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--border,#2d333b)}
  .tlrow:first-child .tlrail::before{top:9px}
  .tlrow:last-child .tlrail::before{bottom:auto;height:9px}
  .tldot{position:relative;z-index:1;width:11px;height:11px;border-radius:50%;background:var(--accent,#58a6ff);margin-top:5px;box-shadow:0 0 0 4px var(--bg,#0b0e14)}
  .tldot.feat{background:var(--gold,#e0b23a);box-shadow:0 0 0 4px var(--bg,#0b0e14),0 0 9px rgba(224,178,58,.55)}
  .tlcard{display:flex;gap:14px;align-items:flex-start;padding:0 0 22px 14px;min-width:0}
  .tlthumb{position:relative;flex:none;width:56px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#141b26;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06);display:block}
  .tlthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tlph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:5px;text-align:center;font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.32);line-height:1.25}
  .tlbody{min-width:0}
  .tlnameline{line-height:1.3}
  .tlname{font-weight:750;font-size:15px;color:var(--accent,#58a6ff);text-decoration:none}
  .tlname:hover{color:#7cc0ff}
  .tlact{margin-top:8px}
  .tlfeat{font-size:11px;font-weight:700;color:var(--gold,#e0b23a);letter-spacing:.02em}
  .tlfeatbtn{display:inline-block;font-size:11.5px;font-weight:700;color:var(--muted,#8b98a9);cursor:pointer;border:1px solid var(--border,#2d333b);border-radius:999px;padding:2px 11px;transition:border-color .12s,color .12s;user-select:none}
  .tlfeatbtn:hover{color:var(--gold,#e0b23a);border-color:rgba(224,178,58,.5)}
  .tlsub{font-size:12.5px;color:var(--muted,#8b98a9);margin-top:3px}
  .tlst{color:var(--muted,#8b98a9)}
  .tlspan{font-size:11px;color:var(--muted,#8b98a9);font-variant-numeric:tabular-nums;white-space:nowrap;border:1px solid var(--border,#2d333b);border-radius:999px;padding:1px 8px;margin-left:2px;vertical-align:1px}
  /* Second line under the rail year: the end of the worked range ("–2015" / "→ now"). Makes the
     duration legible at the timeline anchor instead of hiding it in a faint pill by the title. */
  .tlyto{display:block;font-size:11.5px;font-weight:700;color:var(--muted,#8b98a9);font-variant-numeric:tabular-nums;margin-top:1px;letter-spacing:-.2px}
  /* Live-service: a quiet word in the metadata line, not a chip that fights the game title. */
  .tlphase{color:var(--muted,#8b98a9);font-weight:700}
  /* Evidence badge — a small check chip per credit; bigger than the rail dot so it reads as a
     button, click opens the confirmer list ("receipts"). Blue check = peer, green = team,
     gold ! = under review. No badge when a credit is still awaiting confirmation. */
  .evb{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;margin-left:8px;vertical-align:-3px;font-size:10.5px;font-weight:900;line-height:1;color:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:box-shadow .12s,transform .12s}
  .evb.peer{background:var(--accent,#58a6ff);color:#04122b} .evb.team{background:var(--green,#3fb950);color:#04220f} .evb.rev{background:var(--gold,#e0b23a);color:#3a2c05}
  .evb[data-ev]{cursor:pointer} .evb[data-ev]:hover,.evb[data-ev]:focus-visible{transform:scale(1.14);outline:none}
  .evb.peer[data-ev]:hover,.evb.peer[data-ev]:focus-visible{box-shadow:0 0 0 4px rgba(88,166,255,.28)}
  .evb.team[data-ev]:hover,.evb.team[data-ev]:focus-visible{box-shadow:0 0 0 4px rgba(63,185,80,.28)}
  .evb.rev[data-ev]:hover,.evb.rev[data-ev]:focus-visible{box-shadow:0 0 0 4px rgba(224,178,58,.28)}
  /* Confirmer popover ("receipts") */
  .evpop{position:absolute;z-index:60;width:308px;max-width:calc(100vw - 24px);background:var(--panel,#11161d);border:1px solid var(--border,#2d333b);border-radius:13px;box-shadow:0 16px 40px rgba(0,0,0,.55);padding:0;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .12s,transform .12s}
  .evpop.open{opacity:1;transform:translateY(0);pointer-events:auto}
  .evpop-head{display:flex;align-items:center;gap:8px;padding:13px 15px 11px;border-bottom:1px solid var(--border,#2d333b)}
  .evpop-head .hd{width:9px;height:9px;border-radius:50%;flex:none}
  .evpop-head .hd.peer{background:var(--accent,#58a6ff)} .evpop-head .hd.team{background:var(--green,#3fb950)} .evpop-head .hd.rev{background:var(--gold,#e0b23a)}
  .evpop-head .lvl{font-weight:800;font-size:13.5px;color:var(--text,#e6edf3)}
  .evpop-head .cx{margin-left:auto;color:var(--muted,#8b98a9);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:6px}
  .evpop-head .cx:hover{background:rgba(255,255,255,.06);color:var(--text,#e6edf3)}
  .evpop-sub{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#8b98a9);padding:11px 15px 4px}
  .evpop-rev{font-size:12.5px;color:var(--gold,#e0b23a);background:rgba(224,178,58,.08);border-bottom:1px solid var(--border,#2d333b);padding:10px 15px;line-height:1.45}
  .evpop-list{padding:2px 8px 6px;max-height:280px;overflow:auto}
  .evrow{display:flex;align-items:center;gap:10px;padding:8px 7px;border-radius:9px;text-decoration:none}
  a.evrow:hover{background:rgba(255,255,255,.05)}
  .evrow .av{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#0b0e14}
  .evrow .ei{min-width:0}
  .evrow .en{display:block;font-weight:700;font-size:13.5px;color:var(--text,#e6edf3);line-height:1.2}
  .evrow .er{display:block;color:var(--muted,#8b98a9);font-size:11.5px;margin-top:2px}
  .evpop-empty{padding:14px 15px;color:var(--muted,#8b98a9);font-size:12.5px;line-height:1.5}
  .evpop-foot{display:block;padding:10px 15px;border-top:1px solid var(--border,#2d333b);font-size:12px;font-weight:700;color:var(--accent,#58a6ff);text-decoration:none}
  .evpop-foot:hover{text-decoration:underline}
  .tlhint{font-size:12.5px;color:var(--muted,#8b98a9);line-height:1.5;background:var(--panel,#11161d);border:1px solid var(--border,#2d333b);border-radius:10px;padding:10px 13px;margin:0 0 16px;max-width:560px}
  .tlhint b{color:var(--text,#e6edf3);font-weight:700}
  @media(max-width:600px){.tlrow{grid-template-columns:46px 20px 1fr}.tlyear{font-size:14px}}
  @media(max-width:600px){.snapshot{gap:16px 20px;padding:14px 2px}.snap{flex:0 0 auto;padding:0}}
</style>
</head>

<div class="topbar"><div class="container">
  <div class="brand"><a class="brandhome" href="/credits/" data-tip="Back to Credits home" aria-label="DevQuest Credits home"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="12" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="12" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="23" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="23" width="8" height="8" rx="2" fill="var(--gold)"/></svg><span class="wm">Dev<span class="q">Quest</span><span class="tld">.gg</span></span></a> <span class="cr">CREDITS</span> <span class="beta">BETA</span></div>
  <div class="topnav">
    <a href="/credits/#how">How it works</a>

  </div>
</div></div>

<div class="container">
  <div class="crumbs"><a href="/credits/">Credits</a><span class="sep">/</span><a href="search.html?tab=people">People</a><span class="sep">/</span><span id="crumb" class="mut">…</span></div>
</div>

<div id="app"><div class="container"><div class="loading">Loading profile…</div></div></div>

<footer><div class="container">
  <div><b style="color:var(--text)">DevQuest.gg / Credits</b> · a companion to the game-industry job board</div>
  <div><a href="/credits/">← Credits home</a> &nbsp;·&nbsp; <a href="https://igda.org/sigs/credits/" target="_blank" rel="noopener">IGDA crediting guidelines ↗</a> &nbsp;·&nbsp; <a href="mailto:studios@devquest.gg?subject=DevQuest%20Credits%20feedback&body=Bug%2C%20idea%2C%20or%20just%20a%20thought%3A%0A%0A">Feedback</a></div>
</div></footer>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var slug = DQ.qs("slug"), uname = DQ.qs("name"), app = document.getElementById("app");
  // Keep the address bar on the pretty URL (/credits/<slug>) even when reached via
  // person.html?slug=... The 404.html router redirects clean URLs here; this rewrites back.
  try { if (slug) history.replaceState(null, "", "/credits/" + encodeURIComponent(slug)); } catch (e) {}
  if(!slug){
    // No claimed slug, but a ?name= means an unclaimed person — someone a teammate
    // attributed who hasn't signed in yet. Show every title attributed to that name.
    if(uname && window.DQAPI){ renderUnclaimed(uname); return; }
    app.innerHTML = '<div class="container"><div class="empty">No person specified.</div></div>'; return;
  }

  // ---- Unclaimed profile: aggregates every pending attribution for a name ----
  function renderUnclaimed(name){
    document.getElementById("crumb").textContent = name;
    document.title = name + " · DevQuest Credits";
    var pProf = DQAPI.unclaimedProfile(name).catch(function(){ return {ok:false}; });
    var pMe = DQAPI.isSignedIn() ? DQAPI.me().catch(function(){ return {ok:false}; }) : Promise.resolve({ok:false});
    Promise.all([pProf, pMe]).then(function(res){
      var data = (res[0] && res[0].ok && res[0].data) ? res[0].data : null;
      var signedIn = !!(res[1] && res[1].ok && res[1].data && res[1].data.authenticated);
      var atts = (data && data.attributions) || [];
      var disp = (data && data.name) || name;
      document.getElementById("crumb").textContent = disp;
      document.title = disp + " · DevQuest Credits";
      if(!atts.length){
        app.innerHTML = '<div class="container"><div class="empty">No profile yet for that name.<br>'+
          '<span class="mut">People appear here once a teammate attributes a credit, or once they claim their own.</span></div></div>';
        return;
      }
      var rows = atts.map(function(a){
        return '<div class="row">'+
          '<div class="rmain"><div class="rname"><a href="/credits/game/'+encodeURIComponent(a.game_slug)+'">'+DQ.esc(a.game_title)+'</a></div>'+
            '<div class="rsub"><span class="rrole">'+DQ.esc(a.role||"Contributor")+'</span>'+
            '<span class="mut"> &nbsp;·&nbsp; added by '+DQ.esc(a.added_by_name||"a teammate")+'</span></div></div>'+
        '</div>';
      }).join("");
      var cta = '<span class="btn primary" id="claimun">This is me — claim '+(atts.length===1?'this credit':'these '+atts.length+' credits')+' →</span>';
      app.innerHTML =
        '<div class="phead"><div class="container">'+
          '<div style="display:flex;align-items:center;gap:16px">'+
            '<div class="row" style="padding:0;border:none"><div class="av" style="width:60px;height:60px;font-size:22px">'+DQ.esc(DQ.initials(disp))+'</div></div>'+
            '<div><h1 style="margin:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+DQ.esc(disp)+' <span style="font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 11px;line-height:1.4">UNCLAIMED</span></h1>'+
            '<div class="meta">Attributed by teammates · not yet claimed</div></div>'+
          '</div>'+
          '<div class="claimbanner" style="margin-top:16px"><div class="cbtext"><b>Is this you?</b> A teammate credited you on the '+(atts.length===1?'game':'games')+' below. Claim this page to confirm your credits, add the rest of what you shipped, and get peer-vouched.</div>'+cta+'</div>'+
        '</div></div>'+
        '<section class="blk"><div class="container">'+
          '<div class="eyebrow">Attributed credits</div>'+
          '<p class="secsub" style="margin:6px 0 14px">Titles a teammate has credited to this name. They become part of a confirmed record once claimed.</p>'+
          '<div class="rows">'+rows+'</div>'+
          '<div class="notice">These credits were added by teammates and are unclaimed. Only the person credited can claim and edit this page.</div>'+
        '</div></section>';
      var cbtn = document.getElementById("claimun");
      if(cbtn) cbtn.onclick = function(){
        if(DQAPI.isSignedIn()){
          cbtn.textContent = "Claiming…";
          var i = 0, lastSlug = null;
          (function nextClaim(){
            if(i >= atts.length){ location.href = lastSlug ? ("/credits/person.html?slug=" + encodeURIComponent(lastSlug)) : "/credits/"; return; }
            DQAPI.claimAttribution(atts[i].id).then(function(rr){ if(rr.ok && rr.data && rr.data.person_slug) lastSlug = rr.data.person_slug; i++; nextClaim(); }).catch(function(){ i++; nextClaim(); });
          })();
        } else {
          try{ localStorage.setItem("dq_pending_claim_name", disp); }catch(e){}
          location.href = "signin.html";
        }
      };
    }).catch(function(e){
      app.innerHTML = '<div class="container"><div class="empty">Something went wrong loading this profile.<br><span class="mut">'+DQ.esc(e && e.message)+'</span></div></div>';
    });
  }
  var LINK_LABEL = { linkedin:"LinkedIn", portfolio:"Portfolio", artstation:"ArtStation", website:"Website", site:"Website", personal:"Website", twitter:"Twitter", x:"X", bluesky:"Bluesky", github:"GitHub", itch:"itch.io", mastodon:"Mastodon" };

  // Load the static (seed) profile + the live (API) profile + who I am, in parallel.
  var pStatic = DQ.loadEntity("people", slug).catch(function(){ return null; });
  var pApi = (window.DQAPI ? DQAPI.personCredits(slug) : Promise.resolve({ok:false})).catch(function(){ return {ok:false}; });

      Array.prototype.forEach.call(toggles, function(t){

    // ---- Evidence "receipts": click a timeline dot to see who confirmed the credit ----
    // The dot is a summary; this is the substance. One click resolves the credit's confirmers

    // by veterans" reads visibly differently from "confirmed by blank new accounts".
    (function(){
      var pop=null, openDot=null, cache={};
      var AVCOL=["#58a6ff","#a371f7","#3fb950","#e0b23a","#ec6a5e","#3fb0c9","#d2739a"];
      function initials(nm){ var p=String(nm||"").trim().split(/\s+/); return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")).toUpperCase(); }
      function colorFor(s){ var h=0, str=String(s||""); for(var i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return AVCOL[h%AVCOL.length]; }
      function ensurePop(){
        if(pop) return pop;
        pop=document.createElement("div"); pop.className="evpop"; pop.setAttribute("role","dialog"); pop.setAttribute("aria-label","Who confirmed this credit");
        document.body.appendChild(pop);

      function closePop(){ if(pop) pop.classList.remove("open"); if(openDot) openDot.setAttribute("aria-expanded","false"); openDot=null; }
      function place(dot){
        var r=dot.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight, vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
        var left=window.scrollX + r.left + r.width/2 - 20;
        var maxLeft=window.scrollX + vw - pw - 12, minLeft=window.scrollX + 12;
        if(left>maxLeft) left=maxLeft; if(left<minLeft) left=minLeft;
        var top=window.scrollY + r.bottom + 9;
        if(r.bottom + ph + 16 > vh && r.top - ph - 9 > 0) top=window.scrollY + r.top - ph - 9;
        pop.style.left=left+"px"; pop.style.top=top+"px";

      function render(dot, data, loading){
        var rev = dot.getAttribute("data-rev")==="1";
        var cls = dot.classList.contains("team")?"team":(dot.classList.contains("rev")?"rev":"peer");
        var lvl = rev ? "Under review" : (cls==="team"?"Team-confirmed":"Peer-confirmed");
        var list = (data&&data.confirmers)||[];
        var html = '<div class="evpop-head"><span class="hd '+cls+'"></span><span class="lvl">'+DQ.esc(lvl)+'</span><span class="cx" role="button" tabindex="0" aria-label="Close">×</span></div>';
        if(rev) html += '<div class="evpop-rev">A report was filed on this credit. It stays visible while a moderator reviews it. Nothing is ever silently removed.</div>';
        if(loading){
          html += '<div class="evpop-list"><div class="evpop-empty">Loading confirmers…</div></div>';
        } else if(list.length){
          html += '<div class="evpop-sub">Confirmed by teammates who shipped this game</div><div class="evpop-list">';
          list.forEach(function(p){
            var role = p.headline ? DQ.esc(p.headline) : "";
            var cc = p.credit_count ? ((role?" · ":"")+p.credit_count+" credited title"+(p.credit_count===1?"":"s")) : "";
            html += '<a class="evrow" href="/credits/'+encodeURIComponent(p.slug)+'"><span class="av" style="background:'+colorFor(p.slug)+'">'+DQ.esc(initials(p.name))+'</span><span class="ei"><span class="en">'+DQ.esc(p.name)+'</span><span class="er">'+role+cc+'</span></span></a>';
          });

          html += '<div class="evpop-empty">No confirmers to show yet.</div>';
        }
        html += '<a class="evpop-foot" href="/credits/how-evidence-works.html">How evidence works →</a>';

        render(dot, cache[id]||null, !cache[id]);
        pop.classList.add("open"); place(dot);
        if(!cache[id] && window.DQAPI && DQAPI.confirmers){
          DQAPI.confirmers(id).then(function(res){
            cache[id]=(res&&res.data)||{confirmers:[]};
            if(openDot===dot){ render(dot, cache[id], false); place(dot); }
          }).catch(function(){ cache[id]={confirmers:[]}; if(openDot===dot){ render(dot, cache[id], false); place(dot); } });
        }
      }
      document.addEventListener("click", function(e){
        var dot=e.target && e.target.closest && e.target.closest(".evb[data-ev]");
        if(dot){ e.preventDefault(); e.stopPropagation(); openFor(dot); return; }
        if(pop && openDot){
          if(e.target.closest && e.target.closest(".evpop .cx")){ e.preventDefault(); closePop(); return; }
          if(e.target.closest && e.target.closest(".evpop")) return; // clicks inside (e.g. links) pass through
          closePop();
        }
      }, false);
      document.addEventListener("keydown", function(e){
        if(e.key==="Enter" || e.key===" "){
          var dot=e.target && e.target.closest && e.target.closest(".evb[data-ev]");
          if(dot){ e.preventDefault(); openFor(dot); return; }

      }, false);

    })();

    // ---- Drag-to-reorder in the Visual grid (owner only, pointer-based) ----
    // Native HTML5 drag was imprecise about drop targets. This uses mouse events + nearest-
    // centre hit-testing across both grids, reorders live, and re-splits so the hero row always
    // holds the first three. A short move threshold keeps a plain click navigating to the game.
    (function(){
      if(!isOwn || isTouch) return;
      var vis = document.getElementById("gv-visual");
      if(!vis) return;
      var hero = document.getElementById("gv-hero"), rest = document.getElementById("gv-rest");
      function tiles(){ return Array.prototype.slice.call(vis.querySelectorAll(".dragtile")); }
      if(tiles().length < 2) return;

      var drag=null, sx=0, sy=0, active=false;

      // Append in sequence: first three go to the hero row, the rest below. Only called when
      // the order actually changed (guarded by the caller), so re-appends stay cheap.
      function applyOrder(order){ order.forEach(function(el,i){ (i<3?hero:(rest||hero)).appendChild(el); }); }

      function onMove(e){
        if(!drag) return;
        if(!active){
          if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy) < 6) return;
          active=true; drag.classList.add("dragging"); document.body.classList.add("gv-nav-lock"); document.body.style.userSelect="none";
        }
        e.preventDefault();
        var others = tiles().filter(function(x){ return x!==drag; });

          '<label style="font-size:12px;font-weight:700;display:block;margin:10px 0 4px">Other titles <span style="font-weight:400;color:var(--muted)">(comma-separated, optional)</span></label>'+
          '<input class="ed-others" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
          '<label style="font-size:12px;font-weight:700;display:block;margin:10px 0 4px">Proof links <span style="font-weight:400;color:var(--muted)">(LinkedIn, portfolio, press kit. One per line, optional)</span></label>'+
          '<textarea class="ed-proof" style="width:100%;min-height:56px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical"></textarea>'+
          '<label style="font-size:12px;font-weight:700;display:block;margin:10px 0 4px">Ports &amp; remasters <span style="font-weight:400;color:var(--muted)">(other versions of this same game: ports, remasters, re-releases. Comma-separated, optional)</span></label>'+
          '<input class="ed-release" list="ed-release-list" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit" placeholder="PC port, Remaster, Definitive Edition"><datalist id="ed-release-list"><option value="PC port"></option><option value="Console port"></option><option value="Remaster"></option><option value="Definitive Edition"></option><option value="Re-release"></option></datalist>'+
          '<label style="font-size:12px;font-weight:700;display:block;margin:10px 0 4px">Years you worked on it <span style="font-weight:400;color:var(--muted)">(optional — places this on your Timeline. Leave the end blank if ongoing)</span></label>'+
          '<div style="display:flex;align-items:center;gap:8px">'+
            '<input class="ed-wstart" type="number" min="1970" max="2100" placeholder="From" style="width:110px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
            '<span style="color:var(--muted)">to</span>'+
            '<input class="ed-wend" type="number" min="1970" max="2100" placeholder="Present" style="width:110px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
          '</div>'+
          '<div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4">When you actually worked on this game, which can differ from its release year. This is your own note; the green check still comes from a teammate vouch.</div>'+
          '<label style="font-size:12px;font-weight:700;display:block;margin:10px 0 4px">How were you involved?</label>'+
          '<label style="display:block;font-weight:400;font-size:13px;margin:4px 0;cursor:pointer"><input type="radio" name="ed-involve" value="core" style="margin-right:7px;vertical-align:-1px">On the core team <span style="color:var(--muted)">(in-house at the studio that made it)</span></label>'+
          '<label style="display:block;font-weight:400;font-size:13px;margin:4px 0;cursor:pointer"><input type="radio" name="ed-involve" value="external" style="margin-right:7px;vertical-align:-1px">Outsourced or external <span style="color:var(--muted)">(a co-dev, contractor, or partner studio, not the primary developer)</span></label>'+
          '<label style="font-size:12px;font-weight:700;display:block;margin:12px 0 4px">What part did you work on?</label>'+
          '<label style="display:block;font-weight:400;font-size:13px;margin:4px 0;cursor:pointer"><input type="radio" name="ed-scope" value="base" style="margin-right:7px;vertical-align:-1px">The base game <span style="color:var(--muted)">(the main release. Still pick this if you also worked on its ports, expansions, or live service)</span></label>'+
          '<label style="display:block;font-weight:400;font-size:13px;margin:4px 0;cursor:pointer"><input type="radio" name="ed-scope" value="partial" style="margin-right:7px;vertical-align:-1px">A specific part only <span style="color:var(--muted)">(a port, an expansion, or the live-service era, not the base game)</span></label>'+
          '<label style="display:block;font-weight:400;font-size:13px;margin:10px 0 2px;cursor:pointer"><input type="checkbox" class="ed-live" style="margin-right:7px;vertical-align:-1px">I also worked on this game\'s live-service / post-launch period</label>'+
          '<div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4">Only add work you\'re free to disclose. Leave off anything under NDA or not publicly announced.</div>'+
          '<div style="margin-top:12px;display:flex;gap:8px"><span class="btn primary ed-save" style="padding:8px 16px">Save</span><span class="btn ghost ed-cancel" style="padding:8px 16px">Cancel</span></div>'+
        '</div>';
        row.querySelector(".ed-role").value = el.dataset.role || "";
        row.querySelector(".ed-others").value = el.dataset.others || "";
        row.querySelector(".ed-proof").value = el.dataset.links || "";
        var edAll = (el.dataset.releases || "").split(",").map(function(s){return s.trim();}).filter(Boolean);
        row.querySelector(".ed-release").value = edAll.filter(function(r){ var k=DQ.releaseClass(r); return k !== "live" && k !== "xdev"; }).join(", ");
        var edLiveCk = row.querySelector(".ed-live"); if(edLiveCk) edLiveCk.checked = edAll.some(function(r){ return DQ.releaseClass(r) === "live"; });
        var edIsExt = edAll.some(function(r){ return DQ.releaseClass(r) === "xdev"; });
        var involveSel = row.querySelector('input[name="ed-involve"][value="'+(edIsExt?"external":"core")+'"]'); if(involveSel) involveSel.checked = true;
        var scopeSel = row.querySelector('input[name="ed-scope"][value="'+(el.dataset.partial ? "partial" : "base")+'"]');
        if(scopeSel) scopeSel.checked = true;
        row.querySelector(".ed-wstart").value = el.dataset.workstart || "";
        row.querySelector(".ed-wend").value = el.dataset.workend || "";
        row.querySelector(".ed-role").focus();
        row.querySelector(".ed-cancel").onclick = function(){ location.reload(); };
        row.querySelector(".ed-save").onclick = function(){
          var nrole = row.querySelector(".ed-role").value.trim();
          if(!nrole){ alert("Role can't be empty."); return; }
          var nothers = row.querySelector(".ed-others").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
          var nlinks = row.querySelector(".ed-proof").value.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);
          var nverif = nlinks.some(function(u){return /linkedin\.com/i.test(u);}) ? ["linkedin_self"] : [];
          var nreleases = DQ.uniq(row.querySelector(".ed-release").value.split(",").map(function(s){return s.trim();}).filter(Boolean));
          var edLiveOn = row.querySelector(".ed-live");
          if(edLiveOn && edLiveOn.checked && nreleases.indexOf("Live service") === -1) nreleases.push("Live service");
          var edInvolveEl = row.querySelector('input[name="ed-involve"]:checked');
          if(edInvolveEl && edInvolveEl.value === "external" && nreleases.indexOf("External contributor") === -1) nreleases.push("External contributor");
          var nscopeEl = row.querySelector('input[name="ed-scope"]:checked');
          var nscope = nscopeEl ? nscopeEl.value : "base";
          // Work period (optional). Empty string clears it on the server; blank end = present.
          var wsRaw = row.querySelector(".ed-wstart").value.trim();
          var weRaw = row.querySelector(".ed-wend").value.trim();
          if(wsRaw && weRaw && parseInt(weRaw,10) < parseInt(wsRaw,10)){ alert("The end year can't be before the start year."); return; }
          var sbtn = this; sbtn.textContent = "Saving…";
          DQAPI.updateCredit(id, { role: nrole, roles_other: nothers, links: nlinks, verification: nverif, releases: nreleases, scope: nscope, work_start: wsRaw, work_end: weRaw }).then(function(r){
            if(r && r.ok){ location.reload(); }
            else { sbtn.textContent = "Save"; alert((r && r.data && r.data.error) || "Could not save."); }
          });
        };
      };
    });
    // (List view no longer supports manual drag: it's a fixed most-recent-first timeline.
    // Reordering lives in the Visual view, which persists the showcase order.)
    });
  }).catch(function(e){
    app.innerHTML = '<div class="container"><div class="empty">Something went wrong loading this profile.<br><span class="mut">'+DQ.esc(e && e.message)+'</span></div></div>';
  });
})();
</script>
</body>
</html>
