<style>
  .gpheadrow{display:flex;gap:24px;align-items:flex-start}
  .gpheadtext{flex:1;min-width:0}
  .gpcover{flex:none;width:130px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--border,#2d333b);background:#161b22;box-shadow:0 8px 22px rgba(0,0,0,.45)}
  .gpcover img{width:100%;height:100%;object-fit:cover;display:block}
  @media(max-width:560px){.gpcover{width:96px}.gpheadrow{gap:14px}}
  /* Evidence badge — a clickable check chip next to a credited name; click opens the confirmer list. */
  .evb{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;margin-left:8px;vertical-align:-3px;font-size:10.5px;font-weight:900;line-height:1;color:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:box-shadow .12s,transform .12s}
  .evb.peer{background:var(--accent,#58a6ff);color:#04122b} .evb.team{background:var(--green,#3fb950);color:#04220f} .evb.rev{background:var(--gold,#e0b23a);color:#3a2c05}
  .corrb{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;margin-left:6px;vertical-align:-3px;font-size:10px;font-weight:900;line-height:1;text-decoration:none;background:rgba(163,113,247,.16);border:1px solid rgba(163,113,247,.55);color:#a371f7} .corrb:hover{background:rgba(163,113,247,.28)}
  .evb[data-ev]:hover,.evb[data-ev]:focus-visible{transform:scale(1.14);outline:none}
  .evb.peer[data-ev]:hover,.evb.peer[data-ev]:focus-visible{box-shadow:0 0 0 4px rgba(88,166,255,.28)}
  .evb.team[data-ev]:hover,.evb.team[data-ev]:focus-visible{box-shadow:0 0 0 4px rgba(63,185,80,.28)}
  .evb.rev[data-ev]:hover,.evb.rev[data-ev]:focus-visible{box-shadow:0 0 0 4px rgba(224,178,58,.28)}
  .evb.corr{background:var(--purple,#a371f7);color:#160a2e}
  .evb.corr[data-ev]:hover,.evb.corr[data-ev]:focus-visible{box-shadow:0 0 0 4px rgba(163,113,247,.28)}
  .evpop{position:absolute;z-index:60;width:308px;max-width:calc(100vw - 24px);background:var(--panel,#11161d);border:1px solid var(--border,#2d333b);border-radius:13px;box-shadow:0 16px 40px rgba(0,0,0,.55);padding:0;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .12s,transform .12s}
  .evpop.open{opacity:1;transform:translateY(0);pointer-events:auto}
  .evpop-head{display:flex;align-items:center;gap:8px;padding:13px 15px 11px;border-bottom:1px solid var(--border,#2d333b)}
  .evpop-head .hd{width:9px;height:9px;border-radius:50%;flex:none}
  .evpop-head .hd.peer{background:var(--accent,#58a6ff)} .evpop-head .hd.team{background:var(--green,#3fb950)} .evpop-head .hd.rev{background:var(--gold,#e0b23a)} .evpop-head .hd.corr{background:var(--purple,#a371f7)}
  .evpop-corr{display:flex;align-items:center;gap:8px;margin:8px 10px 4px;padding:9px 11px;border-radius:9px;background:rgba(163,113,247,.10);border:1px solid rgba(163,113,247,.32);color:var(--text,#e6edf3);font-size:12.5px;text-decoration:none}
  a.evpop-corr:hover{background:rgba(163,113,247,.18)}
  .evpop-corr .cdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--purple,#a371f7)}
  .evpop-corr .cnote{color:var(--muted,#8b98a9)}
  .evpop-corr .cext{margin-left:auto;color:var(--purple,#a371f7);font-weight:800}
  .evpop-head .lvl{font-weight:800;font-size:13.5px;color:var(--text,#e6edf3)}
  .evpop-head .cx{margin-left:auto;color:var(--muted,#8b98a9);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:6px}
  .evpop-head .cx:hover{background:rgba(255,255,255,.06);color:var(--text,#e6edf3)}
  .evpop-sub{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#8b98a9);padding:11px 15px 4px}
  .evpop-rev{font-size:12.5px;color:var(--gold,#e0b23a);background:rgba(224,178,58,.08);border-bottom:1px solid var(--border,#2d333b);padding:10px 15px;line-height:1.45}
  .evpop-list{padding:2px 8px 6px;max-height:280px;overflow:auto}
  .evrow{display:flex;align-items:center;gap:10px;padding:8px 7px;border-radius:9px;text-decoration:none}
  a.evrow:hover{background:rgba(255,255,255,.05)}
  .evrow .av{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#0b0e14}
  .evrow .ei{min-width:0}
  .evrow .en{display:block;font-weight:700;font-size:13.5px;color:var(--text,#e6edf3);line-height:1.2}
  .evrow .er{display:block;color:var(--muted,#8b98a9);font-size:11.5px;margin-top:2px}
  .evpop-empty{padding:14px 15px;color:var(--muted,#8b98a9);font-size:12.5px;line-height:1.5}
  .evpop-foot{display:block;padding:10px 15px;border-top:1px solid var(--border,#2d333b);font-size:12px;font-weight:700;color:var(--accent,#58a6ff);text-decoration:none}
  .evpop-foot:hover{text-decoration:underline}
</style>

<script>
(function(){
  var slug = DQ.qs("slug"), app = document.getElementById("app");
  var vouchFor = DQ.qs("vouch") || "";   // ?vouch=<person_slug> — a teammate asked to be confirmed
  try { if (slug) history.replaceState(null, "", "/credits/game/" + encodeURIComponent(slug)); } catch (e) {}
  if(!slug){ app.innerHTML = '<div class="container"><div class="empty">No game specified.</div></div>'; return; }

  var pStatic = DQ.loadEntity("games", slug).catch(function(){ return null; });
  var pApi = window.DQAPI ? DQAPI.gameCredits(slug).catch(function(){ return {ok:false}; }) : Promise.resolve({ok:false});
  var pMe  = (window.DQAPI && DQAPI.isSignedIn()) ? DQAPI.me().catch(function(){ return {ok:false}; }) : Promise.resolve({ok:false});

  Promise.all([pStatic, pApi, pMe]).then(function(res){
    var g = res[0];
    var apiRes = (res[1] && res[1].ok && res[1].data) ? res[1].data : null;
    var me = (res[2] && res[2].ok && res[2].data && res[2].data.authenticated) ? res[2].data.person : null;
    var apiGame = apiRes && apiRes.game;
    var apiCredits = (apiRes && apiRes.credits) || [];

    var meta = g || apiGame;
    if(!meta){
      document.getElementById("crumb").textContent = "Not found";
      app.innerHTML = '<div class="container"><div class="empty">We could not find that game.<br>'+
        '<a class="btn ghost" style="margin-top:14px" href="search.html">Search the catalogue</a> '+
        '<a class="btn primary" id="addbtn" style="margin-top:14px">Add this game →</a></div></div>';
      var ab = document.getElementById("addbtn");
      if(ab) ab.onclick = function(){ DQ.openClaim({ mode:"addGame", prefillTitle: slug.replace(/-/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();}) }); };
      return;
    }

    var ov = apiRes && apiRes.override;
    if(ov && ov.hidden){
      document.getElementById("crumb").textContent = "Removed";
      app.innerHTML = '<div class="container"><div class="empty">This entry has been removed.<br><span class="mut">It was reported and taken down by a moderator.</span><br><a class="btn ghost" style="margin-top:14px" href="/credits/">Back to Credits</a></div></div>';
      return;
    }
    var title = (ov && ov.name) ? ov.name : meta.title, isCommunity = !g && !!apiGame;
    var studios = (ov && ov.studio) ? [ov.studio] : (g ? (g.studios||[]) : (apiGame && apiGame.studio ? [apiGame.studio] : []));
    var year = meta.year || null, publishers = g ? (g.publishers||[]) : [];
    var platforms = meta.platforms || [], genres = meta.genres || [], qid = g ? g.qid : "";

    document.title = title + " · DevQuest Credits";
    document.getElementById("crumb").textContent = title;

    var studioLinks = studios.length
      ? studios.map(function(n){ return '<a href="/credits/studio/'+encodeURIComponent(DQ.slugify(n))+'">'+DQ.esc(n)+'</a>'; }).join(", ")
      : '<span class="mut">Studio not recorded</span> <a id="addstudio" class="reportlink" style="cursor:pointer;color:var(--accent);font-size:12px">— know it? Add the studio</a>';
    var metaBits = [studioLinks];
    if(year) metaBits.push(String(year));
    if(publishers.length) metaBits.push("Published by "+publishers.map(DQ.esc).join(", "));

    var chips = "";
    platforms.forEach(function(p){ chips += '<span class="chip plat">'+DQ.esc(p)+'</span>'; });
    genres.forEach(function(x){ chips += '<span class="chip">'+DQ.esc(x)+'</span>'; });

    var srcBadge = isCommunity
      ? '<span class="badge hand">✎ Community entry</span>'
      : '<span class="badge official">◈ Catalogue (Wikidata)</span>';

    // merge credits by person — seed (static) + live (API), API wins
    var byPerson = {};
    ((g && g.credits) || []).forEach(function(c){ var ps=DQ.slugify(c.name); byPerson[ps]={person_slug:ps,name:c.name,role:c.role,roles_other:c.roles_other||[],verification:c.verification||[],vouch_count:0,live:false}; });
    apiCredits.forEach(function(c){ byPerson[c.person_slug]={id:c.id,person_slug:c.person_slug,name:c.person_name,role:c.role,roles_other:c.roles_other||[],verification:c.verification||[],links:c.links||[],releases:c.releases||[],vouch_count:c.vouch_count||0,voucher_slugs:c.voucher_slugs||[],status:c.status,partial:!!c.partial,corroborated:c.corroborated,live:true}; });
    var credits = Object.keys(byPerson).map(function(k){ return byPerson[k]; });
    var iHaveCredit = !!(me && credits.some(function(c){ return c.person_slug===me.slug; }));
    var pending = (apiRes && apiRes.pending) || [];

    // Order: your own claimed credit floats to the top when you're signed in; everyone
    // else is alphabetical by last name (neutral, scannable, implies no hierarchy).
    // Unclaimed teammate additions sort the same way, in their own section below.
    function lastName(n){ var p=String(n||'').trim().split(/\s+/); return (p[p.length-1]||'').toLowerCase(); }
    function cmpLast(na,nb){ return lastName(na).localeCompare(lastName(nb)) || String(na||'').localeCompare(String(nb||'')); }
    credits.sort(function(a,b){ var am=(me&&a.person_slug===me.slug)?0:1, bm=(me&&b.person_slug===me.slug)?0:1; return (am-bm) || cmpLast(a.name,b.name); });
    pending.sort(function(a,b){ return cmpLast(a.name,b.name); });

    // Unclaimed teammate attributions (added by a member, awaiting the named person).
    var pendingHTML = pending.length ? '<div class="rows" style="margin-top:14px">' + pending.map(function(pc){
      var mine = !!(me && pc.added_by_slug === me.slug);
      var iVouched = !!(me && (pc.voucher_slugs||[]).indexOf(me.slug) >= 0);
      // The attributor is an implicit first confirmation, so the total is 1 + peers.
      var confN = 1 + (pc.vouch_count||0);
      var acts = '', hint = '', nameHTML = DQ.esc(pc.name);
      if (mine) {
        acts = '<a class="copyinvite" data-name="'+DQ.esc(pc.name)+'" style="font-size:12px;font-weight:700;color:var(--accent);cursor:pointer">Copy invite link</a>'+
          '<a class="rmvattr" data-id="'+pc.id+'" style="font-size:12px;color:var(--pink);margin-left:12px;cursor:pointer">Remove</a>';
      } else if (iVouched) {
        acts = '<a class="unvouchattr" data-id="'+pc.id+'" title="Withdraw confirmation" style="font-size:12px;font-weight:700;color:var(--green);cursor:pointer">✓ Confirmed</a>';
      } else if (iHaveCredit) {
        acts = '<a class="vouchattr" data-id="'+pc.id+'" style="font-size:12px;font-weight:700;color:var(--green);border:1px solid rgba(63,185,80,.4);background:rgba(63,185,80,.08);border-radius:8px;padding:4px 11px;cursor:pointer">Confirm</a>';
      } else {
        // Tap the name itself to claim — no separate button, keeps the list dense.
        nameHTML = '<a class="claimattr" data-id="'+pc.id+'" style="color:var(--accent);cursor:pointer">'+DQ.esc(pc.name)+'</a>';
        hint = ' <span class="mut" style="font-size:11.5px;font-weight:400">· is this you?</span>';
      }
      var confHTML = (pc.vouch_count>0)
        ? ' &nbsp; <span class="sig vouched" style="color:var(--green)">✓ Confirmed by '+confN+' teammates</span>'
        : '';
      return '<div class="row">'+
        '<div class="av" style="opacity:.55">'+DQ.esc(DQ.initials(pc.name))+'</div>'+
        '<div class="rmain"><div class="rname">'+nameHTML+' <span class="sig" style="color:var(--muted)">unclaimed</span>'+confHTML+hint+'</div>'+
          '<div class="rsub"><span class="rrole">'+DQ.esc(pc.role||"Contributor")+'</span> &nbsp; <span class="mut">added by '+DQ.esc(pc.added_by_name)+'</span></div></div>'+
        '<div class="rright">'+acts+'</div>'+
      '</div>';
    }).join("") + '</div>' : '';

    // "Add a teammate" is available to anyone who holds a credit on this game.
    var addTeamHTML = iHaveCredit
      ? '<div style="margin-top:16px"><span class="btn ghost" id="addteammate" style="font-size:13px">+ Add a teammate you shipped with</span><div id="teamform"></div></div>'
      : '';

    // Discipline filter — classify each credit's role with the same taxonomy the job board uses
    // (DQ.discipline), then offer chips for the disciplines actually present on this game.
    var discCounts = {};
    credits.forEach(function(c){ c._disc = DQ.discipline(c.role); discCounts[c._disc] = (discCounts[c._disc]||0)+1; });
    var discList = (DQ.DISCIPLINE_ORDER||[]).filter(function(d){ return discCounts[d]; });
    var _chipBase = 'cursor:pointer;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:transparent';
    var _chipOn = ';border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.09)';
    var discChips = (credits.length && discList.length > 1)
      ? '<div class="discfilter" id="discfilter" style="display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 16px">'+
          '<span class="dchip" data-disc="" style="'+_chipBase+_chipOn+'">All <b>'+credits.length+'</b></span>'+
          discList.map(function(d){ return '<span class="dchip" data-disc="'+DQ.esc(d)+'" style="'+_chipBase+'">'+DQ.esc(d)+' <b>'+discCounts[d]+'</b></span>'; }).join('')+
        '</div>'
      : '';
    // Evidence badge: blue check = peer-confirmed, green = team-confirmed, gold ! = under review.
    // No badge while a credit is still awaiting confirmation. Click opens the confirmer list.
    function corrBadge(c){
      if(!c || !c.corroborated || !c.id) return '';
      var src = c.corroborated.source || 'the published record';
      var tip = 'Matches '+src+'. Click to see the evidence.';
      return ' <span class="evb corr" data-ev="'+c.id+'" data-corr="1" role="button" tabindex="0" aria-label="Matches published credits. Click to see details." title="'+DQ.esc(tip)+'">✓</span>';
    }
    function evidenceBadge(c){
      var n = c.vouch_count || 0;
      var rev = c.status==="contested";
      if(!rev && n<1) return '';
      var cls = rev ? 'rev' : (n>=2 ? 'team' : 'peer');
      var glyph = rev ? '!' : '✓';
      var lbl = rev ? 'Under review' : (n>=2 ? 'Team-confirmed' : 'Peer-confirmed');
      var tip = rev ? 'Under review. A report was filed on this credit. Click for details.'
                    : (n>=2 ? 'Team-confirmed by '+n+' teammates who shipped this game. Click to see who.'
                            : 'Peer-confirmed by 1 teammate who shipped this game. Click to see who.');
      if(!c.id) return ' <span class="evb '+cls+'" title="'+DQ.esc(tip)+'">'+glyph+'</span>';
      return ' <span class="evb '+cls+'" data-ev="'+c.id+'"'+(rev?' data-rev="1"':'')+' role="button" tabindex="0" aria-label="'+DQ.esc(lbl)+'. Click to see details." title="'+DQ.esc(tip)+'">'+glyph+'</span>';
    }
    // Readable scope labels (same mapping as the profile page): turn "worked on a specific
    // part" into what that part actually was (DLC, ports, live service, post-launch updates)
    // instead of a bare asterisk.
    function partLabels(c){
      var out = [];
      DQ.uniq(c.releases || []).forEach(function(r){
        var s = String(r).toLowerCase();
        if(/dlc|expansion/.test(s)){ if(out.indexOf("DLC")<0) out.push("DLC"); }
        else if(/port|remaster/.test(s)){ if(out.indexOf("ports")<0) out.push("ports"); }
        else if(/live/.test(s)){ if(out.indexOf("live service")<0) out.push("live service"); }
        else if(/patch|post.?launch|update/.test(s)){ if(out.indexOf("post-launch updates")<0) out.push("post-launch updates"); }
      });
      return out;
    }
    function partText(c){ if(!c.partial) return ""; var l = partLabels(c); return l.length ? l.join(", ") : "specific part"; }
    var creditsHTML = credits.length ? '<div class="rows" id="creditrows">' + credits.map(function(c){
      var sigs = (c.verification||[]).map(function(s){ return '<span class="sig">'+DQ.esc(DQ.SIG_LABEL[s]||s)+'</span>'; }).join("");
      var others = c.roles_other || [];
      var more = others.length ? ' <span class="rmore2" style="color:var(--muted);font-weight:400">· also '+DQ.esc(others.join(", "))+'</span>' : '';
      // Scoped work reads as a plain-language tag ("· live service") in the sub-line, matching
      // the profile page, instead of a cryptic asterisk next to the name.
      var scopeTag = c.partial ? ' <span class="rmore2" style="color:var(--muted);font-weight:400" title="Worked on a specific part, not the base game">· '+DQ.esc(partText(c))+'</span>' : '';
      var extNote = DQ.uniq(c.releases||[]).some(function(r){ return DQ.releaseClass(r)==="xdev"; }) ? ' <span class="rmore2" style="color:var(--muted);font-weight:400">· as an outsourcer</span>' : '';
      var proof = (c.links && c.links.length) ? ' <a class="sig" href="'+DQ.esc(DQ.safeUrl(c.links[0]))+'" target="_blank" rel="noopener noreferrer" title="'+DQ.esc(c.links.join(", "))+'" style="text-decoration:none">proof ↗</a>' : '';
      var iVouchedC = !!(me && (c.voucher_slugs||[]).indexOf(me.slug) >= 0);
      var vbtn = (c.live && c.id && me && c.person_slug!==me.slug && iHaveCredit)
        ? (iVouchedC
            ? '<a class="unvouchbtn" data-id="'+c.id+'" title="Withdraw your vouch" style="font-size:12px;font-weight:700;color:var(--green);cursor:pointer">✓ Vouched</a>'
            : '<a class="vouchbtn" data-id="'+c.id+'" style="font-size:12px;font-weight:700;color:var(--green);border:1px solid rgba(63,185,80,.35);background:rgba(63,185,80,.08);border-radius:8px;padding:4px 11px;cursor:pointer">Vouch</a>')
        : '';
      return '<div class="row" data-disc="'+DQ.esc(c._disc||"Other")+'" data-pslug="'+DQ.esc(c.person_slug)+'">'+
        '<div class="av">'+DQ.esc(DQ.initials(c.name))+'</div>'+
        '<div class="rmain"><div class="rname"><a href="/credits/'+encodeURIComponent(c.person_slug)+'">'+DQ.esc(c.name)+'</a>'+evidenceBadge(c)+corrBadge(c)+'</div>'+
          '<div class="rsub"><span class="rrole">'+DQ.esc(c.role||"Role not recorded")+'</span>'+more+scopeTag+extNote+(sigs?' &nbsp; '+sigs:'')+proof+'</div></div>'+
        '<div class="rright">'+vbtn+'<a class="reportcredit reportlink" data-name="'+DQ.esc(c.name)+'" data-cid="'+(c.id||"")+'" title="Report this credit" style="color:var(--muted);font-size:12px;margin-left:12px;text-decoration:none;cursor:pointer">⚑</a></div>'+
      '</div>';
    }).join("") + '</div>' : '<div class="empty">No individual credits recorded yet.<br>If you worked on it, be the first to claim your credit.</div>';

    // People who shipped this game get a clear invitation to confirm the teammates they
    // worked with — vouching was previously just an unexplained button nobody discovered.
    var confirmableHere = (me && iHaveCredit) ? credits.filter(function(c){ return c.live && c.id && c.person_slug!==me.slug && (c.voucher_slugs||[]).indexOf(me.slug) < 0; }).length : 0;
    var vouchInvite = confirmableHere
      ? '<div style="margin:14px 0;padding:12px 14px;border:1px solid rgba(63,185,80,.35);background:rgba(63,185,80,.07);border-radius:10px;font-size:13.5px;line-height:1.5"><b style="color:var(--green)">You shipped this game.</b> Confirm the teammates you actually worked with: tap the green <b>Vouch</b> button on their row. Your vouch is what moves a credit from awaiting confirmation to peer-confirmed. Only confirm people you genuinely worked alongside.</div>'
      : '';

    // Deep link from a "Request a vouch" message: a specific teammate asked to be confirmed.
    var vouchReqName = "";
    if(vouchFor){ var _vc = credits.filter(function(c){ return c.person_slug===vouchFor; })[0]; vouchReqName = _vc ? _vc.name : ""; }
    var vouchReqBanner = (vouchFor && vouchReqName)
      ? '<div style="margin:14px 0;padding:12px 14px;border:1px solid rgba(88,166,255,.45);background:rgba(88,166,255,.08);border-radius:10px;font-size:13.5px;line-height:1.5"><b style="color:var(--accent)">'+DQ.esc(vouchReqName)+' asked you to confirm their credit.</b> If you shipped <b>'+DQ.esc(title)+'</b> too, use the green <b>Vouch</b> button on their row below.'+(iHaveCredit?'':' You\'ll need to <b>claim your own credit</b> on this game first.')+'</div>'
      : '';

    // Cover art in the header (Steam capsule). Shown only when real art exists; a broken
    // image removes the whole frame so we never leave an empty box next to the title.
    var gsteam = (g && g.steam) || null;
    var gcover = (ov && ov.cover) || (g && g.cover) || null;
    // Admin-set cover wins over the Steam capsule (delisted games have a dead capsule).
    var coverSrc = gcover ? DQ.safeUrl(gcover) : (gsteam ? 'https://cdn.cloudflare.steamstatic.com/steam/apps/'+encodeURIComponent(gsteam)+'/library_600x900.jpg' : null);
    var coverHTML = coverSrc
      ? '<div class="gpcover"><img loading="lazy" referrerpolicy="no-referrer" src="'+DQ.esc(coverSrc)+'" onerror="var c=this.closest(\'.gpcover\'); if(c) c.remove();" alt="Cover art"></div>'
      : '';

    app.innerHTML =
      '<div class="phead"><div class="container gpheadrow">'+
        '<div class="gpheadtext">'+
          '<div style="margin-bottom:10px">'+srcBadge+' <a id="reportgame" class="reportlink" style="cursor:pointer;color:var(--muted);font-size:12px;margin-left:8px">⚑ Report or suggest a fix</a></div>'+
          '<h1>'+DQ.esc(title)+'</h1>'+
          '<div class="meta">'+metaBits.join(' · ')+'</div>'+
          (chips?'<div class="chips">'+chips+'</div>':'')+
        '</div>'+
        coverHTML +
      '</div></div>'+
      '<section class="blk"><div class="container">'+
        '<div class="rowhead"><div><div class="eyebrow">Credits</div>'+
          '<h2 class="sec">'+(credits.length? credits.length+' credited' : 'Who made this game?')+'</h2>'+
          '<p class="secsub" style="margin:0">A developer-owned, peer-confirmed record of who made this game. Roles reflect each person\'s full time on the title, not a single moment. Listed alphabetically. <a href="/credits/how-evidence-works.html" style="color:var(--accent);font-weight:600;white-space:nowrap">how evidence works →</a></p></div>'+
          (iHaveCredit ? '' : '<span class="btn primary" id="claimbtn">This is me — claim my credit</span>')+
        '</div>'+
        vouchReqBanner +
        vouchInvite +
        discChips +
        creditsHTML +
        pendingHTML +
        addTeamHTML +
        '<div class="notice">Source of truth is the person who did the work. Catalogue facts come from Wikidata (CC0); credits are added and vouched by developers. Teammate additions are unclaimed until that person confirms them.</div>'+
      '</div></section>';

    // If arrived via a vouch-request link, spotlight the requester's row and scroll to it.
    if(vouchFor){
      var _vrow = document.querySelector('.row[data-pslug="'+vouchFor+'"]');
      if(_vrow){ _vrow.style.boxShadow="0 0 0 2px var(--accent)"; _vrow.style.borderRadius="10px"; _vrow.style.background="rgba(88,166,255,.06)"; try{ _vrow.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){} }
    }

    // Discipline chips: toggle active styling and show/hide credit rows by discipline.
    var _df = document.getElementById("discfilter");
    if(_df) _df.addEventListener("click", function(e){
      var chip = e.target.closest && e.target.closest(".dchip"); if(!chip) return;
      var d = chip.getAttribute("data-disc");
      _df.querySelectorAll(".dchip").forEach(function(x){ x.style.borderColor="var(--border)"; x.style.color="var(--muted)"; x.style.background="transparent"; });
      chip.style.borderColor="var(--accent)"; chip.style.color="var(--accent)"; chip.style.background="rgba(88,166,255,.09)";
      var rows = document.querySelectorAll("#creditrows .row");
      rows.forEach(function(row){ row.style.display = (!d || row.getAttribute("data-disc")===d) ? "" : "none"; });
    });
    // ---- Evidence "receipts": click a credit's badge to see who confirmed it ----
    (function(){
      var pop=null, openDot=null, cache={};
      var AVCOL=["#58a6ff","#a371f7","#3fb950","#e0b23a","#ec6a5e","#3fb0c9","#d2739a"];
      function initials(nm){ var p=String(nm||"").trim().split(/\s+/); return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")).toUpperCase(); }
      function colorFor(s){ var h=0, str=String(s||""); for(var i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return AVCOL[h%AVCOL.length]; }
      function ensurePop(){
        if(pop) return pop;
        pop=document.createElement("div"); pop.className="evpop"; pop.setAttribute("role","dialog"); pop.setAttribute("aria-label","Who confirmed this credit");
        document.body.appendChild(pop);
        return pop;
      }
      function closePop(){ if(pop) pop.classList.remove("open"); if(openDot) openDot.setAttribute("aria-expanded","false"); openDot=null; }
      function place(dot){
        var r=dot.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight, vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
        var left=window.scrollX + r.left + r.width/2 - 20;
        var maxLeft=window.scrollX + vw - pw - 12, minLeft=window.scrollX + 12;
        if(left>maxLeft) left=maxLeft; if(left<minLeft) left=minLeft;
        var top=window.scrollY + r.bottom + 9;
        if(r.bottom + ph + 16 > vh && r.top - ph - 9 > 0) top=window.scrollY + r.top - ph - 9;
        pop.style.left=left+"px"; pop.style.top=top+"px";
      }
      function render(dot, data, loading){
        var rev = dot.getAttribute("data-rev")==="1";
        var cls = dot.classList.contains("team")?"team":(dot.classList.contains("rev")?"rev":(dot.classList.contains("corr")?"corr":"peer"));
        var lvl = rev ? "Under review" : (cls==="team"?"Team-confirmed":(cls==="corr"?"Matches published credits":"Peer-confirmed"));
        var list = (data&&data.confirmers)||[];
        var html = '<div class="evpop-head"><span class="hd '+cls+'"></span><span class="lvl">'+DQ.esc(lvl)+'</span><span class="cx" role="button" tabindex="0" aria-label="Close">×</span></div>';
        if(rev) html += '<div class="evpop-rev">A report was filed on this credit. It stays visible while a moderator reviews it. Nothing is ever silently removed.</div>';
        if(loading){
          html += '<div class="evpop-list"><div class="evpop-empty">Loading confirmers…</div></div>';
        } else if(list.length){
          html += '<div class="evpop-sub">Confirmed by teammates who shipped this game</div><div class="evpop-list">';
          list.forEach(function(p){
            var role = p.headline ? DQ.esc(p.headline) : "";
            var cc = p.credit_count ? ((role?" · ":"")+p.credit_count+" credited title"+(p.credit_count===1?"":"s")) : "";
            html += '<a class="evrow" href="/credits/'+encodeURIComponent(p.slug)+'"><span class="av" style="background:'+colorFor(p.slug)+'">'+DQ.esc(initials(p.name))+'</span><span class="ei"><span class="en">'+DQ.esc(p.name)+'</span><span class="er">'+role+cc+'</span></span></a>';
          });
          html += '</div>';
        } else if(!rev && cls!=="corr"){
          html += '<div class="evpop-empty">No confirmers to show yet.</div>';
        }
        if(data && data.corroborated){
          var csrc = data.corroborated.source || 'the published record', curl = data.corroborated.url;
          var cin = '<span class="cdot"></span><span>Matches <b>'+DQ.esc(csrc)+'</b> <span class="cnote">published record</span></span>';
          if(curl) html += '<a class="evpop-corr" href="'+DQ.esc(DQ.safeUrl(curl))+'" target="_blank" rel="noopener noreferrer">'+cin+'<span class="cext">↗</span></a>';
          else html += '<div class="evpop-corr">'+cin+'</div>';
        }
        html += '<a class="evpop-foot" href="/credits/how-evidence-works.html">How evidence works →</a>';
        pop.innerHTML=html;
      }
      function openFor(dot){
        var id=dot.getAttribute("data-ev"); if(!id) return;
        if(openDot===dot){ closePop(); return; }
        ensurePop();
        openDot=dot; dot.setAttribute("aria-expanded","true");
        render(dot, cache[id]||null, !cache[id]);
        pop.classList.add("open"); place(dot);
        if(!cache[id] && window.DQAPI && DQAPI.confirmers){
          DQAPI.confirmers(id).then(function(res){
            cache[id]=(res&&res.data)||{confirmers:[]};
            if(openDot===dot){ render(dot, cache[id], false); place(dot); }
          }).catch(function(){ cache[id]={confirmers:[]}; if(openDot===dot){ render(dot, cache[id], false); place(dot); } });
        }
      }
      document.addEventListener("click", function(e){
        var dot=e.target && e.target.closest && e.target.closest(".evb[data-ev]");
        if(dot){ e.preventDefault(); e.stopPropagation(); openFor(dot); return; }
        if(pop && openDot){
          if(e.target.closest && e.target.closest(".evpop .cx")){ e.preventDefault(); closePop(); return; }
          if(e.target.closest && e.target.closest(".evpop")) return;
          closePop();
        }
      }, false);
      document.addEventListener("keydown", function(e){
        if(e.key==="Enter" || e.key===" "){
          var dot=e.target && e.target.closest && e.target.closest(".evb[data-ev]");
          if(dot){ e.preventDefault(); openFor(dot); return; }
          var cx=e.target && e.target.closest && e.target.closest(".evpop .cx");
          if(cx){ e.preventDefault(); closePop(); return; }
        }
        if(e.key==="Escape" && openDot){ var d=openDot; closePop(); try{ d.focus(); }catch(_){} }
      }, false);
      window.addEventListener("resize", function(){ if(openDot) place(openDot); });
      window.addEventListener("scroll", function(){ if(openDot) place(openDot); });
    })();

    var cb = document.getElementById("claimbtn");
    if(cb) cb.onclick = function(){
      if(window.DQAPI && !DQAPI.isSignedIn()){ location.href = "signin.html"; return; }
      DQ.openClaim({ game_slug: slug, game_title: title, game_qid: qid });
    };
    var rgb = document.getElementById("reportgame");
    if(rgb) rgb.onclick = function(){ DQ.openReport("game", slug, title); };
    var asb = document.getElementById("addstudio");
    if(asb) asb.onclick = function(){ DQ.openReport("game", slug, title, { reason: "wrong_studio" }); };
    Array.prototype.forEach.call(document.querySelectorAll(".reportcredit"), function(el){
      el.onclick = function(){ DQ.openReport("credit", slug, el.getAttribute("data-name"), { gameTitle: title, creditId: el.getAttribute("data-cid") }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".vouchbtn"), function(el){
      el.onclick = function(){ el.textContent = "…"; DQAPI.vouch(el.dataset.id).then(function(r){ if(r.ok){ location.reload(); } else { el.textContent="Vouch"; alert((r.data&&r.data.error)||"Could not vouch. Are you still signed in?"); } }).catch(function(){ el.textContent="Vouch"; alert("Network error. Try reloading the page and signing in again."); }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".unvouchbtn"), function(el){
      el.onclick = function(){ if(!confirm("Withdraw your vouch for this credit?")) return; DQAPI.unvouch(el.dataset.id).then(function(r){ if(r.ok) location.reload(); else alert((r.data&&r.data.error)||"Could not update."); }); };
    });

    // --- Add a teammate → generates a copyable claim link (you send it yourself) ---
    var atb = document.getElementById("addteammate");
    if(atb) atb.onclick = function(){
      var box = document.getElementById("teamform");
      atb.style.display = "none";
      box.innerHTML = '<div class="panel" style="padding:14px;margin-top:12px;max-width:520px">'+
        '<div style="font-size:12px;font-weight:700;margin-bottom:6px">Teammate\'s name</div>'+
        '<input class="tm-name" placeholder="e.g. Mark Davis" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
        '<div style="font-size:12px;font-weight:700;margin:10px 0 6px">Their role <span style="font-weight:400;color:var(--muted)">(optional)</span></div>'+
        '<input class="tm-role" placeholder="e.g. Programmer" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
        '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">Use a standard title where you can, per the <a href="https://igda.org/sigs/credits/" target="_blank" rel="noopener" style="color:var(--accent)">IGDA crediting guide ↗</a>.</div>'+
        '<div style="margin-top:12px;display:flex;gap:8px"><span class="btn primary tm-save" style="padding:8px 16px">Add teammate</span><span class="btn ghost tm-cancel" style="padding:8px 16px">Cancel</span></div>'+
        '<div class="tm-msg" style="font-size:13px;margin-top:10px"></div></div>';
      box.querySelector(".tm-cancel").onclick = function(){ box.innerHTML=""; atb.style.display=""; };
      box.querySelector(".tm-name").focus();
      box.querySelector(".tm-save").onclick = function(){
        var nm = box.querySelector(".tm-name").value.trim(), rl = box.querySelector(".tm-role").value.trim(), msg = box.querySelector(".tm-msg");
        if(!nm){ msg.innerHTML='<span style="color:var(--pink)">Enter their name.</span>'; return; }
        var sb = this; sb.textContent = "Adding…";
        DQAPI.attributeTeammate({ game_slug: slug, game_title: title, studio: (studios[0]||null), name: nm, role: rl||null }).then(function(r){
          if((r.status===201 || r.ok) && r.data && r.data.claim_url){
            var url = r.data.claim_url;
            box.innerHTML = '<div class="panel" style="padding:14px;margin-top:12px;max-width:560px">'+
              '<div style="font-weight:700;margin-bottom:6px;color:var(--green)">Added '+DQ.esc(nm)+' to '+DQ.esc(title)+'.</div>'+
              '<p style="font-size:13px;color:var(--muted);margin:0 0 10px">Send them this link so they can claim it. Adding them to more games reuses the same link.</p>'+
              '<div style="display:flex;gap:8px"><input class="tm-url" readonly value="'+DQ.esc(url)+'" style="flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit"><span class="btn primary tm-copy" style="padding:8px 14px;white-space:nowrap">Copy</span></div>'+
              '<div style="margin-top:12px;display:flex;gap:8px"><span class="btn ghost tm-again" style="padding:7px 14px;font-size:13px">Add another</span><span class="btn ghost tm-done" style="padding:7px 14px;font-size:13px">Done</span></div></div>';
            box.querySelector(".tm-copy").onclick = function(){ var i=box.querySelector(".tm-url"); i.select(); try{ navigator.clipboard.writeText(url); }catch(e){ try{ document.execCommand("copy"); }catch(e2){} } box.querySelector(".tm-copy").textContent="Copied ✓"; };
            box.querySelector(".tm-again").onclick = function(){ atb.style.display=""; atb.onclick(); };
            box.querySelector(".tm-done").onclick = function(){ location.reload(); };
          } else { sb.textContent="Add teammate"; msg.innerHTML='<span style="color:var(--pink)">'+DQ.esc((r.data&&r.data.error)||"Could not add.")+'</span>'; }
        }).catch(function(){ sb.textContent="Add teammate"; msg.innerHTML='<span style="color:var(--pink)">Network error. Try again.</span>'; });
      };
    };
    Array.prototype.forEach.call(document.querySelectorAll(".rmvattr"), function(el){
      el.onclick = function(){ if(!confirm("Remove this teammate attribution?")) return; DQAPI.removeAttribution(el.dataset.id).then(function(r){ if(r.ok) location.reload(); else alert((r.data&&r.data.error)||"Could not remove."); }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".copyinvite"), function(el){
      el.onclick = function(){ var nm=el.dataset.name; el.textContent="…"; DQAPI.myInvites().then(function(r){ var inv=((r.data&&r.data.invites)||[]).filter(function(x){return x.invitee_name===nm;})[0]; if(inv){ try{ navigator.clipboard.writeText(inv.claim_url); }catch(e){} el.textContent="Copied ✓"; } else { el.textContent="Copy invite link"; alert("Could not find the link."); } }).catch(function(){ el.textContent="Copy invite link"; }); };
    });
    // Claim an unclaimed teammate row directly (no link needed).
    Array.prototype.forEach.call(document.querySelectorAll(".claimattr"), function(el){
      el.onclick = function(){
        var id = el.dataset.id;
        if(window.DQAPI && DQAPI.isSignedIn()){
          el.textContent = "…";
          DQAPI.claimAttribution(id).then(function(r){
            if(r.ok){ location.href = "/credits/person.html?slug=" + encodeURIComponent(r.data.person_slug); }
            else { el.textContent = "Is this you? Claim"; alert((r.data&&r.data.error)||"Could not claim right now."); }
          }).catch(function(){ el.textContent = "Is this you? Claim"; });
        } else {
          try{ localStorage.setItem("dq_pending_claim_credit", id); }catch(e){}
          location.href = "signin.html";
        }
      };
    });
    // Confirm an unclaimed teammate you shipped alongside.
    Array.prototype.forEach.call(document.querySelectorAll(".vouchattr"), function(el){
      el.onclick = function(){
        el.textContent = "…";
        DQAPI.vouchAttribution(el.dataset.id).then(function(r){
          if(r.ok) location.reload();
          else { el.textContent = "Confirm"; alert((r.data&&r.data.error)||"Could not confirm right now."); }
        }).catch(function(){ el.textContent = "Confirm"; });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".unvouchattr"), function(el){
      el.onclick = function(){ if(!confirm("Withdraw your confirmation of this teammate?")) return; DQAPI.unvouchAttribution(el.dataset.id).then(function(r){ if(r.ok) location.reload(); else alert((r.data&&r.data.error)||"Could not update."); }); };
    });
  }).catch(function(e){
    app.innerHTML = '<div class="container"><div class="empty">Something went wrong loading this game.<br><span class="mut">'+DQ.esc(e && e.message)+'</span></div></div>';
  });
})();
</script>
</body>
</html>
