<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game · DevQuest Credits</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="topbar"><div class="container">
  <div class="brand"><a class="brandhome" href="/credits/" data-tip="Back to Credits home" aria-label="DevQuest Credits home"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="12" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="12" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="23" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="23" width="8" height="8" rx="2" fill="var(--gold)"/></svg><span class="wm">Dev<span class="q">Quest</span><span class="tld">.gg</span></span></a> <span class="cr">CREDITS</span> <span class="beta">BETA</span></div>
  <div class="topnav">
    <a href="/credits/#how">How it works</a>
    <a class="back" href="/">← Jobs board</a>
  </div>
</div></div>

<div class="container">
  <div class="crumbs"><a href="/credits/">Credits</a><span class="sep">/</span><a href="search.html">Games</a><span class="sep">/</span><span id="crumb" class="mut">…</span></div>
</div>

<div id="app"><div class="container"><div class="loading">Loading game…</div></div></div>

<footer><div class="container">
  <div><b style="color:var(--text)">DevQuest.gg / Credits</b> · a companion to the game-industry job board</div>
  <div><a href="/credits/">← Credits home</a> &nbsp;·&nbsp; <a href="mailto:studios@devquest.gg?subject=DevQuest%20Credits%20feedback&body=Bug%2C%20idea%2C%20or%20just%20a%20thought%3A%0A%0A">Feedback</a></div>
</div></footer>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var slug = DQ.qs("slug"), app = document.getElementById("app");
  if(!slug){ app.innerHTML = '<div class="container"><div class="empty">No game specified.</div></div>'; return; }

  var pStatic = DQ.loadEntity("games", slug).catch(function(){ return null; });
  var pApi = window.DQAPI ? DQAPI.gameCredits(slug).catch(function(){ return {ok:false}; }) : Promise.resolve({ok:false});
  var pMe  = (window.DQAPI && DQAPI.isSignedIn()) ? DQAPI.me().catch(function(){ return {ok:false}; }) : Promise.resolve({ok:false});

  Promise.all([pStatic, pApi, pMe]).then(function(res){
    var g = res[0];
    var apiRes = (res[1] && res[1].ok && res[1].data) ? res[1].data : null;
    var me = (res[2] && res[2].ok && res[2].data && res[2].data.authenticated) ? res[2].data.person : null;
    var apiGame = apiRes && apiRes.game;
    var apiCredits = (apiRes && apiRes.credits) || [];

    var meta = g || apiGame;
    if(!meta){
      document.getElementById("crumb").textContent = "Not found";
      app.innerHTML = '<div class="container"><div class="empty">We could not find that game.<br>'+
        '<a class="btn ghost" style="margin-top:14px" href="search.html">Search the catalogue</a> '+
        '<a class="btn primary" id="addbtn" style="margin-top:14px">Add this game →</a></div></div>';
      var ab = document.getElementById("addbtn");
      if(ab) ab.onclick = function(){ DQ.openClaim({ mode:"addGame", prefillTitle: slug.replace(/-/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();}) }); };
      return;
    }

    var title = meta.title, isCommunity = !g && !!apiGame;
    var studios = g ? (g.studios||[]) : (apiGame && apiGame.studio ? [apiGame.studio] : []);
    var year = meta.year || null, publishers = g ? (g.publishers||[]) : [];
    var platforms = meta.platforms || [], genres = meta.genres || [], qid = g ? g.qid : "";

    document.title = title + " · DevQuest Credits";
    document.getElementById("crumb").textContent = title;

    var studioLinks = studios.length
      ? studios.map(function(n){ return '<a href="studio.html?slug='+encodeURIComponent(DQ.slugify(n))+'">'+DQ.esc(n)+'</a>'; }).join(", ")
      : '<span class="mut">Studio not recorded</span>';
    var metaBits = [studioLinks];
    if(year) metaBits.push(String(year));
    if(publishers.length) metaBits.push("Published by "+publishers.map(DQ.esc).join(", "));

    var chips = "";
    platforms.forEach(function(p){ chips += '<span class="chip plat">'+DQ.esc(p)+'</span>'; });
    genres.forEach(function(x){ chips += '<span class="chip">'+DQ.esc(x)+'</span>'; });

    var srcBadge = isCommunity
      ? '<span class="badge hand">✎ Community entry</span>'
      : '<span class="badge official">◈ Catalogue (Wikidata)</span>';

    // merge credits by person — seed (static) + live (API), API wins
    var byPerson = {};
    ((g && g.credits) || []).forEach(function(c){ var ps=DQ.slugify(c.name); byPerson[ps]={person_slug:ps,name:c.name,role:c.role,roles_other:c.roles_other||[],verification:c.verification||[],vouch_count:0,live:false}; });
    apiCredits.forEach(function(c){ byPerson[c.person_slug]={id:c.id,person_slug:c.person_slug,name:c.person_name,role:c.role,roles_other:c.roles_other||[],verification:c.verification||[],links:c.links||[],releases:c.releases||[],vouch_count:c.vouch_count||0,voucher_slugs:c.voucher_slugs||[],partial:!!c.partial,live:true}; });
    var credits = Object.keys(byPerson).map(function(k){ return byPerson[k]; });
    var iHaveCredit = !!(me && credits.some(function(c){ return c.person_slug===me.slug; }));
    var pending = (apiRes && apiRes.pending) || [];

    // Order: your own claimed credit floats to the top when you're signed in; everyone
    // else is alphabetical by last name (neutral, scannable, implies no hierarchy).
    // Unclaimed teammate additions sort the same way, in their own section below.
    function lastName(n){ var p=String(n||'').trim().split(/\s+/); return (p[p.length-1]||'').toLowerCase(); }
    function cmpLast(na,nb){ return lastName(na).localeCompare(lastName(nb)) || String(na||'').localeCompare(String(nb||'')); }
    credits.sort(function(a,b){ var am=(me&&a.person_slug===me.slug)?0:1, bm=(me&&b.person_slug===me.slug)?0:1; return (am-bm) || cmpLast(a.name,b.name); });
    pending.sort(function(a,b){ return cmpLast(a.name,b.name); });

    // Unclaimed teammate attributions (added by a member, awaiting the named person).
    var pendingHTML = pending.length ? '<div class="rows" style="margin-top:14px">' + pending.map(function(pc){
      var mine = !!(me && pc.added_by_slug === me.slug);
      var iVouched = !!(me && (pc.voucher_slugs||[]).indexOf(me.slug) >= 0);
      // The attributor is an implicit first confirmation, so the total is 1 + peers.
      var confN = 1 + (pc.vouch_count||0);
      var acts;
      if (mine) {
        acts = '<a class="copyinvite" data-name="'+DQ.esc(pc.name)+'" style="font-size:12px;font-weight:700;color:var(--accent);cursor:pointer">Copy invite link</a>'+
          '<a class="rmvattr" data-id="'+pc.id+'" style="font-size:12px;color:var(--pink);margin-left:12px;cursor:pointer">Remove</a>';
      } else if (iVouched) {
        acts = '<a class="unvouchattr" data-id="'+pc.id+'" title="Withdraw confirmation" style="font-size:12px;font-weight:700;color:var(--green);cursor:pointer">✓ Confirmed</a>';
      } else if (iHaveCredit) {
        acts = '<a class="vouchattr" data-id="'+pc.id+'" style="font-size:12px;font-weight:700;color:var(--green);border:1px solid rgba(63,185,80,.4);background:rgba(63,185,80,.08);border-radius:8px;padding:4px 11px;cursor:pointer">Confirm</a>';
      } else {
        acts = '<a class="claimattr" data-id="'+pc.id+'" style="font-size:12px;font-weight:700;color:var(--accent);cursor:pointer">Is this you? Claim</a>';
      }
      var confHTML = (pc.vouch_count>0)
        ? ' &nbsp; <span class="sig vouched" style="color:var(--green)">✓ Confirmed by '+confN+' teammates</span>'
        : '';
      return '<div class="row">'+
        '<div class="av" style="opacity:.55">'+DQ.esc(DQ.initials(pc.name))+'</div>'+
        '<div class="rmain"><div class="rname">'+DQ.esc(pc.name)+' <span class="sig" style="color:var(--muted)">unclaimed</span>'+confHTML+'</div>'+
          '<div class="rsub"><span class="rrole">'+DQ.esc(pc.role||"Contributor")+'</span> &nbsp; <span class="mut">added by '+DQ.esc(pc.added_by_name)+'</span></div></div>'+
        '<div class="rright">'+acts+'</div>'+
      '</div>';
    }).join("") + '</div>' : '';

    // "Add a teammate" is available to anyone who holds a credit on this game.
    var addTeamHTML = iHaveCredit
      ? '<div style="margin-top:16px"><span class="btn ghost" id="addteammate" style="font-size:13px">+ Add a teammate you shipped with</span><div id="teamform"></div></div>'
      : '';

    var creditsHTML = credits.length ? '<div class="rows">' + credits.map(function(c){
      var sigs = (c.verification||[]).map(function(s){ return '<span class="sig">'+DQ.esc(DQ.SIG_LABEL[s]||s)+'</span>'; }).join("");
      var others = c.roles_other || [];
      var more = others.length ? ' <span class="rmore2" style="color:var(--muted);font-weight:400">· also '+DQ.esc(others.join(", "))+'</span>' : '';
      // Game page stays sparse: no release list here. The asterisk marks scoped work; the
      // "what they worked on" detail lives on the person's profile.
      var seal = c.vouch_count ? ' <span class="vseal" title="Verified by '+c.vouch_count+' teammate'+(c.vouch_count===1?'':'s')+' who shipped this game" aria-label="Peer-verified by '+c.vouch_count+' teammate'+(c.vouch_count===1?'':'s')+'">✓</span>' : '';
      var ast = c.partial ? ' <span class="ast" style="color:var(--muted);font-weight:700;cursor:help" title="Worked on a specific part, not the base game" aria-label="Worked on a specific part, not the base game">*</span>' : '';
      var proof = (c.links && c.links.length) ? ' <a class="sig" href="'+DQ.esc(DQ.safeUrl(c.links[0]))+'" target="_blank" rel="noopener noreferrer" title="'+DQ.esc(c.links.join(", "))+'" style="text-decoration:none">proof ↗</a>' : '';
      var iVouchedC = !!(me && (c.voucher_slugs||[]).indexOf(me.slug) >= 0);
      var vbtn = (c.live && c.id && me && c.person_slug!==me.slug && iHaveCredit)
        ? (iVouchedC
            ? '<a class="unvouchbtn" data-id="'+c.id+'" title="Withdraw your vouch" style="font-size:12px;font-weight:700;color:var(--green);cursor:pointer">✓ Vouched</a>'
            : '<a class="vouchbtn" data-id="'+c.id+'" style="font-size:12px;font-weight:700;color:var(--green);border:1px solid rgba(63,185,80,.35);background:rgba(63,185,80,.08);border-radius:8px;padding:4px 11px;cursor:pointer">Vouch</a>')
        : '';
      return '<div class="row">'+
        '<div class="av">'+DQ.esc(DQ.initials(c.name))+'</div>'+
        '<div class="rmain"><div class="rname"><a href="person.html?slug='+encodeURIComponent(c.person_slug)+'">'+DQ.esc(c.name)+'</a>'+ast+seal+'</div>'+
          '<div class="rsub"><span class="rrole">'+DQ.esc(c.role||"Role not recorded")+'</span>'+more+(sigs?' &nbsp; '+sigs:'')+proof+'</div></div>'+
        '<div class="rright">'+vbtn+'<a class="reportlink" href="mailto:studios@devquest.gg?subject='+encodeURIComponent("Report: "+title)+'&body='+encodeURIComponent("Reporting a credit on "+title+" by "+c.name+".\n\nReason:\n")+'" title="Report this credit" style="color:var(--muted);font-size:12px;margin-left:12px;text-decoration:none">⚑</a></div>'+
      '</div>';
    }).join("") + '</div>' : '<div class="empty">No individual credits recorded yet.<br>If you worked on it, be the first to claim your credit.</div>';

    app.innerHTML =
      '<div class="phead"><div class="container">'+
        '<div style="margin-bottom:10px">'+srcBadge+'</div>'+
        '<h1>'+DQ.esc(title)+'</h1>'+
        '<div class="meta">'+metaBits.join(' · ')+'</div>'+
        (chips?'<div class="chips">'+chips+'</div>':'')+
      '</div></div>'+
      '<section class="blk"><div class="container">'+
        '<div class="rowhead"><div><div class="eyebrow">Credits</div>'+
          '<h2 class="sec">'+(credits.length? credits.length+' credited' : 'Who made this game?')+'</h2>'+
          '<p class="secsub" style="margin:0">A developer-owned, peer-verified record of who made this game. Roles reflect each person\'s full time on the title, not a single moment. Listed alphabetically.</p></div>'+
          (iHaveCredit ? '' : '<span class="btn primary" id="claimbtn">This is me — claim my credit</span>')+
        '</div>'+
        creditsHTML +
        pendingHTML +
        addTeamHTML +
        '<div class="notice">Source of truth is the person who did the work. Catalogue facts come from Wikidata (CC0); credits are added and vouched by developers. Teammate additions are unclaimed until that person confirms them.</div>'+
      '</div></section>';

    var cb = document.getElementById("claimbtn");
    if(cb) cb.onclick = function(){
      if(window.DQAPI && !DQAPI.isSignedIn()){ location.href = "signin.html"; return; }
      DQ.openClaim({ game_slug: slug, game_title: title, game_qid: qid });
    };
    Array.prototype.forEach.call(document.querySelectorAll(".vouchbtn"), function(el){
      el.onclick = function(){ el.textContent = "…"; DQAPI.vouch(el.dataset.id).then(function(r){ if(r.ok){ location.reload(); } else { el.textContent="Vouch"; alert((r.data&&r.data.error)||"Could not vouch. Are you still signed in?"); } }).catch(function(){ el.textContent="Vouch"; alert("Network error. Try reloading the page and signing in again."); }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".unvouchbtn"), function(el){
      el.onclick = function(){ if(!confirm("Withdraw your vouch for this credit?")) return; DQAPI.unvouch(el.dataset.id).then(function(r){ if(r.ok) location.reload(); else alert((r.data&&r.data.error)||"Could not update."); }); };
    });

    // --- Add a teammate → generates a copyable claim link (you send it yourself) ---
    var atb = document.getElementById("addteammate");
    if(atb) atb.onclick = function(){
      var box = document.getElementById("teamform");
      atb.style.display = "none";
      box.innerHTML = '<div class="panel" style="padding:14px;margin-top:12px;max-width:520px">'+
        '<div style="font-size:12px;font-weight:700;margin-bottom:6px">Teammate\'s name</div>'+
        '<input class="tm-name" placeholder="e.g. Mark Davis" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
        '<div style="font-size:12px;font-weight:700;margin:10px 0 6px">Their role <span style="font-weight:400;color:var(--muted)">(optional)</span></div>'+
        '<input class="tm-role" placeholder="e.g. Programmer" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;font-family:inherit">'+
        '<div style="margin-top:12px;display:flex;gap:8px"><span class="btn primary tm-save" style="padding:8px 16px">Add teammate</span><span class="btn ghost tm-cancel" style="padding:8px 16px">Cancel</span></div>'+
        '<div class="tm-msg" style="font-size:13px;margin-top:10px"></div></div>';
      box.querySelector(".tm-cancel").onclick = function(){ box.innerHTML=""; atb.style.display=""; };
      box.querySelector(".tm-name").focus();
      box.querySelector(".tm-save").onclick = function(){
        var nm = box.querySelector(".tm-name").value.trim(), rl = box.querySelector(".tm-role").value.trim(), msg = box.querySelector(".tm-msg");
        if(!nm){ msg.innerHTML='<span style="color:var(--pink)">Enter their name.</span>'; return; }
        var sb = this; sb.textContent = "Adding…";
        DQAPI.attributeTeammate({ game_slug: slug, game_title: title, studio: (studios[0]||null), name: nm, role: rl||null }).then(function(r){
          if((r.status===201 || r.ok) && r.data && r.data.claim_url){
            var url = r.data.claim_url;
            box.innerHTML = '<div class="panel" style="padding:14px;margin-top:12px;max-width:560px">'+
              '<div style="font-weight:700;margin-bottom:6px;color:var(--green)">Added '+DQ.esc(nm)+' to '+DQ.esc(title)+'.</div>'+
              '<p style="font-size:13px;color:var(--muted);margin:0 0 10px">Send them this link so they can claim it. Adding them to more games reuses the same link.</p>'+
              '<div style="display:flex;gap:8px"><input class="tm-url" readonly value="'+DQ.esc(url)+'" style="flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit"><span class="btn primary tm-copy" style="padding:8px 14px;white-space:nowrap">Copy</span></div>'+
              '<div style="margin-top:12px;display:flex;gap:8px"><span class="btn ghost tm-again" style="padding:7px 14px;font-size:13px">Add another</span><span class="btn ghost tm-done" style="padding:7px 14px;font-size:13px">Done</span></div></div>';
            box.querySelector(".tm-copy").onclick = function(){ var i=box.querySelector(".tm-url"); i.select(); try{ navigator.clipboard.writeText(url); }catch(e){ try{ document.execCommand("copy"); }catch(e2){} } box.querySelector(".tm-copy").textContent="Copied ✓"; };
            box.querySelector(".tm-again").onclick = function(){ atb.style.display=""; atb.onclick(); };
            box.querySelector(".tm-done").onclick = function(){ location.reload(); };
          } else { sb.textContent="Add teammate"; msg.innerHTML='<span style="color:var(--pink)">'+DQ.esc((r.data&&r.data.error)||"Could not add.")+'</span>'; }
        }).catch(function(){ sb.textContent="Add teammate"; msg.innerHTML='<span style="color:var(--pink)">Network error. Try again.</span>'; });
      };
    };
    Array.prototype.forEach.call(document.querySelectorAll(".rmvattr"), function(el){
      el.onclick = function(){ if(!confirm("Remove this teammate attribution?")) return; DQAPI.removeAttribution(el.dataset.id).then(function(r){ if(r.ok) location.reload(); else alert((r.data&&r.data.error)||"Could not remove."); }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".copyinvite"), function(el){
      el.onclick = function(){ var nm=el.dataset.name; el.textContent="…"; DQAPI.myInvites().then(function(r){ var inv=((r.data&&r.data.invites)||[]).filter(function(x){return x.invitee_name===nm;})[0]; if(inv){ try{ navigator.clipboard.writeText(inv.claim_url); }catch(e){} el.textContent="Copied ✓"; } else { el.textContent="Copy invite link"; alert("Could not find the link."); } }).catch(function(){ el.textContent="Copy invite link"; }); };
    });
    // Claim an unclaimed teammate row directly (no link needed).
    Array.prototype.forEach.call(document.querySelectorAll(".claimattr"), function(el){
      el.onclick = function(){
        var id = el.dataset.id;
        if(window.DQAPI && DQAPI.isSignedIn()){
          el.textContent = "…";
          DQAPI.claimAttribution(id).then(function(r){
            if(r.ok){ location.href = "person.html?slug=" + encodeURIComponent(r.data.person_slug); }
            else { el.textContent = "Is this you? Claim"; alert((r.data&&r.data.error)||"Could not claim right now."); }
          }).catch(function(){ el.textContent = "Is this you? Claim"; });
        } else {
          try{ localStorage.setItem("dq_pending_claim_credit", id); }catch(e){}
          location.href = "signin.html";
        }
      };
    });
    // Confirm an unclaimed teammate you shipped alongside.
    Array.prototype.forEach.call(document.querySelectorAll(".vouchattr"), function(el){
      el.onclick = function(){
        el.textContent = "…";
        DQAPI.vouchAttribution(el.dataset.id).then(function(r){
          if(r.ok) location.reload();
          else { el.textContent = "Confirm"; alert((r.data&&r.data.error)||"Could not confirm right now."); }
        }).catch(function(){ el.textContent = "Confirm"; });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll(".unvouchattr"), function(el){
      el.onclick = function(){ if(!confirm("Withdraw your confirmation of this teammate?")) return; DQAPI.unvouchAttribution(el.dataset.id).then(function(r){ if(r.ok) location.reload(); else alert((r.data&&r.data.error)||"Could not update."); }); };
    });
  }).catch(function(e){
    app.innerHTML = '<div class="container"><div class="empty">Something went wrong loading this game.<br><span class="mut">'+DQ.esc(e && e.message)+'</span></div></div>';
  });
})();
</script>
</body>
</html>
