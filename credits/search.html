<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search · DevQuest Credits</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  .tabs{display:flex;gap:6px;margin:18px 0 6px}
  .tab{font-size:13.5px;font-weight:700;color:var(--muted);border:1px solid var(--border);background:var(--panel);border-radius:9px;padding:8px 15px;cursor:pointer}
  .tab.on{color:var(--text);border-color:var(--accent);background:rgba(88,166,255,.08)}
  .tab .n{color:var(--muted);font-weight:600;margin-left:5px}
  .addhint{font-size:13px;color:var(--muted);margin-top:14px}
  .addhint a{color:var(--accent);font-weight:600;cursor:pointer}
  .addhint a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="topbar"><div class="container">
  <div class="brand"><a class="brandhome" href="/credits/" data-tip="Back to Credits home" aria-label="DevQuest Credits home"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="12" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="12" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="23" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="23" width="8" height="8" rx="2" fill="var(--gold)"/></svg><span class="wm">Dev<span class="q">Quest</span><span class="tld">.gg</span></span></a> <span class="cr">CREDITS</span> <span class="beta">BETA</span></div>
  <div class="topnav">
    <a href="/credits/#how">How it works</a>
    <a class="back" href="/">← Jobs board</a>
  </div>
</div></div>

<div class="container">
  <div class="crumbs"><a href="/credits/">Credits</a><span class="sep">/</span><span class="mut">Search</span></div>
  <div class="phead"><h1 style="font-size:30px;margin-bottom:14px">Search the catalogue</h1>
    <div class="searchwrap" style="max-width:680px">
      <div class="search"><span class="ic">🔍</span><input id="q" placeholder="Search a game, a studio, or a name…" autocomplete="off"></div>
    </div>
    <div class="tabs">
      <span class="tab on" data-tab="all">All</span>
      <span class="tab" data-tab="games">Games<span class="n" id="ng"></span></span>
      <span class="tab" data-tab="studios">Studios<span class="n" id="ns"></span></span>
      <span class="tab" data-tab="people">People<span class="n" id="np"></span></span>
    </div>
    <div class="addhint">Worked on a game that isn't here yet? <a id="addgamebtn">Add it →</a></div>
  </div>
</div>

<section class="blk" style="padding-top:8px"><div class="container">
  <div id="results"><div class="loading">Loading catalogue…</div></div>
</div></section>

<footer><div class="container">
  <div><b style="color:var(--text)">DevQuest.gg / Credits</b> · a companion to the game-industry job board</div>
  <div><a href="/credits/">← Credits home</a> &nbsp;·&nbsp; <a href="mailto:studios@devquest.gg?subject=DevQuest%20Credits%20feedback&body=Bug%2C%20idea%2C%20or%20just%20a%20thought%3A%0A%0A">Feedback</a></div>
</div></footer>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var LIMIT = 60;                       // full-tab cap
  var input = document.getElementById("q"), results = document.getElementById("results");
  var tab = (DQ.qs("tab") || "all"), q0 = DQ.qs("q");
  var data = { games: null, studios: null, people: null };

  // ---- row/tile builders ----
  function gameTiles(rows){ return '<div class="glist">'+rows.map(function(g){
    return '<a class="gtile" href="game.html?slug='+encodeURIComponent(g[0])+'"><div class="t">'+DQ.esc(g[1])+'</div>'+
      '<div class="s">'+(g[3]?DQ.esc(g[3]):'Studio unknown')+(g[2]?' · '+g[2]:'')+'</div></a>';
  }).join("")+'</div>'; }
  function studioTiles(rows){ return '<div class="glist">'+rows.map(function(s){
    return '<a class="gtile" href="studio.html?slug='+encodeURIComponent(s[0])+'"><div class="t">'+DQ.esc(s[1])+'</div>'+
      '<div class="s">'+s[2].toLocaleString()+' game'+(s[2]===1?'':'s')+'</div></a>';
  }).join("")+'</div>'; }
  function peopleRows(rows){ return '<div class="rows">'+rows.map(function(p){
    return '<a class="row" href="person.html?slug='+encodeURIComponent(p[0])+'">'+
      '<div class="av">'+DQ.esc(DQ.initials(p[1]))+'</div>'+
      '<div class="rmain"><div class="rname">'+DQ.esc(p[1])+'</div>'+
      '<div class="rsub">'+p[2]+' credit'+(p[2]===1?'':'s')+'</div></div></a>';
  }).join("")+'</div>'; }

  function setCounts(g,s,p){
    document.getElementById("ng").textContent = g?" "+g.toLocaleString():"";
    document.getElementById("ns").textContent = s?" "+s.toLocaleString():"";
    document.getElementById("np").textContent = p?" "+p.toLocaleString():"";
  }
  function section(label, res, goto, body){
    return '<div class="csec"><div class="rowhead"><div class="eyebrow">'+label+'</div>'+
      (res.total>res.rows.length?'<a class="morelink" data-goto="'+goto+'">See all '+res.total.toLocaleString()+' →</a>':'')+
      '</div>'+body(res.rows)+'</div>';
  }

  // ---- All (combined) ----
  function renderAll(q){
    if(!q) return '<div class="empty">Type to search '+ (data.games?data.games.length.toLocaleString():'') +' games, plus studios and people — all at once.</div>';
    var g = DQ.searchRows(data.games,1,q,6),
        s = DQ.searchRows(data.studios,1,q,6),
        p = (data.people&&data.people.length)?DQ.searchRows(data.people,1,q,6):{total:0,rows:[]};
    setCounts(g.total,s.total,p.total);
    if(!g.total && !s.total && !p.total) return '<div class="empty">Nothing matches “'+DQ.esc(q)+'”.<br><a class="btn ghost" data-add style="margin-top:14px">Add this game →</a></div>';
    var h="";
    if(g.total) h += section("Games", g, "games", gameTiles);
    if(s.total) h += section("Studios", s, "studios", studioTiles);
    if(p.total) h += section("People", p, "people", peopleRows);
    return h;
  }

  // ---- single-type tabs ----
  function renderGames(q){
    if(!q) return '<div class="empty">Type to search '+ (data.games?data.games.length.toLocaleString():'') +' games.</div>';
    var m = DQ.searchRows(data.games,1,q,LIMIT);
    document.getElementById("ng").textContent = m.total ? " "+m.total.toLocaleString() : "";
    if(!m.total) return '<div class="empty">No games match “'+DQ.esc(q)+'”.<br><a class="btn ghost" data-add style="margin-top:14px">Add this game →</a></div>';
    return gameTiles(m.rows) + (m.total>LIMIT?'<div class="notice">Showing first '+LIMIT+' of '+m.total.toLocaleString()+'. Keep typing to narrow.</div>':'');
  }
  function renderStudios(q){
    if(!q) return '<div class="empty">Type to search '+ (data.studios?data.studios.length.toLocaleString():'') +' studios.</div>';
    var m = DQ.searchRows(data.studios,1,q,LIMIT);
    document.getElementById("ns").textContent = m.total ? " "+m.total.toLocaleString() : "";
    if(!m.total) return '<div class="empty">No studios match “'+DQ.esc(q)+'”.<br><span class="mut">Studios appear when you add a game made there.</span><br><a class="btn ghost" data-add-studio style="margin-top:14px">Add a game made here →</a></div>';
    return studioTiles(m.rows) + (m.total>LIMIT?'<div class="notice">Showing first '+LIMIT+' of '+m.total.toLocaleString()+'.</div>':'');
  }
  function renderPeople(q){
    if(!data.people || !data.people.length) return '<div class="empty">No people in the database yet — they appear as credits get added.<br><a class="btn ghost" data-add-person style="margin-top:14px">Add a game you worked on →</a></div>';
    if(!q) return '<div class="empty">Type to search '+ data.people.length.toLocaleString() +' people.</div>';
    var m = DQ.searchRows(data.people,1,q,LIMIT);
    document.getElementById("np").textContent = m.total ? " "+m.total.toLocaleString() : "";
    if(!m.total) return '<div class="empty">No people match “'+DQ.esc(q)+'”.<br><span class="mut">People appear when a credit names them.</span><br><a class="btn ghost" data-add-person style="margin-top:14px">Add a game you worked on →</a></div>';
    return peopleRows(m.rows);
  }

  function render(){
    var q = input.value.trim();
    var html = tab==="all" ? renderAll(q) : tab==="studios" ? renderStudios(q) : tab==="people" ? renderPeople(q) : renderGames(q);
    results.innerHTML = html;
    var u = new URL(location.href); u.searchParams.set("tab", tab); q ? u.searchParams.set("q", q) : u.searchParams.delete("q");
    history.replaceState(null, "", u);
  }

  // which indexes the current tab needs
  function neededKinds(){ return tab==="all" ? ["games","studios","people"] : [tab]; }
  function ensure(){
    var need = neededKinds().filter(function(k){ return !data[k]; });
    if(!need.length) return Promise.resolve(true);
    results.innerHTML = '<div class="loading">Loading…</div>';
    return Promise.all(need.map(function(k){ return DQ.loadIndex(k).then(function(rows){ data[k]=rows; }); }))
      .then(function(){ return true; })
      .catch(function(e){
        results.innerHTML = '<div class="empty">Could not load the search index.<br>'+
          '<span class="mut">'+DQ.esc(e.message)+'</span><br>'+
          'If the catalogue was just built, give it a minute and reload.</div>';
        return false;
      });
  }

  function setTab(t){
    tab = t;
    document.querySelectorAll(".tab").forEach(function(el){ el.classList.toggle("on", el.dataset.tab===t); });
    ensure().then(function(ok){ if(ok) render(); });
  }
  document.querySelectorAll(".tab").forEach(function(el){
    el.onclick = function(){ setTab(el.dataset.tab); };
    el.classList.toggle("on", el.dataset.tab===tab);
  });
  function openAddGame(o){ o = o || {}; o.mode = "addGame"; DQ.openClaim(o); }
  function qt(){ return input.value.trim(); }
  // "See all N →" switches tab; the "Add …" buttons open add-a-game with the
  // right field pre-filled (game title, or studio, or your name).
  results.addEventListener("click", function(e){
    if(e.target.closest && e.target.closest("[data-add]")){ e.preventDefault(); openAddGame({ prefillTitle: qt() }); return; }
    if(e.target.closest && e.target.closest("[data-add-studio]")){ e.preventDefault(); openAddGame({ prefillStudio: qt() }); return; }
    if(e.target.closest && e.target.closest("[data-add-person]")){ e.preventDefault(); openAddGame({ prefillName: qt() }); return; }
    var a = e.target.closest && e.target.closest("[data-goto]");
    if(a){ e.preventDefault(); setTab(a.dataset.goto); }
  });
  var agb = document.getElementById("addgamebtn");
  if(agb) agb.onclick = function(){ openAddGame({ prefillTitle: qt() }); };

  var t;
  input.addEventListener("input", function(){ clearTimeout(t); t=setTimeout(function(){ ensure().then(function(ok){ if(ok) render(); }); }, 110); });
  input.addEventListener("keydown", function(e){ if(e.key==="Enter"){ clearTimeout(t); ensure().then(function(ok){ if(ok) render(); }); } });

  input.value = q0;
  ensure().then(function(ok){ if(ok) render(); });
  input.focus();
})();
</script>
</body>
</html>
