<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · DevQuest Credits</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  .signcard{max-width:440px;margin:8vh auto 0;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:30px}
  .signcard h1{font-size:24px;font-weight:850;letter-spacing:-.5px;margin:0 0 8px}
  .signcard p{color:var(--muted);font-size:14.5px;margin:0 0 18px}
  .signcard input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit;outline:none}
  .signcard input:focus{border-color:var(--accent)}
  .signcard .btn{width:100%;justify-content:center;margin-top:14px;font-size:15px;padding:12px}
  .msg{font-size:13.5px;margin-top:14px}
  .msg.err{color:var(--pink)} .msg.ok{color:var(--green)}
  .who{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .who .av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b0e14;background:var(--accent)}
  .erow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .erow:last-child{border-bottom:none}
  .erow .em{font-size:13.5px;word-break:break-all}
  .eb{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .eb.primary{color:var(--green);border:1px solid rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
  .eb.unv{color:var(--gold);border:1px solid rgba(224,178,58,.4);background:rgba(224,178,58,.08)}
  .eacts{display:flex;gap:10px;flex:none}
  .eact{font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;white-space:nowrap}
  .eact:hover{text-decoration:underline}
  .eact.del{color:var(--pink)}
</style>
</head>
<body>
<div class="topbar"><div class="container">
  <div class="brand"><a class="brandhome" href="/credits/" aria-label="DevQuest Credits home"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="12" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="1" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="12" width="8" height="8" rx="2" fill="var(--gold)"/><rect x="23" y="12" width="8" height="8" rx="2" fill="#2d333b"/><rect x="1" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="12" y="23" width="8" height="8" rx="2" fill="#2d333b"/><rect x="23" y="23" width="8" height="8" rx="2" fill="var(--gold)"/></svg><span class="wm">Dev<span class="q">Quest</span><span class="tld">.gg</span></span></a> <span class="cr">CREDITS</span> <span class="beta">BETA</span></div>
  <div class="topnav"><a class="back" href="/credits/">← Credits</a></div>
</div></div>

<div class="container"><div class="signcard" id="card"><div class="loading">Loading…</div></div></div>

<script src="api.js"></script>
<script>
(function(){
  var card = document.getElementById("card");
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(x){return x[0]||"";}).join("").toUpperCase()||"?";}

  // 1) Arriving from a magic link: #token=...&slug=...
  var hash = location.hash.replace(/^#/, "");
  if(hash.indexOf("token=") >= 0){
    var params = {};
    hash.split("&").forEach(function(kv){ var i=kv.indexOf("="); if(i>0) params[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); });
    if(params.token){
      DQAPI.setToken(params.token);
      history.replaceState(null, "", location.pathname); // strip token from URL
    }
  }

  // 1a) If we arrived here to finish claiming a teammate invite, resume it.
  var pendingClaim = null; try{ pendingClaim = localStorage.getItem("dq_pending_claim"); }catch(e){}
  if(pendingClaim && DQAPI.isSignedIn()){
    try{ localStorage.removeItem("dq_pending_claim"); }catch(e){}
    location.href = "claim.html?token=" + encodeURIComponent(pendingClaim);
    return;
  }
  // 1a2) Or to claim a specific unclaimed row from a game page.
  var pendingCredit = null; try{ pendingCredit = localStorage.getItem("dq_pending_claim_credit"); }catch(e){}
  if(pendingCredit && DQAPI.isSignedIn()){
    try{ localStorage.removeItem("dq_pending_claim_credit"); }catch(e){}
    DQAPI.claimAttribution(pendingCredit).then(function(r){
      location.href = (r.ok && r.data && r.data.person_slug) ? ("person.html?slug=" + encodeURIComponent(r.data.person_slug)) : "/credits/";
    }).catch(function(){ location.href = "/credits/"; });
    return;
  }

  // 1a3) Or to finish claiming your own credit on a game (create it now).
  var pendingNew = null; try{ pendingNew = localStorage.getItem("dq_pending_credit"); }catch(e){}
  if(pendingNew && DQAPI.isSignedIn()){
    try{ localStorage.removeItem("dq_pending_credit"); }catch(e){}
    var pl = null; try{ pl = JSON.parse(pendingNew); }catch(e){ pl = null; }
    if(pl){
      DQAPI.createCredit(pl).then(function(r){
        location.href = (r && (r.status===201 || r.ok) && r.data && r.data.person_slug) ? ("person.html?slug=" + encodeURIComponent(r.data.person_slug)) : "/credits/";
      }).catch(function(){ location.href = "/credits/"; });
      return;
    }
  }

  // 1b) Flash flags carried on the fragment (added=1) or query (email=taken)
  var flash = "";
  if(location.hash.indexOf("added=1") >= 0){ flash = "ok:Backup email confirmed and added to your account."; }

  // 2) Bounced back from an expired/invalid link
  var q = new URLSearchParams(location.search);
  var errNote = q.get("signin") === "expired" ? "That sign-in link expired. Request a new one below."
              : q.get("signin") === "invalid" ? "That sign-in link wasn't valid. Request a new one below." : "";
  if(q.get("email") === "taken"){ flash = "err:That email is already linked to another profile."; }

  // 3) Already signed in? Show the Account screen (profile + emails).
  function flashHTML(){
    if(!flash) return "";
    var i = flash.indexOf(":"), kind = flash.slice(0,i), txt = flash.slice(i+1);
    return '<div class="msg" style="margin:0 0 14px"><span class="'+(kind==="ok"?"ok":"err")+'">'+esc(txt)+'</span></div>';
  }
  function emailRow(e){
    var badges = (e.primary ? '<span class="eb primary">Primary</span>' : '') + (e.verified ? '' : '<span class="eb unv">Unverified</span>');
    var actions = '';
    if(!e.primary && e.verified) actions += '<a class="eact" data-primary="'+e.id+'">Make primary</a>';
    if(!e.primary) actions += '<a class="eact del" data-remove="'+e.id+'">Remove</a>';
    return '<div class="erow"><div class="em">'+esc(e.email)+badges+'</div><div class="eacts">'+actions+'</div></div>';
  }
  function reloadAccount(){ DQAPI.me().then(function(r){ if(r.ok && r.data.authenticated){ showAccount(r.data); } else { DQAPI.clearToken(); showForm(); } }); }
  function showAccount(data){
    if(!data.person){
      // Provisional: signed in on a verified email, but no profile yet (orphan fix).
      card.innerHTML = flashHTML() +
        '<h1>You’re signed in</h1>' +
        '<p>Signed in as <b style="color:var(--text)">' + esc(data.email || "") + '</b>. You don’t have a profile yet. Claim a credit on any game you worked on and your page starts automatically.</p>' +
        '<a class="btn primary" href="/credits/">Find a game to claim →</a>' +
        '<a class="btn ghost" id="signout" style="margin-top:10px;justify-content:center;width:100%">Sign out</a>';
      document.getElementById("signout").onclick = function(){ DQAPI.logout().then(function(){ location.reload(); }); };
      return;
    }
    var person = data.person, emails = person.emails || [];
    card.innerHTML = flashHTML() +
      '<div class="who"><div class="av">' + esc(initials(person.name)) + '</div>' +
      '<div><div style="font-weight:800;font-size:16px">' + esc(person.name) + '</div>' +
      '<div class="mut" style="font-size:13px">Signed in</div></div></div>' +
      '<a class="btn primary" href="/credits/' + encodeURIComponent(person.slug) + '">Go to my page</a>' +
      '<div style="margin-top:24px"><div style="font-size:13px;font-weight:800;margin-bottom:6px">Your emails</div>' +
      '<p style="font-size:12.5px;margin:0 0 8px">Any confirmed email here can sign you in. Add a backup so you never lose access to your account.</p>' +
      '<div id="emails">' + emails.map(emailRow).join("") + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:14px;align-items:stretch"><input id="newemail" type="email" placeholder="backup@example.com" style="flex:1 1 auto;min-width:0;margin-top:0;background:var(--bg)"><button class="btn ghost" id="addemail" style="white-space:nowrap;padding:10px 16px;width:auto;flex:0 0 auto;margin-top:0">Add email</button></div>' +
      '<div class="msg" id="emsg"></div></div>' +
      '<div style="margin-top:24px"><div style="font-size:13px;font-weight:800;margin-bottom:6px">Teammate invites</div>' +
      '<p style="font-size:12.5px;margin:0 0 8px">People you added to games, waiting to claim. Copy a link to resend it.</p>' +
      '<div id="invites"><div class="mut" style="font-size:13px">Loading…</div></div></div>' +
      '<a class="btn ghost" id="signout" style="margin-top:18px;justify-content:center;width:100%">Sign out</a>';
    document.getElementById("signout").onclick = function(){ DQAPI.logout().then(function(){ location.reload(); }); };
    var emsg = document.getElementById("emsg");
    document.getElementById("addemail").onclick = function(){
      var v = (document.getElementById("newemail").value || "").trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ emsg.innerHTML = '<span class="err">Enter a valid email.</span>'; return; }
      var b = this; b.disabled = true; b.textContent = "Sending…";
      DQAPI.addEmail(v).then(function(r){
        b.disabled = false; b.textContent = "Add email";
        if(r.ok){ emsg.innerHTML = '<span class="ok">Confirmation link sent to ' + esc(v) + '. Click it from that inbox to add the email.</span>'; document.getElementById("newemail").value = ""; }
        else { emsg.innerHTML = '<span class="err">' + esc((r.data && r.data.error) || "Could not add that email.") + '</span>'; }
      }).catch(function(){ b.disabled = false; b.textContent = "Add email"; emsg.innerHTML = '<span class="err">Network error. Try again.</span>'; });
    };
    Array.prototype.forEach.call(card.querySelectorAll("[data-primary]"), function(a){
      a.onclick = function(){ DQAPI.setPrimaryEmail(a.getAttribute("data-primary")).then(function(r){ if(r.ok){ flash=""; reloadAccount(); } else emsg.innerHTML = '<span class="err">' + esc((r.data && r.data.error) || "Could not update.") + '</span>'; }); };
    });
    Array.prototype.forEach.call(card.querySelectorAll("[data-remove]"), function(a){
      a.onclick = function(){ if(!confirm("Remove this email from your account?")) return; DQAPI.removeEmail(a.getAttribute("data-remove")).then(function(r){ if(r.ok){ flash=""; reloadAccount(); } else emsg.innerHTML = '<span class="err">' + esc((r.data && r.data.error) || "Could not remove.") + '</span>'; }); };
    });
    // Outstanding teammate invites — load and let the user re-copy each link.
    DQAPI.myInvites().then(function(r){
      var box = document.getElementById("invites"); if(!box) return;
      var invs = (r.data && r.data.invites) || [];
      if(!invs.length){ box.innerHTML = '<div class="mut" style="font-size:13px">No outstanding invites.</div>'; return; }
      box.innerHTML = invs.map(function(iv){
        var n = iv.games.length;
        return '<div class="erow"><div class="em">' + esc(iv.invitee_name) + ' <span class="mut">' + n + ' game' + (n===1?'':'s') + '</span></div>' +
          '<div class="eacts"><a class="eact copyinv" data-url="' + esc(iv.claim_url) + '">Copy link</a></div></div>';
      }).join("");
      Array.prototype.forEach.call(box.querySelectorAll(".copyinv"), function(a){
        a.onclick = function(){ try{ navigator.clipboard.writeText(a.getAttribute("data-url")); }catch(e){} a.textContent = "Copied ✓"; };
      });
    }).catch(function(){ var box = document.getElementById("invites"); if(box) box.innerHTML = '<div class="mut" style="font-size:13px">Could not load invites right now.</div>'; });
  }
  function showForm(){
    card.innerHTML =
      '<h1>Sign in to DevQuest Credits</h1>' +
      '<p>Enter your email and we’ll send a one-time sign-in link. No password.<br><span style="color:var(--text);font-weight:600">Returning?</span> Use the same email you claimed with and your profile comes right back.</p>' +
      '<input id="email" type="email" placeholder="you@example.com" autocomplete="email">' +
      '<button class="btn primary" id="send">Email me a link →</button>' +
      '<div class="msg" id="msg">' + (errNote ? '<span class="err">' + esc(errNote) + '</span>' : '') + '</div>' +
      '<p style="font-size:12.5px;margin:16px 0 0">Can’t access that email, or not sure which one you used? <a href="mailto:studios@devquest.gg?subject=DevQuest%20Credits%20account%20recovery&body=I%20need%20help%20getting%20back%20into%20my%20DevQuest%20Credits%20profile.%0A%0AName%3A%0AProfile%20URL%20(if%20known)%3A%0AEmails%20I%20might%20have%20used%3A%0A" style="color:var(--accent);font-weight:600">Contact us</a> and we’ll help you recover it.</p>';
    var email = document.getElementById("email"), btn = document.getElementById("send"), msg = document.getElementById("msg");
    email.focus();
    function send(){
      var v = (email.value || "").trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ msg.innerHTML = '<span class="err">Enter a valid email.</span>'; return; }
      btn.disabled = true; btn.textContent = "Sending…";
      DQAPI.requestLink(v).then(function(r){
        if(r.ok){ card.innerHTML = '<h1>Check your inbox ✉</h1><p>We sent a sign-in link to <b style="color:var(--text)">' + esc(v) + '</b>. It works once and expires in 15 minutes. You can close this tab after clicking it.</p>'; }
        else { btn.disabled = false; btn.textContent = "Email me a link →"; msg.innerHTML = '<span class="err">' + esc((r.data && r.data.error) || "Something went wrong. Try again.") + '</span>'; }
      }).catch(function(){ btn.disabled = false; btn.textContent = "Email me a link →"; msg.innerHTML = '<span class="err">Network error. Try again.</span>'; });
    }
    btn.onclick = send;
    email.addEventListener("keydown", function(e){ if(e.key === "Enter") send(); });
  }

  if(DQAPI.isSignedIn()){
    DQAPI.me().then(function(r){ if(r.ok && r.data.authenticated){ showAccount(r.data); } else { DQAPI.clearToken(); showForm(); } }).catch(showForm);
  } else {
    showForm();
  }
})();
</script>
</body>
</html>
